const QS=[{"no": 51, "q": "奶油海綿蛋糕中奶油用量最多可用多少？", "options": ["10～20％", "21～30％", "31～39％", "40～50％"], "answer": 3, "answerText": "40～50％"}, {"no": 52, "q": "乳沫類蛋糕其麵糊的打發性主要是來自配方中的哪一項？", "options": ["油脂", "蛋", "發粉", "麵粉"], "answer": 1, "answerText": "蛋"}, {"no": 53, "q": "製作魔鬼蛋糕時，配方中增加 3％ 的可可粉，為調整吸水量，配方中的吸水應如何調整？", "options": ["減少 3％", "增加 3％", "減少 4.5％", "增加 4.5％"], "answer": 3, "answerText": "增加 4.5％"}, {"no": 54, "q": "麵粉含水量比標準減少 1％ 時，麵包麵糰攪拌時配方內水的用量可隨著增加多少？", "options": ["0％", "2％", "4％", "6％"], "answer": 1, "answerText": "2％"}, {"no": 55, "q": "煮製奶油空心餅（泡芙），下列何者為正確？", "options": ["麵粉、油脂、水同時置於鍋中煮沸", "油脂煮沸即加水、麵粉拌勻", "油脂與水煮沸並不斷攪拌加入麵粉，繼續攪拌加熱至麵粉完全糊化", "水、油脂煮沸即離火，加入麵粉拌勻"], "answer": 2, "answerText": "油脂與水煮沸並不斷攪拌加入麵粉，繼續攪拌加熱至麵粉完全糊化"}, {"no": 56, "q": "小西餅的烤焙原則為何？", "options": ["高溫短時間", "高溫長時間", "低溫短時間", "低溫長時間"], "answer": 0, "answerText": "高溫短時間"}, {"no": 57, "q": "炸油炸甜圈餅（道納司）的油溫以多少為佳？", "options": ["140～150℃", "180～190℃", "210～220℃", "230～240℃"], "answer": 1, "answerText": "180～190℃"}, {"no": 58, "q": "奶油空心餅成型後應該如何處理？", "options": ["馬上進爐烘烤", "鬆弛 10 分鐘後進爐", "鬆弛 15 分鐘後進爐", "鬆弛 30 分鐘後進爐"], "answer": 0, "answerText": "馬上進爐烘烤"}, {"no": 59, "q": "製作麵包時麵粉筋性較弱，應採用何種攪拌速度？", "options": ["快速", "中速", "慢速", "先用快速再改慢速"], "answer": 1, "answerText": "中速"}, {"no": 60, "q": "裹入油脂為麵糰的 1/4，即表示油脂量為麵糰的多少？", "options": ["20％", "25％", "30％", "35％"], "answer": 1, "answerText": "25％"}, {"no": 61, "q": "重奶油蛋糕如欲組織細膩，可以採用哪一種方法？", "options": ["直接法攪拌", "糖油拌合法", "麵粉油脂拌合法", "兩步拌合法"], "answer": 2, "answerText": "麵粉油脂拌合法"}, {"no": 62, "q": "麵糰分割重量 600 公克，烤好麵包重量為 540 公克，其烤焙損耗是多少？", "options": ["5％", "6％", "10％", "15％"], "answer": 2, "answerText": "10％"}, {"no": 63, "q": "整形後的丹麥麵包或甜麵包麵糰，如需冷藏，冰箱溫度應為何？", "options": ["-5～0℃", "0～7℃", "11～15℃", "16～20℃"], "answer": 1, "answerText": "0～7℃"}, {"no": 64, "q": "烤焙法國麵包時，烤爐內的蒸氣壓力與用量何者最適宜？", "options": ["壓力大、量小", "只要有蒸氣產生就好", "壓力低、量大", "壓力大、量大"], "answer": 2, "answerText": "壓力低、量大"}, {"no": 65, "q": "海綿蛋糕熱攪拌法是先將蛋加溫至多少？", "options": ["25℃以下", "25～30℃", "35～43℃", "50℃以上"], "answer": 2, "answerText": "35～43℃"}, {"no": 66, "q": "海綿蛋糕配方中各項材料百分比合計 180％，已知麵糊總量為 9 公斤，其麵粉用量應為多少？", "options": ["3.5 公斤", "4 公斤", "4.5 公斤", "5 公斤"], "answer": 3, "answerText": "5 公斤"}, {"no": 67, "q": "蛋白經攪拌後，最易與其他原料拌合且進爐後膨脹力最好的階段是？", "options": ["起泡狀態", "濕性發泡", "乾性發泡", "棉花狀態"], "answer": 1, "answerText": "濕性發泡"}, {"no": 68, "q": "麵粉用量為 22 公斤，乳化劑用量為 0.33 公斤，乳化劑所佔烘焙百分比為多少？", "options": ["1.2％", "1.5％", "1.8％", "2％"], "answer": 1, "answerText": "1.5％"}, {"no": 69, "q": "麵包製程中所稱的醒麵即是？", "options": ["基本發酵", "延續發酵", "中間發酵", "滾圓"], "answer": 2, "answerText": "中間發酵"}, {"no": 70, "q": "麵包配方經試驗為正確，但烤焙後表皮顏色經常深淺不一，下列何者不是可能原因？", "options": ["烤爐溫度不平均", "冷卻不足", "發酵", "整型的關係"], "answer": 1, "answerText": "冷卻不足"}, {"no": 71, "q": "中種麵糰攪拌後理想的溫度應為？", "options": ["20～22℃", "23～26℃", "28～30℃", "31～33℃"], "answer": 1, "answerText": "23～26℃"}, {"no": 72, "q": "一般乳沫類蛋糕使用蛋白的溫度最好為？", "options": ["17～22℃", "26～30℃", "31～35℃", "36～40℃"], "answer": 0, "answerText": "17～22℃"}, {"no": 73, "q": "戚風蛋糕蛋白部分要與麵粉拌合，蛋白攪拌到哪個階段最好？", "options": ["液體狀態", "濕性發泡", "乾性發泡", "棉花狀態"], "answer": 1, "answerText": "濕性發泡"}, {"no": 74, "q": "天使蛋糕蛋白應打到何種程度，成品膨脹能力較佳？", "options": ["乾性發泡", "濕性發泡", "棉花狀", "顆粒狀"], "answer": 1, "answerText": "濕性發泡"}, {"no": 75, "q": "麵包麵糰的中間發酵時間約為？", "options": ["25～30 分鐘", "8～15 分鐘", "3～5 分鐘", "0 分鐘即可"], "answer": 1, "answerText": "8～15 分鐘"}, {"no": 76, "q": "奶油空心餅進爐後，在爐內麵糊出油是因為？", "options": ["配方中麵粉用量太多", "加蛋時麵糊太冷，無法乳化均勻", "加蛋時麵糊溫度太高", "配方中蛋的用量太多"], "answer": 1, "answerText": "加蛋時麵糊太冷，無法乳化均勻"}, {"no": 77, "q": "烤焙用具（塑膠製品除外）貯放前最好如何處理？", "options": ["用抹布擦淨", "洗淨烤乾", "洗淨用抹布擦乾", "洗後自然晾乾"], "answer": 1, "answerText": "洗淨烤乾"}, {"no": 78, "q": "奶油空心餅產品內壁呈青色，底部有很多黑色小孔，是配方中使用過多的哪一項？", "options": ["蛋", "麵粉", "碳酸氫銨", "油脂"], "answer": 2, "answerText": "碳酸氫銨"}, {"no": 79, "q": "奶油空心餅成品底部凹陷大，是因為製作時哪一項因素？", "options": ["技術好", "烤盤油擦太多", "底火太弱", "上火太強"], "answer": 1, "answerText": "烤盤油擦太多"}, {"no": 80, "q": "為使奶油空心餅烤焙後表皮品質及膨大性良好，進爐前可噴什麼於麵糊表面？", "options": ["油", "膨脹劑", "蛋白", "水"], "answer": 3, "answerText": "水"}, {"no": 81, "q": "奶油空心餅成品內部缺乏空囊，是因為？", "options": ["麵糊太乾", "配方內油的用量太少", "使用化學膨脹劑", "麵糊糊化程度良好"], "answer": 0, "answerText": "麵糊太乾"}, {"no": 82, "q": "酵母油炸甜圈餅（道納司）的麵糰應攪拌至哪一階段？", "options": ["拾起階段", "捲起階段", "麵筋擴展階段", "麵筋斷裂階段"], "answer": 2, "answerText": "麵筋擴展階段"}, {"no": 83, "q": "派皮整型時，使用防黏用麵粉應使用哪一種？", "options": ["低筋麵粉", "中筋麵粉", "高筋麵粉", "洗筋粉"], "answer": 2, "answerText": "高筋麵粉"}, {"no": 84, "q": "派皮過度收縮的原因是？", "options": ["派皮中油脂量太多", "麵粉筋度太弱", "水分太少", "揉捏整型過久"], "answer": 3, "answerText": "揉捏整型過久"}, {"no": 85, "q": "蛋在牛奶雞蛋布丁餡中的功能，除了提高香味和品質外，還具有什麼功能？", "options": ["防腐", "流散", "凝固", "容易烤焙"], "answer": 2, "answerText": "凝固"}, {"no": 86, "q": "酸度較強的派餡，為防止貯存時出水，其濃度可用什麼調整？", "options": ["黏稠劑", "油脂", "酸", "防腐劑"], "answer": 0, "answerText": "黏稠劑"}, {"no": 87, "q": "鬆餅（起酥）的麵糰軟硬度與裹入用油脂的軟硬度應如何配合，才能達到最佳效果？", "options": ["麵糰較硬", "兩者一致", "麵糰較軟", "兩者無關"], "answer": 1, "answerText": "兩者一致"}, {"no": 88, "q": "烘焙鬆餅（起酥），除了以蒸氣控制表皮外，應先使用什麼烤焙？", "options": ["大火", "小火", "上火", "下火"], "answer": 0, "answerText": "大火"}, {"no": 89, "q": "鬆餅（起酥）的製作中，蘇格蘭簡易法一起攪拌的方式為何？", "options": ["麵粉與水攪拌至完全出筋後再加入油脂", "以切麵刀將油脂和麵粉拌合切成乒乓球狀，再將冰水和其他原料一起加入", "油脂與麵粉打成油粉狀完全分散後，再加入水等原料", "將水和油脂打發後，再加入其他原料攪拌"], "answer": 1, "answerText": "以切麵刀將油脂和麵粉拌合切成乒乓球狀，再將冰水和其他原料一起加入"}, {"no": 90, "q": "鬆餅（起酥）若要求成品體積大、酥層多，配方中裹入油脂與麵糰用油總量以何者為佳？", "options": ["20％", "50％", "75％", "100％"], "answer": 3, "answerText": "100％"}, {"no": 91, "q": "酵母油炸甜圈餅（酵母道納司）製作時，若要控制成金黃色澤，製程上應注意什麼？", "options": ["適當的發酵", "過度的發酵", "低溫長時間油炸", "較硬的麵糰"], "answer": 0, "answerText": "適當的發酵"}, {"no": 92, "q": "烤焙麵糰極軟的小西餅時，最好使用哪一種烤盤（鋼帶）？", "options": ["細網狀", "粗網狀", "平板狀", "圓孔狀"], "answer": 2, "answerText": "平板狀"}, {"no": 93, "q": "為使小西餅成品帶有金黃色色澤，配方中可使用什麼？", "options": ["澱粉", "奶粉", "防腐劑", "抗氧化劑"], "answer": 1, "answerText": "奶粉"}, {"no": 94, "q": "硬質甜餅乾成型時，為使印模圖案清晰，配方中可加入什麼改善？", "options": ["沙拉油", "玉米澱粉", "膨脹劑", "粗砂糖"], "answer": 1, "answerText": "玉米澱粉"}, {"no": 95, "q": "鬆餅（起酥）的製作中，下列何者對膨脹度影響最大？", "options": ["糖", "蛋", "麵粉", "裹入用油脂"], "answer": 3, "answerText": "裹入用油脂"}, {"no": 96, "q": "酵母油炸甜圈餅的配方與甜麵包類似，但為求成品品質與形狀完整，配方中的糖與油脂較甜麵包如何？", "options": ["高", "少", "相等", "視情況而定"], "answer": 1, "answerText": "少"}, {"no": 97, "q": "下列何種油炸甜圈餅（道納司）可採用烤焙方法製作？", "options": ["法式道納司", "蛋糕油炸甜圈餅", "酵母油炸甜圈餅", "麻花道納司"], "answer": 0, "answerText": "法式道納司"}, {"no": 98, "q": "慕斯西點的製作，一般由下列何種原料組合而成？", "options": ["雞蛋、玉米澱粉及果汁", "蛋黃、果膠及果汁", "鮮奶油、蛋白及果汁", "鮮奶油、吉利丁及果汁"], "answer": 3, "answerText": "鮮奶油、吉利丁及果汁"}, {"no": 99, "q": "下列何種原料組合不適宜製作夏季透明性涼果類產品？", "options": ["玉米澱粉、果汁", "果膠、果汁", "洋菜、果汁", "吉利丁、果汁"], "answer": 0, "answerText": "玉米澱粉、果汁"}, {"no": 100, "q": "下列何種原料組合及製作條件，適合製作良好品質的翻糖（fondant）？", "options": ["細粒特砂、水，熬煮終點溫度 135℃", "細粒特砂、水，熬煮終點溫度 100℃", "細粒特砂、水、葡萄糖漿，熬煮終點溫度 115℃", "細粒特砂、水、葡萄糖漿，熬煮終點溫度 135℃"], "answer": 2, "answerText": "細粒特砂、水、葡萄糖漿，熬煮終點溫度 115℃"}];
const $=id=>document.getElementById(id);let cancelled=false;let current=0;
function getVoice(){if(!('speechSynthesis' in window))return null;const vs=speechSynthesis.getVoices();return vs.find(v=>/^zh-TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}
function say(text,onend=()=>{}){if(!('speechSynthesis' in window)){$('status').textContent='此瀏覽器不支援朗讀，請使用 Chrome 或 Edge。';return;}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=0.92;const v=getVoice();if(v)u.voice=v;u.onend=()=>{onend();};u.onerror=()=>{$('status').textContent='朗讀未能啟動，請再按一次朗讀按鈕。';};speechSynthesis.speak(u);}
function speakItem(i){cancelled=true;speechSynthesis.cancel();cancelled=false;current=i;$('status').textContent='正在朗讀第 '+QS[i].no+' 題';say(`第${QS[i].no}題。${QS[i].q}。正確答案：${QS[i].answerText}。`,()=>{if(!cancelled)$('status').textContent='第 '+QS[i].no+' 題朗讀完畢';});}
function allSpeak(i=0){if(i>=QS.length){$('status').textContent='全部 50 題朗讀完畢';return;}if(cancelled)return;current=i;$('status').textContent=`正在朗讀第 ${QS[i].no} 題（${i+1}／${QS.length}）`;say(`第${QS[i].no}題。${QS[i].q}。正確答案：${QS[i].answerText}。`,()=>{if(!cancelled)allSpeak(i+1);});}
$('test').onclick=()=>{cancelled=true;speechSynthesis.cancel();cancelled=false;$('status').textContent='語音測試中';say('朗讀測試成功。這是烘焙食品丙級工作項目三報讀版。',()=>$('status').textContent='測試朗讀完成');};
$('all').onclick=()=>{if(!('speechSynthesis' in window)){$('status').textContent='此瀏覽器不支援朗讀，請使用 Chrome 或 Edge。';return;}cancelled=true;speechSynthesis.cancel();cancelled=false;allSpeak(0);};
$('stop').onclick=()=>{cancelled=true;if('speechSynthesis' in window)speechSynthesis.cancel();$('status').textContent='已停止朗讀';};
function render(){$('list').innerHTML=QS.map((q,i)=>`<section class="card qrow"><div class="qtitle">第 ${q.no} 題</div><div class="qtext">${q.q}</div><div class="ans"><strong>正確答案：</strong>${q.answerText}</div><div class="bar"><button class="ghost" onclick="speakItem(${i})">🔊 朗讀本題（題目＋答案）</button></div></section>`).join('');}
render();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{getVoice();};
</script></body></html>
