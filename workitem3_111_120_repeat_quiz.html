<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#234d68;color:white;padding:20px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #d7e0e8;border-radius:14px;padding:18px;margin:12px 0}button{border:0;border-radius:9px;padding:11px 15px;margin:4px;background:#245b78;color:white;font-size:16px;cursor:pointer}button.secondary{background:#e8edf2;color:#20364f}button.opt{display:block;width:100%;text-align:left;background:white;color:#17202a;border:1px solid #cbd5df;margin:9px 0}button:disabled{cursor:default}.correct{background:#e2f4e8!important;color:#14532d!important}.wrong{background:#ffebeb!important;color:#7f1d1d!important}.hidden{display:none}.q{font-size:20px;font-weight:750;line-height:1.7}.muted{color:#5c6875}.row{display:flex;flex-wrap:wrap;gap:6px}.progress{height:8px;background:#e3e8ee;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#3b78d8}.feedback{padding:12px;border-radius:10px;background:#f0f3f7;margin-top:12px}.score{font-size:32px;font-weight:850}.item{border-bottom:1px solid #e3e8ee;padding:16px 0;line-height:1.7}</style><title>工作項目三｜111～120題重複測驗</title><header><h1>烘焙食品丙級｜工作項目三</h1><div>第 111～120 題｜朗讀＋可重複測驗</div></header><main><section id="start" class="card"><h2>開始練習</h2><p>共 10 題。每次開始會重新打亂題目與選項。答題後立即顯示正誤與正確答案，完成後可查看錯題並重新測驗。</p><button id="startBtn">開始測驗</button></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section></main><script>const BANK=[{"n": 111, "q": "小麥之橫斷面呈粉質狀者為何？", "opts": ["高筋麵粉", "中筋麵粉", "粉心麵粉", "低筋麵粉"], "a": "低筋麵粉"}, {"n": 112, "q": "小麥之橫斷面呈玻璃質狀者為何？", "opts": ["高筋麵粉", "中筋麵粉", "粉心麵粉", "低筋麵粉"], "a": "高筋麵粉"}, {"n": 113, "q": "麵粉蛋白質是屬於部分不完全蛋白質，因為其胺基酸內缺少了一種必需胺基酸為？", "opts": ["甲硫胺酸（methionine）", "胱胺酸（cystine）", "半胱胺酸（cysteine）", "離胺酸（lysine）"], "a": "離胺酸（lysine）"}, {"n": 114, "q": "下列何種胺基酸內含有硫氫根（-SH），並具有還原特性，以影響麵糰之性質？", "opts": ["麩胺酸（glutamic acid）", "甘胺酸（glycine）", "半胱胺酸（cysteine）", "離胺酸（lysine）"], "a": "半胱胺酸（cysteine）"}, {"n": 115, "q": "小麥胚芽中含有下列何種物質，其含有硫氫根（-SH），會減少麵筋彈性，使麵糰發粘？", "opts": ["維生素 E", "礦物質", "油脂", "麩胱甘肽"], "a": "麩胱甘肽"}, {"n": 116, "q": "可以得到麵粉之吸水量、攪拌時間及攪拌耐力之儀器設備為？", "opts": ["麵粉酵素活性測定儀（Amylograph）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": "麵糰攪拌特性測定儀（Farinograph）"}, {"n": 117, "q": "測定低筋粉或軟麥麵粉中膠性粘度之儀器設備為？", "opts": ["麵粉沉降係數測定儀（Falling Number）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": "連續溫度黏度測定儀（Viscosgraph）"}, {"n": 118, "q": "測定麵筋之伸張力及伸張阻力等品質之儀器設備為？", "opts": ["麵粉酵素活性測定儀（Amylograph）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": "麵糰拉力特性測定儀（Extensograph）"}, {"n": 119, "q": "測定麵粉中之液化酵素的儀器設備為？", "opts": ["麵粉酵素活性測定儀（Amylograph）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": "麵粉酵素活性測定儀（Amylograph）"}, {"n": 120, "q": "D.E.值（葡萄糖當量）30～50 之澱粉糖漿，其組成成分為？", "opts": ["蔗糖", "果糖", "葡萄糖", "糊精、麥芽糖及葡萄糖之混合物"], "a": "糊精、麥芽糖及葡萄糖之混合物"}];const $=id=>document.getElementById(id);let run=[],idx=0,score=0,wrong=[];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function start(){stop();run=shuffle(BANK).map(x=>({...x,opts:shuffle(x.opts)}));idx=0;score=0;wrong=[];$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()}function show(){let x=run[idx];$('quiz').innerHTML=`<div class="muted">第 ${idx+1} / ${run.length} 題（題庫題號 ${x.n}）</div><div class="progress"><div class="fill" style="width:${idx/run.length*100}%"></div></div><div class="q">${x.q}</div><div id="opts"></div><div class="row"><button class="secondary" id="read">🔊 朗讀題目與選項</button><button class="secondary" id="stop">⏹ 停止朗讀</button></div><div id="feedback"></div>`;x.opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>choose(o);$('opts').appendChild(b)});$('read').onclick=()=>speak(`第${x.n}題。${x.q}。${x.opts.map((o,i)=>`選項${['A','B','C','D'][i]}：${o}。`).join('')}`);$('stop').onclick=stop}function choose(o){stop();let x=run[idx],ok=o===x.a;if(ok)score++;else wrong.push({...x,chosen:o});document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct');if(b.textContent===o&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=`<div class="feedback">${ok?'答對！':'答錯。'} 正確答案：${x.a}</div><button id="next">${idx===run.length-1?'查看成績':'下一題'}</button>`;$('next').onclick=()=>{idx++;if(idx<run.length)show();else finish()}}function finish(){stop();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let pct=Math.round(score/run.length*100);$('result').innerHTML=`<h2>測驗完成</h2><div class="score">${score} / ${run.length} 題（${pct} 分）</div><p>${wrong.length?`答錯 ${wrong.length} 題，請檢視下方錯題。`:'全部答對！'}</p><h3>錯題整理</h3>${wrong.length?wrong.map(x=>`<div class="item"><strong>第 ${x.n} 題：</strong>${x.q}<br>你的答案：${x.chosen}<br><strong>正確答案：${x.a}</strong><br><button class="secondary" data-read="${x.n}">🔊 朗讀錯題與答案</button></div>`).join(''):'<p>沒有錯題。</p>'}<div class="row"><button id="again">🔁 重新測驗</button><button class="secondary" id="stop">⏹ 停止朗讀</button></div>`;document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let x=wrong.find(x=>x.n==b.dataset.read);speak(`第${x.n}題。${x.q}。正確答案：${x.a}。`)});$('again').onclick=start;$('stop').onclick=stop}$('startBtn').onclick=start;</script></html>
