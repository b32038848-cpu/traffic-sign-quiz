<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作項目三 101–130 題｜朗讀與重複測驗</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;max-width:850px;margin:24px auto;padding:0 16px;line-height:1.7;color:#222}button{padding:9px 14px;margin:5px;border:1px solid #aaa;border-radius:8px;background:#f7f7f7;cursor:pointer}.card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}.muted{color:#666}.opt{display:block;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:8px}.correct{background:#e7f5e8}.wrong{background:#fde8e8}</style><body><h1>工作項目三 101–130 題｜朗讀與重複測驗</h1><p>30 題單選。作答後顯示答案，可重新測驗。支援題目與選項朗讀。</p><div id="app"></div><script>
const qs=[{"n": 101, "answer": 1, "question": "下列那一項非麵包滾圓的目的？", "options": ["鬆弛麵筋使麵糰易於整型", "使麵糰表 面光滑不易粘手", "使麵糰易於保住二氧化碳", "使氣體均勻分佈"]}, {"n": 102, "answer": 4, "question": "調整配方時，下列何者材料不會使麵包麵糰較軟？", "options": ["水", "糖", "油", "麵 粉"]}, {"n": 103, "answer": 1, "question": "調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？", "options": ["水", "糖", "油", "麵粉"]}, {"n": 104, "answer": 1, "question": "法國麵包（硬式麵包）常用之烤焙溫度為多少？", "options": ["230℃", "200℃", "170 ℃", "150℃"]}, {"n": 105, "answer": 2, "question": "800 公克的帶蓋土司在正常的狀態下，給予 200℃烤溫，烤焙所需時間 為？", "options": ["15～20 分", "35～40 分", "55～60 分", "1 小時以上"]}, {"n": 106, "answer": 4, "question": "下列那一種麵包，烤焙時間最短？", "options": ["800 公克的帶蓋土司", "450 公克的圓 頂葡萄乾土司", "350 公克的法國麵包", "90 公克包餡的甜麵包"]}, {"n": 107, "answer": 3, "question": "下列那一種麵包必需使用蒸氣烤爐？", "options": ["甜麵包", "丹麥麵包", "硬式麵包", "葡萄乾麵包"]}, {"n": 108, "answer": 1, "question": "圓烤盤，其直徑為 22 公分、高 5 公分其容積為？", "options": ["1899.7 立方公分", "1997.7 立方公分", "7598.8 立方公分", "110 立方公分"]}, {"n": 109, "answer": 2, "question": "長方型烤盤，其長為 30 公分、寬為 22 公分、高為 5 公分，其容積為？", "options": ["3300 平方公分", "3300 立方公分", "660 平方公分", "660 立方公分 。 Page 16 of 28"]}, {"n": 110, "answer": 2, "question": "低成分重奶油蛋糕，採用何種攪拌方法為宜？", "options": ["麵粉油脂拌合法", "糖油 拌合法", "兩步拌合法", "糖水拌合法"]}, {"n": 111, "answer": 4, "question": "何種攪拌方法能節省人工和縮短攪拌時間？", "options": ["糖油拌合法", "麵粉油脂拌 合法", "糖水拌合法", "直接法"]}, {"n": 112, "answer": 3, "question": "麵糊類蛋糕的麵糊溫度應該是？", "options": ["10℃", "15℃", "22℃", "30℃ 在這個溫 度的麵糊所烤出來的蛋糕，體積最大，內部組織細膩"]}, {"n": 113, "answer": 4, "question": "下列何種蛋糕在烘焙時不可擦防粘油脂？", "options": ["海綿蛋糕", "重奶油蛋糕", "輕 奶油蛋糕", "天使蛋糕"]}, {"n": 114, "answer": 1, "question": "理想的海綿蛋糕麵糊比重為", "options": ["0.46", "0.56", "0.66", "0.76 左右"]}, {"n": 115, "answer": 3, "question": "利用糖油拌合法製作丹麥小西餅(Danish cookies)，材料中的麵粉應在最後 加入，輕輕拌勻，其主要的原因為？", "options": ["容易吸收水分", "好控制麵粉量", "避免攪拌出筋", "防止破壞打發的氣泡"]}, {"n": 116, "answer": 4, "question": "菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其 原因為？", "options": ["不需最後發酵", "需較高濕度發酵", "需較高溫度發酵", "避免高 濕高溫的發酵使菠蘿皮融解而化開"]}, {"n": 117, "answer": 1, "question": "50～100 公克左右的甜麵包，其烤焙應？", "options": ["上火為主，下火為輔", "只用上 火", "下火為主，上火為輔", "只用下火"]}, {"n": 118, "answer": 2, "question": "以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？", "options": ["硬", "粗糙", "細膩", "沒影響"]}, {"n": 119, "answer": 2, "question": "戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？", "options": ["組織較軟", "拌入其他材料時易消泡", "體積較大", "不影響蛋糕品質"]}, {"n": 120, "answer": 2, "question": "可以減少海綿蛋糕出爐時收縮的程度為？", "options": ["選用麵筋較強的麵粉", "烤焙 時間避免過久", "烤盤擦油", "減少配方中的用油量"]}, {"n": 121, "answer": 4, "question": "添加下列那一項材料不會增加蛋糕的柔軟度？", "options": ["糖", "油", "蛋黃", "麵 粉"]}, {"n": 122, "answer": 1, "question": "一般麵糊類蛋糕烤熟與否的判斷方法？", "options": ["以探針試探或以手輕拍", "以顏 色判斷即可", "時間一到即可出爐", "敲烤盤邊聽聲音判斷"]}, {"n": 123, "answer": 3, "question": "切割蛋糕用的刀子，下列那一種方式既可防止細菌污染又可達到切面整齊 的要求？", "options": ["洗淨使用", "以布擦拭後使用", "浸在沸水中燙一次，切一次", "在沸水中燙一次用布擦一下使用"]}, {"n": 124, "answer": 4, "question": "煮製檸檬布丁餡時檸檬汁在？", "options": ["與水一道加入", "與玉米澱粉拌勻加入", "糖水部分煮沸後加入", "待餡煮好後加入拌勻"]}, {"n": 125, "answer": 3, "question": "製作丹麥麵包整形宜在？", "options": ["近烤爐邊", "一般的工作間", "在溫度較低的場 所", "與溫度無關，在那裡整形皆可"]}, {"n": 126, "answer": 3, "question": "麵粉的 pH 值變小時，小西餅的體積", "options": ["不變", "變大", "變小", "變厚"]}, {"n": 127, "answer": 1, "question": "餅乾用麵粉，若酸度偏高時，配方中應提高？", "options": ["小蘇打", "水", "氧化劑", "油脂 的用量"]}, {"n": 128, "answer": 1, "question": "蘇打餅乾成品的 pH 值比一般奶油小西餅為？", "options": ["高", "相同", "低", "測不出 來 。 Page 17 of 28"]}, {"n": 129, "answer": 4, "question": "下列那種因素不會影響麵包攪拌時間？", "options": ["攪拌速度不同", "配方不同", "攪 拌機型式不同", "攪拌人員不同"]}, {"n": 130, "answer": 1, "question": "正常情況下，甜麵包麵糰之攪拌時間，應比白土司麵包？", "options": ["長", "短", "一 樣", "不受限制"]}];
let order=[],idx=0,score=0,wrong=[];
function speak(t){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';speechSynthesis.speak(u)}
function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
function start(){speechSynthesis?.cancel();order=[...qs].sort(()=>Math.random()-.5);idx=0;score=0;wrong=[];render()}
function render(){
 const app=document.getElementById('app');app.replaceChildren();
 if(idx>=order.length){
  app.append(el('h2',`完成！${score}/${order.length}`));
  app.append(el('p',`答錯 {$wrong.length} 題。`));
  if(wrong.length){app.append(el('h3','錯題總結'));wrong.forEach((w,i)=>{const c=el('div',undefined,'card');c.append(el('b',`${i+1}. 題庫第 ${w.q.n} 題`),el('p',w.q.question),el('p','你的答案：'+w.q.options[w.user-1]),el('p','正確答案：'+w.q.options[w.q.answer-1]));app.append(c)})}else app.append(el('p','全部答對，沒有錯題！'));
  const again=el('button','重新測驗');again.onclick=start;app.append(again);return
 }
 const q=order[idx],card=el('div',undefined,'card');card.append(el('p',`第 ${idx+1}/${order.length} 題（題庫題號 ${q.n}）`),el('h3',q.question));
 const rq=el('button','朗讀題目');rq.onclick=()=>speak(q.question);card.append(rq);
 const ro=el('button','朗讀選項');ro.onclick=()=>speak(q.options.map((x,i)=>String.fromCharCode(65+i)+'、'+x).join('。'));card.append(ro);
 q.options.forEach((x,i)=>{const label=el('label',undefined,'opt'),input=document.createElement('input');input.type='radio';input.name='ans';input.value=i+1;label.append(input,document.createTextNode(' '+String.fromCharCode(65+i)+'. '+x));card.append(label)});
 const submit=el('button','確認答案'),feedback=el('p'),next=el('button','下一題');next.hidden=true;
 submit.onclick=()=>{const selected=card.querySelector('input[name=ans]:checked');if(!selected){alert('請先選答案');return}const user=Number(selected.value),ok=user===q.answer;if(ok)score++;else wrong.push({q,user});feedback.textContent=(ok?'答對':'答錯')+'；正確答案：'+q.options[q.answer-1];card.querySelectorAll('input').forEach(x=>x.disabled=true);submit.disabled=true;next.hidden=false};
 next.onclick=()=>{idx++;render()};card.append(submit,feedback,next);app.append(card)
}
start();
</script></body></html>
