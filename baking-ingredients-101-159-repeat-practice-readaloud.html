se;$('quiz').classList.remove('hidden');$('status').textContent=`第 ${idx+1}／${BANK.length} 題｜目前得分 ${score}`;const pct=Math.round(idx/BANK.length*100);$('quiz').innerHTML=`<div class="qhead"><span>題庫第 ${q.n} 題</span><span>${idx+1}／${BANK.length}</span></div><div class="progress"><div class="fill" style="width:${pct}%"></div></div><div class="question">${esc(q.q)}</div><button class="btn speak" id="speakBtn">🔊 朗讀本題（題目＋選項）</button><button class="btn stop" id="stopBtn">⏹ 停止朗讀</button><div id="opts"></div><div id="feedback" class="feedback">請選擇答案。</div><div class="controls"><button class="btn secondary" id="nextBtn" disabled>${idx===BANK.length-1?'查看結果':'下一題'}</button><button class="btn secondary" id="restartBtn">重新練習</button></div>`;const opts=$('opts');currentOptions.forEach((op,i)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=`${String.fromCharCode(65+i)}. ${op.text}`;b.addEventListener('click',()=>answer(i));opts.appendChild(b);});$('speakBtn').addEventListener('click',speakCurrent);$('stopBtn').addEventListener('click',stopSpeak);$('nextBtn').addEventListener('click',next);$('restartBtn').addEventListener('click',start);}function answer(selected){if(answered)return;answered=true;stopSpeak();const q=currentQuestion();const correctIndex=currentOptions.findIndex(x=>x.correct);document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===correctIndex)b.classList.add('correct');if(i===selected&&i!==correctIndex)b.classList.add('wrong');});if(selected===correctIndex){score++;$('feedback').className='feedback ok';$('feedback').innerHTML='<span class="answer">答對了！</span>';}else{wrong.push({n:q.n,q:q.q,selected:currentOptions[selected].text,answer:currentOptions[correctIndex].text});$('feedback').className='feedback no';$('feedback').innerHTML=`答錯了。正確答案：<span class="answer">${esc(currentOptions[correctIndex].text)}</span>`;}$('nextBtn').disabled=false;$('status').textContent=`第 ${idx+1}／${BANK.length} 題｜目前得分 ${score}`;}function next(){if(!answered)return;idx++;if(idx>=BANK.length){showResult();return;}render();window.scrollTo({top:0,behavior:'smooth'});}function showResult(){stopSpeak();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const total=BANK.length;const pct=Math.round(score/total*100);let msg='你需要多讀點書';if(pct===100)msg='你超級棒!!';else if(pct>=90)msg='不錯喔! 繼續努力！';else if(pct>=70)msg='不錯，加油';let html=`<div class="result-msg">${msg}</div><div class="score">${pct} 分</div><div>答對 ${score}／${total} 題</div><button class="btn primary" id="againBtn" style="margin-top:14px">重新練習</button>`;if(wrong.length){html+=`<div class="wrong-list"><h3>錯題整理（${wrong.length}題）</h3>`;wrong.forEach(w=>{html+=`<div class="wrong-item"><strong>第${w.n}題</strong><br>${esc(w.q)}<br>你的答案：${esc(w.selected)}<br><strong>正確答案：${esc(w.answer)}</strong></div>`;});html+='</div>';}else html+='<div class="small">本次全部答對。</div>';html+='<button class="btn secondary" id="topBtn" style="margin-top:10px">回到開始畫面</button>';$('result').innerHTML=html;$('againBtn').addEventListener('click',start);$('topBtn').addEventListener('click',()=>{stopSpeak();$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('start').classList.remove('hidden');$('status').textContent='59題手機重複測驗｜題目與選項隨機｜含朗讀';window.scrollTo({top:0,behavior:'smooth'});});}$('startBtn').addEventListener('click',start);</script></body></html>
