<script>
const QUESTIONS = [{"n": 1, "q": "下列材料中，甜度最低的是？", "opts": ["A. 果糖", "B. 砂糖", "C. 麥芽糖", "D. 乳糖"], "ans": "D"}, {"n": 2, "q": "台灣目前使用的白油，每桶重量約為？", "opts": ["A. 5公斤", "B. 10公斤", "C. 16公斤", "D. 30公斤"], "ans": "C"}, {"n": 3, "q": "塔塔粉是屬？", "opts": ["A. 中性鹽", "B. 酸性鹽", "C. 鹼性鹽", "D. 低鹼性鹽"], "ans": "B"}, {"n": 4, "q": "麵包配方中糖含量（依烘焙百分比）佔20％以上的是？", "opts": ["A. 土司麵包", "B. 法國麵包", "C. 甜麵包", "D. 全麥麵包"], "ans": "C"}, {"n": 5, "q": "一般以中種法製作麵包，中種麵糰的原料不含？", "opts": ["A. 鹽", "B. 酵母", "C. 麵粉", "D. 水"], "ans": "A"}, {"n": 6, "q": "以下那一種原料不屬於化學膨大劑？", "opts": ["A. 發粉", "B. 小蘇打", "C. 酵母", "D. 阿摩尼亞（碳酸氫銨）"], "ans": "C"}, {"n": 7, "q": "下列那種油脂約含有10％的氣體（氮氣）？", "opts": ["A. 清香油", "B. 瑪琪琳", "C. 雪白乳化油", "D. 奶油"], "ans": "C"}, {"n": 8, "q": "沒有分析檢驗的情況下，下列何者不是由外觀判斷油炸油的劣化？", "opts": ["A. 顏色加深", "B. 黏度增加", "C. 有蟹泡並提前冒煙", "D. 酸價為1.0"], "ans": "D"}, {"n": 9, "q": "麵包配方中何種材料添加愈多發酵愈快？", "opts": ["A. 油脂", "B. 蛋黃", "C. 酵母", "D. 細砂糖"], "ans": "C"}, {"n": 10, "q": "國產麵粉每袋的重量以何種最多？", "opts": ["A. 22磅", "B. 30磅", "C. 22公斤", "D. 30公斤"], "ans": "C"}, {"n": 11, "q": "海綿蛋糕配方主要原料為？", "opts": ["A. 細砂糖、麵粉、鹽、牛奶", "B. 麵粉、沙拉油、水", "C. 麵粉、細砂糖、發粉", "D. 麵粉、細砂糖、蛋"], "ans": "D"}, {"n": 12, "q": "下列何種材料可提高小西餅產品的脆性？", "opts": ["A. 鹽", "B. 水", "C. 糖", "D. 蛋"], "ans": "C"}, {"n": 13, "q": "製作某種麵包，使用新鮮酵母4％，今因某種原因需改用快速即發酵母粉，用量應為？", "opts": ["A. 4％", "B. 2％", "C. 1.6％", "D. 1.33％"], "ans": "C"}, {"n": 14, "q": "配方內使用60％鮮奶製作麵包，比用4％的脫脂奶粉作麵包，其實際奶粉固形量？", "opts": ["A. 較少", "B. 相同", "C. 較多", "D. 大同小異"], "ans": "C"}, {"n": 15, "q": "奶水中含固形物（奶粉）量為？", "opts": ["A. 4％", "B. 8％", "C. 12％", "D. 16％"], "ans": "C"}, {"n": 16, "q": "做蘇打餅乾應注意油脂的？", "opts": ["A. 安定性好、不易酸敗", "B. 打發性好", "C. 乳化效果好", "D. 可塑性好"], "ans": "A"}, {"n": 17, "q": "蒸發奶水含固形物為？", "opts": ["A. 40％", "B. 35％", "C. 30％", "D. 26％"], "ans": "D"}, {"n": 18, "q": "麵包配方中正常用糖量如從5％增加為10％，則烤好後的麵包最明顯的不同是？", "opts": ["A. 表皮顏色變淺", "B. 表皮變薄而軟", "C. 表皮顏色加深", "D. 表皮變粗糙"], "ans": "C"}, {"n": 19, "q": "做麵包時配方中油脂量高，可使麵包表皮？", "opts": ["A. 顏色深", "B. 厚", "C. 柔軟", "D. 硬"], "ans": "C"}, {"n": 20, "q": "乳化劑在蛋糕中的功能是？", "opts": ["A. 使蛋糕風味佳", "B. 使蛋糕顏色加深", "C. 融和配方內水和油使組織細膩", "D. 縮短攪拌時間減少人工"], "ans": "C"}, {"n": 21, "q": "一般烘焙人員所稱的「重曹」(baking soda)是指？", "opts": ["A. 發粉", "B. 蘇打粉", "C. 酵母", "D. 酵素"], "ans": "B"}, {"n": 22, "q": "全蛋的固形物為？", "opts": ["A. 10％", "B. 15％", "C. 25％", "D. 35％"], "ans": "C"}, {"n": 23, "q": "要使麵包長時間保持柔軟，可在配方內添加？", "opts": ["A. 膨大劑", "B. 麥芽酵素", "C. 乳化劑", "D. 丙酸鈣"], "ans": "C"}, {"n": 24, "q": "稀釋奶油霜飾最適當的原料是？", "opts": ["A. 沙拉油", "B. 水", "C. 蛋", "D. 稀糖漿"], "ans": "D"}, {"n": 25, "q": "一般油炸用油發煙點應在？", "opts": ["A. 150～160℃", "B. 160～170℃", "C. 170～180℃", "D. 200℃以上"], "ans": "D"}, {"n": 26, "q": "為使小西餅達到鬆脆與擴展的目的，配方內可多使用？", "opts": ["A. 細砂糖", "B. 糖粉", "C. 糖漿", "D. 麥芽糖"], "ans": "A"}, {"n": 27, "q": "食品工廠用的油炸用油最好選用？", "opts": ["A. 沙拉油", "B. 氫化油", "C. 黃豆油", "D. 奶油"], "ans": "B"}, {"n": 28, "q": "新鮮酵母貯存的最佳溫度為？", "opts": ["A. -10～0℃", "B. 2～10℃", "C. 11～20℃", "D. 21～27℃"], "ans": "B"}, {"n": 29, "q": "製作麩皮或裸麥麵包，其主要原料的麵粉為？", "opts": ["A. 高筋麵粉", "B. 洗筋粉", "C. 粉心粉", "D. 低筋麵粉"], "ans": "A"}, {"n": 30, "q": "下列那一種油脂其烤酥性最大？", "opts": ["A. 純奶油", "B. 人造奶油", "C. 豬油", "D. 雪白油"], "ans": "D"}, {"n": 31, "q": "製作天使蛋糕時塔塔粉與鹽的用量總和為？", "opts": ["A. 0.1％", "B. 1％", "C. 5％", "D. 10％"], "ans": "B"}, {"n": 32, "q": "下列那一種糖的甜度最高？", "opts": ["A. 果糖", "B. 轉化糖漿", "C. 砂糖", "D. 葡萄糖"], "ans": "A"}, {"n": 33, "q": "製做丹麥麵包或鬆餅，其裹入用油脂應採用？", "opts": ["A. 豬油", "B. 雪白奶油", "C. 白油（烤酥油）", "D. 瑪琪琳"], "ans": "D"}, {"n": 34, "q": "麵粉如因貯存太久筋性受損，在做麵包時可酌量在配方內？", "opts": ["A. 增加鹽的用量", "B. 減少糖的用量", "C. 使用脫脂奶粉", "D. 增加乳化劑"], "ans": "D"}, {"n": 35, "q": "製作高成分奶油海綿蛋糕為降低麵粉的筋性，配方內部分麵粉最好用哪一項代替？", "opts": ["A. 全脂奶粉", "B. 太白粉", "C. 小麥澱粉", "D. 乳清粉"], "ans": "C"}, {"n": 36, "q": "乳化油在下列那一項產品較不合適添加？", "opts": ["A. 戚風蛋糕", "B. 麵包", "C. 海綿蛋糕", "D. 奶油霜飾"], "ans": "D"}, {"n": 37, "q": "欲增加小西餅鬆酥的性質可酌量增加？", "opts": ["A. 水", "B. 油", "C. 糖", "D. 高筋麵粉"], "ans": "B"}, {"n": 38, "q": "使用蒸發奶水代替鮮奶時，應照鮮奶用量？", "opts": ["A. 等量使用", "B. 1/3蒸發奶水加2/3水", "C. 2/3蒸發奶水加1/3水", "D. 1/2蒸發奶水加1/2水"], "ans": "D"}, {"n": 39, "q": "製作蛋糕道納 const PASSWORD = "0109";
let idx=0, picks={}, identity="", finished=false, started=false;
const $=id=>document.getElementById(id);
function keyFor(){return "quiz1012:"+[$("studentClass").value.trim(),$("seat").value.trim(),$("studentName").value.trim()].map(s=>s.toLowerCase()).join("|")}
function warn(s){$("warning").textContent=s}
function save(){if(identity) localStorage.setItem(identity,JSON.stringify({picks,idx,started,finished}))}
function render(){
 const q=QUESTIONS[idx]; $("counter").textContent=`第 ${idx+1} / ${QUESTIONS.length} 題`;
 $("answered").textContent=`已作答 ${Object.keys(picks).length} 題`;
 $("bar").style.width=`${(idx+1)/QUESTIONS.length*100}%`;
 $("qtext").textContent=`${q.n}. ${q.q}`;
 $("options").innerHTML="";
 q.opts.forEach(opt=>{
  const letter=opt.slice(0,1), label=document.createElement("label"); label.className="option";
  const radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.value=letter;radio.checked=picks[q.n]===letter;
  radio.addEventListener("change",()=>{picks[q.n]=letter;save();renderMeta()});
  const span=document.createElement("span");span.textContent=opt.slice(3);
  label.append(radio,span);$("options").append(label);
 });
 $("prev").disabled=idx===0;$("next").textContent=idx===QUESTIONS.length-1?"交卷":"下一題";
}
function renderMeta(){$("answered").textContent=`已作答 ${Object.keys(picks).length} 題`;save()}
function startQuiz(){
 const c=$("studentClass").value.trim(), s=$("seat").value.trim(), n=$("studentName").value.trim();
 if(!c||!s||!n){warn("請先填寫班級、座號及姓名。");return}
 identity=keyFor();let old=localStorage.getItem(identity);
 if(old){warn("此生已經有測驗紀錄。若要重測，請輸入老師密碼並按「老師重設此生紀錄」。");return}
 picks={};idx=0;started=true;finished=false;localStorage.setItem(identity,JSON.stringify({picks,idx,started,finished}));
 $("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render();
}
function finish(reason){
 if(!started||finished)return;finished=true;
 const score=QUESTIONS.reduce((sum,q)=>sum+(picks[q.n]===q.ans?1.25:0),0);
 const correct=QUESTIONS.filter(q=>picks[q.n]===q.ans).length;
 localStorage.setItem(identity,JSON.stringify({picks,idx,started,finished,score,reason}));
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 $("score").textContent=`${score.toFixed(2)} 分`;
 $("resultText").textContent=`答對 ${correct} 題，未作答或答錯 ${80-correct} 題。${reason==="leave"?"因離開測驗頁面，系統已自動結算。":"已完成交卷。"}`;
 const rev=$("review");rev.innerHTML="";
 QUESTIONS.forEach(q=>{if(picks[q.n]!==q.ans){const d=document.createElement("div");d.className="review-item";d.textContent=`第 ${q.n} 題｜你的答案：${picks[q.n]||"未作答"}｜暫定正確答案：${q.ans}`;rev.append(d)}});
}
$("start").addEventListener("click",startQuiz);
$("reset").addEventListener("click",()=>{
 if($("teacherPassword").value!==PASSWORD){warn("老師密碼錯誤，未重設紀錄。");return}
 const c=$("studentClass").value.trim(),s=$("seat").value.trim(),n=$("studentName").value.trim();
 if(!c||!s||!n){warn("請先填寫班級、座號及姓名，再重設紀錄。");return}
 localStorage.removeItem(keyFor());warn("已重設此生的本機測驗紀錄。可清空老師密碼後重新開始。");
 $("teacherPassword").value="";
});
$("prev").addEventListener("click",()=>{if(idx>0){idx--;render()}});
$("next").addEventListener("click",()=>{if(idx<QUESTIONS.length-1){idx++;render()}else finish("submit")});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")finish("leave")});
window.addEventListener("pagehide",()=>finish("leave"));
</script></body></html>
