甲酸丁酯', '④ 山梨酸'], 'ans': '② 丙酸鈉'}, {'n': 60, 'q': '新鮮酵母貯存的最佳溫度為？', 'opts': ['① -18～0℃', '② 2～10℃', '③ 15～20℃', '④ 25～30℃'], 'ans': '② 2～10℃'}, {'n': 61, 'q': '製作麩皮或裸麥麵包，其主要原料的麵粉為？', 'opts': ['① 低筋麵粉', '② 中筋麵粉', '③ 高筋麵粉', '④ 玉米澱粉'], 'ans': '① 高筋麵粉'}, {'n': 62, 'q': '下列那一種油脂其烤酥性最大？', 'opts': ['① 奶油', '② 白油', '③ 豬油', '④ 沙拉油'], 'ans': '③ 豬油'}, {'n': 63, 'q': '製作天使蛋糕時塔塔粉與鹽的用量總和為？', 'opts': ['① 0.5％', '② 1％', '③ 2％', '④ 3％'], 'ans': '② 1％'}, {'n': 64, 'q': '下列那一種糖的甜度最高？', 'opts': ['① 果糖', '② 砂糖', '③ 乳糖', '④ 麥芽糖'], 'ans': '① 果糖'}, {'n': 65, 'q': '製做丹麥麵包或鬆餅，其裹入用油脂應採用？', 'opts': ['① 白油', '② 沙拉油', '③ 奶油', '④ 瑪琪琳'], 'ans': '④ 瑪琪琳'}, {'n': 66, 'q': '麵粉如因貯存太久筋性受損，在做麵包時可酌量在配方內？', 'opts': ['① 增加酵母', '② 增加糖', '③ 使用脫脂奶粉', '④ 增加乳化劑'], 'ans': '③ 使用脫脂奶粉'}, {'n': 67, 'q': '製作高成分奶油海綿蛋糕為降低麵粉的筋性，配方內部分麵粉最好用？', 'opts': ['① 高筋麵粉', '② 中筋麵粉', '③ 小麥澱粉', '④ 裸麥粉'], 'ans': '③ 小麥澱粉'}, {'n': 68, 'q': '乳化油在下列那一項產品較不合適添加？', 'opts': ['① 戚風蛋糕', '② 麵包', '③ 海綿蛋糕', '④ 奶油霜飾'], 'ans': '① 戚風蛋糕'}, {'n': 69, 'q': '蛋糕所用的發粉應為？', 'opts': ['① 單重反應發粉', '② 小蘇打', '③ 雙重反應發粉', '④ 酵母'], 'ans': '③ 雙重反應發粉'}, {'n': 70, 'q': '欲增加小西餅鬆酥的性質可酌量增加？', 'opts': ['① 鹽', '② 糖', '③ 油', '④ 奶粉'], 'ans': '② 油'}];
const quiz = document.getElementById('quiz');
const result = document.getElementById('result');
function render(){
  quiz.innerHTML = questions.map((x,i)=>`<section class="card">
    <div class="qnum">第 ${x.n} 題</div>
    <div class="question">${x.q}</div>
    ${x.opts.map((o,j)=>`<label><input type="radio" name="q${x.n}" value="${o[0]}"> ${o}</label>`).join('')}
  </section>`).join('');
  document.querySelectorAll('input').forEach(el=>el.addEventListener('change',updateProgress));
  updateProgress();
}
function updateProgress(){
  const done=new Set([...document.querySelectorAll('input:checked')].map(x=>x.name)).size;
  document.getElementById('progress').textContent=`共70題｜已作答 ${done} 題`;
}
function submitQuiz(){
  let score=0, answered=0;
  const wrongReviews=[];
  questions.forEach(x=>{
    const picked=document.querySelector(`input[name="q${x.n}"]:checked`);
    if(picked) answered++;
    const ok=picked && picked.value===x.ans[0];
    if(ok) {
      score++;
    } else {
      const studentAnswer = picked ? picked.value + '（已作答）' : '未作答';
      wrongReviews.push(`<div class="review"><b>第 ${x.n} 題</b>：${picked ? '✗ 答錯' : '✗ 未作答'}<br>你的答案：${studentAnswer}<br>正確答案：<span class="correct">${x.ans}</span></div>`);
    }
  });
  result.style.display='block';
  const wrongTitle = wrongReviews.length
    ? `<h3 style="text-align:left;margin:20px 0 8px">錯誤題目與正確答案（${wrongReviews.length} 題）</h3>${wrongReviews.join('')}`
    : `<div class="correct" style="margin-top:18px">全部答對，沒有錯誤題目。</div>`;
  result.innerHTML=`
    <div>測驗完成</div>
    <div class="score">${score} / 70</div>
    <div>答題數：${answered} / 70</div>
    ${wrongTitle}
    <div class="teacher-box">
      <button class="teacher-btn" onclick="unlockRetest()">教師解鎖重測</button>
      <div class="lock-note">分數會停留在此頁；經教師檢查後輸入密碼才能重新測驗。</div>
    </div>
  `;
  window.scrollTo({top:0,behavior:'smooth'});
}
function unlockRetest(){
  const password = prompt('請輸入教師重測密碼：');
  if (password === '0217') {
    if (confirm('密碼正確。確定要清除本次成績並重新測驗嗎？')) {
      resetQuiz();
    }
  } else if (password !== null) {
    alert('密碼錯誤，無法重新測驗。');
  }
}

function resetQuiz(){
  if(confirm('確定要清除目前答案並重新開始嗎？')){render(); result.style.display='none'; result.innerHTML=''; window.scrollTo({top:0,behavior:'smooth'});}
}
render();
</script>
