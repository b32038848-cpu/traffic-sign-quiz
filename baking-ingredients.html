<style>

<script>

:27,"q":"蛋白在烘焙原料中屬於那一種性質？","opts":["柔性原料","韌性原料","酸性原料","中性原料"],"ans":1},{"n":28,"q":"蛋白的含水量為？","opts":["50％","75％","88％","95％"],"ans":2},{"n":29,"q":"巧克力融化加熱方式，最好使用？","opts":["直火加熱","隔水加熱","烤爐加熱","自然融化"],"ans":1},{"n":30,"q":"蛋黃成分中所含的油脂具有？","opts":["乳化作用","起泡作用","安定作用","膨大作用"],"ans":0},{"n":31,"q":"製作蛋糕時，奶粉應屬於？","opts":["柔性材料","鹼性材料","韌性材料","芳香材料"],"ans":2},{"n":32,"q":"奶水中含固形物（奶粉）量為？","opts":["4％","8％","12％","16％"],"ans":2},{"n":33,"q":"做蘇打餅乾應注意油脂的？","opts":["安定性好、不易酸敗","打發性好","乳化效果好","可塑性好"],"ans":0},{"n":34,"q":"蒸發奶水含固形物為？","opts":["40％","35％","30％","26％"],"ans":3},{"n":35,"q":"麵包配方使用2％的細砂糖如將糖量增加至4％，則發酵時間會？","opts":["縮短很多","縮短很少","延長","不變"],"ans":3},{"n":36,"q":"麵包配方中正常用糖量如從5％增加為10％，則烤好後的麵包最明顯的不同是？","opts":["表皮顏色變淺","表皮變薄而軟","表皮顏色加深","表皮變粗糙"],"ans":2},{"n":37,"q":"做麵包時配方中油脂量高，可使麵包表皮？","opts":["顏色深","厚","柔軟","硬"],"ans":2},{"n":38,"q":"蛋黃之水分含量為？","opts":["30～34％","35～39％","40～44％","50～55％"],"ans":3},{"n":39,"q":"一般奶油或瑪琪琳含水量約為？","opts":["6～10％","11～13％","14～22％","24～30％"],"ans":2},{"n":40,"q":"乳化劑在蛋糕中的功能是？","opts":["使蛋糕風味佳","使蛋糕顏色加深","融和配方內水和油使組織細膩","縮短攪拌時間減少人工"],"ans":2},{"n":41,"q":"麵粉中添加活性麵筋粉每增加1％時，則麵粉之吸水量約可提高？","opts":["1％","1.5％","2％","2.5％"],"ans":1},{"n":42,"q":"新鮮酵母(compressed yeast)水分含量約為？","opts":["45～50％","55～60％","65～70％","80～85％"],"ans":2},{"n":43,"q":"一般烘焙人員所稱的「重曹」(baking soda)是指？","opts":["發粉","蘇打粉","酵母","酵素"],"ans":1},{"n":44,"q":"沙拉油必須密封保存，是因為？","opts":["遇空氣易於變色","含不飽和脂肪酸易受氧化酸敗","易揮發","易感染其他不良味道"],"ans":1},{"n":45,"q":"雞蛋中水分含量？","opts":["70％","75％","80％","85％"],"ans":1},{"n":46,"q":"乳化劑在麵包中的功能？","opts":["增加麵包風味","使麵包柔軟不易老化","防止麵包發黴","促進酵母活力"],"ans":1},{"n":47,"q":"全蛋的固形物為？","opts":["10％","15％","25％","35％"],"ans":2},{"n":48,"q":"麵包的組織鬆軟好吃，主要是在製作的過程中加入了？","opts":["酵母","發粉","小蘇打","阿摩尼亞（碳酸氫銨等）"],"ans":0},{"n":49,"q":"要使麵包長時間保持柔軟，可在配方內添加？","opts":["膨大劑","麥芽酵素","乳化劑","丙酸鈣"],"ans":2},{"n":50,"q":"控制發酵最有效的原料是？","opts":["食鹽","糖","改良劑","奶粉"],"ans":0},{"n":51,"q":"稀釋奶油霜飾最適當的原料是？","opts":["沙拉油","水","蛋","稀糖漿"],"ans":3},{"n":52,"q":"一般油炸用油發煙點應在？","opts":["150～160℃","160～170℃","170～180℃","200℃以上"],"ans":3},{"n":53,"q":"為使小西餅達到鬆脆與擴展的目的，配方內可多使用？","opts":["細砂糖","糖粉","糖漿","麥芽糖"],"ans":0},{"n":54,"q":"製作水果蛋糕應選用？","opts":["新鮮水果","罐頭水果","蜜餞水果","脫水水果"],"ans":2},{"n":55,"q":"一般西點派皮或蛋糕用的奶酥底，配方內油脂應用？","opts":["無水奶油或精製豬油","瑪琪琳","含水奶油","沙拉油"],"ans":0},{"n":56,"q":"做蘋果派餡的膠凍原料，通常採用？","opts":["玉米澱粉","動物膠","洋菜粉","甘藷粉"],"ans":0},{"n":57,"q":"食品工廠用的油炸用油最好選用？","opts":["沙拉油","氫化油","黃豆油","奶油"],"ans":1},{"n":58,"q":"麵包可使用的防腐劑為？","opts":["丙酸鈣","去水醋酸","硼酸","苯甲酸"],"ans":0},{"n":59,"q":"蛋糕可使用的防腐劑為？","opts":["苯甲酸","丙酸鈉","對羥苯甲酸丁酯","異抗壞血酸"],"ans":1},{"n":60,"q":"新鮮酵母貯存的最佳溫度為？","opts":["-10～0℃","2～10℃","11～20℃","21～27℃"],"ans":1},{"n":61,"q":"製作麩皮或裸麥麵包，其主要原料的麵粉為？","opts":["高筋麵粉","洗筋粉","粉心粉","低筋麵粉"],"ans":0},{"n":62,"q":"下列那一種油脂其烤酥性最大？","opts":["純奶油","人造奶油","豬油","雪白油"],"ans":2},{"n":63,"q":"製作天使蛋糕時塔塔粉與鹽的用量總和為？","opts":["0.1％","1％","5％","10％"],"ans":1},{"n":64,"q":"下列那一種糖的甜度最高？","opts":["果糖","轉化糖漿","砂糖","葡萄糖"],"ans":0},{"n":65,"q":"製做丹麥麵包或鬆餅，其裹入用油脂應採用？","opts":["豬油","雪白奶油","白油（烤酥油）","瑪琪琳"],"ans":3},{"n":66,"q":"麵粉如因貯存太久筋性受損，在做麵包時可酌量在配方內？","opts":["增加鹽的用量","減少糖的用量","使用脫脂奶粉","增加乳化劑"],"ans":2},{"n":67,"q":"製作高成分奶油海綿蛋糕為降低麵粉的筋性，配方內部分麵粉最好用？","opts":["全脂奶粉","太白粉","小麥澱粉","乳清粉"],"ans":2},{"n":68,"q":"乳化油在下列那一項產品較不合適添加？","opts":["戚風蛋糕","麵包","海綿蛋糕","奶油霜飾"],"ans":0},{"n":69,"q":"蛋糕所用的發粉應為？","opts":["快性發粉","次快性發粉","雙重反應發粉","慢性發粉"],"ans":2},{"n":70,"q":"欲增加小西餅鬆酥的性質可酌量增加？","opts":["水","油","糖","高筋麵粉"],"ans":1}];
const TEACHER_PASSWORD = "0217";
const STORAGE_KEY = "bakingIngredientsFormalExam_v4";

let state = null;

const $ = id => document.getElementById(id);
const progress = $("progress");
const labels = ["①","②","③","④"];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>'"]/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"
  }[c]));
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
  catch(e) { return null; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function createNewExam() {
  state = {
    started: true,
    finished: false,
    order: shuffle(QUESTIONS.map((_, i) => i)),
    current: 0,
    answers: {},
    score: 0,
    wrong: []
  };
  saveState();
}

function updateProgress() {
  if (!state) {
    progress.textContent = "尚未開始";
    return;
  }
  const answered = Object.keys(state.answers).length;
  progress.textContent = `第 ${state.current + 1}／70 題｜已作答 ${answered} 題`;
}

function renderQuestion() {
  $("start").style.display = "none";
  $("result").style.display = "none";
  $("quiz").style.display = "block";

  const q = QUESTIONS[state.order[state.current]];
  updateProgress();

  const previousAnswer = state.answers[state.current];

  $("quiz").innerHTML = `
    <div class="qnum">原題第 ${q.n} 題</div>
    <div class="question">${escapeHtml(q.q)}</div>
    <div id="options">
      ${q.opts.map((o,i)=>`
        <button class="option ${previousAnswer === i ? "selected" : ""}" data-i="${i}">
          ${labels[i]} ${escapeHtml(o)}
        </button>`).join("")}
    </div>
    <div class="navrow">
      <button class="next" id="nextBtn" ${previousAnswer === undefined ? "disabled" : ""}>
        ${state.current === 69 ? "交卷並查看成績" : "下一題 →"}
      </button>
    </div>
    <div class="status">本題只能作答一次；確認後可進入下一題。</div>
  `;

  document.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => {
      const chosen = Number(btn.dataset.i);
      if (state.answers[state.current] !== undefined) return;
      state.answers[state.current] = chosen;
      saveState();

      document.querySelectorAll(".option").forEach(x => x.classList.remove("selected"));
      btn.classList.add("selected");
      $("nextBtn").disabled = false;
    });
  });

  $("nextBtn").addEventListener("click", () => {
    if (state.answers[state.current] === undefined) return;

    if (state.current === 69) {
      finishExam();
    } else {
      state.current++;
      saveState();
      window.scrollTo({top:0, behavior:"smooth"});
      renderQuestion();
    }
  });
}

function finishExam() {
  let score = 0;
  const wrong = [];

  state.order.forEach((qIndex, displayIndex) => {
    const q = QUESTIONS[qIndex];
    const chosen = state.answers[displayIndex];

    if (chosen === q.ans) {
      score++;
    } else {
      wrong.push({
        n: q.n,
        q: q.q,
        answer: q.opts[q.ans]
      });
    }
  });

  state.score = score;
  state.wrong = wrong;
  state.finished = true;
  saveState();
  showResult();
}

function showResult() {
  $("start").style.display = "none";
  $("quiz").style.display = "none";
  $("result").style.display = "block";
  progress.textContent = "測驗完成｜成績已保留";

  const percent = Math.round(state.score / 70 * 100);
  let wrongHtml = "";

  if (state.wrong.length === 0) {
    wrongHtml = `<div class="notice"><strong>70 題全部答對。</strong></div>`;
  } else {
    wrongHtml = `
      <div class="wrong-list">
        <h3>錯誤題目統整（共 ${state.wrong.length} 題）</h3>
        ${state.wrong.map((x,i)=>`
          <div class="wrong-item">
            <div class="wrong-q">${i+1}．原題第 ${x.n} 題：${escapeHtml(x.q)}</div>
            <div class="correct-answer"><strong>正確答案：</strong>${escapeHtml(x.answer)}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  $("result").innerHTML = `
    <div>測驗完成</div>
    <div class="score">${state.score}／70</div>
    <div>答對率：${percent}%</div>
    <div class="result-note" style="margin-top:10px">
      成績已保存。本頁<strong>沒有學生自行重新測驗的按鈕</strong>。
    </div>

    ${wrongHtml}

    <div class="lockbox">
      <h3>老師解鎖重測</h3>
      <div class="password-row">
        <input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="輸入老師密碼">
        <button class="unlock-btn" id="unlockBtn">解鎖</button>
      </div>
      <div id="unlockMsg" class="msg"></div>
      <div class="small">老師輸入正確密碼後，才會清除本次成績並開始新一輪隨機測驗。</div>
    </div>
  `;

  $("unlockBtn").addEventListener("click", unlock);
  $("pw").addEventListener("keydown", e => {
    if (e.key === "Enter") unlock();
  });
}

function unlock() {
  const pw = $("pw").value.trim();
  const msg = $("unlockMsg");

  if (pw !== TEACHER_PASSWORD) {
    msg.className = "msg err";
    msg.textContent = "密碼錯誤，無法重新測驗。";
    return;
  }

  localStorage.removeItem(STORAGE_KEY);
  createNewExam();
  renderQuestion();
}

function init() {
  const saved = loadState();

  // 已完成：直接顯示成績與錯題，不提供學生重測。
  if (saved && saved.finished) {
    state = saved;
    showResult();
    return;
  }

  // 未完成：保留原進度，重新整理不會重新抽題。
  if (saved && saved.started) {
    state = saved;
    renderQuestion();
    return;
  }

  $("start").style.display = "block";
  $("quiz").style.display = "none";
  $("result").style.display = "none";
}

$("startBtn").addEventListener("click", () => {
  createNewExam();
  renderQuestion();
});

init();
</script>
</body>
</html>
