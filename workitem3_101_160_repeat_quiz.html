<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作項目三101-160重複練習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1c2b38;font-family:system-ui,'Noto Sans TC',sans-serif;line-height:1.65}.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}h1{font-size:26px}.panel{background:white;border:1px solid #d9e2ea;border-radius:14px;padding:18px;margin:16px 0}.muted{color:#607080}.btn{padding:10px 15px;border:1px solid #aab9c6;border-radius:9px;background:white;font:inherit;cursor:pointer;margin:4px}.primary{background:#175a7d;color:white;border-color:#175a7d}.q{font-size:19px;font-weight:650;margin:12px 0}.opt{display:block;padding:10px;border:1px solid #d5dfe7;border-radius:9px;margin:8px 0;cursor:pointer}.opt input{margin-right:9px}.good{background:#e9f6ee;border-color:#9acbaa}.bad{background:#fff0ef;border-color:#e3aaa5}.hide{display:none}.tag{color:#175a7d;font-weight:700}.review{border-top:1px solid #ddd;padding:12px 0}</style><body><div class="wrap"><h1>烘焙食品丙級｜工作項目三 101～160 題</h1><p class="muted">重複練習｜每題作答後立即顯示正確答案｜共60題</p><div class="panel"><button class="btn" id="stop">停止朗讀</button><button class="btn" id="restart">重新測驗</button><div id="progress"></div></div><main id="quiz"></main><section id="result" class="panel hide"></section></div><script>const BANK=[{"n": 101, "q": "下列那一項非麵包滾圓的目的？", "options": ["鬆弛麵筋使麵糰易於整型", "使麵糰表面光滑不易粘手", "使麵糰易於保住二氧化碳", "使氣體均勻分佈"], "a": 0}, {"n": 102, "q": "調整配方時，下列何者材料不會使麵包麵糰較軟？", "options": ["水", "糖", "油", "麵粉"], "a": 3}, {"n": 103, "q": "調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？", "options": ["水", "糖", "油", "麵粉"], "a": 0}, {"n": 104, "q": "法國麵包（硬式麵包）常用之烤焙溫度為多少？", "options": ["230℃", "200℃", "170℃", "150℃"], "a": 0}, {"n": 105, "q": "800公克的帶蓋土司在正常的狀態下，給予200℃烤溫，烤焙所需時間為？", "options": ["15～20分", "35～40分", "55～60分", "1小時以上"], "a": 1}, {"n": 106, "q": "下列那一種麵包，烤焙時間最短？", "options": ["800公克的帶蓋土司", "450公克的圓頂葡萄乾土司", "350公克的法國麵包", "90公克包餡的甜麵包"], "a": 3}, {"n": 107, "q": "下列那一種麵包必需使用蒸氣烤爐？", "options": ["甜麵包", "丹麥麵包", "硬式麵包", "葡萄乾麵包"], "a": 2}, {"n": 108, "q": "圓烤盤，其直徑為22公分、高5公分其容積為？", "options": ["1899.7立方公分", "1997.7立方公分", "7598.8立方公分", "110立方公分"], "a": 0}, {"n": 109, "q": "長方型烤盤，其長為30公分、寬為22公分、高為5公分，其容積為？", "options": ["3300平方公分", "3300立方公分", "660平方公分", "660立方公分"], "a": 1}, {"n": 110, "q": "低成分重奶油蛋糕，採用何種攪拌方法為宜？", "options": ["麵粉油脂拌合法", "糖油拌合法", "兩步拌合法", "糖水拌合法"], "a": 1}, {"n": 111, "q": "何種攪拌方法能節省人工和縮短攪拌時間？", "options": ["糖油拌合法", "麵粉油脂拌合法", "糖水拌合法", "直接法"], "a": 3}, {"n": 112, "q": "麵糊類蛋糕的麵糊溫度應該是？", "options": ["10℃", "15℃", "22℃", "30℃"], "a": 2}, {"n": 113, "q": "下列何種蛋糕在烘焙時不可擦防粘油脂？", "options": ["海綿蛋糕", "重奶油蛋糕", "輕奶油蛋糕", "天使蛋糕"], "a": 3}, {"n": 114, "q": "理想的海綿蛋糕麵糊比重為", "options": ["0.46", "0.56", "0.66", "0.76"], "a": 0}, {"n": 115, "q": "利用糖油拌合法製作丹麥小西餅(Danishcookies)，材料中的麵粉應在最後加入，輕輕拌勻，其主要的原因為？", "options": ["容易吸收水分", "好控制麵粉量", "避免攪拌出筋", "防止破壞打發的氣泡"], "a": 2}, {"n": 116, "q": "菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其原因為？", "options": ["不需最後發酵", "需較高濕度發酵", "需較高溫度發酵", "避免高濕高溫的發酵使菠蘿皮融解而化開"], "a": 3}, {"n": 117, "q": "50～100公克左右的甜麵包，其烤焙應？", "options": ["上火為主，下火為輔", "只用上火", "下火為主，上火為輔", "只用下火"], "a": 0}, {"n": 118, "q": "以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？", "options": ["硬", "粗糙", "細膩", "沒影響"], "a": 1}, {"n": 119, "q": "戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？", "options": ["組織較軟", "拌入其他材料時易消泡", "體積較大", "不影響蛋糕品質"], "a": 1}, {"n": 120, "q": "可以減少海綿蛋糕出爐時收縮的程度為？", "options": ["選用麵筋較強的麵粉", "烤焙時間避免過久", "烤盤擦油", "減少配方中的用油量"], "a": 1}, {"n": 121, "q": "添加下列那一項材料不會增加蛋糕的柔軟度？", "options": ["糖", "油", "蛋黃", "麵粉"], "a": 3}, {"n": 122, "q": "一般麵糊類蛋糕烤熟與否的判斷方法？", "options": ["以探針試探或以手輕拍", "以顏色判斷即可", "時間一到即可出爐", "敲烤盤邊聽聲音判斷"], "a": 0}, {"n": 123, "q": "切割蛋糕用的刀子，下列那一種方式既可防止細菌污染又可達到切面整齊的要求？", "options": ["洗淨使用", "以布擦拭後使用", "浸在沸水中燙一次，切一次", "在沸水中燙一次用布擦一下使用"], "a": 2}, {"n": 124, "q": "煮製檸檬布丁餡時檸檬汁在？", "options": ["與水一道加入", "與玉米澱粉拌勻加入", "糖水部分煮沸後加入", "待餡煮好後加入拌勻"], "a": 3}, {"n": 125, "q": "製作丹麥麵包整形宜在？", "options": ["近烤爐邊", "一般的工作間", "在溫度較低的場所", "與溫度無關，在那裡整形皆可"], "a": 2}, {"n": 126, "q": "麵粉的pH值變小時，小西餅的體積", "options": ["不變", "變大", "變小", "變厚"], "a": 2}, {"n": 127, "q": "餅乾用麵粉，若酸度偏高時，配方中應提高？", "options": ["小蘇打", "水", "氧化劑", "油脂的用量"], "a": 0}, {"n": 128, "q": "蘇打餅乾成品的pH值比一般奶油小西餅為？", "options": ["高", "相同", "低", "測不出來"], "a": 0}, {"n": 129, "q": "下列那種因素不會影響麵包攪拌時間？", "options": ["攪拌速度不同", "配方不同", "攪拌機型式不同", "攪拌人員不同"], "a": 3}, {"n": 130, "q": "正常情況下，甜麵包麵糰之攪拌時間，應比白土司麵包？", "options": ["長", "短", "一樣", "不受限制"], "a": 0}, {"n": 131, "q": "麵糰整型時，如經過二道滾輪之整型機，正常第一道滾輪與第二道滾輪之間隙比為？", "options": ["6:1", "4:1", "2:1", "1:1"], "a": 2}, {"n": 132, "q": "下列那一項因素不會影響麵包之基本發酵時間？", "options": ["酵母量", "鹽", "麵糰溫度", "容器"], "a": 3}, {"n": 133, "q": "下列何者不是影響烘焙食品烤焙條件設定之因素？", "options": ["產品種類", "產品大小", "烤爐種類", "烤焙人員"], "a": 3}, {"n": 134, "q": "製作組織鬆軟體積較大的奶油蛋糕通常採用？", "options": ["糖油拌合法", "麵粉油脂拌合法", "直接拌合法", "糖水拌合法"], "a": 0}, {"n": 135, "q": "以攪拌機攪拌麵糊類蛋糕，下列那一項操作較為正確？", "options": ["自始至終一貫快速拌成", "隨時提升攪拌缸以利拌勻", "忽快忽慢促進麵筋形成", "先用慢速拌合材料，再以快速攪拌，中途停機刮勻缸底麵糊後再繼續攪拌"], "a": 3}, {"n": 136, "q": "為促進蛋白的起泡性並改善蛋糕的風味可在配方中酌加？", "options": ["麩胺酸鈉", "檸檬汁", "酒精", "亞硝酸鉀"], "a": 1}, {"n": 137, "q": "油炸甜圈餅（道納司，doughnuts）油脂宜選用？", "options": ["沙拉油", "豬油", "油炸油", "奶油"], "a": 2}, {"n": 138, "q": "製作泡芙（奶油空心餅）時常添加之化學膨大劑為？", "options": ["碳酸氫銨（阿摩尼亞）", "小蘇打", "發粉", "酵母"], "a": 0}, {"n": 139, "q": "鬆餅（起酥，puffpastry）烤焙時烤爐宜選用？", "options": ["熱風爐", "普通爐", "蒸氣爐", "隧道爐"], "a": 2}, {"n": 140, "q": "派皮堅韌不酥的原因為？", "options": ["派餡裝盤時太熱", "麵糰拌合太久", "烘烤時間不夠", "油脂用量太多"], "a": 1}, {"n": 141, "q": "派餡中牛奶布丁過於堅韌其原因為？", "options": ["烘烤時間太久", "派皮太厚", "熬煮膠凝程度不夠", "派餡溫度太低"], "a": 0}, {"n": 142, "q": "以直接法製作鹹餅乾，麵糰發酵的溫度以下列何者為宜？", "options": ["32℃", "42℃", "52℃", "62℃"], "a": 0}, {"n": 143, "q": "麵包製作時翻麵的目的，以下何者為非？", "options": ["平均溫度", "促進發酵", "抑制發酵", "促進氣體保留"], "a": 2}, {"n": 144, "q": "麵包直接法配方中，已知水用量為360g，理想水溫為5℃，自來水溫為20℃，該日室溫為28℃，冰用量為？", "options": ["40g", "54g", "80g", "100g"], "a": 1}, {"n": 145, "q": "製作蛋糕使用未經鹼處理過的可可粉時，應以部分小蘇打代替發粉，其用量為可可粉用量之", "options": ["2％", "7％", "10％", "15％"], "a": 1}, {"n": 146, "q": "一般蒸烤牛奶布丁，所選用之凝凍材料為？", "options": ["雞蛋", "吉利丁", "玉米粉", "麵粉"], "a": 0}, {"n": 147, "q": "烤焙不帶蓋土司若烤焙時間相同，烤爐溫度太高會造成", "options": ["體積大", "表皮顏色深", "烘焙損耗小", "表皮顏色淺"], "a": 1}, {"n": 148, "q": "烤焙甜麵包時，若烤焙時間相同烤爐溫度太低會造成", "options": ["體積不變", "底部顏色深", "表皮顏色淺", "組織細緻"], "a": 2}, {"n": 149, "q": "攪拌中種麵糰時為控制理想溫度為25℃，下列何者為宜？", "options": ["攪拌時間延長", "水溫提高", "依室溫及攪拌設備，控制材料溫度及攪拌時間", "用高速攪拌"], "a": 2}, {"n": 150, "q": "製作天使蛋糕擬降低蛋白之韌性可增加", "options": ["蛋白量", "麵粉量", "糖量", "鹽量"], "a": 2}, {"n": 151, "q": "為改善麵粉中澱粉之膠體性質及改良麵包之內部組織，一般可加入？", "options": ["纖維分解酵素", "脂肪分解酵素", "蛋白質分解酵素", "液化酵素"], "a": 3}, {"n": 152, "q": "一般攪拌好之麵糰 pH 值約為 6.0，發酵後之麵糰 pH 值會？", "options": ["下降", "上升", "不改變", "先上升再下降"], "a": 0}, {"n": 153, "q": "下列何者，不是造成發酵後之麵糰 pH 值會下降的原因？", "options": ["麵糰內之乳酸菌，於發酵時產生乳酸", "麵糰內之醋酸菌，於發酵時產生醋酸", "硫酸氨改良劑經酵母代謝作用而產生硫酸", "麵糰中加乳化劑"], "a": 3}, {"n": 154, "q": "餅乾在連續式隧道爐烤焙，若將烤爐分成四區時，餅體組織的固定是在？", "options": ["第一區", "第二區", "第三區", "第四區"], "a": 2}, {"n": 155, "q": "餅乾麵糰在烤焙過程中，物性改變且遞減的是？", "options": ["水分", "顏色", "厚度", "膨脹度"], "a": 0}, {"n": 156, "q": "餅乾麵糰在壓延成型時，打孔洞的原因，下列何者敘述錯誤？", "options": ["有表面裝飾之作用", "減少原料用量、降低成本", "切斷麵糰筋性、防止緊縮作用", "水分變成水蒸氣，有孔洞時可保持較均勻的膨脹度"], "a": 1}, {"n": 157, "q": "解決硬質餅乾或蘇打餅乾在成型時麵片收縮的方法為何？", "options": ["表面噴水", "麵片作打浪狀", "撒麵粉", "重新混合製作"], "a": 1}, {"n": 158, "q": "製造調味餅乾在表面加入調味粉最適當之時機為？", "options": ["餅片成型後、入烤爐前", "出烤爐噴油後", "在烤焙時", "進包裝機前"], "a": 1}, {"n": 159, "q": "下列何種產品的生麵片經成型、烤焙後的收縮率最大？", "options": ["蘇打餅乾", "瑪莉餅乾", "冰箱小西餅", "乳沫類小西餅"], "a": 0}, {"n": 160, "q": "下列何種產品在攪拌過程中，麵糰的溫度最高？", "options": ["蘇打餅乾", "瑪莉餅乾", "冰箱小西餅", "乳沫類小西餅"], "a": 1}];let order=[],idx=0,answers={};const nums='①②③④';function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';speechSynthesis.speak(u)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function render(){let x=order[idx];document.getElementById('progress').textContent=`第 ${idx+1} / ${order.length} 題`;let chosen=answers[x.n];document.getElementById('quiz').innerHTML=`<section class="panel"><div class="tag">題庫第 ${x.n} 題</div><div class="q">${x.q}</div><button class="btn" id="read">朗讀題目與選項</button><div id="opts">${x.options.map((o,k)=>`<label class="opt ${chosen!==undefined?(k===x.a?'good':k===chosen?'bad':''):''}"><input type="radio" name="ans" value="${k}" ${chosen===k?'checked':''} ${chosen!==undefined?'disabled':''}> ${nums[k]} ${o}</label>`).join('')}</div>${chosen!==undefined?`<p class="good">正確答案：${nums[x.a]} ${x.options[x.a]}</p><p>${chosen===x.a?'答對':'答錯'}</p>`:''}<button class="btn primary" id="next" ${chosen===undefined?'disabled':''}>${idx===order.length-1?'查看總結':'下一題'}</button></section>`;document.getElementById('read').onclick=()=>say(`第${x.n}題。${x.q}。${x.options.map((o,k)=>nums[k]+o).join('。')}`);document.querySelectorAll('input[name=ans]').forEach(el=>el.onchange=()=>{answers[x.n]=Number(el.value);render()});document.getElementById('next').onclick=()=>{if(idx<order.length-1){idx++;render()}else summary()}}function summary(){let correct=order.filter(x=>answers[x.n]===x.a).length,bad=order.filter(x=>answers[x.n]!==x.a);document.getElementById('quiz').innerHTML='';let r=document.getElementById('result');r.classList.remove('hide');r.innerHTML=`<h2>測驗總結</h2><p>總題數：60｜答對：${correct}｜答錯：${bad.length}｜正確率：${(correct/60*100).toFixed(1)}%</p><h3>錯題總結</h3>${bad.length?bad.map(x=>`<div class="review"><b>題庫第${x.n}題：${x.q}</b><p>你的答案：${answers[x.n]===undefined?'未作答':nums[answers[x.n]]+' '+x.options[answers[x.n]]}</p><p class="good">正確答案：${nums[x.a]} ${x.options[x.a]}</p></div>`).join(''):'<p class="good">全部答對，沒有錯題。</p>'}<button class="btn primary" id="again">重新測驗</button>`;document.getElementById('again').onclick=restart;r.scrollIntoView()}function restart(){speechSynthesis.cancel();order=shuffle(BANK);idx=0;answers={};document.getElementById('result').classList.add('hide');render()}document.getElementById('stop').onclick=()=>speechSynthesis.cancel();document.getElementById('restart').onclick=restart;restart();</script></body></html>
