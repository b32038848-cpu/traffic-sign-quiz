<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f5f7fa;margin:0;padding:12px;color:#111}
.card{max-width:760px;margin:auto;background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:18px}
.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.title{font-size:20px;font-weight:700}.stats{font-size:14px;color:#64748b}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#2563eb;width:0}
.tag{display:inline-block;background:#f1f5f9;border-radius:999px;padding:5px 9px;font-size:13px;margin-bottom:10px}
.q{font-size:18px;font-weight:700;line-height:1.5}.sign{height:230px;display:flex;align-items:center;justify-content:center;margin:8px 0 12px}.sprite{width:220px;height:220px;background-repeat:no-repeat;background-size:2420px 1540px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{min-height:58px;text-align:left;padding:12px 14px;border:1px solid #dbe2ea;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.opt:disabled{cursor:default}
.correct{background:#ecfdf5!important;border-color:#16a34a!important}.wrong{background:#fef2f2!important;border-color:#dc2626!important}
.fb{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:14px}.fb.show{display:block}.actions{display:flex;justify-content:flex-end;margin-top:12px}
.next{min-height:46px;padding:10px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.next:disabled{opacity:.45}
.result{text-align:center;border:1px solid #dbe2ea;border-radius:14px;padding:25px}.score{font-size:40px;font-weight:800;margin:8px 0}
@media(max-width:520px){.opts{grid-template-columns:1fr}.card{padding:15px}.q{font-size:17px}.sign{height:205px}.sprite{transform:scale(.9)}}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/9k=";
const junction=new Set(["岔路一","岔路二","岔路三","岔路四","岔路五","岔路六","岔路七","岔路八","岔路九"]);
const cols=11,tile=220;let danger=signs.findIndex(x=>x[0]==="警50");
let rest=signs.map((_,i)=>i).filter(i=>i!==danger);rest.sort(()=>Math.random()-.5);
let order=[danger,...rest],p=0,score=0,locked=false;
function opts(item){
 let pool;
 if(junction.has(item[1])) pool=signs.filter(x=>x[0].startsWith("警")&&!junction.has(x[1])&&x[1]!==item[1]);
 else pool=signs.filter(x=>x[0].startsWith(item[0].startsWith("警")?"警":"遵")&&!junction.has(x[1])&&x[1]!==item[1]);
 let start=(item[0].length*17+item[1].length*9)%pool.length,a=[item[1]],used=new Set(a);
 for(let j=0;a.length<4;j++){let v=pool[(start+j*5)%pool.length][1];if(!used.has(v)){a.push(v);used.add(v)}}
 return a.sort(()=>Math.random()-.5);
}
function render(){
 locked=false;let idx=order[p],item=signs[idx],choices=opts(item),col=idx%cols,row=Math.floor(idx/cols);
 document.getElementById("stats").textContent="第 "+(p+1)+" / "+signs.length+" 題　答對 "+score+" 題";
 document.getElementById("bar").style.width=(p/signs.length*100)+"%";
 document.getElementById("stage").innerHTML=
 '<div class="tag">'+(item[0].startsWith("警")?"警告標誌":"遵行標誌")+'｜'+item[0]+'</div>'+
 '<div class="q">請看下方原始交通標誌圖片，選出正確的標誌意義：</div>'+
 '<div class="sign"><div class="sprite" style="background-image:url('+sprite+');background-position:-'+(col*tile)+'px -'+(row*tile)+'px"></div></div>'+
 '<div class="opts">'+choices.map((x,i)=>'<button type="button" class="opt" data-answer="'+x.replaceAll('"','&quot;')+'">'+["A","B","C","D"][i]+". "+x+'</button>').join("")+'</div>'+
 '<div id="fb" class="fb"></div><div class="actions"><button type="button" class="next" id="next" disabled>'+(p===signs.length-1?"查看成績":"下一題")+'</button></div>';
 document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(b,item[1])));
 document.getElementById("next").addEventListener("click",()=>{if(p<signs.length-1){p++;render()}else finish()});
}
function choose(btn,correct){
 if(locked)return;locked=true;let bs=[...document.querySelectorAll(".opt")];bs.forEach(b=>b.disabled=true);
 let ok=btn.dataset.answer===correct;if(ok){score++;btn.classList.add("correct")}else{btn.classList.add("wrong");bs.find(b=>b.dataset.answer===correct)?.classList.add("correct")}
 let f=document.getElementById("fb");f.textContent=ok?"答對！":"答錯。正確答案："+correct;f.classList.add("show");
 f.style.background=ok?"#ecfdf5":"#fef2f2";f.style.border="1px solid "+(ok?"#86efac":"#fca5a5");
 document.getElementById("stats").textContent="第 "+(p+1)+" / "+signs.length+" 題　答對 "+score+" 題";document.getElementById("bar").style.width=((p+1)/signs.length*100)+"%";document.getElementById("next").disabled=false;
}
function finish(){
 let rate=Math.round(score/signs.length*100);document.getElementById("stats").textContent="測驗完成";document.getElementById("bar").style.width="100%";
 document.getElementById("stage").innerHTML='<div class="result"><div class="tag">測驗完成</div><div class="score">'+score+' / '+signs.length+'</div><div>答對率：'+rate+'%</div><div class="actions" style="justify-content:center"><button type="button" class="next" id="again">重新測驗</button></div></div>';
 document.getElementById("again").addEventListener("click",()=>{rest=signs.map((_,i)=>i).filter(i=>i!==danger);rest.sort(()=>Math.random()-.5);order=[danger,...rest];p=0;score=0;render()});
}
render();
