<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>烘焙食品丙級｜原料111～150｜教師解鎖正式測驗</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}body{user-select:text;-webkit-user-select:text}.wrap{max-width:760px;margin:auto;padding:12px 12px 70px}header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20;padding:12px 0}h1{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:#667085}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}.title{font-size:24px;font-weight:900;margin-bottom:10px}.notice{line-height:1.7;background:#f7f8fa;border-radius:12px;padding:14px}.btn{border:0;border-radius:12px;padding:13px 16px;font-size:17px;cursor:pointer}.primary{background:#222;color:#fff}.secondary{background:#eceff2;color:#222}.danger{background:#7a2222;color:#fff}.full{width:100%}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:#222;transition:width .2s}.qhead{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;color:#667085;margin-bottom:8px}.question{font-size:21px;font-weight:900;line-height:1.55;margin:10px 0 14px}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d7dce2;border-radius:12px;padding:14px;margin:10px 0;font-size:18px;line-height:1.5;cursor:pointer;touch-action:manipulation}.option:hover{background:#f7f8fa}.option.selected{border:2px solid #222;background:#f4f5f7}.option.correct{border:2px solid #198754;background:#eaf7ef}.option.wrong{border:2px solid #dc3545;background:#fff0f1}.option:disabled{opacity:1}.speak{width:100%;background:#eef1f4;color:#222;margin-bottom:10px}.stop{width:100%;background:#444;color:#fff;margin-bottom:10px}.nav{display:flex;gap:10px;margin-top:16px}.nav .btn{flex:1}.feedback{min-height:54px;padding:13px 14px;border-radius:12px;margin-top:14px;font-size:17px;line-height:1.6;background:#f7f8fa}.feedback.ok{background:#eaf7ef}.feedback.no{background:#fff0f1}.answer{font-weight:900}.result{text-align:center}.score{font-size:44px;font-weight:900;margin:4px 0 8px}.wrong-list{text-align:left;margin-top:18px}.wrong-item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:9px 0;line-height:1.65}.small{font-size:13px;color:#697586;line-height:1.65;margin-top:12px}.hidden{display:none!important}.lock{background:#fff7e6;border:1px solid #f2d28a;border-radius:12px;padding:12px;line-height:1.6;margin-top:12px}.input{width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:10px;font-size:17px;margin-top:8px}@media(max-width:480px){.wrap{padding:10px 10px 60px}.card{padding:15px}.question{font-size:20px}.option{font-size:17px;padding:12px}.title{font-size:22px}.nav{flex-direction:column}}</style></head><body><header><div class="wrap" style="padding-bottom:0"><h1>烘焙食品丙級｜原料111～150</h1><div class="sub" id="status">正式測驗｜40題｜完成後鎖定｜教師密碼解鎖重測</div></div></header><main class="wrap"><section id="start" class="card"></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden result"></section></main><script>const BANK=[{"n":111,"q":"小麥之橫斷面呈粉質狀者為何？","o":["高筋麵粉","中筋麵粉","粉心麵粉","低筋麵粉"],"a":3},{"n":112,"q":"小麥之橫斷面呈玻璃質狀者為何？","o":["高筋麵粉","中筋麵粉","粉心麵粉","低筋麵粉"],"a":0},{"n":113,"q":"麵粉蛋白質是屬於部分不完全蛋白質，因為其胺基酸內缺少了一種必需胺基酸為？","o":["甲硫胺酸","胱胺酸","半胱胺酸","離胺酸"],"a":3},{"n":114,"q":"下列何種胺基酸內含有硫氫根（－SH），並具有還原特性，以影響麵糰之性質？","o":["麩胺酸","甘胺酸","半胱胺酸","離胺酸"],"a":2},{"n":115,"q":"小麥胚芽中含有下列何種物質，其含有硫氫根（－SH），會減少麵筋彈性，使麵糰發粘？","o":["維生素E","礦物質","油脂","麩胱甘"],"a":3},{"n":116,"q":"可以得到麵粉之吸水量、攪拌時間及攪拌耐力之儀器設備為？","o":["麵粉酵素活性測定儀（Amylograph）","連續溫度黏度測定儀（Viscosgraph）","麵糰拉力特性測定儀（Extensograph）","麵糰攪拌特性測定儀（Farinograph）"],"a":3},{"n":117,"q":"測定低筋粉或軟麥麵粉中膠性粘度之儀器設備為？","o":["麵粉沉降係數測定儀（Falling Number）","連續溫度黏度測定儀（Viscosgraph）","麵糰拉力特性測定儀（Extensograph）","麵糰攪拌特性測定儀（Farinograph）"],"a":1},{"n":118,"q":"測定麵筋之伸張力及伸張阻力等品質之儀器設備為？","o":["麵粉酵素活性測定儀（Amylograph）","連續溫度黏度測定儀（Viscosgraph）","麵糰拉力特性測定儀（Extensograph）","麵糰攪拌特性測定儀（Farinograph）"],"a":2},{"n":119,"q":"測定麵粉中之液化酵素的儀器設備為？","o":["麵粉酵素活性測定儀（Amylograph）","連續溫度黏度測定儀（Viscosgraph）","麵糰拉力特性測定儀（Extensograph）","麵糰攪拌特性測定儀（Farinograph）"],"a":0},{"n":120,"q":"D.E.值（葡萄糖當量）30～50之澱粉糖漿，其組成成分為？","o":["蔗糖","果糖","葡萄糖","糊精、麥芽糖及葡萄糖之混合物"],"a":3},{"n":121,"q":"以澱粉為原料經完全水解 D.E.值（葡萄糖當量）為100之糖漿產品，其組成成分為？","o":["蔗糖","果糖","葡萄糖","澱粉及葡萄糖之混合物"],"a":2},{"n":122,"q":"下列何種糖吸濕性最小？","o":["砂糖","果糖","蜂蜜","轉化糖"],"a":0},{"n":123,"q":"有關糖對麵包品質之影響，下列何者有誤？","o":["可防止麵包變硬","是一種柔性材料","烤焙時著色快","增加風味"],"a":0},{"n":124,"q":"下列何種糖，酵母發酵產生二氧化碳及酒精之速率最慢？","o":["砂糖","果糖","葡萄糖","麥芽糖"],"a":3},{"n":125,"q":"新鮮雞蛋其 pH 值約為？","o":["5.2","6.5","7.6","9.0"],"a":2},{"n":126,"q":"雞蛋內含有下列何種酵素，可以殺死多種微生物，增長貯存時間？","o":["蛋白質分解酵素","脂肪分解酵素","澱粉分解酵素","溶菌酵素"],"a":3},{"n":127,"q":"製造乾燥蛋白粉時，為避免於乾燥時產生變色反應，必須去除蛋白內之？","o":["葡萄糖","脂肪","蛋白質","礦物質"],"a":0},{"n":128,"q":"蛋經貯藏後蛋白會釋出下列何種氣體，使其 pH 值升高？","o":["氫氣","氮氣","組織胺","二氧化碳"],"a":3},{"n":129,"q":"有關碳酸氫鈉，下列敘述何者錯誤？","o":["是一種化學膨大劑","亦稱小蘇打","其化學分子式為 NaHCO₃","是一種酸性鹽"],"a":3},{"n":130,"q":"有關發粉，下列敘述何者錯誤？","o":["以碳酸鈉為主原料","由各種不同的酸性鹽混合而成","加澱粉或麵粉為填充劑","俗稱為泡打粉或發泡粉"],"a":0},{"n":131,"q":"下列何者為慢性發粉之主要成分？","o":["酸性焦磷酸鹽","酸性磷酸鈣","碳酸氫鈉","碳酸鈉"],"a":0},{"n":132,"q":"小西餅在烘焙過程中，下列何者不是扮演膨脹的因素？","o":["碳酸氫銨","碳酸氫鈉","酵母","水"],"a":3},{"n":133,"q":"下列何者製作時需要添加酵母發酵？","o":["貓舌小西餅","瑪琍餅乾","蘇打餅乾","椰子餅乾"],"a":2},{"n":134,"q":"油炸用食用油之總極性化合物（total polar compounds）含量達百分之多少以上時，不得再予使用，應全部更換新油？","o":["25％","30％","40％","45％"],"a":0},{"n":135,"q":"製作食用豆漿，那一個不是正常步驟？","o":["水中浸泡約3至8個小時","將黃豆磨碎","用紗布分離豆渣","生豆漿不必再加熱"],"a":3},{"n":136,"q":"全豆豆漿含有的成份中那一項是錯的？","o":["蛋白質","油脂","乳糖","鈣"],"a":2},{"n":137,"q":"豆漿的鈣含量和牛奶比較，是？","o":["低","高","一樣","無法比較"],"a":0},{"n":138,"q":"乳糖不耐症的人喝那種飲料不會產生副作用？","o":["全脂牛奶","豆漿","脫脂牛奶","巧克力牛奶"],"a":1},{"n":139,"q":"市售椰奶包裝及脂肪含量那一項是錯的？","o":["鋁箔紙盒裝，脂肪含量比較低","罐裝，脂肪含量比較低","罐裝，脂肪含量比較高","包裝不一樣脂肪含量都一樣"],"a":1},{"n":140,"q":"下列對椰奶或椰漿（Coconut Milk）及椰子鮮奶油（Coconut Cream）敘述何者為非？","o":["椰奶，水和椰肉的比例約在1：1，如牛乳一樣的液狀","椰子鮮奶油，水和椰肉的比例約在1：4，脂肪含量較高、質地濃稠似鮮奶油","椰奶在開封前是常溫保存","椰漿，水和椰肉的比例約在1：4"],"a":3},{"n":141,"q":"素食分類中，那一種不含奶蛋類？","o":["奶蛋素","全素或純素","植物五辛素","蛋素"],"a":1},{"n":142,"q":"下列對鷹嘴豆（Chickpea）敘述何者為非？","o":["蛋白質含量高達28％以上","用罐頭鷹嘴豆水加糖可以打成的蛋白霜","對雞蛋敏感及吃全素的人可以代替「蛋白質」","鷹嘴豆水可以同比例代替雞蛋蛋白"],"a":3},{"n":143,"q":"對全素（Vegan）敘述何者為非？","o":["英國的《經濟學人》報導中全球大趨勢指出2019年是全素之年","這類素食者的飲食跟植物五辛素很像但不吃蛋、奶","這類素食者不只不食用動物食品，也不使用動物製品","這類素食者可以食用蜂蜜"],"a":3},{"n":144,"q":"椰漿敘述何者為非？","o":["包括椰子水和椰肉","南洋料理中常用在煮濃湯時取代牛奶","椰漿所含碳水化合物超過20%","全素業者常用來代替乳製品"],"a":2},{"n":145,"q":"烘焙產品標示為全素產品，下列那一項原料不應該加入？","o":["豆漿粉","大豆蛋白","乳清蛋白","小麥蛋白"],"a":2},{"n":146,"q":"製作全素麵包不可加入牛奶，可使用下列那一項原料代替？","o":["蛋黃","蛋白","鮮奶油","豆漿"],"a":3},{"n":147,"q":"製作全素巧克力產品，下列那一項原料不可加入？","o":["可可粉","白巧克力","可可脂","可可膏"],"a":1},{"n":148,"q":"攪拌全素麵包下列那一項原料不可取代牛奶？","o":["燕麥奶","豆漿","黑豆奶","優格"],"a":3},{"n":149,"q":"全素烘焙產品下列那一項原料不可使用？","o":["椰子油","發酵奶油","橄欖油","葡萄籽油"],"a":1},{"n":150,"q":"製作全素產品下列那一項原料可以取代奶粉？","o":["米穀粉","豆漿粉","玉米粉","蓬萊米粉"],"a":1}];const LABELS=["①", "②", "③", "④"];const PASSCODE='0217';const KEY='baking_ingredients_111_150_teacher_lock_v1';let state={started:false,finished:false,order:[],choices:{},answers:{},current:0,score:0,wrong:[]};const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function stopSpeak(){if('speechSynthesis'in window)speechSynthesis.cancel()}function speakText(text,rate=.88){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀，請使用手機 Chrome 或 Safari。');return}stopSpeak();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=rate;u.pitch=1;speechSynthesis.speak(u)}function currentQuestion(){return BANK[state.order[state.current]]}function initExam(){state={started:true,finished:false,order:shuffle([...Array(BANK.length).keys()]),choices:{},answers:{},current:0,score:0,wrong:[]};save();renderQuiz()}function renderStart(){const locked=!!state.finished;$('start').classList.remove('hidden');$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('start').innerHTML=locked?'<div class="title">本次測驗已完成</div><div class="notice">本裝置已鎖定，學生不能自行重測。<br>需要重新測驗時，請由老師輸入密碼。</div><div class="lock"><b>教師解鎖重測</b><input id="unlock" class="input" inputmode="numeric" maxlength="8" placeholder="請輸入教師密碼"><button class="btn primary full" style="margin-top:10px" onclick="unlockRetake()">教師解鎖並重新測驗</button></div>':'<div class="title">原料111～150 正式測驗</div><div class="notice">共 <strong>40題</strong>。<br>題目順序與選項順序都會隨機。<br>作答過程<strong>不顯示答案</strong>。<br>可以上一題／下一題修改答案。<br>全部完成後才能交卷。<br>每題可按「🔊 朗讀本題」。<br><strong>交卷後不可自行重測，需教師密碼解鎖。</strong></div><button class="btn primary full" style="margin-top:14px" onclick="initExam()">開始正式測驗</button>'}function renderQuiz(){const q=currentQuestion(),qIndex=state.order[state.current];if(!state.choices[state.current])state.choices[state.current]=shuffle(q.o.map((text,i)=>({text,orig:i})));const opts=state.choices[state.current],selectedOrig=state.answers[qIndex];$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('status').textContent=`第 ${state.current+1}／${BANK.length} 題｜原題第 ${q.n} 題`;$('quiz').innerHTML='<div class="qhead"><span>原題第 '+q.n+' 題</span><span>'+(state.current+1)+'／'+BANK.length+'</span></div><div class="progress"><div class="fill" style="width:'+((state.current/BANK.length)*100)+'%"></div></div><div class="question">'+esc(q.q)+'</div><button class="btn speak" onclick="speakCurrent()">🔊 朗讀本題</button><button class="btn stop" onclick="stopSpeak()">⏹ 停止朗讀</button><div>'+opts.map((o,i)=>'<button class="option '+(selectedOrig===o.orig?'selected':'')+'" onclick="selectOption('+i+')">'+LABELS[i]+' '+esc(o.text)+'</button>').join('')+'</div><div class="nav"><button class="btn secondary" onclick="prevQ()" '+(state.current===0?'disabled':'')+'>← 上一題</button><button class="btn primary" onclick="nextQ()">'+(state.current===BANK.length-1?'檢查作答':'下一題 →')+'</button></div><div class="small">答案可以修改；完成40題後才能交卷。</div>'}function selectOption(i){const qIndex=state.order[state.current];state.answers[qIndex]=state.choices[state.current][i].orig;save();renderQuiz()}function prevQ(){if(state.current>0){state.current--;save();renderQuiz()}}function nextQ(){const qIndex=state.order[state.current];if(state.answers[qIndex]===undefined){alert('請先選擇答案。');return}if(state.current<BANK.length-1){state.current++;save();renderQuiz()}else renderReview()}function renderReview(){const unanswered=[];for(let i=0;i<BANK.length;i++)if(state.answers[i]===undefined)unanswered.push(i+1);$('quiz').classList.remove('hidden');$('quiz').innerHTML='<div class="title">確認交卷</div><div class="notice">你已完成所有題目，請確認後再交卷。'+(unanswered.length?'<br><b>尚未作答：第 '+unanswered.join('、')+' 題</b>':'')+'</div><button class="btn secondary full" onclick="renderQuiz()">回到最後一題</button><button class="btn danger full" style="margin-top:10px" onclick="submitExam()">正式交卷</button>'}function submitExam(){for(let i=0;i<BANK.length;i++)if(state.answers[i]===undefined){alert('尚有題目未作答，不能交卷。');return}stopSpeak();let score=0,wrong=[];for(let i=0;i<BANK.length;i++){const q=BANK[i];if(state.answers[i]===q.a)score++;else wrong.push({q,chosen:q.o[state.answers[i]],correct:q.o[q.a]})}state.score=score;state.wrong=wrong;state.finished=true;state.started=false;save();renderResult()}function renderResult(){$('start').classList.add('hidden');$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const rate=Math.round((state.score/BANK.length)*100);$('result').innerHTML='<div class="title">測驗完成</div><div class="score">'+state.score+'／'+BANK.length+'</div><div>答對率：'+rate+'%</div><div class="notice" style="margin-top:14px">本次測驗已鎖定。學生不能自行重測。<br>需要重新測驗，請由老師輸入密碼 <b>0217</b> 解鎖。</div>'+(state.wrong.length?'<div class="wrong-list"><h3>錯誤題目與正確答案</h3>'+state.wrong.map(w=>'<div class="wrong-item"><b>第'+w.q.n+'題</b><br>'+esc(w.q.q)+'<br>你的答案：'+esc(w.chosen)+'<br><b>正確答案：'+esc(w.correct)+'</b></div>').join('')+'</div>':'<h3>🎉 全部答對！</h3>')+'<div class="lock"><b>教師解鎖重測</b><input id="unlock2" class="input" inputmode="numeric" maxlength="8" placeholder="請輸入教師密碼"><button class="btn primary full" style="margin-top:10px" onclick="unlockRetake()">教師解鎖並重新測驗</button></div>'}function unlockRetake(){const p=(document.getElementById('unlock')||document.getElementById('unlock2')).value.trim();if(p!==PASSCODE){alert('教師密碼錯誤');return}stopSpeak();localStorage.removeItem(KEY);state={started:false,finished:false,order:[],choices:{},answers:{},current:0,score:0,wrong:[]};renderStart()}function speakCurrent(){const q=currentQuestion(),opts=state.choices[state.current];speakText('第'+q.n+'題。'+q.q+'。'+opts.map((o,i)=>'選項'+LABELS[i]+'：'+o.text).join('。'))}window.addEventListener('load',()=>{const old=load();if(old){state=old;if(state.finished)renderResult();else if(state.started)renderQuiz();else renderStart()}else renderStart()});</script></body></html>
