<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作項目一 產品分類 1-30題練習</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#20252b;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.6}main{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:1.35rem;margin:0 0 5px}.muted{color:#657181;font-size:.92rem}.panel{background:white;border:1px solid #e1e5ea;border-radius:14px;padding:16px;margin:14px 0}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 13px;background:#245b8f;color:white;font-size:.95rem;cursor:pointer}button.alt{background:#e8edf3;color:#263746}button:disabled{opacity:.45}.tab.active{background:#245b8f;color:#fff}.qnum{font-size:.9rem;color:#657181}.question{font-size:1.12rem;font-weight:700;margin:8px 0 14px}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#f1f4f7;color:#20252b;border:1px solid #dce2e8}.option:disabled{opacity:1}.option.correct{background:#e4f3e9;border-color:#6eaa7c}.option.wrong{background:#fae8e8;border-color:#cb7777}.feedback{margin-top:12px;padding:12px;border-radius:10px;background:#f1f4f7;display:none}.feedback.show{display:block}.feedback.good{background:#e4f3e9}.feedback.bad{background:#fae8e8}.progress{height:7px;background:#e4e8ed;border-radius:10px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#245b8f;width:0}.score{font-weight:700}.hide{display:none}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
</style></head><body><main>
<h1>烘焙食品丙級｜工作項目一：產品分類</h1><div class="muted">第 1～30 題重複練習｜每組 10 題｜作答後立即顯示正確答案，並可朗讀題目與答案。</div>
<div class="panel"><div class="tabs" id="tabs"></div><div class="progress"><div id="bar"></div></div><div class="qnum" id="qnum"></div><div class="question" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div>
<div class="actions" style="margin-top:12px"><button class="alt" onclick="readQuestion()">朗讀題目</button><button class="alt" onclick="readAnswer()" id="readAns" disabled>朗讀正確答案</button><button class="alt" onclick="readBoth()">朗讀題目＋正確答案</button><button class="alt" onclick="speechSynthesis.cancel()">停止朗讀</button></div>
<div class="foot"><button class="alt" onclick="prev()">上一題</button><span class="score" id="score">本組答對：0 / 10</span><button onclick="next()">下一題</button></div></div>
<div class="panel"><div class="actions"><button class="alt" onclick="restartGroup()">重做本組</button><button class="alt" onclick="restartAll()">重新開始全部 30 題</button></div><div class="muted">選擇答案後會立即顯示正確答案及解析。可在答題後朗讀題目、正確答案，或兩者一起朗讀。使用瀏覽器內建語音功能。</div></div>
</main><script>
const data=[[1, "歐美流行之比薩─義大利發麵餅屬於？", ["麵包項", "餅乾項", "中點項", "西點項"], 4], [2, "下列何種產品不需經過油炸而成？", ["開口笑", "沙其瑪", "道納司", "鬆餅"], 4], [3, "最適合製作鮮奶油蛋糕及冰淇淋蛋糕是？", ["麵糊類蛋糕", "乳沫類蛋糕", "戚風類蛋糕", "磅蛋糕"], 3], [4, "那一種蛋糕之烤溫最低？", ["輕奶油", "海綿蛋糕", "水果蛋糕", "天使蛋糕"], 3], [5, "同種蛋糕那一種麵糊的著色最深？", ["低酸性", "中性", "鹼性", "強酸性"], 3], [6, "那一種蛋糕麵糊理想比重最輕？", ["海綿類", "戚風類", "麵糊類", "天使類"], 4], [7, "下列何種為硬式麵包？", ["全麥麵包", "甜麵包", "可鬆麵包", "法國麵包"], 4], [8, "何種蛋糕在攪拌前，蛋先予加溫到40～43℃，使容易起泡及膨脹？", ["輕奶油蛋糕", "重奶油蛋糕", "海綿蛋糕", "水果蛋糕"], 3], [9, "下列蛋糕配方中何者宜使用高筋麵粉？", ["魔鬼蛋糕", "水果蛋糕", "果醬捲", "戚風蛋糕"], 2], [10, "下列何種產品一定要使用高筋麵粉？", ["海綿蛋糕", "比薩餅", "白土司麵包", "天使蛋糕"], 3], [11, "蛋糕依麵糊性質和膨大方法的不同可分為？", ["二大類", "三大類", "四大類", "五大類"], 2], [12, "長崎蛋糕屬於？", ["麵糊類蛋糕", "乳沫類蛋糕", "戚風類蛋糕", "重奶油蛋糕"], 2], [13, "配方中採用液體油脂可製作下列何種蛋糕？", ["水果蛋糕", "重奶油蛋糕", "海綿蛋糕", "輕奶油蛋糕"], 3], [14, "下列何種產品配方中使用酵母，以利產品之膨脹？", ["鬆餅", "酥鬆性小西餅", "綠豆椪", "丹麥式甜麵包"], 4], [15, "配方中採用高筋麵粉，比較適合製作下列何種產品？", ["擠出小西餅", "魔鬼蛋糕", "法國麵包", "天使蛋糕"], 3], [16, "歐美俗稱的磅蛋糕（pound cake）是屬於？", ["戚風類蛋糕", "麵糊類蛋糕", "乳沫類蛋糕", "天使蛋糕"], 2], [17, "下列何種產品之麵糰是屬於發酵性麵糰？", ["奶油小西餅", "蛋黃酥", "廣式月餅", "美式甜麵包"], 4], [18, "下列何種產品之麵糰，其配方中糖油含量最低？", ["蘇打餅乾", "口糧餅乾", "戚風蛋糕", "海綿蛋糕"], 1], [19, "下列何種產品，其麵糊須經加熱熬煮？", ["廣式月餅", "太陽餅", "天使蛋糕", "奶油空心餅"], 4], [20, "下列何種產品，以烘焙百分比而言，其配方中用蛋量超過100％？", ["麵包", "鬆餅", "中點", "蛋糕"], 4], [21, "下列何種產品，不需經烤焙過程？", ["法國麵包", "戚風蛋糕", "奶油空心餅", "開口笑"], 4], [22, "奶油雞蛋布丁派是屬於？", ["生派皮生派餡", "熟派皮熟派餡", "雙皮派", "油炸派"], 1], [23, "牛肉派是屬於？", ["生派皮生派餡", "熟派皮熟派餡", "雙皮派", "油炸派"], 3], [24, "餅乾麵糰在攪拌終了階段不須產生麵筋的產品是？", ["輥輪推壓小西餅", "硬質餅乾", "蘇打餅乾", "瑪莉餅乾"], 1], [25, "餅乾麵糰在壓延成型時須考慮收縮比的產品為？", ["煎餅", "蘇打餅乾", "乳沫類小西餅", "線切成型小西餅"], 2], [26, "依照製作方法，乳沫類小西餅是以下列何者方式成型？", ["塊狀成型", "擠出成型", "線切成型", "推壓成型"], 2], [27, "以麵粉與油脂調製烘焙層次分明之鬆酥性產品是？", ["小西餅", "脆餅", "煎餅", "鬆餅、派、起酥"], 4], [28, "小西餅配方中糖的用量比油多、油的用量比水多，麵糰較乾硬，須擀平或用模型壓出的產品是？", ["軟性小西餅", "酥硬性小西餅", "鬆酥性小西餅", "脆硬性小西餅"], 4], [29, "下列何者不適合用直接法攪拌？", ["海綿小西餅", "奶油小西餅", "瑪琍餅乾", "調味餅乾"], 1], [30, "台灣素食分類分為五大類，下列哪一類不是在素食分類？", ["奶素", "蛋奶素", "五辛素", "鍋邊素"], 4]];let group=0,index=0;let results=[Array(10).fill(null),Array(10).fill(null),Array(10).fill(null)];
const letters=["A","B","C","D"];const zh=["一","二","三","四"];
function renderTabs(){const t=document.getElementById("tabs");t.innerHTML="";for(let i=0;i<3;i++){let b=document.createElement("button");b.className="tab "+(i===group?"active":"alt");b.textContent=`第${i+1}組（${i*10+1}-${i*10+10}題）`;b.onclick=()=>{group=i;index=0;render()};t.appendChild(b)}}
function current(){return data[group*10+index]}
function render(){renderTabs();let q=current(),r=results[group][index];document.getElementById("qnum").textContent=`第 ${q[0]} 題｜本組第 ${index+1} / 10 題`;document.getElementById("question").textContent=q[1];document.getElementById("bar").style.width=((index+1)*10)+"%";let opts=document.getElementById("options");opts.innerHTML="";q[2].forEach((o,i)=>{let b=document.createElement("button");b.className="option";b.textContent=letters[i]+". "+o;b.disabled=r!==null;if(r!==null&&i+1===q[3])b.classList.add("correct");if(r!==null&&r.choice===i+1&&r.choice!==q[3])b.classList.add("wrong");b.onclick=()=>answer(i+1);opts.appendChild(b)});let f=document.getElementById("feedback");f.className="feedback"+(r!==null?" show "+(r.choice===q[3]?"good":"bad"):"");f.textContent=r===null?"":(r.choice===q[3]?"答對了！":"答錯了。")+" 正確答案："+letters[q[3]-1]+". "+q[2][q[3]-1];document.getElementById("readAns").disabled=r===null;let done=results[group].filter(x=>x!==null),correct=done.filter(x=>x.choice===data[group*10+results[group].indexOf(x)][3]).length;document.getElementById("score").textContent=`本組答對：${correct} / 10（已作答 ${done.length} 題）`;}
function answer(choice){let q=current();if(results[group][index]!==null)return;results[group][index]={choice};render()}
function speak(text){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="zh-TW";u.rate=.9;speechSynthesis.speak(u)}
function readQuestion(){speak(`第${current()[0]}題。${current()[1]}`)}
function readAnswer(){let q=current();speak(`第${q[0]}題，正確答案是${zh[q[3]-1]}，${q[2][q[3]-1]}`)}
function readBoth(){let q=current();speak(`第${q[0]}題。${q[1]}。正確答案是${zh[q[3]-1]}，${q[2][q[3]-1]}。`)}
function prev(){if(index>0)index--;render()}function next(){if(index<9)index++;else if(group<2){group++;index=0}else{alert("已到第30題。可選擇重做本組或重新開始全部題目。")}render()}
function restartGroup(){if(confirm("確定重做本組10題？")){results[group]=Array(10).fill(null);index=0;render()}}
function restartAll(){if(confirm("確定重新開始全部30題？")){results=[Array(10).fill(null),Array(10).fill(null),Array(10).fill(null)];group=0;index=0;render()}}
render();
</script></body></html>
