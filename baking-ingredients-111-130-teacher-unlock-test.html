<!doctype html>
<html lang="zh-Hant"><head>

<title>烘焙食品丙級｜原料111～130｜正式測驗</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}body{user-select:text;-webkit-user-select:text}.wrap{max-width:760px;margin:auto;padding:12px 12px 80px}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}h1{font-size:20px;margin:0 0 4px;line-height:1.4}.sub{font-size:13px;color:#666}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}.start-title{font-size:23px;font-weight:900;line-height:1.4;margin-bottom:10px}.notice{background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7;margin:12px 0}.qhead{display:flex;justify-content:space-between;gap:10px;color:#666;font-size:14px;font-weight:800;margin-bottom:10px}.progress{height:8px;background:#e7e7e7;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:#222;width:0}.question{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:14px;user-select:text;-webkit-user-select:text}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d6d6d6;border-radius:12px;padding:14px;margin:10px 0;font-size:18px;line-height:1.5;cursor:pointer;touch-action:manipulation;user-select:text;-webkit-user-select:text}.option.selected{border:2px solid #222;background:#f4f4f4}.btn{border:0;border-radius:12px;padding:13px 16px;font-size:17px;cursor:pointer}.btn.full{width:100%}.primary{background:#222;color:#fff}.secondary{background:#eee;color:#222}.danger{background:#6b2e2e;color:#fff}.speak{background:#eee;color:#222;width:100%;margin:0 0 10px}.stop{background:#555;color:#fff;width:100%;margin-bottom:10px}.nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.submit{width:100%;margin-top:16px}.btn:disabled{opacity:.45;cursor:not-allowed}.result{line-height:1.7}.score{font-size:42px;font-weight:900;margin:6px 0;text-align:center}.wrong-item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;line-height:1.7}.small{font-size:13px;color:#777;line-height:1.6;margin-top:12px}.lock-title{font-size:22px;font-weight:900;margin-bottom:10px}.password{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:18px;margin:8px 0 10px}.error{color:#b00020;font-size:14px;min-height:20px}.hidden{display:none!important}@media(max-width:480px){.wrap{padding:10px 10px 60px}.card{padding:16px;border-radius:15px}.question{font-size:19px}.option{font-size:17px;padding:12px}}
</style></head><body>
<header><div class="wrap" style="padding:0"><h1>烘焙食品丙級｜原料111～130 正式測驗</h1><div class="sub" id="status">共20題｜教師密碼解鎖重測｜含手機報讀</div></div></header>
<main class="wrap">
<section id="start" class="card"><div class="start-title">原料111～130正式測驗</div><div class="notice">共 <strong>20題</strong>，每次測驗會<strong>重新打亂題目順序</strong>。<br>作答時不顯示答案；可以返回上一題修改答案。<br>完成全部20題後才能交卷。<br>交卷後顯示<strong>總分、答對率、錯誤題目與正確答案</strong>。<br><strong>學生完成後會鎖定；再次測驗必須由教師輸入密碼解鎖。</strong></div><button class="btn primary full" id="startBtn">開始測驗</button><div class="small">教師重測密碼：0217</div></section>
<section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section>
<section id="locked" class="card hidden"><div class="lock-title">本次測驗已完成</div><div class="notice">學生無法自行重新測驗。若要重考，請教師輸入解鎖密碼。</div><input id="pw" class="password" type="password" inputmode="numeric" autocomplete="off" placeholder="請輸入教師密碼"><div id="pwError" class="error"></div><button class="btn danger full" id="unlockBtn">教師解鎖並重新測驗</button></section>
</main>
<script>
const BANK=[{"n": 111, "q": "小麥之橫斷面呈粉質狀者為何？", "o": ["高筋麵粉", "中筋麵粉", "粉心麵粉", "低筋麵粉"], "a": 3}, {"n": 112, "q": "小麥之橫斷面呈玻璃質狀者為何？", "o": ["高筋麵粉", "中筋麵粉", "粉心麵粉", "低筋麵粉"], "a": 0}, {"n": 113, "q": "麵粉蛋白質是屬於部分不完全蛋白質，因為其胺基酸內缺少了一種必需胺基酸為？", "o": ["甲硫胺酸", "胱胺酸", "半胱胺酸", "離胺酸"], "a": 3}, {"n": 114, "q": "下列何種胺基酸內含有硫氫根（－SH），並具有還原特性，以影響麵糰之性質？", "o": ["麩胺酸", "甘胺酸", "半胱胺酸", "離胺酸"], "a": 2}, {"n": 115, "q": "小麥胚芽中含有下列何種物質，其含有硫氫根（－SH），會減少麵筋彈性，使麵糰發粘？", "o": ["維生素E", "礦物質", "油脂", "麩胱甘"], "a": 3}, {"n": 116, "q": "可以得到麵粉之吸水量、攪拌時間及攪拌耐力之儀器設備為？", "o": ["麵粉酵素活性測定儀（Amylograph）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": 3}, {"n": 117, "q": "測定低筋粉或軟麥麵粉中膠性粘度之儀器設備為？", "o": ["麵粉沉降係數測定儀（Falling Number）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": 1}, {"n": 118, "q": "測定麵筋之伸張力及伸張阻力等品質之儀器設備為？", "o": ["麵粉酵素活性測定儀（Amylograph）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": 2}, {"n": 119, "q": "測定麵粉中之液化酵素的儀器設備為？", "o": ["麵粉酵素活性測定儀（Amylograph）", "連續溫度黏度測定儀（Viscosgraph）", "麵糰拉力特性測定儀（Extensograph）", "麵糰攪拌特性測定儀（Farinograph）"], "a": 0}, {"n": 120, "q": "D.E.值（葡萄糖當量）30～50之澱粉糖漿，其組成成分為？", "o": ["蔗糖", "果糖", "葡萄糖", "糊精、麥芽糖及葡萄糖之混合物"], "a": 3}, {"n": 121, "q": "以澱粉為原料經完全水解 D.E.值（葡萄糖當量）為100之糖漿產品，其組成成分為？", "o": ["蔗糖", "果糖", "葡萄糖", "澱粉及葡萄糖之混合物"], "a": 2}, {"n": 122, "q": "下列何種糖吸濕性最小？", "o": ["砂糖", "果糖", "蜂蜜", "轉化糖"], "a": 0}, {"n": 123, "q": "有關糖對麵包品質之影響，下列何者有誤？", "o": ["可防止麵包變硬", "是一種柔性材料", "烤焙時著色快", "增加風味"], "a": 0}, {"n": 124, "q": "下列何種糖，酵母發酵產生二氧化碳及酒精之速率最慢？", "o": ["砂糖", "果糖", "葡萄糖", "麥芽糖"], "a": 3}, {"n": 125, "q": "新鮮雞蛋其 pH 值約為？", "o": ["5.2", "6.5", "7.6", "9.0"], "a": 2}, {"n": 126, "q": "雞蛋內含有下列何種酵素，可以殺死多種微生物，增長貯存時間？", "o": ["蛋白質分解酵素", "脂肪分解酵素", "澱粉分解酵素", "溶菌酵素"], "a": 3}, {"n": 127, "q": "製造乾燥蛋白粉時，為避免於乾燥時產生變色反應，必須去除蛋白內之？", "o": ["葡萄糖", "脂肪", "蛋白質", "礦物質"], "a": 0}, {"n": 128, "q": "蛋經貯藏後蛋白會釋出下列何種氣體，使其 pH 值升高？", "o": ["氫氣", "氮氣", "組織胺", "二氧化碳"], "a": 3}, {"n": 129, "q": "有關碳酸氫鈉，下列敘述何者錯誤？", "o": ["是一種化學膨大劑", "亦稱小蘇打", "其化學分子式為 NaHCO₃", "是一種酸性鹽"], "a": 3}, {"n": 130, "q": "有關發粉，下列敘述何者錯誤？", "o": ["以碳酸鈉為主原料", "由各種不同的酸性鹽混合而成", "加澱粉或麵粉為填充劑", "俗稱為泡打粉或發泡粉"], "a": 0}];
const PASSWORD="0217";const STORAGE_KEY="baking_ingredients_111_130_teacher_lock_v1";const LABELS=["A","B","C","D"];let state={started:false,finished:false,order:[],current:0,answers:{},score:0,wrong:[]};
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function speakCurrent(){const q=BANK[state.order[state.current]];stopSpeak();if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀，請改用手機 Chrome 或 Safari。');return}const text=`第${q.n}題。${q.q}。選項A，${q.o[0]}。選項B，${q.o[1]}。選項C，${q.o[2]}。選項D，${q.o[3]}。`;const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.85;u.pitch=1;speechSynthesis.speak(u)}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x&&typeof x==='object'?x:null}catch(e){return null}}
function showOnly(id){['start','quiz','result','locked'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function startExam(){stopSpeak();state={started:true,finished:false,order:shuffle(BANK.map((_,i)=>i)),current:0,answers:{},score:0,wrong:[]};save();render()}
function render(){showOnly('quiz');const q=BANK[state.order[state.current]];const selected=state.answers[state.current];$('status').textContent=`第 ${state.current+1}／${BANK.length} 題｜已作答 ${Object.keys(state.answers).length}／${BANK.length}`;$('quiz').innerHTML=`<div class="qhead"><span>題庫第 ${q.n} 題</span><span>${state.current+1}／${BANK.length}</span></div><div class="progress"><div class="fill" style="width:${(state.current+1)/BANK.length*100}%"></div></div><div class="question">${esc(q.q)}</div><button class="btn speak" id="speakBtn">🔊 朗讀本題（題目＋選項）</button><button class="btn stop" id="stopBtn">⏹ 停止朗讀</button><div id="opts"></div><div class="nav"><button class="btn secondary" id="prevBtn" ${state.current===0?'disabled':''}>← 上一題</button><button class="btn primary" id="nextBtn">${state.current===BANK.length-1?'檢查作答':'下一題 →'}</button></div><button class="btn danger submit" id="submitBtn">交卷</button><div class="small">交卷前可以返回上一題修改答案；20題全部作答後才能正式交卷。測驗中不顯示正確答案。</div>`;const opts=$('opts');q.o.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='option'+(selected===i?' selected':'');b.innerHTML=`<strong>${LABELS[i]}.</strong> ${esc(t)}`;b.onclick=()=>choose(i);opts.appendChild(b)});$('speakBtn').onclick=speakCurrent;$('stopBtn').onclick=stopSpeak;$('prevBtn').onclick=prev;$('nextBtn').onclick=nextOrCheck;$('submitBtn').onclick=submitExam}
function choose(i){state.answers[state.current]=i;save();render()}function prev(){if(state.current>0){state.current--;save();render()}}function nextOrCheck(){if(state.current<BANK.length-1){state.current++;save();render()}else{checkComplete()}}
function checkComplete(){const missing=[];for(let i=0;i<BANK.length;i++)if(state.answers[i]===undefined)missing.push(i+1);if(missing.length){alert(`尚有 ${missing.length} 題未作答，請完成全部20題後再交卷。`);return}alert('20題均已作答，可以按「交卷」完成測驗。')}
function submitExam(){const missing=[];for(let i=0;i<BANK.length;i++)if(state.answers[i]===undefined)missing.push(i+1);if(missing.length){alert(`尚有 ${missing.length} 題未作答，請完成全部20題後再交卷。`);return}stopSpeak();let score=0;const wrong=[];for(let pos=0;pos<BANK.length;pos++){const q=BANK[state.order[pos]],sel=state.answers[pos];if(sel===q.a)score++;else wrong.push({n:q.n,q:q.q,selected:sel===undefined?'未作答':q.o[sel],answer:q.o[q.a]})}state.score=score;state.wrong=wrong;state.finished=true;save();showResult()}
function showResult(){showOnly('result');$('status').textContent='本次測驗完成';const pct=Math.round(state.score/BANK.length*100);const wrongHtml=state.wrong.length?state.wrong.map(x=>`<div class="wrong-item"><strong>第 ${x.n} 題</strong><br>${esc(x.q)}<br>你的答案：${esc(x.selected)}<br><strong>正確答案：${esc(x.answer)}</strong></div>`).join(''):'<p>全部答對。</p>';$('result').innerHTML=`<h2>測驗完成</h2><div class="score">${state.score}／${BANK.length}</div><p style="text-align:center">答對率：${pct}%</p><h3>錯誤題目整理</h3>${wrongHtml}<div class="notice">學生重新整理或再次進入本網址，仍會維持鎖定。需要重考時，請教師輸入密碼。</div><button class="btn danger full" id="toUnlock">教師解鎖重測</button>`;$('toUnlock').onclick=showLocked}
function showLocked(){stopSpeak();showOnly('locked');$('status').textContent='已鎖定｜需要教師密碼解鎖重測';$('pw').value='';$('pwError').textContent=''}function unlock(){const pw=$('pw').value.trim();if(pw!==PASSWORD){$('pwError').textContent='密碼錯誤，請教師重新輸入。';return}localStorage.removeItem(STORAGE_KEY);$('pw').value='';$('pwError').textContent='';startExam()}
$('startBtn').onclick=startExam;$('unlockBtn').onclick=unlock;const saved=load();if(saved&&saved.finished){state=saved;showLocked()}else if(saved&&saved.started){state=saved;render()}else showOnly('start');
</script></body></html>
