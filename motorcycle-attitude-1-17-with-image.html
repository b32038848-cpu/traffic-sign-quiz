<title>機車駕照｜正確觀念與態度</title><style>

<section class="card" id="quiz"><div class="head"><div><div class="title">機車駕照｜正確觀念與態度</div><div class="sub">第一階段：第1～17題｜貨物裝載</div></div><div class="sub">答對 <b id="score">0</b> 題</div></div>

</main><script>
const QUESTIONS=[{"no": 1, "q": "機車附載物品，高度不可超過駕駛人", "opts": ["頭部", "肩部", "腰部"], "ans": 2}, {"no": 2, "q": "機車附載物品，寬度不可超過車輛把手外緣", "opts": ["10 公分", "2 公尺", "1 公尺半"], "ans": 1}, {"no": 3, "q": "重型機車，附載物品重量，不得超過", "opts": ["50 公斤", "80 公斤", "90 公斤"], "ans": 2}, {"no": 4, "q": "機車附載物品，長度規定伸出車尾部分，自後輪軸起，不得超過", "opts": ["半公尺", "1 公尺", "3 公尺"], "ans": 1}, {"no": 5, "q": "普通輕型機車附載物件，重量規定", "opts": ["以40 公斤為限", "以50 公斤為限", "以20 公斤為限"], "ans": 2}, {"no": 6, "q": "關於機車載物的規定，下列何者不正確？", "opts": ["得載運高於騎士肩膀以上之貨物", "寬度不得超過把手外緣 10 公分", "伸出車尾部分，自後輪軸起不得超過 50 公分。"], "ans": 1}, {"no": 7, "q": "機車附載人員或物品，下列何者不正確？", "opts": ["小型輕型機車不得附載人員，重型及普通輕型機車在駕駛人後設有固定座位者，得附載 1 人", "附載坐人後，不得另載物品", "附載坐人可以側坐。"], "ans": 3}, {"no": 8, "q": "機車附載乘客之原則，何者不正確?", "opts": ["附載乘客不可側坐", "普通輕型機車不可附載乘客", "重型機車限載 1 人。"], "ans": 2}, {"no": 9, "q": "（圖示）題目中的數字所代表的是哪一項？", "opts": ["車輛總重限制", "車輛載重限制", "車輛空重。"], "ans": 1}, {"no": 10, "q": "機車所附載之貨物，長度規定下列何者正確？", "opts": ["自座位後部起不得向前超伸", "自座位後部起向前不得伸出超過一公尺", "自座位後部起向前不得伸出超過二十公分"], "ans": 1}, {"no": 11, "q": "機車附載物品超過車尾，最長不得超過多少？", "opts": ["自後輪軸起不得超過半公尺", "自後輪軸起不得超過一公尺", "自車尾（車身）起不得伸出超過半公尺"], "ans": 1}, {"no": 12, "q": "機車載物之長度，自座位後部起有何規定？", "opts": ["不得向前超伸", "得向前伸出但不得超過把手", "無相關限制"], "ans": 1}, {"no": 13, "q": "機車載物時，所載貨物的最大寬度限制為何？", "opts": ["不得超過把手外緣 10 公分", "不得超過把手外緣 15 公分", "不得超過機車把手寬度"], "ans": 1}, {"no": 14, "q": "機車載運貨物時，關於裝載規定，下列敘述何者正確？", "opts": ["貨物以繩索確實固定且未遮蔽車尾燈號者，得不受尺寸限制", "貨物寬度未超出車把手且重量在駕駛人可控制範圍內，即符合規定", "載運貨物應遵守法定之寬度、長度、高度及重量限制，不得超載"], "ans": 3}, {"no": 15, "q": "機車附載人員或物品，以下規定何者正確？", "opts": ["小型輕型機車、重型及普通輕型機車在駕駛人後設有固定座位者，得附載一人", "載物者，小型輕型不得超過三十公斤；普通輕型不得超過六十公斤；重型不得超過九十公斤", "附載坐人後，不得另載物品。但零星物品不影響駕駛人及附載人員之安全者，不在此限"], "ans": 3}, {"no": 16, "q": "若機車附載人員或物品違反規定，將處罰誰？", "opts": ["乘客", "機車駕駛人", "機車駕駛人及乘客"], "ans": 2}, {"no": 17, "q": "機車附載人員或物品未依規定者，將處駕駛人多少罰鍰？", "opts": ["新臺幣 300 元~600 元罰鍰", "新臺幣 600 元~1,200 元罰鍰", "新臺幣 1,200 元~2,400 元罰鍰"], "ans": 1}];let order=[],idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){order=shuffle(QUESTIONS);idx=0;score=0;$("quiz").style.display="block";$("result").style.display="none";render()}
function render(){locked=false;const item=order[idx];$("qno").textContent="第"+item.no+"題";$("qimage").innerHTML=item.no===9?`<img class="qimage" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MDAgNTAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IjUuNeWFrOWZuOi7iui8m+e4vemHjemZkOWItuaomeiqjCI+CjxyZWN0IHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIiBmaWxsPSJ3aGl0ZSIvPgo8Y2lyY2xlIGN4PSIyNTAiIGN5PSIyNTAiIHI9IjIwMCIgZmlsbD0id2hpdGUiIHN0cm9rZT0iI2U2MDAxMiIgc3Ryb2tlLXdpZHRoPSI1NSIvPgo8dGV4dCB4PSIxNzgiIHk9IjMwMiIgZm9udC1mYW1pbHk9IkFyaWFsLCAnTm90byBTYW5zIFRDJywgJ01pY3Jvc29mdCBKaGVuZ0hlaScsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTUwIiBmaWxsPSIjMTExIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj41LjU8L3RleHQ+Cjx0ZXh0IHg9IjM2MyIgeT0iMjkyIiBmb250LWZhbWlseT0iQXJpYWwsICdOb3RvIFNhbnMgVEMnLCAnTWljcm9zb2Z0IEpoZW5nSGVpJywgc2Fucy1zZXJpZiIgZm9udC1zaXplPSI0MiIgZmlsbD0iIzExMSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+5YWs5Zm4PC90ZXh0Pgo8L3N2Zz4=" alt="5.5公噸車輛總重限制標誌">`:``;$("question").textContent=item.q;$("score").textContent=score;$("fill").style.width=(idx/order.length*100)+"%";$("feedback").className="fb";$("feedback").textContent="";$("next").disabled=true;$("next").textContent=idx===order.length-1?"查看成績":"下一題";$("options").innerHTML="";item.shuffled=shuffle(item.opts.map((text,i)=>({text,i})));item.shuffled.forEach((o,pos)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=String.fromCharCode(65+pos)+"．"+o.text;b.onclick=()=>choose(o.i,b,item);$("options").appendChild(b)})}
function choose(i,b,item){if(locked)return;locked=true;const bs=[...document.querySelectorAll(".opt")];bs.forEach(x=>x.disabled=true);const cp=item.shuffled.findIndex(o=>o.i===item.ans-1);if(i===item.ans-1){score++;b.classList.add("correct");$("feedback").className="fb show ok";$("feedback").textContent="答對！"}else{b.classList.add("wrong");bs[cp].classList.add("correct");$("feedback").className="fb show bad";$("feedback").textContent="答錯。正確答案："+String.fromCharCode(65+cp)+"．"+item.opts[item.ans-1]}$("score").textContent=score;$("next").disabled=false}
$("next").onclick=()=>{if(!locked)return;if(idx===order.length-1){$("quiz").style.display="none";$("result").style.display="block";$("finalScore").textContent=score+" / "+order.length;$("finalRate").textContent="正確率 "+Math.round(score/order.length*100)+"％"}else{idx++;render();window.scrollTo({top:0,behavior:"smooth"})}}
$("restart").onclick=start;start();
</script></body></html>
