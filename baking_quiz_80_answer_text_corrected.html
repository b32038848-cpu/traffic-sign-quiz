<script>
const questions=[{"id":1,"question":"西點用亮光糖漿製作原料，下列何者為非？","options":[{"value":"A","label":"洋菜、水、糖"},{"value":"B","label":"桔子果醬、水"},{"value":"C","label":"杏桃果膠、水"},{"value":"D","label":"糖、水"}],"answer":"D"},{"id":2,"question":"烤焙時若遇到產品不滿一盤時，可做以下之處理方式才不致於烤焙不均？","options":[{"value":"A","label":"白紙打濕置於空盤處"},{"value":"B","label":"報紙打濕置於空盤處"},{"value":"C","label":"將多餘麵糊倒掉不用"},{"value":"D","label":"空盤處墊錫箔紙"}],"answer":"A"},{"id":3,"question":"擠製小西餅於烤盤上時如習慣以右手操作者可選擇下列那一項較順手？","options":[{"value":"A","label":""},{"value":"B","label":""},{"value":"C","label":""},{"value":"D","label":""}],"answer":"A"},{"id":4,"question":"製作鬆餅摺疊次數以下列何者為佳？","options":[{"value":"A","label":"3 折法×1 次"},{"value":"B","label":"3 折法×2 次"},{"value":"C","label":"3 折法×4 次"},{"value":"D","label":"3 折法×6 次"}],"answer":"C"},{"id":5,"question":"良好的鬆餅製作環境室溫宜控制在？","options":[{"value":"A","label":"5℃±5℃"},{"value":"B","label":"20℃±5℃"},{"value":"C","label":"35℃±5℃"},{"value":"D","label":"45℃±5℃"}],"answer":"B"},{"id":6,"question":"製作乳沫類蛋糕，麵糊攪拌之拌打器宜選用？","options":[{"value":"A","label":"鈎狀"},{"value":"B","label":"漿狀"},{"value":"C","label":"網狀（球狀）"},{"value":"D","label":"螺旋狀"}],"answer":"C"},{"id":7,"question":"下列何種蛋糕在製作時，不得沾上任何油脂？","options":[{"value":"A","label":"大理石蛋糕"},{"value":"B","label":"蜂蜜蛋糕"},{"value":"C","label":"魔鬼蛋糕"},{"value":"D","label":"天使蛋糕"}],"answer":"D"},{"id":8,"question":"蛋白打發時，為增加其潔白度，可加入適量的？","options":[{"value":"A","label":"沙拉油"},{"value":"B","label":"味素"},{"value":"C","label":"檸檬汁"},{"value":"D","label":"食鹽"}],"answer":"C"},{"id":9,"question":"為改善海綿蛋糕組織之韌性，在製作時可加入適量","options":[{"value":"A","label":"蛋黃"},{"value":"B","label":"蛋白"},{"value":"C","label":"麵粉"},{"value":"D","label":"食鹽"}],"answer":"A"},{"id":10,"question":"欲使麵包烤焙後高度一定，後發酵時間常需和麵包烤焙彈性（oven spring）配合， 當烤焙彈性大的麵包，入爐時間應","options":[{"value":"A","label":"提早"},{"value":"B","label":"延後"},{"value":"C","label":"不變"},{"value":"D","label":"隨便"}],"answer":"A"},{"id":11,"question":"在沒有空調的室內做麵包時，中間發酵時間，很容易受氣候影響，若要控制中間 發酵的溫度和濕度，下列那一項最適當？","options":[{"value":"A","label":"35℃、85％"},{"value":"B","label":"20℃、85％"},{"value":"C","label":"28℃、75～80％"},{"value":"D","label":"38℃、85％"}],"answer":"C"},{"id":12,"question":"奶油小西餅若以機器成型，每次擠出7 個，每個麵糰重10 公克，機器轉速（r.p.m） 為50 次/分，現有麵糰35 公斤，需幾分鐘擠完？","options":[{"value":"A","label":"10 分鐘"},{"value":"B","label":"20 分鐘"},{"value":"C","label":"40 分鐘"},{"value":"D","label":"50 分鐘"}],"answer":"A"},{"id":13,"question":"線切小西餅，若以機器成型，每次可切出7 個，機器轉速為40 次/分，現有麵糰 28 公斤，共花了20 分鐘切完，則每個麵糰重為？","options":[{"value":"A","label":"5 公克"},{"value":"B","label":"7 公克"},{"value":"C","label":"8 公克"},{"value":"D","label":"10 公克"}],"answer":"A"},{"id":14,"question":"製作奶油空心餅若麵糊較硬，則其殼較？","options":[{"value":"A","label":"厚"},{"value":"B","label":"薄"},{"value":"C","label":"軟"},{"value":"D","label":"不影響"}],"answer":"A"},{"id":15,"question":"重奶油蛋糕油脂的最低使用量為？","options":[{"value":"A","label":"30％"},{"value":"B","label":"40％"},{"value":"C","label":"50％"},{"value":"D","label":"60％"}],"answer":"D"},{"id":16,"question":"一般餐包的油脂用量為？","options":[{"value":"A","label":"4～6％"},{"value":"B","label":"8～14％"},{"value":"C","label":"15～20％"},{"value":"D","label":"25～30％"}],"answer":"B"},{"id":17,"question":"奶油海綿蛋糕中奶油用量最多可用","options":[{"value":"A","label":"10～20％"},{"value":"B","label":"21～30％"},{"value":"C","label":"31～39％"},{"value":"D","label":"40～50％"}],"answer":"D"},{"id":18,"question":"麵粉含水量比標準減少1％時，則麵包麵糰攪拌時配方內水的用量可隨著增加","options":[{"value":"A","label":"0％"},{"value":"B","label":"2％"},{"value":"C","label":"4％"},{"value":"D","label":"6％"}],"answer":"B"},{"id":19,"question":"煮製奶油空心餅（泡芙）何者為正確？","options":[{"value":"A","label":"麵粉、油脂、水同時置於鍋中煮沸"},{"value":"B","label":"油脂煮沸即加水、麵粉拌勻"},{"value":"C","label":"油脂 與水煮沸並不斷地攪拌加入麵粉，繼續攪拌加熱至麵粉完全糊化"},{"value":"D","label":"水、油脂煮 沸即離火，加入麵粉拌勻"}],"answer":"C"},{"id":20,"question":"炸油炸甜圈餅（道納司，doughnuts）的油溫以（ ）為佳？","options":[{"value":"A","label":"140～150℃"},{"value":"B","label":"180～190℃"},{"value":"C","label":"210～220℃"},{"value":"D","label":"230～240℃"}],"answer":"B"},{"id":21,"question":"奶油空心餅成型後應該？","options":[{"value":"A","label":"馬上進爐烘烤"},{"value":"B","label":"鬆弛10 分鐘後進爐"},{"value":"C","label":"鬆弛15 分鐘後進爐"},{"value":"D","label":"鬆弛30 分鐘後進爐"}],"answer":"A"},{"id":22,"question":"製作麵包時麵粉筋性較弱，應採用何種攪拌速度？","options":[{"value":"A","label":"快速"},{"value":"B","label":"中速"},{"value":"C","label":"慢速"},{"value":"D","label":"先用快速再改慢速"}],"answer":"B"},{"id":23,"question":"重奶油蛋糕如欲組織細膩可以採用？","options":[{"value":"A","label":"直接法攪拌"},{"value":"B","label":"糖油拌合法"},{"value":"C","label":"麵粉油脂拌合法"},{"value":"D","label":"兩步拌合法"}],"answer":"C"},{"id":24,"question":"整形後的丹麥麵包或甜麵包麵糰，如需冷藏，冰箱溫度應為何？","options":[{"value":"A","label":"-5～0℃"},{"value":"B","label":"0～7℃"},{"value":"C","label":"11～15℃"},{"value":"D","label":"16～20℃"}],"answer":"B"},{"id":25,"question":"烤焙法國麵包烤爐內必須有蒸氣設備，蒸氣的壓力為？","options":[{"value":"A","label":"壓力大，量小"},{"value":"B","label":"祇要有蒸氣產生就好"},{"value":"C","label":"壓力低，量大"},{"value":"D","label":"壓力大，量 大"}],"answer":"C"},{"id":26,"question":"海綿蛋糕攪拌有冷攪拌法和熱攪拌法，熱攪拌法是先將蛋加溫至？","options":[{"value":"A","label":"25℃以下"},{"value":"B","label":"25～30℃"},{"value":"C","label":"35～43℃"},{"value":"D","label":"50℃以上"}],"answer":"C"},{"id":27,"question":"海綿蛋糕配方中各項材料百分比加起來得180％，已知麵糊總量為9 公斤，其麵 粉的用量應為","options":[{"value":"A","label":"3.5 公斤"},{"value":"B","label":"4 公斤"},{"value":"C","label":"4.5 公斤"},{"value":"D","label":"5 公斤"}],"answer":"D"},{"id":28,"question":"蛋白經攪拌後最易與其他原料拌合且進爐後膨脹力最好的階段是？","options":[{"value":"A","label":"起泡狀態"},{"value":"B","label":"濕性發泡"},{"value":"C","label":"乾性發泡"},{"value":"D","label":"棉花狀態"}],"answer":"B"},{"id":29,"question":"製作某一烘焙食品，麵粉用量為22 公斤，乳化劑用量為0.33 公斤，請問乳化劑 所佔烘焙百分比為？","options":[{"value":"A","label":"1.2％"},{"value":"B","label":"1.5％"},{"value":"C","label":"1.8％"},{"value":"D","label":"2％"}],"answer":"B"},{"id":30,"question":"麵包製程中之醒麵即是？","options":[{"value":"A","label":"基本發酵"},{"value":"B","label":"延續發酵"},{"value":"C","label":"中間發酵"},{"value":"D","label":"滾圓"}],"answer":"C"},{"id":31,"question":"一般乳沫類蛋糕使用蛋白的溫度最好為","options":[{"value":"A","label":"17～22℃"},{"value":"B","label":"26～30℃"},{"value":"C","label":"31～35℃"},{"value":"D","label":"36～40℃"}],"answer":"A"},{"id":32,"question":"麵包麵糰的中間發酵時間約為（ ）即可？","options":[{"value":"A","label":"25～30 分鐘"},{"value":"B","label":"8～15 分鐘"},{"value":"C","label":"3～5 分鐘"},{"value":"D","label":"0 分鐘"}],"answer":"B"},{"id":33,"question":"烤焙用具（塑膠製品除外）貯放前最好之處理方式？","options":[{"value":"A","label":"用抹布擦淨"},{"value":"B","label":"洗淨烤乾"},{"value":"C","label":"洗淨用抹布擦乾"},{"value":"D","label":"洗後自然涼乾"}],"answer":"B"},{"id":34,"question":"奶油空心餅成品底部凹陷大，是因為在製作時？","options":[{"value":"A","label":"技術好"},{"value":"B","label":"烤盤油擦太多"},{"value":"C","label":"底火太弱"},{"value":"D","label":"上火太強"}],"answer":"B"},{"id":35,"question":"為使奶油空心餅在烤焙後表皮品質及膨大性良好，在進烤爐前可噴（ ） 於麵糊表面？","options":[{"value":"A","label":"油"},{"value":"B","label":"膨脹劑"},{"value":"C","label":"蛋白"},{"value":"D","label":"水"}],"answer":"D"},{"id":36,"question":"酵母油炸甜圈餅（道納司，doughnuts）的麵糰應攪拌至？","options":[{"value":"A","label":"拾起階段"},{"value":"B","label":"捲起階段"},{"value":"C","label":"麵筋擴展階段"},{"value":"D","label":"麵筋斷裂階段"}],"answer":"C"},{"id":37,"question":"派皮整型時，使用防黏之麵粉應使用","options":[{"value":"A","label":"低筋麵粉"},{"value":"B","label":"中筋麵粉"},{"value":"C","label":"高筋麵粉"},{"value":"D","label":"洗筋粉"}],"answer":"C"},{"id":38,"question":"烘焙鬆餅（起酥，puff pastry），除了以蒸氣控制表皮外，應先使用（ ） 烤焙？","options":[{"value":"A","label":"大火"},{"value":"B","label":"小火"},{"value":"C","label":"上火"},{"value":"D","label":"下火"}],"answer":"A"},{"id":39,"question":"酵母油炸甜圈餅（酵母道納司，yeast doughnuts）製作時，若要控制成金黃色澤產 品時，在製程上應注意？","options":[{"value":"A","label":"適當的發酵"},{"value":"B","label":"過度的發酵"},{"value":"C","label":"低溫長時間之油炸"},{"value":"D","label":"較硬之麵糰"}],"answer":"A"},{"id":40,"question":"烤焙麵糰極軟的小西餅時最好使用（ ）烤盤（鋼帶）？","options":[{"value":"A","label":"細網狀"},{"value":"B","label":"粗網狀"},{"value":"C","label":"平板狀"},{"value":"D","label":"圓孔狀"}],"answer":"C"},{"id":41,"question":"硬質甜餅乾成型時為求印模圖案清晰，在配方中可加入（ ）改善？","options":[{"value":"A","label":"沙拉油"},{"value":"B","label":"玉米澱粉"},{"value":"C","label":"膨脹劑"},{"value":"D","label":"粗砂糖"}],"answer":"B"},{"id":42,"question":"鬆餅（起酥，puff pastry）的製作下列何者影響膨脹度最大？","options":[{"value":"A","label":"糖"},{"value":"B","label":"蛋"},{"value":"C","label":"麵粉"},{"value":"D","label":"裹入用油脂"}],"answer":"D"},{"id":43,"question":"酵母油炸甜圈餅（酵母道納司，yeast doughnuts）所使用的配方，大致上與甜麵包 類似，然在為求成品之品質與形狀之完整性，則酵母油炸甜圈餅（酵母道納司， yeast doughnuts）配方中的糖與油脂，較甜麵包配方？","options":[{"value":"A","label":"高"},{"value":"B","label":"少"},{"value":"C","label":"相等"},{"value":"D","label":"視情況而定"}],"answer":"B"},{"id":44,"question":"法國麵包（硬式麵包）常用之烤焙溫度為多少？","options":[{"value":"A","label":"230℃"},{"value":"B","label":"200℃"},{"value":"C","label":"170℃"},{"value":"D","label":"150℃"}],"answer":"A"},{"id":45,"question":"下列那一種麵包，烤焙時間最短？","options":[{"value":"A","label":"800 公克的帶蓋土司"},{"value":"B","label":"450 公克的圓頂葡萄乾土司"},{"value":"C","label":"350 公克的法國麵包"},{"value":"D","label":"90 公克包餡的甜麵包"}],"answer":"D"},{"id":46,"question":"低成分重奶油蛋糕，採用何種攪拌方法為宜？","options":[{"value":"A","label":"麵粉油脂拌合法"},{"value":"B","label":"糖油拌合法"},{"value":"C","label":"兩步拌合法"},{"value":"D","label":"糖水拌合法"}],"answer":"B"},{"id":47,"question":"何種攪拌方法能節省人工和縮短攪拌時間？","options":[{"value":"A","label":"糖油拌合法"},{"value":"B","label":"麵粉油脂拌合法"},{"value":"C","label":"糖水拌合法"},{"value":"D","label":"直接法"}],"answer":"D"},{"id":48,"question":"麵糊類蛋糕的麵糊溫度應該是（ ）在這個溫度的麵糊所烤出來的蛋糕， 體積最大，內部組織細膩？","options":[{"value":"A","label":"10℃"},{"value":"B","label":"15℃"},{"value":"C","label":"22℃"},{"value":"D","label":"30℃"}],"answer":"C"},{"id":49,"question":"下列何種蛋糕在烘焙時不可擦防粘油脂？","options":[{"value":"A","label":"海綿蛋糕"},{"value":"B","label":"重奶油蛋糕"},{"value":"C","label":"輕奶油蛋糕"},{"value":"D","label":"天使蛋糕"}],"answer":"D"},{"id":50,"question":"菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其原因為？","options":[{"value":"A","label":"不需最後發酵"},{"value":"B","label":"需較高濕度發酵"},{"value":"C","label":"需較高溫度發酵"},{"value":"D","label":"避免高濕高溫 的發酵使菠蘿皮融解而化開"}],"answer":"D"},{"id":51,"question":"50～100 公克左右的甜麵包，其烤焙應？","options":[{"valu function render(){quiz.innerHTML='';questions.forEach((q,i)=>{const sec=document.createElement('section');sec.className='panel';sec.id='q'+(i+1);let html=`<div class="qhead"><span class="qnum">第 ${i+1} 題／80 題</span><br>${q.question}</div>`;if(q.id===3)html+=`<img class="diagram" alt="第3題擠製小西餅烤盤排列圖" src="${q3img}">`;html+='<div class="options">';q.options.forEach(o=>{html+=`<label class="opt ${answers[i]===o.value?'selected':''}"><input type="radio" name="q${i}" value="${o.value}" ${answers[i]===o.value?'checked':''} ${submitted?'disabled':''}><span><b>${o.value}.</b> ${o.label}</span></label>`});html+='</div>';sec.innerHTML=html;quiz.appendChild(sec);sec.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{answers[i]=inp.value;updateProgress();renderSelection(sec,i)}));});updateProgress();}
function renderSelection(sec,i){sec.querySelectorAll('.opt').forEach(l=>{const inp=l.querySelector('input');l.classList.toggle('selected',inp.checked)});}
function updateProgress(){let n=answers.filter(Boolean).length;document.getElementById('progressText').textContent=`已作答 ${n} / 80 題`;document.getElementById('bar').style.width=(n/80*100)+'%';}
document.getElementById('submit').onclick=()=>{if(submitted)return;let n=answers.filter(Boolean).length;if(n<80){if(!confirm(`目前尚有 ${80-n} 題未作答，確定要交卷嗎？未作答題目將計為錯誤。`))return;}if(!confirm('交卷後答案將鎖定，確定交卷？'))return;submitted=true;render();document.getElementById('submit').disabled=true;document.getElementById('locked').classList.remove('hidden');document.getElementById('locked').scrollIntoView({behavior:'smooth'});};
document.getElementById('unlock').onclick=()=>{if(!submitted){document.getElementById('pwmsg').textContent='尚未交卷。';return;}if(document.getElementById('pw').value!=='1234'){document.getElementById('pwmsg').textContent='密碼錯誤，請重新輸入。';return;}showResults();};
function showResults(){let wrong=[];questions.forEach((q,i)=>{if(answers[i]!==correct[i])wrong.push({q,i})});let score=(80-wrong.length)*1.25;document.getElementById('score').innerHTML=`<div class="score">${score.toFixed(2)} / 100 分</div><div>答對 ${80-wrong.length} 題；答錯 ${wrong.length} 題；未作答 ${answers.filter(a=>!a).length} 題。</div>`;let box=document.getElementById('wrongList');if(!wrong.length){box.innerHTML='<p class="correct">全部答對，沒有錯誤題目。</p>';}else{box.innerHTML=wrong.map(({q,i})=>{const chosen=q.options.find(o=>o.value===answers[i]);const right=q.options.find(o=>o.value===correct[i]);return `<div class="wrong"><b>第 ${i+1} 題：${q.question}</b><div class="correct-answer"><strong>正確答案：</strong>${right && right.label ? right.label : (i===2 ? '請參照本題選項圖片（正確圖示為 A 選項）' : '答案內容未提供')}</div></div>`}).join('');}document.getElementById('results').classList.remove('hidden');document.getElementById('results').scrollIntoView({behavior:'smooth'});document.getElementById('locked').classList.add('hidden');}
document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;function reset(){if(!confirm('確定清除本次答案並重新測驗？'))return;answers=Array(80).fill('');submitted=false;document.getElementById('submit').disabled=false;document.getElementById('locked').classList.add('hidden');document.getElementById('results').classList.add('hidden');document.getElementById('pw').value='';document.getElementById('pwmsg').textContent='';render();window.scrollTo({top:0,behavior:'smooth'});}document.getElementById('print').onclick=()=>window.print();
render();
</script></body></html>
