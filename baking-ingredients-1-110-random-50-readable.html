},{"n":103,"q":"發粉的定義是由小蘇打及酸性鹽混合攪拌而成的一種膨大劑，所產生的二氧化碳量不能低於發粉重量的？","opts":["8％","10％","12％","15％"],"ans":2},{"n":104,"q":"在常溫時不釋出氣體，須於烤焙時才釋出二氧化碳氣體，為？","opts":["快性反應發粉","次快性反應發粉","雙重反應發粉","慢性反應發粉"],"ans":3},{"n":105,"q":"製作蛋糕時，為有效地控制釋出均勻且有規則的氣體，常使用？","opts":["快性發粉","慢性發粉","雙重反應發粉","小蘇打"],"ans":2},{"n":106,"q":"椰子粉的脂肪含量約為？","opts":["20％","40％","60％","80％"],"ans":2},{"n":107,"q":"製作棉花糖時，加入下列何種具有打發起泡特性之膠凍原料？","opts":["果膠","洋菜粉","動物膠","玉米澱粉"],"ans":2},{"n":108,"q":"下列何種膠凍原料需添加適當比例的糖與酸，才能形成膠體？","opts":["動物膠","果膠","洋菜粉","明膠粉"],"ans":1},{"n":109,"q":"製作轉化糖漿，以下列何者為原料，加水溶解再加入稀酸、加熱使之轉化的液體糖？","opts":["砂糖","麥芽糖","葡萄糖","果糖"],"ans":0},{"n":110,"q":"製作海綿蛋糕添加乳化起泡劑目的為？","opts":["增加麵糊的安定性","增加麵糊的甜度","降低麵粉筋性","增加蛋糕含水量"],"ans":0}];
const LABELS=["①","②","③","④"];
const STORAGE_KEY="baking_ingredients_1_110_random50_no_retake_v2";
let state={started:false,finished:false,order:[],current:0,answers:{},score:0,wrong:[]};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function startExam(){state={started:true,finished:false,order:shuffle(QUESTIONS.map((_,i)=>i)).slice(0,50),current:0,answers:{},score:0,wrong:[]};save();render();}
function render(){
 const q=QUESTIONS[state.order[state.current]],selected=state.answers[state.current];
 $("start").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
 $("status").textContent=`第 ${state.current+1}／50 題｜已作答 ${Object.keys(state.answers).length}／50`;
 $("quiz").innerHTML=`<div class="qhead"><span>原題第 ${q.n} 題</span><span>${state.current+1}／50</span></div><div class="progress"><div class="fill" style="width:${(state.current+1)/50*100}%"></div></div><div class="question">${esc(q.q)}</div><button class="btn speak" id="speakBtn">🔊 朗讀本題</button><div>${q.opts.map((o,i)=>`<div class="option ${selected===i?"selected":""}" role="button" tabindex="0" data-i="${i}">${LABELS[i]} ${esc(o)}</div>`).join("")}</div><div class="nav"><button class="btn prev" id="prev" ${state.current===0?'disabled':''}>← 上一題</button><button class="btn next" id="next">${state.current===49?'檢查作答':'下一題 →'}</button></div><button class="btn submit hidden" id="submit">交卷</button><div class="small">答案可以修改；完成全部 50 題後才能交卷。</div>`;
 document.querySelectorAll('.option').forEach(btn=>{
  const choose=()=>{state.answers[state.current]=Number(btn.dataset.i);save();render();};
  btn.addEventListener('click',choose);
  btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});
 });
 $('speakBtn').onclick=()=>{
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const qText=`題目：${q.q}。${q.opts.map((o,i)=>`選項${LABELS[i]}${o}`).join('。')}。`;
    const u=new SpeechSynthesisUtterance(qText);
    u.lang='zh-TW';
    u.rate=0.9;
    window.speechSynthesis.speak(u);
  } else {
    alert('此瀏覽器不支援內建朗讀功能，請使用手機的螢幕朗讀／朗讀選取功能。');
  }
 };
 $("prev").onclick=()=>{if(state.current>0){state.current--;save();render();window.scrollTo(0,0);}};
 $("next").onclick=()=>{if(state.answers[state.current]===undefined){alert('請先作答本題。');return;}if(state.current<49){state.current++;save();render();window.scrollTo(0,0);}else{if(Object.keys(state.answers).length===50){$('submit').classList.remove('hidden');alert('50 題已全部作答，請按「交卷」。');}else{alert('尚有未作答題目，請完成後再交卷。');}}};
 $("submit").onclick=finish;
}
function finish(){if(Object.keys(state.answers).length!==50){alert('尚未完成全部 50 題，不能交卷。');return;}let score=0,wrong=[];state.order.forEach((qi,i)=>{const q=QUESTIONS[qi];if(state.answers[i]===q.ans)score++;else wrong.push({n:q.n,q:q.q,answer:q.opts[q.ans]});});state.score=score;state.wrong=wrong;state.finished=true;save();showResult();}
function showResult(){$("start").classList.add('hidden');$("quiz").classList.add('hidden');$("result").classList.remove('hidden');$("status").textContent='測驗完成｜結果已鎖定';const wrongHtml=state.wrong.length===0?"<div class='notice'><strong>50 題全部答對！</strong></div>":`<div class="wrong-list"><h3>錯誤題目整理（共 ${state.wrong.length} 題）</h3>${state.wrong.map((x,i)=>`<div class="wrong-item"><div class="wrong-q">${i+1}．原題第 ${x.n} 題：${esc(x.q)}</div><div><strong>正確答案：</strong>${esc(x.answer)}</div></div>`).join('')}</div>`;$("result").innerHTML=`<div class="start-title">測驗完成</div><div class="score">${state.score}／50</div><div>答對率：${Math.round(state.score/50*100)}%</div>${wrongHtml}<div class="notice" style="margin-top:18px"><strong>本次測驗已完成，學生不能自行重新測驗。</strong></div>`;}
$("startBtn").onclick=startExam;
const saved=load();
if(saved&&saved.finished){state=saved;showResult();}else if(saved&&saved.started){state=saved;render();}
</script>
