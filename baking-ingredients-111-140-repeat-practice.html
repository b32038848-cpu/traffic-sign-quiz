<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>烘焙食品丙級｜原料111～140｜重複練習</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{user-select:text;-webkit-user-select:text}
.wrap{max-width:760px;margin:auto;padding:12px 12px 70px}
header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20;padding:12px 0}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:#667085}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.start-title{font-size:24px;font-weight:900;margin-bottom:10px}.notice{line-height:1.7;background:#f7f8fa;border-radius:12px;padding:14px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:17px;cursor:pointer}.primary{background:#222;color:#fff}.secondary{background:#eceff2;color:#222}.full{width:100%}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:#222;transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;color:#667085;margin-bottom:8px}.question{font-size:21px;font-weight:900;line-height:1.55;margin:10px 0 14px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d7dce2;border-radius:12px;padding:14px;margin:10px 0;font-size:18px;line-height:1.5;cursor:pointer;touch-action:manipulation;user-select:text;-webkit-user-select:text}
.option:hover{background:#f7f8fa}.option.correct{border:2px solid #198754;background:#eaf7ef}.option.wrong{border:2px solid #dc3545;background:#fff0f1}.option:disabled{opacity:1;cursor:default}
.speak{width:100%;background:#eef1f4;color:#222;margin-bottom:10px}.stop{width:100%;background:#444;color:#fff;margin-bottom:10px}
.feedback{min-height:54px;padding:13px 14px;border-radius:12px;margin-top:14px;font-size:17px;line-height:1.6;background:#f7f8fa}.feedback.ok{background:#eaf7ef}.feedback.no{background:#fff0f1}.answer{font-weight:900}
.controls{display:flex;gap:10px;margin-top:16px}.controls .btn{flex:1}.result{text-align:center}.score{font-size:44px;font-weight:900;margin:4px 0 8px}.small{font-size:13px;color:#697586;line-height:1.65;margin-top:12px}.hidden{display:none!important}
.wrong-list{text-align:left;margin-top:18px}.wrong-item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:9px 0;line-height:1.6}
@media(max-width:480px){.wrap{padding:10px 10px 60px}.card{padding:15px}.question{font-size:20px}.option{font-size:17px;padding:12px}.start-title{font-size:22px}}
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0"><h1>烘焙食品丙級｜原料111～140</h1><div class="sub" id="status">30題重複練習｜含手機報讀</div></div></header>
<main class="wrap">
<section id="start" class="card">
<div class="start-title">原料111～140 重複練習</div>
<div class="notice">
共 <strong>30 題</strong>，每次練習會重新打亂題目順序與選項順序。<br>
答題後立即顯示對錯與正確答案。<br>
可以按「🔊 朗讀本題」聽題目與四個選項，也可以停止朗讀。<br>
完成後會顯示本次分數與答錯題目；按「重新練習」即可再次挑戰。
</div>
<button class="btn primary full" style="margin-top:14px" id="startBtn">開始練習</button>
</section>
<section id="quiz" class="card hidden"></section>
<section id="result" class="card hidden result"></section>
</main>
<script>
const BANK=[
{n:111,q:'小麥之橫斷面呈粉質狀者為何？',o:['高筋麵粉','中筋麵粉','粉心麵粉','低筋麵粉'],a:3},
{n:112,q:'小麥之橫斷面呈玻璃質狀者為何？',o:['高筋麵粉','中筋麵粉','粉心麵粉','低筋麵粉'],a:0},
{n:113,q:'麵粉蛋白質是屬於部分不完全蛋白質，因為其胺基酸內缺少了一種必需胺基酸為？',o:['甲硫胺酸','胱胺酸','半胱胺酸','離胺酸'],a:3},
{n:114,q:'下列何種胺基酸內含有硫氫根（－SH），並具有還原特性，以影響麵糰之性質？',o:['麩胺酸','甘胺酸','半胱胺酸','離胺酸'],a:2},
{n:115,q:'小麥胚芽中含有下列何種物質，其含有硫氫根（－SH），會減少麵筋彈性，使麵糰發粘？',o:['維生素E','礦物質','油脂','麩胱甘'],a:3},
{n:116,q:'可以得到麵粉之吸水量、攪拌時間及攪拌耐力之儀器設備為？',o:['麵粉酵素活性測定儀（Amylograph）','連續溫度黏度測定儀（Viscosgraph）','麵糰拉力特性測定儀（Extensograph）','麵糰攪拌特性測定儀（Farinograph）'],a:3},
{n:117,q:'測定低筋粉或軟麥麵粉中膠性粘度之儀器設備為？',o:['麵粉沉降係數測定儀（Falling Number）','連續溫度黏度測定儀（Viscosgraph）','麵糰拉力特性測定儀（Extensograph）','麵糰攪拌特性測定儀（Farinograph）'],a:1},
{n:118,q:'測定麵筋之伸張力及伸張阻力等品質之儀器設備為？',o:['麵粉酵素活性測定儀（Amylograph）','連續溫度黏度測定儀（Viscosgraph）','麵糰拉力特性測定儀（Extensograph）','麵糰攪拌特性測定儀（Farinograph）'],a:2},
{n:119,q:'測定麵粉中之液化酵素的儀器設備為？',o:['麵粉酵素活性測定儀（Amylograph）','連續溫度黏度測定儀（Viscosgraph）','麵糰拉力特性測定儀（Extensograph）','麵糰攪拌特性測定儀（Farinograph）'],a:0},
{n:120,q:'D.E.值（葡萄糖當量）30～50之澱粉糖漿，其組成成分為？',o:['蔗糖','果糖','葡萄糖','糊精、麥芽糖及葡萄糖之混合物'],a:3},
{n:121,q:'以澱粉為原料經完全水解 D.E.值（葡萄糖當量）為100之糖漿產品，其組成成分為？',o:['蔗糖','果糖','葡萄糖','澱粉及葡萄糖之混合物'],a:2},
{n:122,q:'下列何種糖吸濕性最小？',o:['砂糖','果糖','蜂蜜','轉化糖'],a:0},
{n:123,q:'有關糖對麵包品質之影響，下列何者有誤？',o:['可防止麵包變硬','是一種柔性材料','烤焙時著色快','增加風味'],a:0},
{n:124,q:'下列何種糖，酵母發酵產生二氧化碳及酒精之速率最慢？',o:['砂糖','果糖','葡萄糖','麥芽糖'],a:3},
{n:125,q:'新鮮雞蛋其 pH 值約為？',o:['5.2','6.5','7.6','9.0'],a:2},
{n:126,q:'雞蛋內含有下列何種酵素，可以殺死多種微生物，增長貯存時間？',o:['蛋白質分解酵素','脂肪分解酵素','澱粉分解酵素','溶菌酵素'],a:3},
{n:127,q:'製造乾燥蛋白粉時，為避免於乾燥時產生變色反應，必須去除蛋白內之？',o:['葡萄糖','脂肪','蛋白質','礦物質'],a:0},
{n:128,q:'蛋經貯藏後蛋白會釋出下列何種氣體，使其 pH 值升高？',o:['氫氣','氮氣','組織胺','二氧化碳'],a:3},
{n:129,q:'有關碳酸氫鈉，下列敘述何者錯誤？',o:['是一種化學膨大劑','亦稱小蘇打','其化學分子式為 NaHCO₃','是一種酸性鹽'],a:3},
{n:130,q:'有關發粉，下列敘述何者錯誤？',o:['以碳酸鈉為主原料','由各種不同的酸性鹽混合而成','加澱粉或麵粉為填充劑','俗稱為泡打粉或發泡粉'],a:0},
{n:131,q:'下列何者為慢性發粉之主要成分？',o:['酸性焦磷酸鹽','酸性磷酸鈣','碳酸氫鈉','碳酸鈉'],a:0},
{n:132,q:'小西餅在烘焙過程中，下列何者不是扮演膨脹的因素？',o:['碳酸氫銨','碳酸氫鈉','酵母','水'],a:3},
{n:133,q:'下列何者製作時需要添加酵母發酵？',o:['貓舌小西餅','瑪琍餅乾','蘇打餅乾','椰子餅乾'],a:2},
{n:134,q:'油炸用食用油之總極性化合物（total polar compounds）含量達百分之多少以上時，不得再予使用，應全部更換新油？',o:['25％','30％','40％','45％'],a:0},
{n:135,q:'製作食用豆漿，那一個不是正常步驟？',o:['水中浸泡約3至8個小時','將黃豆磨碎','用紗布分離豆渣','生豆漿不必再加熱'],a:3},
{n:136,q:'全豆豆漿含有的成份中那一項是錯的？',o:['蛋白質','油脂','乳糖','鈣'],a:2},
{n:137,q:'豆漿的鈣含量和牛奶比較，是？',o:['低','高','一樣','無法比較'],a:0},
{n:138,q:'乳糖不耐症的人喝那種飲料不會產生副作用？',o:['全脂牛奶','豆漿','脫脂牛奶','巧克力牛奶'],a:1},
{n:139,q:'市售椰奶包裝及脂肪含量那一項是錯的？',o:['鋁箔紙盒裝，脂肪含量比較低','罐裝，脂肪含量比較低','罐裝，脂肪含量比較高','包裝不一樣脂肪含量都一樣'],a:1},
{n:140,q:'下列對椰奶或椰漿（Coconut Milk）及椰子鮮奶油（Coconut Cream）敘述何者為非？',o:['椰奶，水和椰肉的比例約在1：1，如牛乳一樣的液狀','椰子鮮奶油，水和椰肉的比例約在1：4，脂肪含量較高、質地濃稠似鮮奶油','椰奶在開封前是常溫保存','椰漿，水和椰肉的比例約在1：4'],a:3}
];
let order=[],idx=0,score=0,answered=false,wrong=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function speak(text,rate=.88){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀，請使用手機 Chrome 或 Safari。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=rate;u.pitch=1;speechSynthesis.speak(u)}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function speakCurrent(){const q=BANK[order[idx]],opts=window.currentOptions;speak(`第${q.n}題。${q.q}。選項一：${opts[0]}。選項二：${opts[1]}。選項三：${opts[2]}。選項四：${opts[3]}。`)}
function start(){stopSpeak();order=shuffle(BANK.map((_,i)=>i));idx=0;score=0;answered=false;wrong=[];showStart(false);render()}
function showStart(show){$('start').classList.toggle('hidden',!show);$('quiz').classList.add('hidden');$('result').classList.add('hidden')}
function render(){const q=BANK[order[idx]];const opts=shuffle(q.o);window.currentOptions=opts;const pct=(idx/BANK.length)*100;$('status').textContent=`第 ${idx+1}／${BANK.length} 題｜目前得分 ${score}`;$('quiz').classList.remove('hidden');$('result').classList.add('hidden');$('quiz').innerHTML=`<div class="qhead"><span>題庫第 ${q.n} 題</span><span>${idx+1}／${BANK.length}</span></div><div class="progress"><div class="fill" style="width:${pct}%"></div></div><div class="question">${esc(q.q)}</div><button class="btn speak" id="speakBtn">🔊 朗讀本題（題目＋選項）</button><button class="btn stop" id="stopBtn">⏹ 停止朗讀</button><div id="opts">${opts.map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback">請選擇答案。</div><div class="controls"><button class="btn secondary" id="nextBtn" disabled>${idx===BANK.length-1?'看結果':'下一題'}</button><button class="btn secondary" id="restartBtn">重新練習</button></div><div class="small">每次重新練習會重新打亂30題與選項順序。</div>`;
$('speakBtn').onclick=speakCurrent;$('stopBtn').onclick=stopSpeak;$('restartBtn').onclick=start;
document.querySelectorAll('.option').forEach((b,i)=>b.onclick=()=>choose(i));
$('nextBtn').onclick=next;
}
function choose(sel){if(answered)return;answered=true;const q=BANK[order[idx]],opts=window.currentOptions,correct=opts[sel]===q.o[q.a];document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(opts[i]===q.o[q.a])b.classList.add('correct');if(i===sel&&!correct)b.classList.add('wrong')});const fb=$('feedback');if(correct){score++;fb.className='feedback ok';fb.innerHTML=`✅ 答對！<span class="answer">答案：${esc(q.o[q.a])}</span>`}else{wrong.push({n:q.n,q:q.q,chosen:opts[sel],answer:q.o[q.a]});fb.className='feedback no';fb.innerHTML=`❌ 答錯。<span class="answer">正確答案：${esc(q.o[q.a])}</span>`}$('nextBtn').disabled=false}
function next(){if(!answered)return;if(idx===BANK.length-1){showResult();return}idx++;answered=false;render()}
function showResult(){stopSpeak();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const rate=Math.round(score/BANK.length*100);$('status').textContent=`測驗完成｜${score}/${BANK.length}`;$('result').innerHTML=`<div class="result-title">作答完成</div><div class="score">${score}／${BANK.length}</div><div>答對率：${rate}%</div><div class="small">你可以重新練習，題目與選項會重新打亂。</div><button class="btn primary full" style="margin-top:14px" id="again">🔄 重新練習</button>${wrong.length?`<div class="wrong-list"><h3>答錯題目</h3>${wrong.map(w=>`<div class="wrong-item"><b>第${w.n}題</b><br>${esc(w.q)}<br>你的答案：${esc(w.chosen)}<br><span class="answer">正確答案：${esc(w.answer)}</span></div>`).join('')}</div>`:'<div style="margin-top:16px;font-weight:900">🎉 30題全部答對！</div>'}`;$('again').onclick=start}
$('startBtn').onclick=start;
showStart(true);
</script>
</body>
</html>
