<style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:900px;margin:auto}.panel{background:white;border:1px solid #d9e1e8;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px #1323330a}h1{font-size:clamp(23px,4vw,32px);margin:0 0 10px}.muted{color:#596879}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.btn{border:0;border-radius:9px;padding:11px 16px;background:#205a75;color:white;font-size:15px;cursor:pointer}.btn.secondary{background:#e8eef2;color:#20313d}.btn:disabled{opacity:.45;cursor:not-allowed}.progress{height:8px;background:#e7edf1;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#28718d;width:0}.qtitle{font-size:19px;line-height:1.65;margin:8px 0 16px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;border:1px solid #ccd6de;border-radius:10px;background:white;padding:13px 14px;font-size:16px;line-height:1.5;cursor:pointer;color:#182a36}.opt:hover{background:#f5f9fb}.opt.correct{border-color:#27834f;background:#eaf7ef}.opt.wrong{border-color:#bf4545;background:#fff0f0}.feedback{margin-top:14px;padding:13px;border-radius:9px;background:#f0f4f6;line-height:1.6}.hidden{display:none}.summary h2{margin-top:0}.wrongitem{border-top:1px solid #e2e7eb;padding:12px 0;line-height:1.6}.tag{font-size:13px;color:#586a77}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{background:#eef3f6;border-radius:99px;padding:6px 10px;font-size:14px}.note{font-size:14px;color:#5b6872;line-height:1.6}
</style></head><body><main class="wrap">
<section class="panel"><h1>工作項目三｜101–140 題重複測驗</h1><p class="muted">共 40 題，依題庫原題與答案製作。選擇後立即顯示正確答案與解析提示；完成後可重新測驗。</p><div class="top"><span class="pill" id="counter">尚未開始</span><span class="pill" id="score">答對 0 題</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="actions"><button class="btn" id="start">開始測驗</button><button class="btn secondary" id="readAll" disabled>朗讀本題</button><button class="btn secondary" id="stop" disabled>停止朗讀</button></div></section>
<section class="panel hidden" id="quiz"><div class="top"><span class="tag" id="qno"></span><span class="tag" id="answered"></span></div><div class="qtitle" id="question"></div><div class="opts" id="options"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="next" disabled>下一題</button></div></section>
<section class="panel summary hidden" id="summary"><h2>測驗結果</h2><div class="top"><span class="pill" id="finalscore"></span><span class="pill" id="accuracy"></span></div><div id="wronglist"></div><div class="actions"><button class="btn" id="again">重新測驗</button></div></section>
<p class="note">題目及答案依據你提供的《工作項目三.pdf》工作項目 03：產品製作第 101–140 題。語音功能需瀏覽器支援中文語音。</p>
</main><script>
const BANK=[{"no": 101, "question": "下列那一項非麵包滾圓的目的？", "options": ["鬆弛麵筋使麵糰易於整型", "使麵糰表面光滑不易粘手", "使麵糰易於保住二氧化碳", "使氣體均勻分佈"], "answer": 0}, {"no": 102, "question": "調整配方時，下列何者材料不會使麵包麵糰較軟？", "options": ["水", "糖", "油", "麵粉"], "answer": 3}, {"no": 103, "question": "調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？", "options": ["水", "糖", "油", "麵粉"], "answer": 0}, {"no": 104, "question": "法國麵包（硬式麵包）常用之烤焙溫度為多少？", "options": ["230℃", "200℃", "170 ℃", "150℃"], "answer": 0}, {"no": 105, "question": "800 公克的帶蓋土司在正常的狀態下，給予 200℃烤溫，烤焙所需時間 為？", "options": ["15～20 分", "35～40 分", "55～60 分", "1 小時以上"], "answer": 1}, {"no": 106, "question": "下列那一種麵包，烤焙時間最短？", "options": ["800 公克的帶蓋土司", "450 公克的圓頂葡萄乾土司", "350 公克的法國麵包", "90 公克包餡的甜麵包"], "answer": 3}, {"no": 107, "question": "下列那一種麵包必需使用蒸氣烤爐？", "options": ["甜麵包", "丹麥麵包", "硬式麵包", "葡萄乾麵包"], "answer": 2}, {"no": 108, "question": "圓烤盤，其直徑為 22 公分、高 5 公分其容積為？", "options": ["1899.7 立方公分", "1997.7 立方公分", "7598.8 立方公分", "110 立方公分"], "answer": 0}, {"no": 109, "question": "長方型烤盤，其長為 30 公分、寬為 22 公分、高為 5 公分，其容積為？", "options": ["3300 平方公分", "3300 立方公分", "660 平方公分", "660 立方公分"], "answer": 1}, {"no": 110, "question": "低成分重奶油蛋糕，採用何種攪拌方法為宜？", "options": ["麵粉油脂拌合法", "糖油拌合法", "兩步拌合法", "糖水拌合法"], "answer": 1}, {"no": 111, "question": "何種攪拌方法能節省人工和縮短攪拌時間？", "options": ["糖油拌合法", "麵粉油脂拌合法", "糖水拌合法", "直接法"], "answer": 3}, {"no": 112, "question": "麵糊類蛋糕的麵糊溫度應該是？", "options": ["10℃", "15℃", "22℃", "30℃ 在這個溫 度的麵糊所烤出來的蛋糕，體積最大，內部組織細膩"], "answer": 2}, {"no": 113, "question": "下列何種蛋糕在烘焙時不可擦防粘油脂？", "options": ["海綿蛋糕", "重奶油蛋糕", "輕奶油蛋糕", "天使蛋糕"], "answer": 3}, {"no": 114, "question": "理想的海綿蛋糕麵糊比重為？", "options": ["0.46", "0.56", "0.66", "0.76 左右"], "answer": 0}, {"no": 115, "question": "利用糖油拌合法製作丹麥小西餅(Danish cookies)，材料中的麵粉應在最後 加入，輕輕拌勻，其主要的原因為？", "options": ["容易吸收水分", "好控制麵粉量", "避免攪拌出筋", "防止破壞打發的氣泡"], "answer": 2}, {"no": 116, "question": "菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其 原因為？", "options": ["不需最後發酵", "需較高濕度發酵", "需較高溫度發酵", "避免高濕高溫的發酵使菠蘿皮融解而化開"], "answer": 3}, {"no": 117, "question": "50～100 公克左右的甜麵包，其烤焙應？", "options": ["上火為主，下火為輔", "只用上火", "下火為主，上火為輔", "只用下火"], "answer": 0}, {"no": 118, "question": "以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？", "options": ["硬", "粗糙", "細膩", "沒影響"], "answer": 1}, {"no": 119, "question": "戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？", "options": ["組織較軟", "拌入其他材料時易消泡", "體積較大", "不影響蛋糕品質"], "answer": 1}, {"no": 120, "question": "可以減少海綿蛋糕出爐時收縮的程度為？", "options": ["選用麵筋較強的麵粉", "烤焙 時間避免過久", "烤盤擦油", "減少配方中的用油量"], "answer": 1}, {"no": 121, "question": "添加下列那一項材料不會增加蛋糕的柔軟度？", "options": ["糖", "油", "蛋黃", "麵粉"], "answer": 3}, {"no": 122, "question": "一般麵糊類蛋糕烤熟與否的判斷方法？", "options": ["以探針試探或以手輕拍", "以顏色判斷即可", "時間一到即可出爐", "敲烤盤邊聽聲音判斷"], "answer": 0}, {"no": 123, "question": "切割蛋糕用的刀子，下列那一種方式既可防止細菌污染又可達到切面整齊 的要求？", "options": ["洗淨使用", "以布擦拭後使用", "浸在沸水中燙一次，切一次", "在沸水中燙一次用布擦一下使用"], "answer": 2}, {"no": 124, "question": "煮製檸檬布丁餡時檸檬汁在？", "options": ["與水一道加入", "與玉米澱粉拌勻加入", "糖水部分煮沸後加入", "待餡煮好後加入拌勻"], "answer": 3}, {"no": 125, "question": "製作丹麥麵包整形宜在？", "options": ["近烤爐邊", "一般的工作間", "在溫度較低的場所", "與溫度無關，在那裡整形皆可"], "answer": 2}, {"no": 126, "question": "麵粉的 pH 值變小時，小西餅的體積？", "options": ["不變", "變大", "變小", "變厚"], "answer": 2}, {"no": 127, "question": "餅乾用麵粉，若酸度偏高時，配方中應提高？", "options": ["小蘇打", "水", "氧化劑", "油脂 的用量"], "answer": 0}, {"no": 128, "question": "蘇打餅乾成品的 pH 值比一般奶油小西餅為？", "options": ["高", "相同", "低", "測不出 來"], "answer": 0}, {"no": 129, "question": "下列那種因素不會影響麵包攪拌時間？", "options": ["攪拌速度不同", "配方不同", "攪拌機型式不同", "攪拌人員不同"], "answer": 3}, {"no": 130, "question": "正常情況下，甜麵包麵糰之攪拌時間，應比白土司麵包？", "options": ["長", "短", "一 樣", "不受限制"], "answer": 0}, {"no": 131, "question": "麵糰整型時，如經過二道滾輪之整型機，正常第一道滾輪與第二道滾輪之 間隙比為？", "options": ["6:1", "4:1", "2:1", "1:1"], "answer": 2}, {"no": 132, "question": "下列那一項因素不會影響麵包之基本發酵時間？", "options": ["酵母量", "鹽", "麵糰溫 度", "容器"], "answer": 3}, {"no": 133, "question": "下列何者不是影響烘焙食品烤焙條件設定之因素？", "options": ["產品種類", "產品大 小", "烤爐種類", "烤焙人員"], "answer": 3}, {"no": 134, "question": "製作組織鬆軟體積較大的奶油蛋糕通常採用？", "options": ["糖油拌合法", "麵粉油脂 拌合法", "直接拌合法", "糖水拌合法"], "answer": 0}, {"no": 135, "question": "以攪拌機攪拌麵糊類蛋糕，下列那一項操作較為正確？", "options": ["自始至終一貫快 速拌成", "隨時提升攪拌缸以利拌勻", "忽快忽慢促進麵筋形成", "先用慢速 拌合材料，再以快速攪拌，中途停機刮勻缸底麵糊後再繼續攪拌"], "answer": 3}, {"no": 136, "question": "為促進蛋白的起泡性並改善蛋糕的風味可在配方中酌加？", "options": ["麩胺酸鈉", "檸檬汁", "酒精", "亞硝酸鉀"], "answer": 1}, {"no": 137, "question": "油炸甜圈餅（道納司，doughnuts）油脂宜選用？", "options": ["沙拉油", "豬油", "油炸油", "奶油"], "answer": 2}, {"no": 138, "question": "製作泡芙（奶油空心餅）時常添加之化學膨大劑為？", "options": ["碳酸氫銨（阿摩尼亞）", "小蘇打", "發粉", "酵母"], "answer": 0}, {"no": 139, "question": "鬆餅（起酥，puff pastry）烤焙時烤爐宜選用？", "options": ["熱風爐", "普通爐", "蒸氣爐", "隧道爐"], "answer": 2}, {"no": 140, "question": "派皮堅韌不酥的原因為？", "options": ["派餡裝盤時太熱", "麵糰拌合太久", "烘烤時間不夠", "油脂用量太多"], "answer": 1}];
let order=[],idx=0,correct=0,wrong=[],locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function speak(text){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function begin(){stop();order=shuffle(BANK);idx=0;correct=0;wrong=[];$('summary').classList.add('hidden');$('quiz').classList.remove('hidden');$('start').disabled=true;$('readAll').disabled=false;$('stop').disabled=false;render()}
function render(){locked=false;let q=order[idx];$('qno').textContent=`第 ${idx+1}／${order.length} 題｜題庫題號 ${q.no}`;$('counter').textContent=`進度 ${idx+1}／40`;$('score').textContent=`答對 ${correct} 題`;$('bar').style.width=(idx/order.length*100)+'%';$('question').textContent=q.question;$('answered').textContent='請選擇一個答案';$('feedback').classList.add('hidden');$('next').disabled=true;$('next').textContent=idx===order.length-1?'查看測驗結果':'下一題';let box=$('options');box.innerHTML='';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=['①','②','③','④'][i]+' '+o;b.onclick=()=>choose(i);box.appendChild(b)})}
function choose(i){if(locked)return;locked=true;let q=order[idx],buttons=[...$('options').children],ok=i===q.answer;if(ok)correct++;else wrong.push({q,chosen:i});buttons.forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});$('score').textContent=`答對 ${correct} 題`;$('answered').textContent=ok?'回答正確':'回答錯誤';$('feedback').classList.remove('hidden');$('feedback').textContent=ok?`正確答案：${['①','②','③','④'][q.answer]} ${q.options[q.answer]}`:`正確答案：${['①','②','③','④'][q.answer]} ${q.options[q.answer]}。你的選擇：${['①','②','③','④'][i]} ${q.options[i]}`;$('next').disabled=false}
function finish(){stop();$('quiz').classList.add('hidden');$('summary').classList.remove('hidden');$('bar').style.width='100%';$('finalscore').textContent=`答對 ${correct}／40 題`;$('accuracy').textContent=`正確率 ${Math.round(correct/40*100)}%`;let box=$('wronglist');box.innerHTML='';if(!wrong.length){box.innerHTML='<p>本次全部答對。</p>';return}let h=document.createElement('h3');h.textContent=`錯題總結（${wrong.length} 題）`;box.appendChild(h);wrong.forEach(({q,chosen})=>{let d=document.createElement('div');d.className='wrongitem';d.innerHTML=`<strong>題庫第 ${q.no} 題</strong><br>${escapeHtml(q.question)}<br><span class="tag">你的答案：${['①','②','③','④'][chosen]} ${escapeHtml(q.options[chosen])}</span><br><span style="color:#207247">正確答案：${['①','②','③','④'][q.answer]} ${escapeHtml(q.options[q.answer])}</span>`;box.appendChild(d)})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').onclick=begin;$('again').onclick=begin;$('next').onclick=()=>{stop();if(idx===order.length-1)finish();else{idx++;render()}};$('readAll').onclick=()=>{let q=order[idx];speak(q.question+'。選項一：'+q.options[0]+'。選項二：'+q.options[1]+'。選項三：'+q.options[2]+'。選項四：'+q.options[3])};$('stop').onclick=stop;
</script></body></html>
