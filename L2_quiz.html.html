const Q=[{"id":1,"q":"下列材料中，甜度最低的是？","opts":["果糖","砂糖","麥芽糖","乳糖"],"ans":"D"},{"id":2,"q":"台灣目前使用的白油，每桶重量約為","opts":["5公斤","10公斤","16公斤","30公斤"],"ans":"C"},{"id":3,"q":"不需要使用酵母的烘焙產品是？","opts":["包子","饅頭","麵包","重奶油蛋糕"],"ans":"D"},{"id":4,"q":"蛋黃中含量最多的成分？","opts":["水","油脂","蛋白質","灰分"],"ans":"A"},{"id":5,"q":"蛋白成分除了水以外含量最多的是？","opts":["油脂","葡萄糖","灰分","蛋白質"],"ans":"D"},{"id":6,"q":"一般最適合於麵包製作的水是？","opts":["軟水","蒸餾水","鹼水","中硬度水"],"ans":"D"},{"id":7,"q":"麵包配方中糖含量（依烘焙百分比）佔20％以上的是？","opts":["土司麵包","法國麵包","甜麵包","全麥麵包"],"ans":"C"},{"id":8,"q":"一般以中種法製作麵包，中種麵糰的原料不含？","opts":["鹽","酵母","麵粉","水"],"ans":"A"},{"id":9,"q":"以下那一種原料不屬於化學膨大劑？","opts":["發粉","小蘇打","酵母","阿摩尼亞（碳酸氫銨）"],"ans":"C"},{"id":10,"q":"無水奶油是來自於下列那種原料？","opts":["牛肉","豬肉","牛奶","植物油"],"ans":"C"},{"id":11,"q":"下列烘焙用原料較不常使用的是？","opts":["新鮮奶油","全脂奶粉","脫脂奶粉","煉乳"],"ans":"D"},{"id":12,"q":"沒有分析檢驗的情況下，下列何者不是由外觀判斷油炸油的劣化？","opts":["顏色加深","黏度增加","有蟹泡並提前冒煙","酸價為1.0"],"ans":"D"},{"id":13,"q":"海綿蛋糕配方主要原料為？","opts":["細砂糖、麵粉、鹽、牛奶","麵粉、沙拉油、水","麵粉、細砂糖、發粉","麵粉、細砂糖、蛋"],"ans":"D"},{"id":14,"q":"若用快速酵母粉取代新鮮酵母時，快速酵母粉的用量應為新鮮酵母的？","opts":["等量","1/3","1/2","2倍"],"ans":"B"},{"id":15,"q":"下列何種原料不是製作奶油布丁派餡之凝凍原料？","opts":["蛋","動物膠","玉米澱粉","奶油水"],"ans":"D"},{"id":16,"q":"蛋白在烘焙原料中屬於那一種性質？","opts":["柔性原料","韌性原料","酸性原料","中性原料"],"ans":"B"},{"id":17,"q":"蛋黃成分中所含的油脂具有","opts":["乳化作用","起泡作用","安定作用","膨大作用"],"ans":"A"},{"id":18,"q":"製作蛋糕時，奶粉應屬於？","opts":["柔性材料","鹼性材料","韌性材料","芳香材料"],"ans":"C"},{"id":19,"q":"奶水中含固形物（奶粉）量為？","opts":["4％","8％","12％","16％"],"ans":"C"},{"id":20,"q":"蒸發奶水含固形物為？","opts":["40％","35％","30％","26％"],"ans":"D"},{"id":21,"q":"麵包配方使用2％的細砂糖如將糖量增加至4％，則發酵時間會？","opts":["縮短很多","縮短很少","延長","不變"],"ans":"D"},{"id":22,"q":"做麵包時配方中油脂量高，可使麵包表皮？","opts":["顏色深","厚","柔軟","硬"],"ans":"C"},{"id":23,"q":"乳化劑在蛋糕中的功能是？","opts":["使蛋糕風味佳","使蛋糕顏色加深","融和配方內水和油使組織細膩","縮短攪拌時間減少人工"],"ans":"C"},{"id":24,"q":"一般烘焙人員所稱的「重曹」（baking soda）是指？","opts":["發粉","蘇打粉","酵母","酵素"],"ans":"B"},{"id":25,"q":"全蛋的固形物為？","opts":["10％","15％","25％","35％"],"ans":"C"},{"id":26,"q":"麵包的組織 由何種麥所磨製？","opts":["硬紅春麥","硬紅冬麥","琥珀色硬質小麥","軟質冬麥"],"ans":"D"},{"id":52,"q":"食品用水溶於油（W／O）之乳化劑，其親水親油平衡值（HLB：Hydrophilic - Lipophilic Balance value）之範圍介於？","opts":["3.5～6","8～18","20～25","26～30"],"ans":"A"},{"id":53,"q":"食品用油溶於水（O/W）之乳化劑，其親水親油平衡值（HLB：Hydrophilic - Lipophilic Balance value）之範圍介於？","opts":["3.5～6","8～18","20～25","26～30"],"ans":"B"},{"id":54,"q":"製作轉化糖漿，以下列何者為原料，加水溶解再加入稀酸、加熱使之轉化的液體糖？","opts":["乳糖","砂糖","麥芽糖","蜂蜜"],"ans":"B"},{"id":55,"q":"製作轉化糖漿時，以下列何種酸水解得到之品質最佳？","opts":["鹽酸","硫酸","磷酸","酒石酸"],"ans":"D"},{"id":56,"q":"在常溫時不釋出氣體，須於烤焙時才釋出二氧化碳氣體，為？","opts":["快性反應發粉","慢性反應發粉","雙重反應發粉","多重反應發粉"],"ans":"B"},{"id":57,"q":"製作蛋糕時，為有效地控制釋出均勻且有規則的氣體，常使用","opts":["快性反應發粉","慢性反應發粉","雙重反應發粉","銨粉"],"ans":"C"},{"id":58,"q":"椰子粉的脂肪含量約為？","opts":["30％","40％","50％","60％"],"ans":"D"},{"id":59,"q":"製作棉花糖時，加入下列何種具有打發起泡特性之膠凍原料？","opts":["洋菜","果膠","阿拉伯膠","動物膠"],"ans":"D"},{"id":60,"q":"下列何種膠凍原料需添加適當比例的糖與酸，才能形成膠體？","opts":["洋菜","果膠","阿拉伯膠","動物膠"],"ans":"B"},{"id":61,"q":"小麥之橫斷面呈粉質狀者為何？","opts":["高筋麵粉","中筋麵粉","粉心麵粉","低筋麵粉"],"ans":"D"},{"id":62,"q":"麵粉蛋白質是屬於部分不完全蛋白質，因為其胺基酸內缺少了一種必需胺基酸為？","opts":["甲硫胺酸（methioine）","胱胺酸（cystine）","半胱胺酸（cysteine）","離胺酸（lysine）"],"ans":"D"},{"id":63,"q":"可以得到麵粉之吸水量，攪拌時間及攪拌耐力之儀器設備為？","opts":["麵粉酵素活性測定儀（Amylograph）","連續溫度黏度測定儀（Viscosgraph）","麵糰拉力特性測定儀（Extensograph）","麵糰攪拌特性測定儀（Farinograph）"],"ans":"D"},{"id":64,"q":"下列何種糖，酵母發酵產生二氧化碳及酒精之速率最慢？","opts":["砂糖","果糖","葡萄糖","麥芽糖"],"ans":"D"},{"id":65,"q":"新鮮雞蛋其pH值約為？","opts":["5.2","6.5","7.6","9.0"],"ans":"C"},{"id":66,"q":"雞蛋內含有下列何種酵素，可以殺死多種微生物，增長貯存時間？","opts":["蛋白質分解酵素","脂肪分解酵素","澱粉分解酵素","溶菌酵素"],"ans":"D"},{"id":67,"q":"製造乾燥蛋白粉時，為避免於乾燥時產生變色反應，必須去除蛋白內之？","opts":["葡萄糖","脂肪","蛋白質","礦物質"],"ans":"A"},{"id":68,"q":"下列何者製作時需要添加酵母發酵？","opts":["貓舌小西餅","瑪琍餅乾","蘇打餅乾","椰子餅乾"],"ans":"C"},{"id":69,"q":"油炸用食用油之總極性化合物（total polar compounds）含量達百分之多少以上時，不得再予使用，應全部更換新油","opts":["25","30","40","45"],"ans":"A"},{"id":70,"q":"製作食用豆漿，哪一個不是正常步驟？","opts":["水中浸泡約3至8個小時","將黃豆磨碎","用紗布分離豆渣","生豆漿不必再加熱"],"ans":"D"},{"id":71,"q":"豆漿的鈣含量和牛奶比較，是","opts":["低","高","一樣","無法比較"],"ans":"A"},{"id":72,"q":"乳糖不耐症的人喝那種飲料不會產生副作用？","opts":["全脂牛奶","豆漿","脫脂牛奶","巧克力牛奶"],"ans":"B"},{"id":73,"q":"市售椰奶包裝及脂肪含量那一項是錯的？","opts":["鋁箔紙盒裝，脂肪含量比較低","罐裝，脂肪含量比較低","罐裝，脂肪含量比較高","包裝不一樣脂肪含量都一樣"],"ans":"B"},{"id":74,"q":"素食分類中，那一種不含奶蛋類？","opts":["奶蛋素","全素或純素","植物五辛素","蛋素"],"ans":"B"},{"id":75,"q":"製作全素巧克力產品，下列那一項原料不可加入？","opts":["可可粉","白巧克力","可可脂","可可膏"],"ans":"B"},{"id":76,"q":"攪拌全素麵包下列那一項原料不可取代牛奶？","opts":["燕麥奶","豆漿","黑豆奶","優格"],"ans":"D"},{"id":77,"q":"製作全素義大利蛋白霜可用那一項原料取代蛋白打發？","opts":["乳清蛋白","義大利蛋白霜粉","鷹嘴豆汁","豆漿"],"ans":"C"},{"id":78,"q":"製作全素調味餅乾下列那一項原料不可使用？","opts":["胡椒鹽","薑黃粉","辣椒粉","乳酪粉"],"ans":"D"},{"id":79,"q":"製作全素的慕斯蛋糕，不可使用下列那一項原料？","opts":["動物膠","可可脂","寒天粉","巧克力"],"ans":"A"},{"id":80,"q":"果凍中含有下列那一項凝膠原料，全素者不可食用？","opts":["果凍粉","果膠","寒天粉","動物膠"],"ans":"D"}],TEACHER_PASSWORD="1234";let answers=Array(80).fill(""),pos=0,submitted=false;
const $=x=>document.getElementById(x);
function show(id){["intro","quiz","locked","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}
function start(){answers=Array(80).fill("");pos=0;submitted=false;speechSynthesis?.cancel();show("quiz");render();}
function render(){let q=Q[pos];$("counter").textContent=`第 ${pos+1}／80 題`;$("answered").textContent=`已作答 ${answers.filter(Boolean).length}／80 題`;$("stem").textContent=q.q;$("opts").innerHTML="";
["A","B","C","D"].forEach((k,i)=>{let l=document.createElement("label");l.className="option";let r=document.createElement("input");r.type="radio";r.name="answer";r.value=k;r.checked=answers[pos]===k;r.onchange=()=>{answers[pos]=k;renderProgress();};let t=document.createElement("span");t.textContent=`(${k}) ${q.opts[i]}`;l.append(r,t);$("opts").append(l);});
$("prev").disabled=pos===0;$("next").disabled=pos===79;renderProgress();}
function renderProgress(){$("answered").textContent=`已作答 ${answers.filter(Boolean).length}／80 題`;$("bar").style.width=(answers.filter(Boolean).length/80*100)+"%";}
function speak(all){if(!("speechSynthesis"in window)){alert("此瀏覽器不支援語音報讀，請使用 Chrome 或 Safari。");return;}let q=Q[pos],s=`第${pos+1}題。${q.q}。`;if(all)q.opts.forEach((o,i)=>s+=`選項${"ABCD"[i]}。${o}。`);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang="zh-TW";u.rate=.9;speechSynthesis.speak(u);}
function submit(){let n=answers.filter(Boolean).length;if(n<80&&!confirm(`還有${80-n}題未作答，確定交卷？未作答視為答錯。`))return;if(!confirm("確定交卷？交卷後需老師輸入密碼才能查看成績。"))return;submitted=true;speechSynthesis?.cancel();show("locked");}
function results(){let correct=Q.filter((q,i)=>answers[i]===q.ans).length,wrong=Q.filter((q,i)=>answers[i]!==q.ans);$("score").textContent=`${(correct*1.25).toFixed(2)} 分／100分`;$("stats").textContent=`答對 ${correct} 題；答錯 ${wrong.length} 題；未作答 ${answers.filter(x=>!x).length} 題。`;$("wrongList").innerHTML="";if(!wrong.length){$("wrongList").textContent="全部答對，沒有錯題。";}else wrong.forEach(q=>{let i=q.id-1,d=document.createElement("div");d.className="wrong";let h=document.createElement("b");h.textContent=`第 ${q.id} 題`;let stem=document.createElement("div");stem.textContent=q.q;let mine=document.createElement("div");mine.textContent=`你的答案：${answers[i]||"未作答"}${answers[i]?" "+q.opts["ABCD".indexOf(answers[i]) ]:""}`;let a=document.createElement("div");a.className="answer";a.textContent=`正確答案：(${q.ans}) ${q.opts["ABCD".indexOf(q.ans)]}`;d.append(h,stem,mine,a);$("wrongList").append(d);});show("result");}
$("start").onclick=start;$("prev").onclick=()=>{speechSynthesis?.cancel();pos--;render();};$("next").onclick=()=>{speechSynthesis?.cancel();pos++;render();};$("submit").onclick=submit;$("readQ").onclick=()=>speak(false);$("readAll").onclick=()=>speak(true);$("stop").onclick=()=>speechSynthesis?.cancel();$("unlock").onclick=()=>{if($("pw").value===TEACHER_PASSWORD){$("pwmsg").textContent="";results();}else $("pwmsg").textContent="密碼錯誤，請重新輸入。";};$("retry").onclick=()=>{ $("pw").value="";show("intro");};
</script></body></html>
