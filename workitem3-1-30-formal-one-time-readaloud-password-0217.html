const PASSCODE="0217";
const STORAGE_KEY="workitem3_product_make_1_30_formal_exam_v1";
const LABELS=["A","B","C","D"];
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function stopSpeak(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}
function speak(text){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀，請改用手機 Chrome 或 Safari。');return;}stopSpeak();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.88;u.pitch=1;window.speechSynthesis.speak(u);}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){alert('此瀏覽器無法保存測驗進度，請允許網站使用本機儲存功能。');}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));return v&&typeof v==='object'?v:null;}catch(e){return null;}}
function showOnly(id){['start','quiz','result','locked'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
let state={started:false,finished:false,order:[],current:0,answers:{},score:0,wrong:[]};
function initialize(){const old=load();if(old){state=old;if(state.finished){renderResult(true);return;}if(state.started){$('resumeNote').textContent='偵測到尚未交卷的測驗，已保留作答進度。按「繼續測驗」可接續作答。';$('startBtn').textContent='繼續測驗';}}showOnly('start');}
function startExam(){stopSpeak();if(state.started&&!state.finished){renderQuiz();return;}state={started:true,finished:false,order:shuffle(BANK.map((_,i)=>i)),current:0,answers:{},score:0,wrong:[]};save();renderQuiz();}
function currentQuestion(){return BANK[state.order[state.current]];}
function qOptions(q){return q.opts.map((o,i)=>typeof o==='string'?({id:i,text:o,spoken:o}):({id:i,text:o.label,spoken:o.spoken||o.label,img:o.img}));}
function renderQuiz(){if(state.finished){renderResult(true);return;}stopSpeak();showOnly('quiz');const q=currentQuestion();const opts=shuffle(qOptions(q));state.displayedOptions=opts.map(o=>o.id);save();$('status').textContent='正式測驗｜第 '+(state.current+1)+'／'+BANK.length+' 題';$('quiz').innerHTML='<div class="qno">題庫第 '+q.n+' 題 <span style="float:right">'+(state.current+1)+'／'+BANK.length+'</span></div><div class="progress"><div class="fill" style="width:'+((state.current+1)/BANK.length*100)+'%"></div></div><div class="question">'+esc(q.q)+'</div><button class="btn speak" id="speakBtn">朗讀本題（題目＋選項）</button><button class="btn stop" id="stopBtn">停止朗讀</button><div id="opts"></div><div class="controls"><button class="btn secondary" id="prevBtn" '+(state.current===0?'disabled':'')+'>上一題</button><button class="btn secondary" id="nextBtn">'+(state.current===BANK.length-1?'確認並交卷':'下一題')+'</button></div><div id="unanswered" class="small"></div>';
$('speakBtn').onclick=()=>{const readingOpts=opts.map((o,i)=>'選項'+['A','B','C','D'][i]+'：'+o.spoken).join('。');speak('第'+q.n+'題。'+q.q+'。'+readingOpts+'。');};$('stopBtn').onclick=stopSpeak;$('prevBtn').onclick=()=>{if(state.current>0){state.current--;save();renderQuiz();}};$('nextBtn').onclick=()=>{stopSpeak();if(state.current===BANK.length-1){submitExam();}else{state.current++;save();renderQuiz();}};
const box=$('opts');opts.forEach((o,pos)=>{const b=document.createElement('button');b.type='button';b.className='option'+(state.answers[q.n]===o.id?' selected':'');const l=document.createElement('span');l.className='letter';l.textContent=LABELS[pos];b.appendChild(l);if(o.img){const im=document.createElement('img');im.className='optimg';im.src=o.img;im.alt='圖示選項 '+LABELS[pos];b.appendChild(im);}else{const t=document.createElement('span');t.textContent=o.text;b.appendChild(t);}b.onclick=()=>{if(state.finished)return;state.answers[q.n]=o.id;save();box.querySelectorAll('.option').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');$('unanswered').textContent='已選擇答案 '+LABELS[pos]+'。交卷前可再修改。';};box.appendChild(b);});}
function answerText(q,id){const o=q.opts[id];if(typeof o==='string')return o;return '圖示選項（'+o.label+'）';}
function submitExam(){const missing=state.order.map(i=>BANK[i]).filter(q=>!Object.prototype.hasOwnProperty.call(state.answers,q.n));if(missing.length){$('unanswered').textContent='還有 '+missing.length+' 題未作答，請先完成全部題目。';const first=state.order.findIndex(i=>!Object.prototype.hasOwnProperty.call(state.answers,BANK[i].n));state.current=first;save();renderQuiz();$('unanswered').textContent='還有 '+missing.length+' 題未作答，請完成後再交卷。';return;}if(!confirm('確定交卷？交卷後本次測驗會鎖定，不能自行重測。'))return;state.score=0;state.wrong=[];for(const i of state.order){const q=BANK[i],pick=state.answers[q.n];if(pick===q.ans)state.score++;else state.wrong.push({n:q.n,q:q.q,chosen:answerText(q,pick),correct:answerText(q,q.ans),correctOpt:q.opts[q.ans]});}state.finished=true;state.finishedAt=new Date().toISOString();save();renderResult(false);}
function renderResult(fromStorage){stopSpeak();showOnly('result');$('status').textContent='正式測驗已完成並鎖定';const pct=Math.round((state.score||0)/BANK.length*100);const message=pct===100?'你超級棒!!':pct>=90?'不錯喔！繼續努力！':pct>=70?'不錯，加油':'你需要多讀點書';const rows=(state.wrong||[]).length?'<div class="wrong-list"><h3>錯題整理</h3>'+state.wrong.map(w=>'<div class="wrong-item"><strong>第 '+w.n+' 題</strong><br>'+esc(w.q)+'<br>你的答案：'+esc(w.chosen)+'<br><strong>正確答案：'+esc(w.correct)+'</strong></div>').join('')+'</div>':'<div class="center"><strong>全部答對，沒有錯題。</strong></div>';$('result').innerHTML='<div class="title center">測驗完成</div><div class="score">'+(state.score||0)+'／'+BANK.length+'</div><div class="center">答對率：'+pct+'%</div><div class="center" style="font-weight:800;margin:8px 0 15px">'+message+'</div>'+rows+'<div class="notice" style="margin-top:16px">本次測驗已鎖定。若要重測，請由教師輸入密碼解鎖。</div><button class="btn secondary full" id="showUnlock">教師解鎖重測</button>';$('showUnlock').onclick=()=>{showOnly('locked');};if(fromStorage){/* restore saved completed score without reopening questions */}}
function unlock(){const p=$('teacherPassword').value.trim();if(p!==PASSCODE){$('passwordError').textContent='密碼錯誤，無法重新測驗。';return;}if(!confirm('教師密碼正確。確定清除本次成績並開放重新測驗？'))return;stopSpeak();localStorage.removeItem(STORAGE_KEY);state={started:false,finished:false,order:[],current:0,answers:{},score:0,wrong:[]};$('teacherPassword').value='';$('passwordError').textContent='';$('resumeNote').textContent='';$('startBtn').textContent='開始測驗';showOnly('start');}
$('startBtn').onclick=startExam;$('unlockBtn').onclick=unlock;window.addEventListener('beforeunload',()=>{if(state.started&&!state.finished)save();});initialize();
</script></body></html>
