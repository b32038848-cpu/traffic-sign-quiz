const groups=[];for(let i=0;i<BANK.length;i+=20)groups.push(BANK.slice(i,i+20));
let currentGroup=0,order=0,answers={},done={},attempted={};
const $=id=>document.getElementById(id);
function groupRange(g){return `原題 ${g[0].no}～${g[g.length-1].no}`;}
function showHome(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden");speechSynthesis?.cancel();}
function buildUnits(){let root=$("units");root.innerHTML="";groups.forEach((g,i)=>{let d=document.createElement("div");d.className="unit";let h=document.createElement("h3");h.textContent=`第 ${i+1} 單元`;let p=document.createElement("p");p.textContent=`${groupRange(g)}｜${g.length} 題`;let b=document.createElement("button");b.className="primary";b.textContent="開始練習";b.onclick=()=>startGroup(i);d.append(h,p,b);root.appendChild(d);});}
function startGroup(i){currentGroup=i;order=0;answers={};attempted={};$("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");$("unitName").textContent=`第 ${i+1} 單元（${groupRange(groups[i])}）`;$("finish").disabled=true;render();}
function current(){return groups[currentGroup][order];}
function render(){let q=current();$("count").textContent=`第 ${order+1}／${groups[currentGroup].length} 題`;$("qno").textContent=`原題第 ${q.no} 題`;$("question").textContent=q.q;$("options").innerHTML="";$("feedback").classList.add("hidden");
q.opts.forEach((opt,i)=>{let label=document.createElement("label");label.className="option";let radio=document.createElement("input");radio.type="radio";radio.name="ans";radio.value=i+1;radio.checked=answers[q.no]===i+1;radio.disabled=attempted[q.no]===true;let text=document.createElement("span");text.textContent=`${["①","②","③","④"][i]} ${opt}`;label.append(radio,text);if(radio.checked)label.classList.add("selected");label.onclick=(e)=>{if(attempted[q.no])return;answers[q.no]=i+1;attempted[q.no]=true;renderFeedback();};$("options").appendChild(label);});
if(attempted[q.no])renderFeedback();$("prev").disabled=order===0;$("next").disabled=!attempted[q.no]||order===groups[currentGroup].length-1;$("finish").disabled=Object.keys(attempted).length!==groups[currentGroup].length;$("bar").style.width=(Object.keys(attempted).length/groups[currentGroup].length*100)+"%";}
function renderFeedback(){let q=current(),correct=answers[q.no]===q.ans;let f=$("feedback");f.className="feedback "+(correct?"good":"bad");f.textContent=correct?`答對了。正確答案：${["①","②","③","④"][q.ans-1]} ${q.opts[q.ans-1]}`:`答錯了。正確答案：${["①","②","③","④"][q.ans-1]} ${q.opts[q.ans-1]}`;f.classList.remove("hidden");$("options").querySelectorAll("label").forEach((l,i)=>{if(i+1===q.ans)l.classList.add("selected");});$("next").disabled=order===groups[currentGroup].length-1;$("finish").disabled=Object.keys(attempted).length!==groups[currentGroup].length;}
function move(n){speechSynthesis?.cancel();order+=n;render();}
function say(all){let q=current(),s=`第${q.no}題。${q.q}。`;if(all)q.opts.forEach((o,i)=>s+=`選項${i+1}。${o}。`);if(!("speechSynthesis"in window)){alert("此瀏覽器不支援語音報讀，請改用 Safari 或 Chrome。");return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang="zh-TW";u.rate=.9;speechSynthesis.speak(u);}
function finish(){let g=groups[currentGroup],right=g.filter(q=>answers[q.no]===q.ans).length,wrong=g.filter(q=>answers[q.no]!==q.ans);$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("resultTitle").textContent=`第 ${currentGroup+1} 單元｜測驗結果`;$("score").textContent=`${right}／${g.length} 題答對`;$("stats").textContent=`答對 ${right} 題；答錯 ${wrong.length} 題；得分 ${(right/g.length*100).toFixed(1)}％。`;let list=$("wrongList");list.innerHTML="";if(!wrong.length){list.textContent="本單元全部答對。";return;}wrong.forEach(q=>{let d=document.createElement("div");d.className="wrong";let h=document.createElement("b");h.textContent=`原題第 ${q.no} 題`;let stem=document.createElement("div");stem.textContent=q.q;let a=document.createElement("div");a.className="answer";a.textContent=`正確答案：${["①","②","③","④"][q.ans-1]} ${q.opts[q.ans-1]}`;d.append(h,stem,a);list.appendChild(d);});}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("finish").onclick=finish;$("back").onclick=showHome;$("readQ").onclick=()=>say(false);$("readAll").onclick=()=>say(true);$("stop").onclick=()=>speechSynthesis?.cancel();$("retry").onclick=()=>startGroup(currentGroup);$("choose").onclick=showHome;
