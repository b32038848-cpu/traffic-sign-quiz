<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>烘焙食品丙級｜補充題1-11手機互動題目</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:720px;margin:auto}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;z-index:10}
h1{font-size:19px;margin:0 0 4px}.sub{font-size:13px;color:#666}
main{padding:14px 12px 80px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tag{display:inline-block;background:#eee;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;margin-bottom:12px}
.qnum{font-weight:800;color:#666;margin-bottom:8px}.question{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d7d7d7;border-radius:12px;padding:14px;margin:10px 0;font-size:17px;line-height:1.45;cursor:pointer}
.option:disabled{cursor:default}.option.correct{border:2px solid #17834d;background:#edf8f1}.option.wrong{border:2px solid #c73939;background:#fff0f0}
.feedback{display:none;border-radius:12px;padding:14px;margin-top:14px;line-height:1.6}.feedback.correct{background:#edf8f1}.feedback.wrong{background:#fff0f0}
.next{display:none;width:100%;border:0;border-radius:12px;background:#222;color:#fff;padding:14px;font-size:17px;margin-top:14px;cursor:pointer}
.score{font-size:36px;font-weight:900;margin:8px 0}.wrong-list{margin-top:18px}.wrong-item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;line-height:1.6}.wrong-q{font-weight:800}
.retry{width:100%;border:0;border-radius:12px;background:#555;color:#fff;padding:14px;font-size:17px;margin-top:18px;cursor:pointer}
.note{background:#f7f7f7;border-radius:12px;padding:12px;line-height:1.6;margin-bottom:14px;font-size:14px}
</style></head>
<body>
<header><div class="wrap"><h1>烘焙食品丙級｜補充題 1～11</h1><div class="sub" id="progress">第 1／11 題</div></div></header>
<main class="wrap"><section id="quiz" class="card"></section><section id="result" class="card" style="display:none"></section></main>
<script>
const QUESTIONS=[{"n":1,"q":"胚乳約佔整個小麥穀粒的？","opts":["70％","76％","83％","90％"],"ans":2},{"n":2,"q":"使用脫脂奶粉代替奶水時，脫脂奶粉對水混合的比例應為？","opts":["5：95","10：90","15：85","20：80"],"ans":1},{"n":3,"q":"裝飾用鮮奶油加入牛奶攪拌時，牛奶溫度必須保持在多少以下，以避免油水分離？","opts":["5℃","10℃","15℃","20℃"],"ans":1},{"n":4,"q":"發粉的定義是由小蘇打及酸性鹽混合攪拌而成的一種膨大劑，所產生的二氧化碳量不能低於發粉重量的？","opts":["8％","10％","12％","15％"],"ans":2},{"n":5,"q":"在常溫時不釋出氣體，須於烤焙時才釋出二氧化碳氣體，為？","opts":["快性反應發粉","次快性反應發粉","雙重反應發粉","慢性反應發粉"],"ans":3},{"n":6,"q":"製作蛋糕時，為有效地控制釋出均勻且有規則的氣體，常使用？","opts":["快性發粉","慢性發粉","雙重反應發粉","小蘇打"],"ans":2},{"n":7,"q":"椰子粉的脂肪含量約為？","opts":["20％","40％","60％","80％"],"ans":2},{"n":8,"q":"製作棉花糖時，加入下列何種具有打發起泡特性之膠凍原料？","opts":["果膠","洋菜粉","動物膠","玉米澱粉"],"ans":2},{"n":9,"q":"下列何種膠凍原料需添加適當比例的糖與酸，才能形成膠體？","opts":["動物膠","果膠","洋菜粉","明膠粉"],"ans":1},{"n":10,"q":"製作轉化糖漿，以下列何者為原料，加水溶解再加入稀酸、加熱使之轉化的液體糖？","opts":["砂糖","麥芽糖","葡萄糖","果糖"],"ans":0},{"n":11,"q":"製作海綿蛋糕添加乳化起泡劑目的為？","opts":["增加麵糊的安定性","增加麵糊的甜度","降低麵粉筋性","增加蛋糕含水量"],"ans":0}],LABELS=["①","②","③","④"];
let current=0,score=0,answered=false,wrong=[];
const quiz=document.getElementById("quiz"),result=document.getElementById("result"),progress=document.getElementById("progress");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function render(){
 answered=false; const q=QUESTIONS[current]; progress.textContent=`第 ${current+1}／${QUESTIONS.length} 題`;
 quiz.style.display="block";result.style.display="none";
 quiz.innerHTML=`<div class="tag">手機互動題目｜即時回饋</div><div class="qnum">第 ${q.n} 題</div><div class="question">${esc(q.q)}</div><div id="options">${q.opts.map((o,i)=>`<button class="option" data-i="${i}">${LABELS[i]} ${esc(o)}</button>`).join("")}</div><div id="feedback" class="feedback"></div><button id="nextBtn" class="next">${current===QUESTIONS.length-1?"查看成績":"下一題 →"}</button>`;
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answerQuestion(Number(b.dataset.i))); document.getElementById("nextBtn").onclick=nextQuestion;
}
function answerQuestion(chosen){
 if(answered)return;answered=true;const q=QUESTIONS[current],buttons=[...document.querySelectorAll(".option")],fb=document.getElementById("feedback");buttons.forEach(b=>b.disabled=true);
 if(chosen===q.ans){score++;buttons[chosen].classList.add("correct");fb.className="feedback correct";fb.innerHTML=`<strong>答對！</strong><br>正確答案：${LABELS[q.ans]} ${esc(q.opts[q.ans])}`;}
 else{buttons[chosen].classList.add("wrong");buttons[q.ans].classList.add("correct");wrong.push({n:q.n,q:q.q,a:q.opts[q.ans]});fb.className="feedback wrong";fb.innerHTML=`<strong>答錯！</strong><br>正確答案：${LABELS[q.ans]} ${esc(q.opts[q.ans])}`;}
 fb.style.display="block";document.getElementById("nextBtn").style.display="block";
}
function nextQuestion(){if(!answered)return;if(current===QUESTIONS.length-1){showResult();return}current++;window.scrollTo({top:0,behavior:"smooth"});render()}
function showResult(){
 quiz.style.display="none";result.style.display="block";progress.textContent="測驗完成";
 const wrongHtml=wrong.length===0?"<div class='note'><strong>11 題全部答對！</strong></div>":`<div class="wrong-list"><h3>錯誤題目整理（共 ${wrong.length} 題）</h3>${wrong.map((x,i)=>`<div class="wrong-item"><div class="wrong-q">${i+1}．第 ${x.n} 題：${esc(x.q)}</div><div><strong>正確答案：</strong>${esc(x.a)}</div></div>`).join("")}</div>`;
 result.innerHTML=`<div>測驗完成</div><div class="score">${score}／11</div><div>答對率：${Math.round(score/11*100)}%</div>${wrongHtml}<button class="retry" id="retryBtn">重新測驗</button>`;
 document.getElementById("retryBtn").onclick=restart;
}
function restart(){current=0;score=0;answered=false;wrong=[];window.scrollTo({top:0,behavior:"smooth"});render()}
render();
</script></body></html>
