<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>烘焙食品丙級｜工作項目三 51～70 重複測驗</title><style>
:root{color-scheme:light;--blue:#2457a7;--ink:#182230;--muted:#687386;--line:#d7dee8;--bg:#f3f5f8;--green:#eaf7ef;--red:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:16px;line-height:1.6}header{background:#244e86;color:#fff;padding:20px 16px}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#e3ecf9;font-size:14px}.wrap{width:min(900px,100%);margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #14213d0a}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:white;font-size:16px;font-weight:700;cursor:pointer}.btn.secondary{background:#e9edf2;color:#233144}.btn:disabled{opacity:.45}.tag{color:var(--muted);font-size:13px;font-weight:700}.qtitle{font-weight:800;font-size:19px;margin:4px 0 14px}.answer{background:var(--green);border-radius:10px;padding:12px;font-weight:800}.small{color:var(--muted);font-size:14px}.hidden{display:none!important}
 .progress{height:8px;background:#e5eaf1;border-radius:99px;overflow:hidden;margin:12px 0 18px}.fill{height:100%;background:#3971c9;width:0}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0;font-size:16px;cursor:pointer;color:var(--ink)}.option:hover{border-color:#7897c4}.option.correct{background:var(--green);border-color:#35a565}.option.wrong{background:var(--red);border-color:#d55}.feedback{margin-top:12px;padding:12px;border-radius:10px;background:#eef2f7}.resultscore{font-size:40px;font-weight:900;color:#244e86}.wrongitem{padding:12px;border-bottom:1px solid var(--line)}.speechbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}.speechstatus{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}button:focus-visible{outline:3px solid #86b7fe;outline-offset:2px}</style></head><body><header><div class="wrap"><h1>烘焙食品丙級｜工作項目三：產品製作</h1><p>第 51～70 題｜共 20 題｜可重新測驗</p></div></header><main class="wrap"><section id="start" class="card"><h2>測驗說明</h2><p>每次開始或重新測驗時，題目順序與各題選項都會重新排列。答完本題才能繼續下一題；完成後會顯示成績與錯題。</p><button class="btn" id="startBtn">開始測驗</button></section><section id="quiz" class="card hidden"><div class="bar"><span id="counter"></span><span id="scoreLive">答對 0 題</span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="tag" id="qno"></div><div class="qtitle" id="question"></div><div class="speechbar"><button class="btn secondary" id="speakBtn" type="button">🔊 朗讀本題（題目＋選項）</button><button class="btn secondary" id="stopSpeakBtn" type="button">停止朗讀</button></div><div class="speechstatus" id="speechStatus" aria-live="polite"></div><div id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions" style="margin-top:14px"><button class="btn" id="nextBtn" disabled>下一題</button><button class="btn secondary" id="quitBtn">回到開始頁</button></div></section><section id="result" class="card hidden"><h2>測驗完成</h2><div class="resultscore" id="finalScore"></div><p id="message"></p><div id="wrongList"></div><div class="actions"><button class="btn" id="retryBtn">重新測驗</button><button class="btn secondary" id="homeBtn">回到開始頁</button></div></section></main><script>const BANK=[{"no": 51, "q": "奶油海綿蛋糕中奶油用量最多可用？", "options": ["10～20％", "21～30％", "31～39％", "40～50％"], "ans": 3}, {"no": 52, "q": "乳沫類蛋糕其麵糊的打發性主要是來自配方中的？", "options": ["油脂", "蛋", "發粉", "麵粉"], "ans": 1}, {"no": 53, "q": "可可粉加入蛋糕配方內時須注意調整其吸水量。製作魔鬼蛋糕時，為增加可口風味，配方中增加 3％的可可粉，則配方中的吸水應該？", "options": ["減少 3％", "增加 3％", "減少 4.5％", "增加 4.5％"], "ans": 3}, {"no": 54, "q": "麵粉含水量比標準減少 1％時，麵包麵糰攪拌時配方內水的用量可隨著增加多少？", "options": ["0％", "2％", "4％", "6％"], "ans": 1}, {"no": 55, "q": "煮製奶油空心餅（泡芙），何者為正確？", "options": ["麵粉、油脂、水同時置於鍋中煮沸", "油脂煮沸即加水、麵粉拌勻", "油脂與水煮沸並不斷攪拌加入麵粉，繼續攪拌加熱至麵粉完全糊化", "水、油脂煮沸即離火，加入麵粉拌勻"], "ans": 2}, {"no": 56, "q": "小西餅的烤焙原則為何？", "options": ["高溫短時間", "高溫長時間", "低溫短時間", "低溫長時間"], "ans": 0}, {"no": 57, "q": "炸油炸甜圈餅（道納司，doughnuts）的油溫以多少為佳？", "options": ["140～150℃", "180～190℃", "210～220℃", "230～240℃"], "ans": 1}, {"no": 58, "q": "奶油空心餅成型後應該如何處理？", "options": ["馬上進爐烘烤", "鬆弛 10 分鐘後進爐", "鬆弛 15 分鐘後進爐", "鬆弛 30 分鐘後進爐"], "ans": 0}, {"no": 59, "q": "製作麵包時麵粉筋性較弱，應採用何種攪拌速度？", "options": ["快速", "中速", "慢速", "先用快速再改慢速"], "ans": 1}, {"no": 60, "q": "裹入油脂為麵糰的 1/4，即表示油脂量為麵糰的多少？", "options": ["20％", "25％", "30％", "35％"], "ans": 1}, {"no": 61, "q": "重奶油蛋糕如欲組織細膩，可以採用哪一種方法？", "options": ["直接法攪拌", "糖油拌合法", "麵粉油脂拌合法", "兩步拌合法"], "ans": 2}, {"no": 62, "q": "麵糰分割重量 600 公克，烤好麵包重量為 540 公克，其烤焙損耗是？", "options": ["5％", "6％", "10％", "15％"], "ans": 2}, {"no": 63, "q": "整形後的丹麥麵包或甜麵包麵糰，如需冷藏，冰箱溫度應為何？", "options": ["-5～0℃", "0～7℃", "11～15℃", "16～20℃"], "ans": 1}, {"no": 64, "q": "烤焙法國麵包時，烤爐內必須有蒸氣設備，蒸氣的壓力與量應如何？", "options": ["壓力大、量小", "只要有蒸氣產生就好", "壓力低、量大", "壓力大、量大"], "ans": 2}, {"no": 65, "q": "海綿蛋糕有冷攪拌法和熱攪拌法，熱攪拌法是先將蛋加溫至多少？", "options": ["25℃以下", "25～30℃", "35～43℃", "50℃以上"], "ans": 2}, {"no": 66, "q": "海綿蛋糕配方中各項材料百分比加起來為 180％，已知麵糊總量為 9 公斤，其麵粉用量應為？", "options": ["3.5 公斤", "4 公斤", "4.5 公斤", "5 公斤"], "ans": 3}, {"no": 67, "q": "蛋白經攪拌後，最易與其他原料拌合且進爐後膨脹力最好的階段是？", "options": ["起泡狀態", "濕性發泡", "乾性發泡", "棉花狀態"], "ans": 1}, {"no": 68, "q": "製作某烘焙食品，麵粉用量為 22 公斤，乳化劑用量為 0.33 公斤，乳化劑所佔烘焙百分比為？", "options": ["1.2％", "1.5％", "1.8％", "2％"], "ans": 1}, {"no": 69, "q": "麵包製程中所說的「醒麵」即是？", "options": ["基本發酵", "延續發酵", "中間發酵", "滾圓"], "ans": 2}, {"no": 70, "q": "麵包配方經試驗為正確，但烤焙後表皮顏色經常深淺不一，下列何者不是可能原因？", "options": ["烤爐溫度不平均", "冷卻不足", "發酵", "整型的關係"], "ans": 1}];const $=id=>document.getElementById(id);let order=[],idx=0,score=0,answers=[];let speechRun=0;function stopSpeech(showMessage=true){speechRun++;if('speechSynthesis' in window)window.speechSynthesis.cancel();if(showMessage&&$('speechStatus'))$('speechStatus').textContent='已停止朗讀。'}function speakCurrent(){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){$('speechStatus').textContent='此瀏覽器不支援語音朗讀，請使用最新版 Chrome、Edge 或 Safari。';return}const q=order[idx];if(!q)return;stopSpeech(false);const run=speechRun;const opts=q.displayOptions.map((o,i)=>`選項${['一','二','三','四'][i]}，${o.text}`).join('。');const text=`第${q.no}題。${q.q}。${opts}。請選出正確答案。`;const utterance=new SpeechSynthesisUtterance(text);const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>/^zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));utterance.lang=voice?.lang||'zh-TW';if(voice)utterance.voice=voice;utterance.rate=0.88;utterance.pitch=1;utterance.volume=1;utterance.onstart=()=>{if(run===speechRun)$('speechStatus').textContent='正在朗讀本題題目與選項；不會朗讀正確答案。'};utterance.onend=()=>{if(run===speechRun)$('speechStatus').textContent='本題朗讀完成。'};utterance.onerror=(e)=>{if(run===speechRun)$('speechStatus').textContent=`朗讀發生問題（${e.error||'unknown'}）。請檢查裝置音量與語音設定。`};window.speechSynthesis.resume();window.speechSynthesis.speak(utterance)};function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){stopSpeech(false);order=shuffle(BANK).map(q=>({...q,displayOptions:shuffle(q.options.map((text,i)=>({text,correct:i===q.ans})))}));idx=0;score=0;answers=[];$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){stopSpeech(false);$('counter').textContent=`第 ${idx+1}／${order.length} 題`;$('scoreLive').textContent=`答對 ${score} 題`;$('fill').style.width=`${idx/order.length*100}%`;const q=order[idx];$('qno').textContent=`原題號：第 ${q.no} 題`;$('question').textContent=q.q;$('options').innerHTML='';$('feedback').classList.add('hidden');$('feedback').textContent='';$('nextBtn').disabled=true;$('nextBtn').textContent=idx===order.length-1?'查看成績':'下一題';q.displayOptions.forEach((op,i)=>{const b=document.createElement('button');b.className='option';b.textContent=`${String.fromCharCode(65+i)}. ${op.text}`;b.onclick=()=>choose(i,b);$('options').appendChild(b)})}function choose(i,btn){stopSpeech(false);const q=order[idx];if(answers[idx])return;const op=q.displayOptions[i];answers[idx]={no:q.no,question:q.q,chosen:op.text,correctText:q.options[q.ans],ok:op.correct};if(op.correct)score++;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(q.displayOptions[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').classList.remove('hidden');$('feedback').textContent=(op.correct?'答對了！':'答錯了。')+` 正確答案：${q.options[q.ans]}`;$('scoreLive').textContent=`答對 ${score} 題`;$('nextBtn').disabled=false;$('fill').style.width=`${(idx+1)/order.length*100}%`}function next(){if(!answers[idx])return;if(idx<order.length-1){idx++;render()}else finish()}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const rate=Math.round(score/order.length*100);$('finalScore').textContent=`${score}／${order.length} 題（${rate} 分）`;$('message').textContent=rate===100?'全部答對，表現很好！':rate>=80?'表現不錯，繼續保持。':'請參考錯題，再重新練習。';const wrong=answers.filter(a=>!a.ok);$('wrongList').innerHTML=wrong.length?`<h3>錯題整理（${wrong.length} 題）</h3>`+wrong.map(a=>`<div class="wrongitem"><strong>第 ${a.no} 題：${a.question}</strong><div>你的答案：${a.chosen}</div><div class="answer">正確答案：${a.correctText}</div></div>`).join(''):'<p>本次沒有錯題。</p>'}function home(){$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('start').classList.remove('hidden')} $('startBtn').onclick=start;$('retryBtn').onclick=start;$('speakBtn').onclick=speakCurrent;$('stopSpeakBtn').onclick=()=>stopSpeech(true);window.addEventListener('pagehide',()=>stopSpeech(false));$('nextBtn').onclick=next;$('quitBtn').onclick=home;$('homeBtn').onclick=home;</script></body></html>
