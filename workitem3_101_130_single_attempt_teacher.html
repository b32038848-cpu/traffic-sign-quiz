<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作項目三 101–130｜單次正式測驗</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#172331;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:#20364f;color:#fff;padding:22px 16px}header h1,header p,main{max-width:850px;margin-left:auto;margin-right:auto}header h1{font-size:24px;margin-top:0;margin-bottom:8px}header p{margin-top:0;color:#dce6f0}main{padding:16px}.card{background:#fff;border:1px solid #d9e1e8;border-radius:14px;padding:20px;margin:14px 0}button{border:0;border-radius:9px;padding:11px 16px;margin:4px;background:#245879;color:white;font-size:16px;cursor:pointer}button.secondary{background:#e7edf2;color:#20364f}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.muted{color:#5b6875;font-size:14px}.q{font-size:20px;font-weight:650;line-height:1.6}.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #dbe2e8;border-radius:9px;margin:8px 0;cursor:pointer}.opt input{margin-top:5px}.bar{height:8px;background:#dce4eb;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#2a789e;width:0}.result{padding:12px;background:#f7f9fb;border-radius:9px}.error{color:#a12626}
</style></head><body><header><h1>工作項目三 101–130 題｜單次正式測驗</h1><p>30 題單選・限時不限・提交後結算・不可重測</p></header><main>
<div class="card" id="intro"><p>請開始後完成全部 30 題再提交。測驗期間離開或重新整理頁面將觸發警告；提交後由教師輸入密碼查看成績與答案。</p><button id="start">開始測驗</button></div>
<div id="exam" class="hidden"><div class="card"><div id="progressText"></div><div class="bar"><div id="progress"></div></div><button class="secondary" id="readAll">朗讀題目與選項</button><button class="secondary" id="stopRead">停止朗讀</button></div><div id="questions"></div><div class="card"><button id="submit">提交並結算</button><p class="muted">提交後不可重新作答。</p></div></div>
<div id="locked" class="card hidden"><h2>測驗已提交</h2><p>成績與答案由教師解鎖查看。</p><label>教師密碼 <input id="pw" type="password" autocomplete="off"></label><button id="unlock">教師解鎖</button><p id="pwmsg" class="error"></p></div><div id="result" class="hidden"></div>
</main><script>
const qs=[{"n": 101, "answer": 1, "question": "下列那一項非麵包滾圓的目的？", "options": ["鬆弛麵筋使麵糰易於整型", "使麵糰表面光滑不易粘手", "使麵糰易於保住二氧化碳", "使氣體均勻分佈"]}, {"n": 102, "answer": 4, "question": "調整配方時，下列何者材料不會使麵包麵糰較軟？", "options": ["水", "糖", "油", "麵粉"]}, {"n": 103, "answer": 1, "question": "調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？", "options": ["水", "糖", "油", "麵粉"]}, {"n": 104, "answer": 1, "question": "法國麵包（硬式麵包）常用之烤焙溫度為多少？", "options": ["230℃", "200℃", "170 ℃", "150℃"]}, {"n": 105, "answer": 2, "question": "800 公克的帶蓋土司在正常的狀態下，給予 200℃烤溫，烤焙所需時間 為？", "options": ["15～20 分", "35～40 分", "55～60 分", "1 小時以上"]}, {"n": 106, "answer": 4, "question": "下列那一種麵包，烤焙時間最短？", "options": ["800 公克的帶蓋土司", "450 公克的圓頂葡萄乾土司", "350 公克的法國麵包", "90 公克包餡的甜麵包"]}, {"n": 107, "answer": 3, "question": "下列那一種麵包必需使用蒸氣烤爐？", "options": ["甜麵包", "丹麥麵包", "硬式麵包", "葡萄乾麵包"]}, {"n": 108, "answer": 1, "question": "圓烤盤，其直徑為 22 公分、高 5 公分其容積為？", "options": ["1899.7 立方公分", "1997.7 立方公分", "7598.8 立方公分", "110 立方公分"]}, {"n": 109, "answer": 2, "question": "長方型烤盤，其長為 30 公分、寬為 22 公分、高為 5 公分，其容積為？", "options": ["3300 平方公分", "3300 立方公分", "660 平方公分", "660 立方公分"]}, {"n": 110, "answer": 2, "question": "低成分重奶油蛋糕，採用何種攪拌方法為宜？", "options": ["麵粉油脂拌合法", "糖油 拌合法", "兩步拌合法", "糖水拌合法"]}, {"n": 111, "answer": 4, "question": "何種攪拌方法能節省人工和縮短攪拌時間？", "options": ["糖油拌合法", "麵粉油脂拌 合法", "糖水拌合法", "直接法"]}, {"n": 112, "answer": 3, "question": "麵糊類蛋糕的麵糊溫度應該是？", "options": ["10℃", "15℃", "22℃", "30℃ 在這個溫 度的麵糊所烤出來的蛋糕，體積最大，內部組織細膩"]}, {"n": 113, "answer": 4, "question": "下列何種蛋糕在烘焙時不可擦防粘油脂？", "options": ["海綿蛋糕", "重奶油蛋糕", "輕 奶油蛋糕", "天使蛋糕"]}, {"n": 114, "answer": 1, "question": "理想的海綿蛋糕麵糊比重為", "options": ["0.46", "0.56", "0.66", "0.76 左右"]}, {"n": 115, "answer": 3, "question": "利用糖油拌合法製作丹麥小西餅(Danish cookies)，材料中的麵粉應在最後 加入，輕輕拌勻，其主要的原因為？", "options": ["容易吸收水分", "好控制麵粉量", "避免攪拌出筋", "防止破壞打發的氣泡"]}, {"n": 116, "answer": 4, "question": "菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其 原因為？", "options": ["不需最後發酵", "需較高濕度發酵", "需較高溫度發酵", "避免高濕高溫的發酵使菠蘿皮融解而化開"]}, {"n": 117, "answer": 1, "question": "50～100 公克左右的甜麵包，其烤焙應？", "options": ["上火為主，下火為輔", "只用上火", "下火為主，上火為輔", "只用下火"]}, {"n": 118, "answer": 2, "question": "以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？", "options": ["硬", "粗糙", "細膩", "沒影響"]}, {"n": 119, "answer": 2, "question": "戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？", "options": ["組織較軟", "拌入其他材料時易消泡", "體積較大", "不影響蛋糕品質"]}, {"n": 120, "answer": 2, "question": "可以減少海綿蛋糕出爐時收縮的程度為？", "options": ["選用麵筋較強的麵粉", "烤焙 時間避免過久", "烤盤擦油", "減少配方中的用油量"]}, {"n": 121, "answer": 4, "question": "添加下列那一項材料不會增加蛋糕的柔軟度？", "options": ["糖", "油", "蛋黃", "麵粉"]}, {"n": 122, "answer": 1, "question": "一般麵糊類蛋糕烤熟與否的判斷方法？", "options": ["以探針試探或以手輕拍", "以顏 色判斷即可", "時間一到即可出爐", "敲烤盤邊聽聲音判斷"]}, {"n": 123, "answer": 3, "question": "切割蛋糕用的刀子，下列那一種方式既可防止細菌污染又可達到切面整齊 的要求？", "options": ["洗淨使用", "以布擦拭後使用", "浸在沸水中燙一次，切一次", "在沸水中燙一次用布擦一下使用"]}, {"n": 124, "answer": 4, "question": "煮製檸檬布丁餡時檸檬汁在？", "options": ["與水一道加入", "與玉米澱粉拌勻加入", "糖水部分煮沸後加入", "待餡煮好後加入拌勻"]}, {"n": 125, "answer": 3, "question": "製作丹麥麵包整形宜在？", "options": ["近烤爐邊", "一般的工作間", "在溫度較低的場所", "與溫度無關，在那裡整形皆可"]}, {"n": 126, "answer": 3, "question": "麵粉的 pH 值變小時，小西餅的體積", "options": ["不變", "變大", "變小", "變厚"]}, {"n": 127, "answer": 1, "question": "餅乾用麵粉，若酸度偏高時，配方中應提高？", "options": ["小蘇打", "水", "氧化劑", "油脂 的用量"]}, {"n": 128, "answer": 1, "question": "蘇打餅乾成品的 pH 值比一般奶油小西餅為？", "options": ["高", "相同", "低", "測不出 來"]}, {"n": 129, "answer": 4, "question": "下列那種因素不會影響麵包攪拌時間？", "options": ["攪拌速度不同", "配方不同", "攪拌機型式不同", "攪拌人員不同"]}, {"n": 130, "answer": 1, "question": "正常情況下，甜麵包麵糰之攪拌時間，應比白土司麵包？", "options": ["長", "短", "一樣", "不受限制"]}];const TEACHER_PASSWORD='1212';let answers={},submitted=false,idx=0;const $=id=>document.getElementById(id);
function speak(text){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';speechSynthesis.speak(u)}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function render(){const root=$('questions');root.innerHTML='';qs.forEach((q,i)=>{let d=document.createElement('section');d.className='card';let title=document.createElement('div');title.className='q';title.textContent=`${q.n}. ${q.question}`;d.append(title);let rb=document.createElement('button');rb.className='secondary';rb.textContent='朗讀題目';rb.onclick=()=>speak(q.question);d.append(rb);q.options.forEach((o,j)=>{let lab=document.createElement('label');lab.className='opt';let inp=document.createElement('input');inp.type='radio';inp.name='q'+q.n;inp.value=j+1;inp.checked=answers[q.n]===j+1;inp.onchange=()=>{answers[q.n]=j+1;updateProgress()};let txt=document.createElement('span');txt.textContent=`${String.fromCharCode(65+j)}. ${o}`;lab.append(inp,txt);lab.onclick=()=>{if(!submitted)setTimeout(()=>speak(o),0)};d.append(lab)});root.append(d)});updateProgress()}
function updateProgress(){let n=Object.keys(answers).length;$('progressText').textContent=`已作答 ${n} / ${qs.length} 題`;$('progress').style.width=(n/qs.length*100)+'%';$('submit').disabled=n!==qs.length}
$('start').onclick=()=>{$('intro').classList.add('hidden');$('exam').classList.remove('hidden');render();window.onbeforeunload=()=>submitted?undefined:'測驗尚未提交，離開頁面將無法恢復作答。'};
$('readAll').onclick=()=>{stop();let text=qs.map(q=>`${q.n}題。${q.question}。${q.options.map((o,i)=>`${String.fromCharCode(65+i)}，${o}`).join('。')}`).join('。下一題。');speak(text)};$('stopRead').onclick=stop;
$('submit').onclick=()=>{if(Object.keys(answers).length!==qs.length)return;if(!confirm('確定提交？提交後不可重新作答。'))return;submitted=true;stop();window.onbeforeunload=null;$('exam').classList.add('hidden');$('locked').classList.remove('hidden')};
$('unlock').onclick=()=>{if($('pw').value!==TEACHER_PASSWORD){$('pwmsg').textContent='密碼錯誤';return}$('locked').classList.add('hidden');let score=0;qs.forEach(q=>{if(answers[q.n]===q.answer)score++});let out=$('result');out.classList.remove('hidden');out.innerHTML=`<div class="card"><h2>測驗成績：${score} / ${qs.length}（${Math.round(score/qs.length*100)} 分）</h2><h3>作答總結</h3></div>`;qs.forEach(q=>{let ok=answers[q.n]===q.answer;let d=document.createElement('div');d.className='card';d.innerHTML=`<strong>${q.n}. ${ok?'答對':'答錯'}</strong><p>${q.question}</p><p>作答：${String.fromCharCode(64+answers[q.n])}. ${q.options[answers[q.n]-1]}</p><p>正確答案：${String.fromCharCode(64+q.answer)}. ${q.options[q.answer-1]}</p>`;out.append(d)})};
</script></body></html>
