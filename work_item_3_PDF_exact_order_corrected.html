const questions=[{"id":1,"question":"烤焙時若遇到產品不滿一盤時，可做以下之處理方式才不致於烤焙不均？","options":["白紙打濕置於空盤處","報紙打濕置於空盤處","將多餘麵糊倒掉不用","空盤處墊錫箔紙"],"answer":"A"},{"id":2,"question":"製作鬆餅摺疊次數以下列何者為佳？","options":["3 折法×1 次","3 折法×2 次","3 折法×4 次","3 折法×6 次"],"answer":"C"},{"id":3,"question":"良好的鬆餅製作環境室溫宜控制在？","options":["5℃±5℃","20℃±5℃","35℃±5℃","45℃±5℃"],"answer":"B"},{"id":4,"question":"製作大量手工丹麥小西餅，粉與糖油拌勻時應留意？","options":["分次攪拌","一次攪拌完成","糖油不需打發即可與粉拌勻","麵粉不經 過篩即可與糖油拌勻 ，方不致麵糰乾硬而不易成型"],"answer":"A"},{"id":5,"question":"經攪拌後之蛋白糖以手指勾起成山峰狀，倒置而不彎曲，此階段稱為？","options":["起泡狀","濕性發泡","乾性發泡","棉花狀"],"answer":"C"},{"id":6,"question":"麵糊類蛋糕之配方中油脂含量60％以下者，其麵糊攪拌不宜用？","options":["糖油拌和法","麵粉油脂拌和法","直接拌和法","兩步拌和法"],"answer":"B"},{"id":7,"question":"烘烤小型或薄層體積之蛋糕，爐溫宜控制為","options":["上小／下大","上大／下小","上大／下大","上小／下小"],"answer":"B"},{"id":8,"question":"製作甜麵包時，配方中蛋量和水量加起來為62％，如今已知使用3 公斤麵粉，蛋 量為240g，應添加多少水？","options":["1,520g","1,620g","1,720g","1,820g"],"answer":"B"},{"id":9,"question":"欲控制攪拌後麵糰溫度，以直接法製作時與下列那項因素無關？","options":["室溫","粉溫（或材料溫度）","機器攪拌所產生的摩擦溫度","中種麵 糰溫度"],"answer":"D"},{"id":10,"question":"製作麵包有時要翻麵（punching），下列那一項與翻麵的好處無關？","options":["使麵糰內部溫度均勻","更換空氣，促進酵母發酵","縮短攪拌時間","促進麵筋擴展，增加麵筋氣體保留性"],"answer":"C"},{"id":11,"question":"欲使麵包烤焙後高度一定，後發酵時間常需和麵包烤焙彈性（oven spring）配合， 當烤焙彈性大的麵包，入爐時間應","options":["提早","延後","不變","隨便"],"answer":"A"},{"id":12,"question":"製作硬式麵包，一般使用的後發酵條件，溫度、濕度以下列那一項較適宜？","options":["42℃、90％","38℃、85％","35℃、75％","10℃、60％"],"answer":"C"},{"id":13,"question":"使用分割滾圓機分割麵糰，假如機器分割麵糰每分鐘30 粒每個50g，現有60 公 斤麵糰多少時間可分割完？","options":["20 分","30 分","40 分","50 分"],"answer":"C"},{"id":14,"question":"在沒有空調的室內做麵包時，中間發酵時間，很容易受氣候影響，若要控制中間 發酵的溫度和濕度，下列那一項最適當？","options":["35℃、85％","20℃、85％","28℃、75～80％","38℃、85％"],"answer":"C"},{"id":15,"question":"製作麵包在發酵過程中，麵糰的酸鹼度（pH 值）會？","options":["上升","下降","不變","有時高、有時低"],"answer":"B"},{"id":16,"question":"下列何者不是在製作麵包發酵後產物？","options":["二氧化碳（CO2）","氨（NH3）","熱","酒精"],"answer":"B"},{"id":17,"question":"麵包製作採烘焙百分比，其配方總和為250％，若使用麵粉25 公斤，在不考慮損 耗之狀況下，可產出麵糰？","options":["100 公斤","75 公斤","62.5 公斤","50 公斤"],"answer":"C"},{"id":18,"question":"以中種法製作蘇打餅乾，中種麵糰之攪拌應攪拌至？","options":["捲起階段","麵筋擴展階段","麵筋完成階段","麵筋斷裂階段"],"answer":"A"},{"id":19,"question":"奶油小西餅若以機器成型，每次擠出7 個，每個麵糰重10 公克，機器轉速（r.p.m） 為50 次/分，現有麵糰35 公斤，需幾分鐘擠完？","options":["10 分鐘","20 分鐘","40 分鐘","50 分鐘"],"answer":"A"},{"id":20,"question":"線切小西餅，若以機器成型，每次可切出7 個，機器轉速為40 次/分，現有麵糰 28 公斤，共花了20 分鐘切完，則每個麵糰重為？","options":["5 公克","7 公克","8 公克","10 公克"],"answer":"A"},{"id":21,"question":"烤焙麵包時使用那一種的能源品質最好？","options":["瓦斯","電","柴油","重油"],"answer":"A"},{"id":22,"question":"製作奶油空心餅若麵糊較硬，則其殼較？","options":["厚","薄","軟","不影響"],"answer":"A"},{"id":23,"question":"鬆餅（如眼鏡酥），其膨大的主要原因是？","options":["酵母產生的二氧化碳","發粉分解產生的二氧化碳","水經加熱形成水蒸氣","攪拌時拌入的空氣經加熱膨脹"],"answer":"C"},{"id":24,"question":"奶油空心餅，蛋的最低用量為麵粉的？","options":["70％","80％","90％","100％"],"answer":"D"},{"id":25,"question":"戚風類蛋糕其膨大的最主要因素是？","options":["蛋白中攪拌入空氣","塔塔粉","蛋黃麵糊部分的攪拌","水"],"answer":"A"},{"id":26,"question":"標準土司麵包配方內水的用量應為","options":["45～50％","51～55％","60～64％","66～70％"],"answer":"C"},{"id":27,"question":"麵粉含水量比標準減少1％時，則麵包麵糰攪拌時配方內水的用量可隨著增加","options":["0％","2％","4％","6％"],"answer":"B"},{"id":28,"question":"製作麵包時麵粉筋性較弱，應採用何種攪拌速度？","options":["快速","中速","慢速","先用快速再改慢速"],"answer":"B"},{"id":29,"question":"海綿蛋糕攪拌有冷攪拌法和熱攪拌法，熱攪拌法是先將蛋加溫至？","options":["25℃以下","25～30℃","35～43℃","50℃以上"],"answer":"C"},{"id":30,"question":"海綿蛋糕配方中各項材料百分比加起來得180％，已知麵糊總量為9 公斤，其麵 粉的用量應為","options":["3.5 公斤","4 公斤","4.5 公斤","5 公斤"],"answer":"D"},{"id":31,"question":"蛋白經攪拌後最易與其他原料拌合且進爐後膨脹力最好的階段是？","options":["起泡狀態","濕性發泡","乾性發泡","棉花狀態"],"answer":"B"},{"id":32,"question":"麵包配方經試驗為正確，但烤焙後其表皮顏色經常深淺不一，下列何者不是可能 原因？","options":["烤爐溫度不平均","冷卻不足","發酵","整型的關係"],"answer":"B"},{"id":33,"question":"天使蛋糕蛋白應打到何種程度，成品膨脹能力較佳？","options":["乾性發泡","濕性發泡","棉花狀","顆粒狀"],"answer":"B"},{"id":34,"question":"烤焙用具（塑膠製品除外）貯放前最好之處理方式？","options":["用抹布擦淨","洗淨烤乾","洗淨用抹布擦乾","洗後自然涼乾"],"answer":"B"},{"id":35,"question":"奶油空心餅成品底部凹陷大，是因為在製作時？","options":["技術好","烤盤油擦太多","底火太弱","上火太強"],"answer":"B"},{"id":36,"question":"為使奶油空心餅在烤焙後表皮品質及膨大性良好，在進烤爐前可噴（ ） 於麵糊表面？","options":["油","膨脹劑","蛋白","水"],"answer":"D"},{"id":37,"question":"奶油空心餅成品內部缺乏空囊是因為？","options":["麵糊太乾","配方內油的用量太少","使用化學膨脹劑","麵糊糊化程度 良好"],"answer":"A"},{"id":38,"question":"鬆餅（起酥，puff pastry）的麵糰軟硬度比其裹入用油脂的軟硬度應（ ）， 則能達到最佳效果？","options":["較硬","一致","較軟","無關"],"answer":"B"},{"id":39,"question":"烘焙鬆餅（起酥，puff pastry），除了以蒸氣控制表皮外，應先使用（ ） 烤焙？","options":["大火","小火","上火","下火"],"answer":"A"},{"id":40,"question":"為使小西餅成品帶有金黃色色澤，配方中可使用？","options":["澱粉","奶粉","防腐劑","抗氧化劑"],"answer":"B"},{"id":41,"question":"酵母油炸甜圈餅（酵母道納司，yeast doughnuts）所使用的配方，大致上與甜麵包 類似，然在為求成品之品質與形狀之完整性，則酵母油炸甜圈餅（酵母道納司， yeast doughnuts）配方中的糖與油脂，較甜麵包配方？","options":["高","少","相等","視情況而定"],"answer":"B"},{"id":42,"question":"下列何種原料之組合不適宜製作夏季透明性涼果類產品？","options":["玉米澱粉、果汁","果膠、果汁","洋菜、果汁","吉利丁（gelatine）、 果汁"],"answer":"A"},{"id":43,"question":"調整配方時，下列何者材料不會使麵包麵糰較軟？","options":["水","糖","油","麵粉"],"answer":"D"},{"id":44,"question":"調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？","options":["水","糖","油","麵粉"],"answer":"A"},{"id":45,"question":"800 公克的帶蓋土司在正常的狀態下，給予200℃烤溫，烤焙所需時間為？","options":["15～20 分","35～40 分","55～60 分","1 小時以上"],"answer":"B"},{"id":46,"question":"下列那一種麵包，烤焙時間最短？","options":["800 公克的帶蓋土司","450 公克的圓頂葡萄乾土司","350 公克的法國麵包","90 公克包餡的甜麵包"],"answer":"D"},{"id":47,"question":"下列那一種麵包必需使用蒸氣烤爐？","options":["甜麵包","丹麥麵包","硬式麵包","葡萄乾麵包"],"answer":"C"},{"id":48,"question":"何種攪拌方法能節省人工和縮短攪拌時間？","options":["糖油拌合法","麵粉油脂拌合法","糖水拌合法","直接法"],"answer":"D"},{"id":49,"question":"麵糊類蛋糕的麵糊溫度應該是（ ）在這個溫度的麵糊所烤出來的蛋糕， 體積最大，內部組織細膩？","options":["10℃","15℃","22℃","30℃"],"answer":"C"},{"id":50,"question":"下列何種蛋糕在烘焙時不可擦防粘油脂？","options":["海綿蛋糕","重奶油蛋糕","輕奶油蛋糕","天使蛋糕"],"answer":"D"},{"id":51,"question":"理想的海綿蛋糕麵糊比重為（ ）左右","options":["0.46","0.56","0.66","0.76"],"answer":"A"},{"id":52,"question":"利用糖油拌合法製作丹麥小西餅（Danish cookies），材料中的麵粉應在最後加入， 輕輕拌勻，其主要的原因為？","options":["容易吸收水分","好控制麵粉量","避免攪拌出筋","防止破壞打發的氣 泡"],"answer":"C"},{"id":53,"question":"戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？","options":["組織較軟","拌入其他材料時易消泡","體積較大","不影響蛋糕品質 ,"options":["配方中牛奶量太多","煮時爐火太小","煮時攪拌太慢","快速冷卻"],"answer":"C"},{"id":74,"question":"製作布丁餡甜麵包的布丁餡，那一項不是以零分計？","options":["布丁餡不凝固","布丁餡凝固且光滑","布丁餡有焦黑顆粒或結顆粒","布丁餡堅硬如羊羹"],"answer":"B"},{"id":75,"question":"製作布丁餡甜麵包，成品直徑9.5 公分（含）以上，高度5 公分（含）以上，下 列何者不是「不良品」？","options":["高度4 公分","成品直徑8 公分","高度4.5 公分","成品直徑10 公分"],"answer":"D"},{"id":76,"question":"全素業者製作布丁餡時，那一項不是選用的材料？","options":["豆漿","牛奶","馬鈴薯澱粉","椰漿"],"answer":"B"},{"id":77,"question":"全素業者製作布丁餡甜麵包時，添加油脂會選用","options":["奶油","人造奶油","全素用烤酥油","烤酥油"],"answer":"C"},{"id":78,"question":"製作圓形貓舌小西餅時，那一項不是以不良品計？","options":["成品不呈平整","成品不呈圓片狀","成品質地硬脆","成品週邊無擴展 成尖薄狀"],"answer":"C"},{"id":79,"question":"全素業者製作葡萄乾燕麥紅糖小西餅時，那一項不是選用的材料？","options":["燕麥片","豆漿粉","奶粉","鷹嘴豆汁液"],"answer":"C"},{"id":80,"question":"選用那一項材料打發起泡效果最差？","options":["鷹嘴豆汁液","椰子鮮奶油（Coconut Cream）","乳清","沙拉油"],"answer":"D"}];
let answers={},pos=0,submitted=false;
const $=id=>document.getElementById(id);
function begin(){answers={};pos=0;submitted=false;$("intro").classList.add("hidden");$("locked").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");render();}
function render(){let q=questions[pos];$("counter").textContent=`第 ${pos+1} / 80 題`;$("qhead").textContent=`原題第 ${q.id} 題`;$("stem").textContent=q.question;$("opts").innerHTML="";
["A","B","C","D"].forEach(letter=>{let label=document.createElement("label");label.className="option";let radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.value=letter;radio.checked=answers[q.id]===letter;radio.onchange=()=>{answers[q.id]=letter;progress();};label.appendChild(radio);
let body=document.createElement("div");body.innerHTML=`<b>(${letter})</b> `;body.appendChild(document.createTextNode(q.options[letter.charCodeAt(0)-65]));label.appendChild(body);$("opts").appendChild(label);});
$("prev").disabled=pos===0;$("next").disabled=pos===79;progress();}
function progress(){let n=Object.keys(answers).length;$("answered").textContent=`已作答 ${n} / 80`;$("bar").style.width=(n/80*100)+"%";}
function speech(text){if(!("speechSynthesis" in window)){alert("此瀏覽器不支援語音報讀，請改用 Safari 或 Chrome。");return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="zh-TW";u.rate=0.9;speechSynthesis.speak(u);}
function spoken(q,all){let s=`第${q.id}題。${q.question}。`;if(all){["A","B","C","D"].forEach(k=>{s+=`選項${k}。${q.options[k.charCodeAt(0)-65]}。`;});}return s;}
$("start").onclick=begin;$("prev").onclick=()=>{if(pos>0){speechSynthesis.cancel();pos--;render();}};$("next").onclick=()=>{if(pos<79){speechSynthesis.cancel();pos++;render();}};
$("readQ").onclick=()=>speech(spoken(questions[pos],false));$("readAll").onclick=()=>speech(spoken(questions[pos],true));$("stopRead").onclick=()=>speechSynthesis.cancel();
$("submit").onclick=()=>{let n=Object.keys(answers).length;if(n<80&&!confirm(`目前尚有 ${80-n} 題未作答，未作答視為答錯。確定交卷？`))return;if(!confirm("交卷後將鎖定答案，確定交卷？"))return;submitted=true;speechSynthesis.cancel();$("quiz").classList.add("hidden");$("locked").classList.remove("hidden");};
$("unlock").onclick=()=>{if(!submitted){$("pwmsg").textContent="尚未交卷。";return;}if($("pw").value!=="1234"){$("pwmsg").textContent="密碼錯誤，請重新輸入。";return;}showResults();};
function showResults(){let wrong=questions.filter(q=>answers[q.id]!==q.answer);let correct=80-wrong.length;$("locked").classList.add("hidden");$("results").classList.remove("hidden");$("score").textContent=`${(correct*1.25).toFixed(2)} 分 / 100 分`;$("stats").textContent=`答對 ${correct} 題；答錯 ${wrong.length} 題；未作答 ${questions.filter(q=>!answers[q.id]).length} 題。`;
$("wrongList").innerHTML="";if(!wrong.length){$("wrongList").textContent="全部答對，沒有錯題。";return;}
wrong.forEach(q=>{let div=document.createElement("div");div.className="result-item";let correctText=`正確答案：(${q.answer}) ${q.options[q.answer.charCodeAt(0)-65]}`;let stem=document.createElement("div");stem.textContent=q.question;let head=document.createElement("b");head.textContent=`原題第 ${q.id} 題`;let ans=document.createElement("div");ans.className="correct";ans.textContent=correctText;div.append(head,stem,ans);$("wrongList").appendChild(div);});}
$("again").onclick=()=>{$("results").classList.add("hidden");$("intro").classList.remove("hidden");$("pw").value="";$("pwmsg").textContent="";};
</script></body></html>
