<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>烘焙食品丙級｜原料加強題 → 71-90</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:auto}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}
h1{font-size:19px;margin:0 0 4px}.sub{font-size:13px;color:#666}
main{padding:14px 12px 80px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.notice{background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7;margin-bottom:16px}
.stage{display:inline-block;padding:5px 10px;border-radius:999px;background:#eee;font-size:13px;font-weight:700;margin-bottom:12px}
.qhead{display:flex;justify-content:space-between;color:#666;font-weight:700;font-size:14px;margin-bottom:10px}
.question{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d6d6d6;border-radius:12px;padding:14px;margin:10px 0;font-size:17px;line-height:1.5;cursor:pointer}
.option.selected{border:2px solid #222;background:#f3f3f3}
.nav{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:14px 16px;font-size:17px;cursor:pointer}
.prev{background:#eee;color:#222;flex:1}.next{background:#222;color:#fff;flex:1}.submit{background:#6b2f2f;color:#fff;width:100%;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:8px;background:#e8e8e8;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.fill{height:100%;background:#222}
.score{font-size:38px;font-weight:900;margin:8px 0}
.result-title{font-size:24px;font-weight:900}
.wrong-list{margin-top:18px}
.wrong-item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;line-height:1.65}
.wrong-q{font-weight:800}
.action{width:100%;border:0;border-radius:12px;background:#555;color:#fff;padding:14px;font-size:17px;margin-top:16px;cursor:pointer}
.pass{background:#edf8f1;border-radius:12px;padding:14px;line-height:1.7;margin-top:16px}
.fail{background:#fff0f0;border-radius:12px;padding:14px;line-height:1.7;margin-top:16px}
.small{font-size:13px;color:#777;line-height:1.5;margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
<h1>烘焙食品丙級｜原料加強題 → 71～90</h1>
<div class="sub" id="status">第一階段：加強題 1～9</div>
</div></header>

<main class="wrap">
<section id="start" class="card">
<div class="stage">兩階段測驗</div>
<div class="result-title">先完成 9 題加強題</div>
<div class="notice">
第一階段共 <strong>9 題</strong>，必須 <strong>9／9 全對</strong>才會進入第二階段。<br>
通過後自動進入<strong>原料 71～90，共 20 題</strong>。<br>
兩階段都不會在作答時顯示答案，完成後才統整成績與錯題。
</div>
<button class="btn next" id="startBtn" style="width:100%">開始第一階段</button>
</section>

<section id="quiz" class="card hidden"></section>
<section id="result" class="card hidden"></section>
</main>

<script>
const DATA = {"stage1":[{"id":"S1-1","display":"加強題 1","q":"小麥胚芽中富含油脂，其主要之脂肪酸為？","opts":["亞麻仁油酸","棕櫚酸","硬脂酸","月桂酸"],"ans":0},{"id":"S1-2","display":"加強題 2","q":"小麥製粉時，與其出粉率成正比者為？","opts":["灰分含量","麩皮含量","水分含量","蛋白質含量"],"ans":0},{"id":"S1-3","display":"加強題 3","q":"麵粉中添加維生素 C 作為改良劑之主要效用為？","opts":["增加甜味","熟成作用","降低水分","增加油脂含量"],"ans":1},{"id":"S1-4","display":"加強題 4","q":"蛋糕用麵粉一般由何種麥所磨製？","opts":["軟質冬麥","硬質春麥","杜蘭小麥","裸麥"],"ans":0},{"id":"S1-5","display":"加強題 5","q":"食品用水溶於油（W／O）之乳化劑，其親水親油平衡值（HLB）之範圍介於？","opts":["3.5～6","7～9","10～14","15～18"],"ans":0},{"id":"S1-6","display":"加強題 6","q":"食品用油溶於水（O／W）之乳化劑，其親水親油平衡值（HLB）之範圍介於？","opts":["1～4","3.5～6","8～18","19～25"],"ans":2},{"id":"S1-7","display":"加強題 7","q":"製作轉化糖漿時，以下列何種酸水解得到之品質最佳？","opts":["鹽酸","醋酸","酒石酸","檸檬酸"],"ans":2},{"id":"S1-8","display":"加強題 8","q":"雞蛋蛋白的脂肪含量為？","opts":["0％","5％","10％","15％"],"ans":0},{"id":"S1-9","display":"加強題 9","q":"下列何者為小麥製粉主要的目的？","opts":["增加麵粉的甜味","使麩皮、胚芽與胚乳部分分離","提高麵粉中的油脂含量","使所有成分完全混合"],"ans":1}],"stage2":[{"id":"71","display":"原題第 71 題","q":"依 CNS 所謂全麥麵包，其全麥麵粉的用量應為？","opts":["20％","30％","40％","50％以上"],"ans":0},{"id":"72","display":"原題第 72 題","q":"使用蒸發奶水代替鮮奶時，應照鮮奶用量？","opts":["等量使用","1/3 蒸發奶水加 2/3 水","2/3 蒸發奶水加 1/3 水","1/2 蒸發奶水加 1/2 水"],"ans":3},{"id":"73","display":"原題第 73 題","q":"欲生產良好的烘焙產品下列條件何者不是？","opts":["好的原料","純熟的技術","好的設備","好的裝潢"],"ans":3},{"id":"74","display":"原題第 74 題","q":"夾心餅乾之夾心用油脂，通常需要數個月之保存、流通，因此宜使用？","opts":["花生油","沙拉油","葵花油","椰子油"],"ans":3},{"id":"75","display":"原題第 75 題","q":"烘焙用油脂的融點愈高，其口溶性？","opts":["愈好","愈差","無關","差不多"],"ans":1},{"id":"76","display":"原題第 76 題","q":"食品衛生管理法規定烘焙油脂中合成抗氧化劑的總量不得超過？","opts":["50 ppm","200 ppm","400 ppm","0.1％"],"ans":1},{"id":"77","display":"原題第 77 題","q":"麵粉之蛋白質組成成分中缺乏？","opts":["丙苯胺酸","離胺酸","麩胺酸","半胱胺酸"],"ans":1},{"id":"78","display":"原題第 78 題","q":"不是派餡用來做膠凍原料有？","opts":["玉米澱粉","動物膠","雞蛋","果膠"],"ans":3},{"id":"79","display":"原題第 79 題","q":"製作蛋糕道納司所使用之膨脹劑是？","opts":["酵母","發粉（B.P）","油脂","小蘇打（B.S）"],"ans":1},{"id":"80","display":"原題第 80 題","q":"製作蛋白霜飾所需要之主原料是？","opts":["蛋黃","全蛋","蛋白和糖","蛋黃和糖"],"ans":2},{"id":"81","display":"原題第 81 題","q":"一個中型雞蛋去殼後約重？","opts":["40公克","50公克","60公克","70公克"],"ans":1},{"id":"82","display":"原題第 82 題","q":"麵粉中的蛋白質每增加1％，則吸水量約增加？","opts":["1％","2％","3％","4％"],"ans":1},{"id":"83","display":"原題第 83 題","q":"製作轉化糖漿使用何種糖原料？","opts":["砂糖","麥芽糖","葡萄糖","果糖"],"ans":0},{"id":"84","display":"原題第 84 題","q":"烘焙用乾酪（Cheese）原料，其主要的組成成分為？","opts":["脂肪","蛋白質","醣類","水分"],"ans":1},{"id":"85","display":"原題第 85 題","q":"烘焙產品使用何者糖，在其烤焙時較易產生梅納反應？","opts":["砂糖","麥芽糖","果糖","乳糖"],"ans":2},{"id":"86","display":"原題第 86 題","q":"下列何種油脂含有反式脂肪酸？","opts":["豬油","牛油","橄欖油","花生油"],"ans":1},{"id":"87","display":"原題第 87 題","q":"下列材料中何者不屬於膨脹劑？","opts":["小蘇打","發粉","酵母","可可粉"],"ans":3},{"id":"88","display":"原題第 88 題","q":"下列何種小麥適合製作海綿蛋糕？","opts":["硬質小麥","軟質小麥","杜蘭小麥","高筋小麥"],"ans":1},{"id":"89","display":"原題第 89 題","q":"下列何種性質不是為小麥分類的依據？","opts":["麥粒硬度","麥粒顏色","麥粒蛋白質含量","破損澱粉"],"ans":3},{"id":"90","display":"原題第 90 題","q":"小麥胚乳的主要色素為？","opts":["葉綠素","花青素","葉黃素","胡蘿蔔素"],"ans":3}]};
const LABELS=["①","②","③","④"];
const KEY="baking71_90_gate_v1";

let phase=1, cur=0, answers={}, stage1Score=0, stage2Score=0, stage1Wrong=[], stage2Wrong=[], submitted=false;

const $=id=>document.getElementById(id);

function esc(s){
  return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function save(){
  localStorage.setItem(KEY,JSON.stringify({phase,cur,answers,stage1Score,stage2Score,stage1Wrong,stage2Wrong,submitted}));
}
function load(){
  try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}
}
function questions(){
  return phase===1?DATA.stage1:DATA.stage2;
}
function updateStatus(){
  const total=questions().length;
  $("status").textContent=(phase===1?"第一階段｜加強題 ":"第二階段｜原料71～90｜")+"第 "+(cur+1)+"／"+total+" 題";
}
function render(){
  const qs=questions(),q=qs[cur];
  updateStatus();
  $("start").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  const pct=((cur+1)/qs.length*100);
  $("quiz").innerHTML=`
    <div class="stage">${phase===1?"第一階段：加強題":"第二階段：原料71～90"}</div>
    <div class="qhead"><span>${q.display}</span><span>${cur+1} / ${qs.length}</span></div>
    <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
    <div class="question">${esc(q.q)}</div>
    <div id="opts">${q.opts.map((o,i)=>`<button class="option ${answers[cur]===i?"selected":""}" data-i="${i}">${LABELS[i]} ${esc(o)}</button>`).join("")}</div>
    <div class="nav">
      <button class="btn prev" id="prev" ${cur===0?"disabled":""}>← 上一題</button>
      <button class="btn next" id="next">${cur===qs.length-1?"檢查作答":"下一題 →"}</button>
    </div>
    <button class="btn submit hidden" id="submit">交卷</button>
    <div class="small">可以返回上一題修改答案；必須完成本階段全部題目後才能交卷。</div>
  `;

  document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{
    answers[cur]=Number(b.dataset.i);save();render();
  });
  $("prev").onclick=()=>{
    if(cur>0){cur--;save();render();window.scrollTo(0,0);}
  };
  $("next").onclick=()=>{
    if(answers[cur]===undefined){
      alert("請先作答本題。"); return;
    }
    if(cur<qs.length-1){
      cur++;save();render();window.scrollTo(0,0);
    } else {
      if(Object.keys(answers).length!==qs.length){
        alert("尚有未作答題目，請完成後再交卷。"); return;
      }
      $("submit").classList.remove("hidden");
      alert("本階段已全部作答，請按「交卷」。");
    }
  };
  $("submit").onclick=finishPhase;
}
function finishPhase(){
  const qs=questions(),wrong=[];
  let score=0;
  qs.forEach((q,i)=>{
    if(answers[i]===q.ans) score++;
    else wrong.push({display:q.display,q:q.q,a:q.opts[q.ans]});
  });

  if(phase===1){
    stage1Score=score;stage1Wrong=wrong;
    if(score===9){
      phase=2;cur=0;answers={};save();
      $("quiz").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("status").textContent="第一階段通過";
      $("result").innerHTML=`
        <div class="result-title">第一階段通過</div>
        <div class="score">9／9</div>
        <div class="pass">9 題全對，現在進入第二階段：原料 71～90。</div>
        <button class="action" id="go2">進入原料 71～90</button>`;
      $("go2").onclick=()=>{$("result").classList.add("hidden");render();};
    } else {
      $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
      $("status").textContent="第一階段未通過";
      const list=wrong.map((x,i)=>`<div class="wrong-item"><div class="wrong-q">${i+1}．${x.display}：${esc(x.q)}</div><div><strong>正確答案：</strong>${esc(x.a)}</div></div>`).join("");
      $("result").innerHTML=`
        <div class="result-title">第一階段未通過</div>
        <div class="score">${score}／9</div>
        <div class="fail">必須 9／9 全對才能進入第二階段。</div>
        <h3>錯誤題目整理（${wrong.length} 題）</h3>${list}
        <button class="action" id="retry1">重新挑戰第一階段</button>`;
      $("retry1").onclick=()=>{
        phase=1;cur=0;answers={};stage1Score=0;stage1Wrong=[];save();render();window.scrollTo(0,0);
      };
    }
  } else {
    stage2Score=score;stage2Wrong=wrong;submitted=true;save();showFinal();
  }
}
function showFinal(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  $("status").textContent="兩階段測驗完成";
  const total=stage1Score+stage2Score, totalMax=29;
  const allWrong=[
    ...stage1Wrong.map(x=>({...x,group:"第一階段加強題"})),
    ...stage2Wrong.map(x=>({...x,group:"第二階段原料71～90"}))
  ];
  const list=allWrong.length===0?"<div class='pass'><strong>29 題全部答對！</strong></div>":
    `<h3>全部錯誤題目整理（${allWrong.length} 題）</h3>`+
    allWrong.map((x,i)=>`<div class="wrong-item">
      <div class="wrong-q">${i+1}．${x.group}｜${esc(x.display)}：${esc(x.q)}</div>
      <div><strong>正確答案：</strong>${esc(x.a)}</div>
    </div>`).join("");
  $("result").innerHTML=`
    <div class="result-title">測驗完成</div>
    <div class="score">${total}／29</div>
    <div>答對率：${Math.round(total/29*100)}%</div>
    <div class="pass">第一階段：${stage1Score}／9　｜　第二階段：${stage2Score}／20</div>
    ${list}
    <button class="action" id="restart">重新從第一階段開始</button>`;
  $("restart").onclick=()=>{
    localStorage.removeItem(KEY);phase=1;cur=0;answers={};stage1Score=0;stage2Score=0;stage1Wrong=[];stage2Wrong=[];submitted=false;
    render();window.scrollTo(0,0);
  };
}
$("startBtn").onclick=()=>{
  phase=1;cur=0;answers={};stage1Score=0;stage2Score=0;stage1Wrong=[];stage2Wrong=[];submitted=false;save();render();
};
const saved=load();
if(saved && saved.submitted){Object.assign(window,{});phase=saved.phase;cur=saved.cur;answers=saved.answers;stage1Score=saved.stage1Score;stage2Score=saved.stage2Score;stage1Wrong=saved.stage1Wrong;stage2Wrong=saved.stage2Wrong;submitted=true;showFinal();}
else if(saved && saved.phase){phase=saved.phase;cur=saved.cur;answers=saved.answers||{};stage1Score=saved.stage1Score||0;stage2Score=saved.stage2Score||0;stage1Wrong=saved.stage1Wrong||[];stage2Wrong=saved.stage2Wrong||[];render();}
</script>
</body>
</html>
