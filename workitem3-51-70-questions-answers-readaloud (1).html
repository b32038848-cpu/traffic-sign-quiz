<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>烘焙食品丙級｜工作項目三 51～70 題目與答案朗讀</title><style>
:root{color-scheme:light;--blue:#2457a7;--ink:#182230;--muted:#687386;--line:#d7dee8;--bg:#f3f5f8;--green:#eaf7ef;--red:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:16px;line-height:1.6}header{background:#244e86;color:#fff;padding:20px 16px}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#e3ecf9;font-size:14px}.wrap{width:min(900px,100%);margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #14213d0a}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:white;font-size:16px;font-weight:700;cursor:pointer}.btn.secondary{background:#e9edf2;color:#233144}.btn:disabled{opacity:.45}.tag{color:var(--muted);font-size:13px;font-weight:700}.qtitle{font-weight:800;font-size:19px;margin:4px 0 14px}.answer{background:var(--green);border-radius:10px;padding:12px;font-weight:800}.small{color:var(--muted);font-size:14px}.hidden{display:none!important}
 .item{margin-bottom:12px}.item:last-child{margin-bottom:0}.anslabel{font-weight:800;color:#14643c}.speak-one{margin-top:10px}button:focus-visible{outline:3px solid #86b7fe;outline-offset:2px}</style></head><body><header><div class="wrap"><h1>烘焙食品丙級｜工作項目三：產品製作</h1><p>第 51～70 題｜只顯示題目與正確答案，不顯示選項</p></div></header><main class="wrap"><section class="card"><p>朗讀內容只有「題目＋正確答案」，不會念出選項。</p><div class="actions"><button class="btn" id="readAll">全部朗讀（題目＋正確答案）</button><button class="btn secondary" id="testSpeech">測試朗讀</button><button class="btn secondary" id="stop">停止朗讀</button></div><p id="speechStatus" class="small" role="status" aria-live="polite">請按「朗讀本題」或「全部朗讀」開始。若無聲音，請確認媒體音量並使用最新版 Chrome、Edge 或 Safari。</p></section><div id="list"></div></main><script>
const QUESTIONS=[{"no": 51, "q": "奶油海綿蛋糕中奶油用量最多可用？", "options": ["10～20％", "21～30％", "31～39％", "40～50％"], "ans": 3}, {"no": 52, "q": "乳沫類蛋糕其麵糊的打發性主要是來自配方中的？", "options": ["油脂", "蛋", "發粉", "麵粉"], "ans": 1}, {"no": 53, "q": "可可粉加入蛋糕配方內時須注意調整其吸水量。製作魔鬼蛋糕時，為增加可口風味，配方中增加 3％的可可粉，則配方中的吸水應該？", "options": ["減少 3％", "增加 3％", "減少 4.5％", "增加 4.5％"], "ans": 3}, {"no": 54, "q": "麵粉含水量比標準減少 1％時，麵包麵糰攪拌時配方內水的用量可隨著增加多少？", "options": ["0％", "2％", "4％", "6％"], "ans": 1}, {"no": 55, "q": "煮製奶油空心餅（泡芙），何者為正確？", "options": ["麵粉、油脂、水同時置於鍋中煮沸", "油脂煮沸即加水、麵粉拌勻", "油脂與水煮沸並不斷攪拌加入麵粉，繼續攪拌加熱至麵粉完全糊化", "水、油脂煮沸即離火，加入麵粉拌勻"], "ans": 2}, {"no": 56, "q": "小西餅的烤焙原則為何？", "options": ["高溫短時間", "高溫長時間", "低溫短時間", "低溫長時間"], "ans": 0}, {"no": 57, "q": "炸油炸甜圈餅（道納司，doughnuts）的油溫以多少為佳？", "options": ["140～150℃", "180～190℃", "210～220℃", "230～240℃"], "ans": 1}, {"no": 58, "q": "奶油空心餅成型後應該如何處理？", "options": ["馬上進爐烘烤", "鬆弛 10 分鐘後進爐", "鬆弛 15 分鐘後進爐", "鬆弛 30 分鐘後進爐"], "ans": 0}, {"no": 59, "q": "製作麵包時麵粉筋性較弱，應採用何種攪拌速度？", "options": ["快速", "中速", "慢速", "先用快速再改慢速"], "ans": 1}, {"no": 60, "q": "裹入油脂為麵糰的 1/4，即表示油脂量為麵糰的多少？", "options": ["20％", "25％", "30％", "35％"], "ans": 1}, {"no": 61, "q": "重奶油蛋糕如欲組織細膩，可以採用哪一種方法？", "options": ["直接法攪拌", "糖油拌合法", "麵粉油脂拌合法", "兩步拌合法"], "ans": 2}, {"no": 62, "q": "麵糰分割重量 600 公克，烤好麵包重量為 540 公克，其烤焙損耗是？", "options": ["5％", "6％", "10％", "15％"], "ans": 2}, {"no": 63, "q": "整形後的丹麥麵包或甜麵包麵糰，如需冷藏，冰箱溫度應為何？", "options": ["-5～0℃", "0～7℃", "11～15℃", "16～20℃"], "ans": 1}, {"no": 64, "q": "烤焙法國麵包時，烤爐內必須有蒸氣設備，蒸氣的壓力與量應如何？", "options": ["壓力大、量小", "只要有蒸氣產生就好", "壓力低、量大", "壓力大、量大"], "ans": 2}, {"no": 65, "q": "海綿蛋糕有冷攪拌法和熱攪拌法，熱攪拌法是先將蛋加溫至多少？", "options": ["25℃以下", "25～30℃", "35～43℃", "50℃以上"], "ans": 2}, {"no": 66, "q": "海綿蛋糕配方中各項材料百分比加起來為 180％，已知麵糊總量為 9 公斤，其麵粉用量應為？", "options": ["3.5 公斤", "4 公斤", "4.5 公斤", "5 公斤"], "ans": 3}, {"no": 67, "q": "蛋白經攪拌後，最易與其他原料拌合且進爐後膨脹力最好的階段是？", "options": ["起泡狀態", "濕性發泡", "乾性發泡", "棉花狀態"], "ans": 1}, {"no": 68, "q": "製作某烘焙食品，麵粉用量為 22 公斤，乳化劑用量為 0.33 公斤，乳化劑所佔烘焙百分比為？", "options": ["1.2％", "1.5％", "1.8％", "2％"], "ans": 1}, {"no": 69, "q": "麵包製程中所說的「醒麵」即是？", "options": ["基本發酵", "延續發酵", "中間發酵", "滾圓"], "ans": 2}, {"no": 70, "q": "麵包配方經試驗為正確，但烤焙後表皮顏色經常深淺不一，下列何者不是可能原因？", "options": ["烤爐溫度不平均", "冷卻不足", "發酵", "整型的關係"], "ans": 1}];
const $=id=>document.getElementById(id);
let speechRunId=0;
let selectedVoice=null;

function setStatus(message, bad=false) {
  const s=$('speechStatus');
  s.textContent=message;
  s.style.color=bad?'#a12626':'#475569';
}

function waitForVoices(timeoutMs=1800) {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return Promise.resolve([]);
  const existing=window.speechSynthesis.getVoices();
  if (existing.length) return Promise.resolve(existing);
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{
      if(done) return;
      done=true;
      clearTimeout(timer);
      window.speechSynthesis.onvoiceschanged=null;
      resolve(window.speechSynthesis.getVoices());
    };
    const timer=setTimeout(finish,timeoutMs);
    window.speechSynthesis.onvoiceschanged=finish;
    window.speechSynthesis.getVoices();
  });
}

function stopSpeech(showStatus=true) {
  speechRunId++;
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); window.speechSynthesis.resume(); } catch (_) {}
  }
  if(showStatus) setStatus('已停止朗讀。');
}

function chooseChineseVoice(voices) {
  return voices.find(v=>/^zh[-_]TW/i.test(v.lang))
      || voices.find(v=>/^zh[-_](HK|MO)/i.test(v.lang))
      || voices.find(v=>/^zh/i.test(v.lang))
      || null;
}

function speakEntries(entries) {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
    setStatus('此瀏覽器不支援語音朗讀。請改用最新版 Chrome、Edge 或 Safari。', true);
    alert('此瀏覽器不支援語音朗讀。請改用最新版 Chrome、Edge 或 Safari 開啟。');
    return;
  }
  // 重要：在使用者點擊的同步事件中立即呼叫 speak，避免等語音清單載入後才失去瀏覽器的使用者操作狀態。
  stopSpeech(false);
  const runId=speechRunId;
  const voices=window.speechSynthesis.getVoices();
  selectedVoice=chooseChineseVoice(voices);
  if(selectedVoice) setStatus(`已啟動朗讀（${selectedVoice.name}／${selectedVoice.lang}）。`);
  else setStatus('已啟動中文朗讀。若無聲音，請檢查媒體音量、靜音設定與系統中文語音。');
  let index=0;
  const next=()=>{
    if(runId!==speechRunId) return;
    if(index>=entries.length) { setStatus('朗讀完成。'); return; }
    const current=index+1;
    const u=new SpeechSynthesisUtterance(entries[index]);
    u.lang=selectedVoice?.lang || 'zh-TW';
    if(selectedVoice) u.voice=selectedVoice;
    u.rate=0.88;
    u.pitch=1;
    u.volume=1;
    u.onstart=()=>{ if(runId===speechRunId) setStatus(`正在朗讀第 ${current}／${entries.length} 段…`); };
    u.onend=()=>{
      if(runId!==speechRunId) return;
      index++;
      if(index<entries.length) setTimeout(next,120);
      else setStatus('朗讀完成。');
    };
    u.onerror=(event)=>{
      if(runId!==speechRunId) return;
      const code=event?.error || 'unknown';
      setStatus(`瀏覽器朗讀錯誤：${code}。請確認媒體音量／靜音，或改用最新版 Chrome、Edge。`, true);
    };
    try {
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(u);
    } catch(err) {
      setStatus('瀏覽器無法啟動朗讀，請改用最新版 Chrome、Edge 或 Safari。', true);
    }
  };
  next();
}

const list=$('list');
QUESTIONS.forEach(q=>{
  const card=document.createElement('section'); card.className='card item';
  const tag=document.createElement('div'); tag.className='tag'; tag.textContent=`第 ${q.no} 題`;
  const title=document.createElement('div'); title.className='qtitle'; title.textContent=q.q;
  const answer=document.createElement('div'); answer.className='answer';
  const label=document.createElement('span'); label.className='anslabel'; label.textContent='正確答案：';
  answer.append(label,document.createTextNode(q.options[q.ans]));
  const button=document.createElement('button'); button.className='btn secondary speak-one'; button.type='button';
  button.textContent='朗讀本題（題目＋正確答案）';
  button.addEventListener('click',()=>speakEntries([`第 ${q.no} 題。${q.q}。正確答案：${q.options[q.ans]}。`]));
  card.append(tag,title,answer,button); list.appendChild(card);
});
$('readAll').addEventListener('click',()=>speakEntries(QUESTIONS.map(q=>`第 ${q.no} 題。${q.q}。正確答案：${q.options[q.ans]}。`)));
$('testSpeech').addEventListener('click',()=>speakEntries(['朗讀測試成功。接下來會朗讀題目與正確答案。']));
$('stop').addEventListener('click',()=>stopSpeech(true));
window.addEventListener('pagehide',()=>stopSpeech(false));
</script></body></html>
