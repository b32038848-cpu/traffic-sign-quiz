<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17365d"><title>烘焙食品丙級｜工作項目三 51～80 重複練習</title><style>
:root{color-scheme:light;--ink:#17212b;--muted:#5b6673;--line:#d8dee6;--blue:#1d4ed8;--blue2:#eaf1ff;--ok:#eaf8ef;--bad:#fff0ef;--surface:#fff;--page:#f4f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
header{background:#17365d;color:#fff;padding:20px 16px}header .wrap,main{max-width:900px;margin:auto}h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:#dce7f5;font-size:14px}
main{padding:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #1322380a}.hidden{display:none!important}.title{font-size:20px;font-weight:800;margin-bottom:8px}.muted{color:var(--muted);font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
button{appearance:none;border:1px solid #c5ced9;border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-weight:700;padding:11px 14px;cursor:pointer;min-height:44px}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.secondary{background:#eef2f7}button:disabled{opacity:.48;cursor:not-allowed}.notice{background:#f7f9fc;border-radius:12px;padding:12px 14px;font-size:14px;color:#374151}
.progress{height:8px;border-radius:99px;background:#e7ebf1;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--blue);width:0;transition:width .2s}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{font-size:13px;background:#eef2f7;padding:5px 9px;border-radius:999px;color:#374151}
.qno{font-size:14px;font-weight:800;color:var(--blue);margin-top:8px}.question{font-size:20px;font-weight:800;line-height:1.6;margin:8px 0 18px}.options{display:grid;gap:10px}.opt{width:100%;display:flex;align-items:center;gap:10px;text-align:left;font-weight:500;line-height:1.45;min-height:54px}.letter{width:29px;height:29px;border-radius:50%;background:#edf1f7;display:inline-flex;flex:0 0 29px;align-items:center;justify-content:center;font-weight:800}.opt.correct{background:var(--ok);border-color:#2c9857}.opt.wrong{background:var(--bad);border-color:#d64545}.opt img{display:block;width:auto;max-width:190px;max-height:115px;object-fit:contain;border-radius:6px}.feedback{margin-top:12px;padding:12px;border-radius:10px}.feedback.ok{background:var(--ok)}.feedback.bad{background:var(--bad)}.score{font-size:36px;font-weight:900;text-align:center;margin:12px}.wrong-item{border-top:1px solid var(--line);padding:12px 0}.wrong-item:first-child{border-top:0}.foot{text-align:center;color:var(--muted);font-size:12px;padding:12px}
input{font:inherit;padding:10px;border:1px solid #c5ced9;border-radius:10px;min-height:44px;width:100%;max-width:240px}@media(max-width:560px){header{padding:16px 13px}h1{font-size:20px}main{padding:10px}.card{padding:14px}.question{font-size:18px}.opt{font-size:16px}.actions button{flex:1}}
</style></head><body>
<header><div class="wrap"><h1>烘焙食品丙級｜工作項目三：產品製作</h1><p>第 51～80 題｜可朗讀｜可重複練習</p></div></header><main>
<section id="start" class="card"><div class="title">工作項目三｜51～80 題練習</div><div class="notice">共 30 題（官方題號 51～80）。開始後每次會重新打亂題目與選項。可朗讀單題或全部題目及選項；作答後會顯示正確答案與說明。完成後可重新練習。</div><div class="actions"><button id="startBtn" class="primary">開始練習</button></div></section>
<section id="quiz" class="card hidden"><div class="row"><span id="progressText" class="badge">第 1／70 題</span><span id="scoreText" class="badge">答對 0 題</span></div><div class="progress"><div id="progressBar"></div></div><div id="qno" class="qno"></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="readThis">🔊 朗讀本題（題目＋選項）</button><button id="nextBtn" class="primary" disabled>下一題</button></div><div class="actions"><button id="readAll" class="secondary">🔊 全部朗讀（題目＋選項）</button><button id="stopBtn" class="secondary">⏹ 停止朗讀</button></div></section>
<section id="result" class="card hidden"><div class="title">練習完成</div><div id="finalScore" class="score"></div><div id="summary" class="muted" style="text-align:center"></div><div class="actions"><button id="retryBtn" class="primary">重新練習（重新排序）</button><button id="resultReadAll" class="secondary">🔊 朗讀全部題目與選項</button><button id="resultStop" class="secondary">⏹ 停止朗讀</button></div><div class="title" style="margin-top:20px">錯題整理</div><div id="wrongList"></div></section><div class="foot">朗讀需由使用者點擊按鈕啟動，音量及語音可受裝置、瀏覽器設定影響。</div></main>
<script>
const BANK=[{"n":51,"q":"奶油海綿蛋糕中奶油用量最多可用？","opts":["10～20％","21～30％","31～39％","40～50％"],"ans":3},{"n":52,"q":"乳沫類蛋糕其麵糊的打發性主要是來自配方中的？","opts":["油脂","蛋","發粉","麵粉"],"ans":1},{"n":53,"q":"可可粉加入蛋糕配方內時須注意調整其吸水量。製作魔鬼蛋糕時，為增加可口風味，配方中增加 3％的可可粉，則配方中的吸水應該？","opts":["減少 3％","增加 3％","減少 4.5％","增加 4.5％"],"ans":3},{"n":54,"q":"麵粉含水量比標準減少 1％時，麵包麵糰攪拌時配方內水的用量可隨著增加多少？","opts":["0％","2％","4％","6％"],"ans":1},{"n":55,"q":"煮製奶油空心餅（泡芙），何者為正確？","opts":["麵粉、油脂、水同時置於鍋中煮沸","油脂煮沸即加水、麵粉拌勻","油脂與水煮沸並不斷攪拌加入麵粉，繼續攪拌加熱至麵粉完全糊化","水、油脂煮沸即離火，加入麵粉拌勻"],"ans":2},{"n":56,"q":"小西餅的烤焙原則為何？","opts":["高溫短時間","高溫長時間","低溫短時間","低溫長時間"],"ans":0},{"n":57,"q":"炸油炸甜圈餅（道納司，doughnuts）的油溫以多少為佳？","opts":["140～150℃","180～190℃","210～220℃","230～240℃"],"ans":1},{"n":58,"q":"奶油空心餅成型後應該如何處理？","opts":["馬上進爐烘烤","鬆弛 10 分鐘後進爐","鬆弛 15 分鐘後進爐","鬆弛 30 分鐘後進爐"],"ans":0},{"n":59,"q":"製作麵包時麵粉筋性較弱，應採用何種攪拌速度？","opts":["快速","中速","慢速","先用快速再改慢速"],"ans":1},{"n":60,"q":"裹入油脂為麵糰的 1/4，即表示油脂量為麵糰的多少？","opts":["20％","25％","30％","35％"],"ans":1},{"n":61,"q":"重奶油蛋糕如欲組織細膩，可以採用哪一種方法？","opts":["直接法攪拌","糖油拌合法","麵粉油脂拌合法","兩步拌合法"],"ans":2},{"n":62,"q":"麵糰分割重量 600 公克，烤好麵包重量為 540 公克，其烤焙損耗是？","opts":["5％","6％","10％","15％"],"ans":2},{"n":63,"q":"整形後的丹麥麵包或甜麵包麵糰，如需冷藏，冰箱溫度應為何？","opts":["-5～0℃","0～7℃","11～15℃","16～20℃"],"ans":1},{"n":64,"q":"烤焙法國麵包時，烤爐內必須有蒸氣設備，蒸氣的壓力與量應如何？","opts":["壓力大、量小","只要有蒸氣產生就好","壓力低、量大","壓力大、量大"],"ans":2},{"n":65,"q":"海綿蛋糕有冷攪拌法和熱攪拌法，熱攪拌法是先將蛋加溫至多少？","opts":["25℃以下","25～30℃","35～43℃","50℃以上"],"ans":2},{"n":66,"q":"海綿蛋糕配方中各項材料百分比加起來為 180％，已知麵糊總量為 9 公斤，其麵粉用量應為？","opts":["3.5 公斤","4 公斤","4.5 公斤","5 公斤"],"ans":3},{"n":67,"q":"蛋白經攪拌後，最易與其他原料拌合且進爐後膨脹力最好的階段是？","opts":["起泡狀態","濕性發泡","乾性發泡","棉花狀態"],"ans":1},{"n":68,"q":"製作某烘焙食品，麵粉用量為 22 公斤，乳化劑用量為 0.33 公斤，乳化劑所佔烘焙百分比為？","opts":["1.2％","1.5％","1.8％","2％"],"ans":1},{"n":69,"q":"麵包製程中所說的「醒麵」即是？","opts":["基本發酵","延續發酵","中間發酵","滾圓"],"ans":2},{"n":70,"q":"麵包配方經試驗為正確，但烤焙後表皮顏色經常深淺不一，下列何者不是可能原因？","opts":["烤爐溫度不平均","冷卻不足","發酵","整型的關係"],"ans":1},{"n":71,"q":"中種麵糰攪拌後理想的溫度應為？","opts":["20～22℃","23～26℃","28～30℃","31～33℃"],"ans":1},{"n":72,"q":"一般乳沫類蛋糕使用蛋白的溫度最好為？","opts":["17～22℃","26～30℃","31～35℃","36～40℃"],"ans":0},{"n":73,"q":"戚風蛋糕蛋白部分要與麵粉拌合最好的階段，是把蛋白攪到哪一種程度？","opts":["液體狀態","濕性發泡","乾性發泡","棉花狀態"],"ans":1},{"n":74,"q":"天使蛋糕蛋白應打到何種程度，成品膨脹能力較佳？","opts":["乾性發泡","濕性發泡","棉花狀","顆粒狀"],"ans":1},{"n":75,"q":"麵包麵糰的中間發酵時間約為？","opts":["25～30分鐘","8～15分鐘","3～5分鐘","0分鐘即可"],"ans":1},{"n":76,"q":"奶油空心餅進爐後，在爐內麵糊出油是因為？","opts":["配方中麵粉用量太多","加蛋時麵糊太冷，無法乳化均勻","加蛋時麵糊溫度太高","配方中蛋的用量太多"],"ans":1},{"n":77,"q":"烤焙用具（塑膠製品除外）貯放前，最好採取哪一種處理方式？","opts":["用抹布擦淨","洗淨烤乾","洗淨用抹布擦乾","洗後自然晾乾"],"ans":1},{"n":78,"q":"奶油空心餅產品內壁呈青色，底部會有很多黑色小孔，是配方中使用過多的哪一種原料？","opts":["蛋","麵粉","碳酸氫銨","油脂"],"ans":2},{"n":79,"q":"奶油空心餅成品底部凹陷大，是因為製作時？","opts":["技術好","烤盤油擦太多","底火太弱","上火太強"],"ans":1},{"n":80,"q":"為使奶油空心餅在烤焙後表皮品質及膨大性良好，進烤爐前可噴哪一種材料於麵糊表面？","opts":["油","膨脹劑","蛋白","水"],"ans":3}];

const LETTERS=['A','B','C','D'];
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function optLabel(o){return typeof o==='string'?o:(o.label||o.spoken||'圖示選項');}
function optSpeak(o){return typeof o==='string'?o:(o.spoken||o.label||'圖示選項，請看螢幕中的圖案');}
function prepare(src){let options=shuffle(src.opts.map((o,i)=>({source:o,label:optLabel(o),isCorrect:i===src.ans,originalIndex:i})));return {n:src.n,q:src.q,options};}
let speechQueue=[],speechBusy=false,speechToken=0;
function stopSpeech(){speechToken++;speechQueue=[];speechBusy=false;if('speechSynthesis'in window)window.speechSynthesis.cancel();}
function speakSegments(parts){if(!('speechSynthesis'in window)){alert('這個瀏覽器不支援語音朗讀，請使用 Chrome、Edge 或 Safari，並允許語音播放。');return;}stopSpeech();const token=speechToken;speechQueue=parts.slice();speechBusy=true;function next(){if(token!==speechToken||!speechBusy)return;const text=speechQueue.shift();if(text===undefined){speechBusy=false;return;}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=0.9;u.pitch=1;u.onend=next;u.onerror=()=>{if(token===speechToken)next();};window.speechSynthesis.speak(u);}next();}
function speakQuestion(q,includeOptions=true){const parts=[`第${q.n}題。${q.q}`];if(includeOptions){q.options.forEach((o,i)=>parts.push(`選項${LETTERS[i]}。${optSpeak(o.source)}`));}return parts;}
function renderOption(o,i){const label=LETTERS[i];const src=o.source;let inner='';if(src&&typeof src==='object'&&src.img){inner=`<span class="letter">${label}</span><span><strong>${safe(src.label||`圖示選項${i+1}`)}</strong><br><img alt="${safe(src.label||`圖示選項${i+1}`)}" src="${src.img}"></span>`;}else{inner=`<span class="letter">${label}</span><span>${safe(o.label)}</span>`;}return inner;}

let test=[],index=0,answers=[],correctCount=0;
const $=id=>document.getElementById(id);
function start(){stopSpeech();test=shuffle(BANK).map(prepare);index=0;answers=Array(test.length).fill(null);correctCount=0;$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();}
function render(){const q=test[index];$('progressText').textContent=`第 ${index+1}／${test.length} 題`;$('scoreText').textContent=`答對 ${correctCount} 題`;$('progressBar').style.width=`${(index/test.length)*100}%`;$('qno').textContent=`第 ${q.n} 題`;$('question').textContent=q.q;$('options').innerHTML='';$('feedback').className='feedback hidden';$('feedback').textContent='';$('nextBtn').disabled=true; q.options.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=renderOption(o,i);b.addEventListener('click',()=>choose(i));$('options').appendChild(b);});}
function choose(i){if(answers[index]!==null)return;answers[index]=i;const q=test[index];const isok=q.options[i].isCorrect;if(isok)correctCount++;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(q.options[j].isCorrect)b.classList.add('correct');else if(j===i)b.classList.add('wrong');});const f=$('feedback');f.className='feedback '+(isok?'ok':'bad');const correct=q.options.find(o=>o.isCorrect);f.textContent=isok?'答對了！':`答錯了。正確答案：${correct.label}`;$('scoreText').textContent=`答對 ${correctCount} 題`;$('nextBtn').disabled=false;$('nextBtn').textContent=index===test.length-1?'查看成績':'下一題';}
function next(){if(answers[index]===null)return;if(index<test.length-1){index++;render();}else finish();}
function finish(){stopSpeech();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=`${correctCount}／${test.length}（${Math.round(correctCount/test.length*100)} 分）`;$('summary').textContent=`已完成 ${test.length} 題；答對 ${correctCount} 題，答錯 ${test.length-correctCount} 題。`;$('wrongList').innerHTML='';test.forEach((q,i)=>{if(q.options[answers[i]]?.isCorrect)return;const good=q.options.find(o=>o.isCorrect);const div=document.createElement('div');div.className='wrong-item';div.innerHTML=`<strong>第 ${q.n} 題：</strong>${safe(q.q)}<br><span class="muted">你的答案：${safe(q.options[answers[i]]?.label||'未作答')}；正確答案：${safe(good.label)}</span>`;$('wrongList').appendChild(div);});if(!$('wrongList').children.length)$('wrongList').innerHTML='<p>本次沒有錯題。</p>';}
$('startBtn').addEventListener('click',start);$('nextBtn').addEventListener('click',next);$('retryBtn').addEventListener('click',start);$('readThis').addEventListener('click',()=>speakSegments(speakQuestion(test[index],true)));$('readAll').addEventListener('click',()=>speakSegments(test.flatMap(q=>speakQuestion(q,true))));$('resultReadAll').addEventListener('click',()=>speakSegments(test.flatMap(q=>speakQuestion(q,true))));$('stopBtn').addEventListener('click',stopSpeech);$('resultStop').addEventListener('click',stopSpeech);
</script></body></html>
