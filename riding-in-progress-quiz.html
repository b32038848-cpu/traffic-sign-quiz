function start(i){roundIndex=i;idx=0;answers=[];locked=false;$('quiz').classList.remove('hidden');$('result').classList.add('hidden');renderRounds();showQuestion()}
function showQuestion(){let q=rounds[roundIndex][idx];locked=false;$('meta').textContent=`第${roundIndex+1}回｜第${idx+1}/${rounds[roundIndex].length}題｜題庫題號 ${q.id}`;$('bar').style.width=`${idx/rounds[roundIndex].length*100}%`;$('stem').textContent=`題號 ${q.id}｜${q.stem}`;$('options').innerHTML='';$('feedback').innerHTML='';$('next').classList.add('hidden');q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=`(${j+1}) ${o}`;b.onclick=()=>choose(j+1);$('options').appendChild(b)})}
function choose(n){if(locked)return;locked=true;let q=rounds[roundIndex][idx],ok=n===q.answer;answers[idx]={qid:q.id,chosen:n,correct:q.answer,ok};[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j+1===q.answer)b.classList.add('correct');if(j+1===n&&!ok)b.classList.add('wrong')});$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').innerHTML=ok?`<b>答對了。</b> 正確答案是第 ${q.answer} 項。`:`<b>答錯了。</b> 正確答案是第 ${q.answer} 項：${q.options[q.answer-1]}`;$('next').textContent=idx===rounds[roundIndex].length-1?'查看本回成績':'下一題';$('next').classList.remove('hidden')}
function next(){if(!locked)return;if(idx<rounds[roundIndex].length-1){idx++;showQuestion()}else finish()}
function finish(){let total=answers.length,correct=answers.filter(a=>a.ok).length,wrong=answers.filter(a=>!a.ok);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=correct;$('percent').textContent=Math.round(correct/total*100)+'%';$('count').textContent=total;$('wrongList').innerHTML=wrong.length?wrong.map(a=>{let q=all.find(x=>x.id===a.qid);return `<div class="wrongitem"><span class="tag">題號 ${a.qid}</span><b>${q.stem}</b><br>你的答案：(${a.chosen}) ${q.options[a.chosen-1]}<br>正確答案：(${a.correct}) ${q.options[a.correct-1]}</div>`}).join(''):'本回全部答對，沒有錯題。';$('bar').style.width='100%'}
$('next').onclick=next;$('restartRound').onclick=()=>start(roundIndex);$('retry').onclick=()=>start(roundIndex);$('back').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.remove('hidden');renderRounds()};start(0);
</script></body></html>
