const QUESTIONS=[{"no": 18, "q": "車禍中不醒人事的骨折傷患，", "opts": ["除非情況緊急，否則不得任意移動", "搬動傷患前，應先處理呼吸困難、出血、骨折等情形", "以上皆是。"], "ans": 3}, {"no": 19, "q": "車禍肇事時，傷者有休克現象時臉色呈", "opts": ["蒼白", "鉛灰色", "潮紅症狀。"], "ans": 1}, {"no": 20, "q": "前方路上發生事故，警察已到現場處理，應如何做比較好？", "opts": ["停在路旁觀看", "繞道離開，不可好奇在現場停留觀看", "留下幫忙順便打卡。"], "ans": 2}, {"no": 21, "q": "速度愈高停車距離：", "opts": ["不變", "愈小", "愈長。"], "ans": 3}, {"no": 22, "q": "如遇油料著火，應即：", "opts": ["用水撲滅", "用滅火器及泥沙或用水浸濕棉被衣服覆蓋撲滅", "就近取樹枝撲滅。"], "ans": 2}, {"no": 23, "q": "發生交通事故時，當事人應儘量在現場尋找：", "opts": ["親朋好友", "目擊證人", "法律人士 以利協助案情釐清。"], "ans": 2}, {"no": 24, "q": "下坡行駛時", "opts": ["可以關閉電門，空檔滑行", "不得將引擎熄火空檔滑行", "無規定。"], "ans": 2}, {"no": 25, "q": "下列哪些地方是高危險區，應避免停駐？", "opts": ["路面正落下小石塊", "有防落石柵處或路邊護欄受撞擊扭曲變形", "以上皆是。"], "ans": 3}, {"no": 26, "q": "駕駛人駕駛汽車肇事致人受傷或死亡者，應即採取救護措施及依規定處置，並通知警察機關處理，不得任意移動肇事汽車及現場痕跡證據，違反者", "opts": ["應處以罰鍰", "車輛沒入", "記違規紀錄 1 次。"], "ans": 1}, {"no": 27, "q": "道路交通事故係指以下何者在道路上行駛，致有人受傷或死亡？", "opts": ["車輛", "動力機械", "以上皆是。"], "ans": 3}, {"no": 28, "q": "下列何者非屬重大道路交通事故？", "opts": ["死亡人數在 3 人以上", "死亡及受傷人數在 10 人以上", "受傷人數在 14 人以下。"], "ans": 3}, {"no": 29, "q": "下列何者係屬重大交通事故？", "opts": ["死亡人數在 3 人以上或死亡及受傷人數在 10 人以上或受傷人數在 15 人以上", "運送之危險物品發生爆炸燃燒或有毒液氣體放射性物質洩漏等事故", "以上皆是。"], "ans": 3}, {"no": 30, "q": "駕駛人駕車肇事，無人受傷或死亡且機車尚能行駛，應優先", "opts": ["等待警察前來處理", "將車輛位置標繪後並迅速移置路邊", "通知保險公司。"], "ans": 2}, {"no": 31, "q": "肇事後在地面標繪相關證物位置後，下列何種狀況應將車輛立即移至路邊，切勿妨礙交通？", "opts": ["輕微事故無人傷亡", "有人重傷", "有人死亡。"], "ans": 1}, {"no": 32, "q": "駕駛人駕駛機車肇事無人受傷或死亡，且機車尚能行駛而不儘速將位置標繪移置路邊，致妨礙交通者處罰", "opts": ["留置該機車", "罰鍰", "扣留牌照。"], "ans": 2}, {"no": 33, "q": "肇事時，若以路權責任歸屬，下列何者為正確：", "opts": ["直行車應讓轉彎車", "先到路口者先行", "轉彎車應讓直行車。"], "ans": 3}, {"no": 34, "q": "有關呼吸、心跳停止的急救常識：暢通呼吸道，檢查呼吸不超過", "opts": ["5 秒鐘", "10 秒鐘", "30 秒鐘。"], "ans": 2}, {"no": 35, "q": "進行 CPR(心肺復甦術)，胸外按壓與人工呼吸之比率，成人為", "opts": ["30：2", "15：2", "5：1。"], "ans": 1}, {"no": 36, "q": "確定傷患無意識時，需進行心肺復甦術，胸部按壓之頻率約為", "opts": ["18 次/每分鐘", "72 次/每分鐘", "100 次/每分鐘。"], "ans": 3}, {"no": 37, "q": "發現傷者哪個部位受傷時，應告知並維持他不受移動？", "opts": ["頸部", "脊椎", "以上皆是。"], "ans": 3}, {"no": 38, "q": "維持呼吸道暢通是急救的首要任務，但如果傷者頸椎受傷，適合哪個方法維持呼吸道暢通？", "opts": ["推下顎法", "抬下巴壓額法", "壓下巴抬額法。"], "ans": 1}, {"no": 39, "q": "下列何者為正確的心外按摩位置？", "opts": ["胸骨外緣", "胸骨上緣", "兩乳頭連線中央胸骨上。"], "ans": 3}, {"no": 40, "q": "下列哪個表徵顯示個案有呼吸道阻塞？", "opts": ["手抱肚子，彎腰一直喊痛", "手抓住頸部無法說話", "手按住胸口無法說話。"], "ans": 2}, {"no": 41, "q": "下列何者需執行哈姆立克氏施救法？", "opts": ["個案昏迷時", "懷疑呼吸道阻塞時", "懷疑心肌梗塞時。"], "ans": 2}, {"no": 42, "q": "當發生車禍時，有名傷者大量出血，下列急救處理方式中何者錯誤?", "opts": ["確定出血位置，剪開衣物，加壓止血", "使用止血帶止血法，並且每隔 15~20 分鐘就鬆開一次", "將出血患肢放置低於心臟的位置，這樣血才不會流太多。"], "ans": 3}, {"no": 43, "q": "CPR(心肺復甦術)在心跳停止多久後必須馬上執行，以免造成腦部不可逆的傷害?", "opts": ["在 10~15 分鐘內", "在 8~10 分鐘內", "在 4~6 分鐘內。"], "ans": 3}, {"no": 44, "q": "施行哈姆立克急救法時，雙手應握拳施力於病人的何處?", "opts": ["肚臍左方", "肚臍下方", "肚臍與胸骨的中間位置。"], "ans": 3}, {"no": 45, "q": "急救的優先做法為何?", "opts": ["把頭擺正", "輕拍病患，並評估意識", "聽診呼吸音。"], "ans": 2}, {"no": 46, "q": "在化學傷害的緊急處理的措施為何?", "opts": ["沖洗患部", "找中和劑", "脫除衣物。"], "ans": 1}, {"no": 47, "q": "因外傷導致腿部出血，下列措施何者適當?", "opts": ["不可使用止血帶，以防患肢壞死", "宜在傷口上加壓止血", "避免抬高患肢。"], "ans": 2}, {"no": 48, "q": "請依急救原則，決定急救順序：A 止血 B 維持呼吸道通暢 C 固定骨折。", "opts": ["A→B→C", "B→C→A", "B→A→C"], "ans": 3}, {"no": 49, "q": "下列有關一氧化碳中毒的敘述，下列何者錯誤?", "opts": ["瓦斯外漏、汽車引擎排出的廢氣都是造成一氧化碳中毒的原因", "患者的皮膚呈黑色", "一氧化碳中毒時，須馬上將患者移出危險環境，並給予 100%氧氣吸入。"], "ans": 2}, {"no": 50, "q": "CPR(心肺復甦術)時觀察患者有無呼吸的方法，不包括下列何者?", "opts": ["看胸部有無起伏", "感覺有無氣體呼出", "摸有無頸動脈跳動。"], "ans": 3}, {"no": 51, "q": "如患者有骨折，下列何者為不適當的急救處置?", "opts": ["移動患者骨折處，擺出能使患者舒服的臥位", "優先處理出血或休克，再以夾板固定患部", "不要隨意移動患者的骨折部位。"], "ans": 1}, {"no": 52, "q": "關於一般傷口的急救法，下列何者錯誤?", "opts": ["先不要做任何處置，應靜待急救人員", "使用流動的水或生理食鹽水來清理傷口", "大量流血時，應用止血法。"], "ans": 1}, {"no": 53, "q": "當發現有人昏迷時，下列何者為首要措施?", "opts": ["直接進行 CPR(心肺復甦術)", "確認患者的意識狀態與脈搏", "立刻使用自動體外去顫器 （AED)。"], "ans": 2}, {"no": 54, "q": "對於意識不清的患者，最好的姿位為下列何者?", "opts": ["半坐臥", "復甦姿勢", "平躺。"], "ans": 2}, {"no": 55, "q": "執行 CPR(心肺復甦術)後，患者已逐漸恢復呼吸及心跳，請問依照現在此患者的狀況，最適合的姿勢為何者?", "opts": ["復甦姿勢", "平躺", "半坐臥。"], "ans": 1}, {"no": 56, "q": "有名患者為大面積的嚴重燒傷，下列處置何者錯誤?", "opts": ["馬上大量沖水", "不管是否傷口沾黏立即脫去衣物", "靜脈注射補充電解質。"], "ans": 2}, {"no": 57, "q": "對於昏迷或是意識不清的患者，要如何幫助其維持體溫?", "opts": ["給予患者熱飲", "使用熱水", "給予覆蓋毛毯。"], "ans": 3}, {"no": 58, "q": "進行 CPR(心肺復甦術)每 2 分鐘，評估效果，應先檢查哪一項？", "opts": ["呼吸", "脈搏", "意識。"], "ans": 2}, {"no": 59, "q": "成人有效的人工呼吸法為何?", "opts": ["口對鼻", "隔空傳氣", "口對口。"], "ans": 3}, {"no": 60, "q": "開始施行心肺復甦術後，不可中斷超過幾秒鐘以上？", "opts": ["10 秒", "13 秒", "15 秒。"], "ans": 1}, {"no": 61, "q": "施行 CPR(心肺復甦術)時，在給予人工呼吸時，若無法吹入氣體則應如何處理？", "opts": ["重新打開呼吸道，再吹 1 口氣", "放棄急救", "馬上施行胸部按壓。"], "ans": 1}, {"no": 62, "q": "CPR(心肺復甦術)實施程序：「叫→叫→C→A→B→D」中的「D」是指", "opts": ["壓額提下巴", "取得 AED(自動體外心臟去顫器)去顫", "死亡。"], "ans": 2}, {"no": 63, "q": "停止施行 CPR(心肺復甦術)的理由為何？", "opts": ["救護人員到達接替救護工作", "傷患已恢復心跳", "以上皆是。"], "ans": 3}, {"no": 64, "q": "血色鮮紅血液連續作噴狀流出係：", "opts": ["靜脈出血", "微血管出血", "動脈出血。"], "ans": 3}, {"no": 65, "q": "斷骨穿出皮外大量流血時，應先", "opts": ["企圖把斷骨推回原位", "止血", "送醫。"], "ans": 2}, {"no": 66, "q": "騎車途中，目睹車禍發生應", "opts": ["儘速駛離現場", "暫留現場協助救護，並向警方處理人員作證", "如有查詢謊稱未看到，以免波及官司。"], "ans": 2}, {"no": 67, "q": "（圖示）標誌代表何者？", "opts": ["路面高突", "路滑", "禁止超車。"], "ans": 2}, {"no": 68, "q": "（圖示）標誌代表何者？", "opts": ["注意右側落石", "斷崖", "注意左側落石。"], "ans": 3}, {"no": 69, "q": "（圖示）標誌代表何者？", "opts": ["注意右側落石", "注意左側落石", "危險路面。"], "ans": 1}, {"no": 70, "q": "（圖示）標誌代表何者？", "opts": ["右側斷崖", "碼頭堤岸", "注意右側落石。"], "ans": 1}, {"no": 71, "q": "（圖示）標誌代表何者？", "opts": ["警告號誌", "危險", "慢行。"], "ans": 2}, {"no": 72, "q": "（圖示）標誌代表何者？", "opts": ["此路不通", "救護站", "醫院。"], "ans": 2}, {"no": 73, "q": "機車發生交通事故後，關於事故現場清除作業，下列敘述何者正確？", "opts": ["事故雙方已完成拍照存證且對責任歸屬無爭議時，得逕行清除現場恢復交通", "應等待肇事處理機關指示後，方可進行現場清除作業", "僅造成車輛輕微損傷且未妨礙交通之事故，得自行清除現場後再行報案。"], "ans": 2}, {"no": 74, "q": "機車發生道路交通事故後，關於車輛移置及報警義務，下列敘述何者正確？", "opts": ["無人傷亡且車輛尚能行駛時，應先標繪車輛位置或以攝影記錄後，將車輛移置不妨礙交通處，並仍應通知警察機關", "無人傷亡且雙方當場和解者，應先標繪車輛位置後移置車輛，但得免通知警察機關", "有人受傷時，無論當事人是否同意，均不得移動車輛，應維持現場完整等待警察到場。"], "ans": 1}, {"no": 75, "q": "機車駕駛人肇事致他人受傷時，關於現場處置之優先順序，下列敘述何者正確？", "opts": ["應先報警並保持現場完整，待警方指示後再對傷者進行救護，以免影響肇責釐清", "應立即對傷者採取救護措施並通知消防機關，同時依規定進行現場標示及報警", "應先以攝影完整記錄現場及傷者位置後，再行救護並報警處理。"], "ans": 2}, {"no": 76, "q": "機車發生交通事故後，關於通報處理之方式，下列敘述何者正確？", "opts": ["應立即撥打 110 報案，簡要說明事故地點、傷亡情形，並依指示進行後續處置", "應先完成現場拍照蒐證及車輛位置標繪後，再行報案以提供較完整之事故資訊", "應先與對方確認雙方損害程度及責任歸屬後，再視情況決定是否報案。"], "ans": 1}, {"no": 77, "q": "駕駛人因違反道路交通管理處罰條例規定，其駕駛執照被吊銷後，除特定重大違規情形外，多久時間內不得重新考領？", "opts": ["應經 1 年", "應經 3 年", "應經 5 年。"], "ans": 1}, {"no": 78, "q": "實行心肺復甦術（CPR）時，關於傷患的姿勢，下列何者正確？", "opts": ["傷患的頭部要高於心臟", "確保傷患仰臥於堅硬的平面上", "可隨意搬動傷患以利急救。"], "ans": 2}, {"no": 79, "q": "當病患疑似頸椎受傷時，急救時應如何處理呼吸道？", "opts": ["使用壓額抬下巴法暢通呼吸道", "小心固定傷患頭頸部後，使用下顎推拉法暢通呼吸道", "先確認是否清醒，再進行心肺復甦術。"], "ans": 2}];let order=[],idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){order=shuffle(QUESTIONS);idx=0;score=0;$("quiz").style.display="block";$("result").style.display="none";render()}
function render(){locked=false;const item=order[idx];$("qno").textContent="第"+item.no+"題";$("question").textContent=item.q;$("score").textContent=score;$("fill").style.width=(idx/order.length*100)+"%";$("feedback").className="fb";$("feedback").textContent="";$("next").disabled=true;$("next").textContent=idx===order.length-1?"查看成績":"下一題";$("options").innerHTML="";item.shuffled=shuffle(item.opts.map((text,i)=>({text,i})));item.shuffled.forEach((o,pos)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=String.fromCharCode(65+pos)+"．"+o.text;b.onclick=()=>choose(o.i,b,item);$("options").appendChild(b)})}
function choose(i,b,item){if(locked)return;locked=true;const bs=[...document.querySelectorAll(".opt")];bs.forEach(x=>x.disabled=true);const cp=item.shuffled.findIndex(o=>o.i===item.ans-1);if(i===item.ans-1){score++;b.classList.add("correct");$("feedback").className="fb show ok";$("feedback").textContent="答對！"}else{b.classList.add("wrong");bs[cp].classList.add("correct");$("feedback").className="fb show bad";$("feedback").textContent="答錯。正確答案："+String.fromCharCode(65+cp)+"．"+item.opts[item.ans-1]}$("score").textContent=score;$("next").disabled=false}
$("next").onclick=()=>{if(!locked)return;if(idx===order.length-1){$("quiz").style.display="none";$("result").style.display="block";$("finalScore").textContent=score+" / "+order.length;$("finalRate").textContent="正確率 "+Math.round(score/order.length*100)+"％"}else{idx++;render();window.scrollTo({top:0,behavior:"smooth"})}}
$("restart").onclick=start;start();
</script></body></html>
