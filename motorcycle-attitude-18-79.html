<script>
const QUESTIONS=[{"no":18,"ans":3,"q":"車禍中不醒人事的骨折傷患，何者正確？","opts":["除非情況緊急，否則不得任意移動","搬動前應先處理呼吸困難、出血、骨折等情形","以上皆是"]},{"no":19,"ans":1,"q":"車禍肇事時，傷者有休克現象，臉色通常呈現何種情形？","opts":["蒼白","鉛灰色","潮紅"]},{"no":20,"ans":2,"q":"前方道路發生事故且警察已到場處理，駕駛人應如何處置？","opts":["停在路旁觀看","繞道離開，不在現場停留觀看","留下幫忙並順便打卡"]},{"no":21,"ans":3,"q":"車速愈高，停車距離會如何變化？","opts":["不變","愈小","愈長"]},{"no":22,"ans":2,"q":"如遇油料著火，應立即如何處理？","opts":["用水撲滅","用滅火器、泥沙，或以浸濕的棉被衣物覆蓋撲滅","就近取樹枝撲滅"]},{"no":23,"ans":2,"q":"發生交通事故時，當事人應儘量在現場尋找何種人員，以協助案情釐清？","opts":["親朋好友","目擊證人","法律人士"]},{"no":24,"ans":2,"q":"下坡行駛時，下列何者正確？","opts":["可以關閉電門、空檔滑行","不得將引擎熄火空檔滑行","沒有相關規定"]},{"no":25,"ans":3,"q":"下列哪些地方是高危險區，應避免停駐？","opts":["路面正落下小石塊","有防落石柵，或路邊護欄受撞擊扭曲變形","以上皆是"]},{"no":26,"ans":1,"q":"駕駛人駕駛汽車肇事致人受傷或死亡，未依規定處置且任意移動肇事汽車及現場痕跡證據，可能受到何種處分？","opts":["處以罰鍰","車輛沒入","記違規紀錄 1 次"]},{"no":27,"ans":3,"q":"道路交通事故係指下列何者在道路上行駛，致有人受傷或死亡？","opts":["車輛","動力機械","以上皆是"]},{"no":28,"ans":3,"q":"下列何者不屬於重大道路交通事故？","opts":["死亡人數在 3 人以上","死亡及受傷人數在 10 人以上","受傷人數在 14 人以下"]},{"no":29,"ans":3,"q":"下列何者屬於重大交通事故？","opts":["死亡人數在 3 人以上，或死亡及受傷人數在 10 人以上，或受傷人數在 15 人以上","運送的危險物品發生爆炸、燃燒，或有毒液、氣體、放射性物質洩漏等事故","以上皆是"]},{"no":30,"ans":2,"q":"駕駛人駕車肇事，無人受傷或死亡且機車尚能行駛，應優先如何處理？","opts":["等待警察前來處理","將車輛位置標繪後迅速移置路邊","通知保險公司"]},{"no":31,"ans":1,"q":"肇事後在地面標繪相關證物位置後，下列何種狀況應將車輛立即移至路邊，切勿妨礙交通？","opts":["輕微事故無人傷亡","有人重傷","有人死亡"]},{"no":32,"ans":2,"q":"駕駛人駕駛機車肇事，無人受傷或死亡且機車尚能行駛，若未儘速標繪位置並移置路邊而妨礙交通，會受到何種處罰？","opts":["留置該機車","罰鍰","扣留牌照"]},{"no":33,"ans":3,"q":"以路權責任歸屬而言，下列何者正確？","opts":["直行車應讓轉彎車","先到路口者先行","轉彎車應讓直行車"]},{"no":34,"ans":2,"q":"有關呼吸、心跳停止的急救常識：暢通呼吸道後，檢查呼吸不超過多久？","opts":["5 秒鐘","10 秒鐘","30 秒鐘"]},{"no":35,"ans":1,"q":"進行 CPR（心肺復甦術）時，成人胸外按壓與人工呼吸的比率為何？","opts":["30：2","15：2","5：1"]},{"no":36,"ans":3,"q":"確定傷患無意識而需進行 CPR，胸部按壓頻率約為多少？","opts":["18 次／每分鐘","72 次／每分鐘","100 次／每分鐘"]},{"no":37,"ans":3,"q":"發現傷者頸部或脊椎受傷時，應告知並維持他不受移動，下列何者正確？","opts":["頸部","脊椎","以上皆是"]},{"no":38,"ans":1,"q":"如果傷者頸椎受傷，適合用哪一種方法維持呼吸道暢通？","opts":["推下顎法","抬下巴壓額法","壓下巴抬額法"]},{"no":39,"ans":3,"q":"下列何者為正確的心外按摩位置？","opts": {"no":62,"ans":2,"q":"CPR 實施程序「叫→叫→C→A→B→D」中的 D 是指什麼？","opts":["壓額提下巴","取得 AED 去顫","死亡"]},{"no":63,"ans":3,"q":"停止施行 CPR 的理由為何？","opts":["救護人員到達接替救護工作","傷患已恢復心跳","以上皆是"]},{"no":64,"ans":3,"q":"血色鮮紅、血液連續作噴狀流出，係何種出血？","opts":["靜脈出血","微血管出血","動脈出血"]},{"no":65,"ans":2,"q":"斷骨穿出皮外並大量流血時，應先做什麼？","opts":["企圖把斷骨推回原位","止血","送醫"]},{"no":66,"ans":2,"q":"騎車途中目睹車禍發生，應如何處理？","opts":["儘速駛離現場","暫留現場協助救護，並向警方處理人員作證","如有查詢謊稱未看到，以免波及官司"]},{"no":67,"ans":2,"q":"（圖示）題目中的標誌代表哪一項？","opts":["路面高突","路滑","禁止超車"]},{"no":68,"ans":3,"q":"（圖示）題目中的標誌代表哪一項？","opts":["注意右側落石","斷崖","注意左側落石"]},{"no":69,"ans":1,"q":"（圖示）題目中的標誌代表哪一項？","opts":["注意右側落石","注意左側落石","危險路面"]},{"no":70,"ans":1,"q":"（圖示）題目中的標誌代表哪一項？","opts":["右側斷崖","碼頭堤岸","注意右側落石"]},{"no":71,"ans":2,"q":"（圖示）題目中的標誌代表哪一項？","opts":["警告號誌","危險","慢行"]},{"no":72,"ans":2,"q":"（圖示）題目中的標誌代表哪一項？","opts":["此路不通","救護站","醫院"]},{"no":73,"ans":2,"q":"機車發生交通事故後，關於事故現場清除作業，下列何者正確？","opts":["事故雙方已完成拍照存證且對責任歸屬無爭議時，得逕行清除現場恢復交通","應等待肇事處理機關指示後，方可進行現場清除作業","僅造成車輛輕微損傷且未妨礙交通之事故，得自行清除現場後再行報案"]},{"no":74,"ans":1,"q":"機車發生道路交通事故後，關於車輛移置及報警義務，下列何者正確？","opts":["無人傷亡且車輛尚能行駛時，先標繪車輛位置或攝影記錄後，將車輛移置不妨礙交通處，並仍應通知警察機關","無人傷亡且雙方當場和解者，標繪後移置車輛即可免通知警察機關","有人受傷時，無論當事人是否同意，均不得移動車輛，應維持現場完整等待警察到場"]},{"no":75,"ans":2,"q":"機車駕駛人肇事致他人受傷時，關於現場處置的優先順序，下列何者正確？","opts":["先報警並保持現場完整，待警方指示後再救護","立即對傷者採取救護措施並通知消防機關，同時依規定進行現場標示及報警","先完整拍照蒐證及標繪位置後，再行救護並報警"]},{"no":76,"ans":1,"q":"機車發生交通事故後，關於通報處理方式，下列何者正確？","opts":["立即撥打 110 報案，說明事故地點、傷亡情形，並依指示處置","先完成拍照蒐證及標繪車輛位置後，再報案","先與對方確認損害程度及責任歸屬後，再決定是否報案"]},{"no":77,"ans":1,"q":"駕駛人因違反道路交通管理處罰條例規定，駕駛執照被吊銷後，除特定重大違規情形外，多久內不得重新考領？","opts":["1 年","3 年","5 年"]},{"no":78,"ans":2,"q":"實行 CPR 時，關於傷患的姿勢，下列何者正確？","opts":["傷患的頭部要高於心臟","確保傷患仰臥於堅硬的平面上","可隨意搬動傷患以利急救"]},{"no":79,"ans":2,"q":"當病患疑似頸椎受傷時，急救時應如何處理呼吸道？","opts":["使用壓額抬下巴法暢通呼吸道","小心固定傷患頭頸部後，使用下顎推拉法暢通呼吸道","先確認是否清醒，再進行心肺復甦術"]}];

const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let order=[],idx=0,score=0,locked=false;
function showImage(no){const box=$("questionImage");box.innerHTML="";box.style.display="none";const url=IMAGE_DATA[String(no)];if(!url)return;const img=document.createElement("img");img.src=url;img.alt="第"+no+"題圖示";img.loading="eager";img.onerror=()=>{box.innerHTML='<div class="img-note">圖示載入失敗</div>';box.style.display="block"};box.appendChild(img);const note=document.createElement("div");note.className="img-note";note.textContent="題庫圖示";box.appendChild(note);box.style.display="block"}
function render(){locked=false;const item=order[idx];$("qno").textContent="第"+item.no+"題";showImage(item.no);$("question").textContent=item.q;$("score").textContent=score;$("fill").style.width=((idx)/order.length*100)+"%";$("feedback").className="feedback";$("feedback").textContent="";$("next").disabled=true;$("next").textContent=idx===order.length-1?"查看成績":"下一題";const box=$("options");box.innerHTML="";item.shuffled=shuffle(item.opts.map((text,i)=>({text,i})));item.shuffled.forEach((o,pos)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=String.fromCharCode(65+pos)+"．"+o.text;b.onclick=()=>choose(o.i,b,item);box.appendChild(b)})}
function choose(i,b,item){if(locked)return;locked=true;const bs=[...document.querySelectorAll(".opt")];bs.forEach(x=>x.disabled=true);const cp=item.shuffled.findIndex(o=>o.i===item.ans-1);if(i===item.ans-1){score++;b.classList.add("correct");$("feedback").className="feedback fb ok";$("feedback").textContent="答對！"}else{b.classList.add("wrong");if(cp>=0)bs[cp].classList.add("correct");$("feedback").className="feedback fb bad";$("feedback").textContent="答錯。正確答案："+String.fromCharCode(65+cp)+"．"+item.opts[item.ans-1]}$("score").textContent=score;$("next").disabled=false;}
$("next").onclick=()=>{if(!locked)return;if(idx===order.length-1){$("quiz").style.display="none";$("result").style.display="block";$("finalScore").textContent=score+" / "+order.length;$("finalRate").textContent="正確率 "+Math.round(score/order.length*100)+"％";$("fill").style.width="100%"}else{idx++;render();window.scrollTo({top:0,behavior:"smooth"})}};
order=shuffle(QUESTIONS);render();
</script></body></html>
