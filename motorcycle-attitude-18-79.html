<section class="card" id="quiz"><div class="head"><div><div class="title">機車駕照｜正確觀念與態度</div><div class="sub">第二階段：第18～79題｜事故預防、急救與相關規定</div></div><div class="sub">答對 <b id="score">0</b> 題</div></div>

</main><script>
const QUESTIONS=[{"no": 18, "q": "車禍中不醒人事的骨折傷患，何者正確？", "opts": ["保持呼吸道暢通", "避免不必要的移動", "以上皆是"], "ans": 3}, {"no": 19, "q": "車禍肇事時，傷者有休克現象時臉色呈何種症狀？", "opts": ["蒼白", "潮紅", "發黑"], "ans": 1}, {"no": 20, "q": "前方路上發生事故，警察已到現場處理，應如何做比較好？", "opts": ["停下觀看事故現場", "繞道離開，不可好奇在現場停留觀看", "按鳴喇叭催促"], "ans": 2}, {"no": 21, "q": "速度愈高，停車距離會如何？", "opts": ["愈短", "不變", "愈長"], "ans": 3}, {"no": 22, "q": "如遇油料著火，應立即如何處理？", "opts": ["用滅火器及泥沙，或用水浸濕棉被、衣服覆蓋撲滅", "用手直接拍打火焰", "繼續行駛等待火勢熄滅"], "ans": 1}, {"no": 23, "q": "發生交通事故時，當事人應儘量在現場尋找何者，以利協助案情釐清？", "opts": ["目擊證人", "路過行人即可", "附近商家人員"], "ans": 1}, {"no": 24, "q": "下坡行駛時，何者正確？", "opts": ["可以將引擎熄火空檔滑行", "不得將引擎熄火空檔滑行", "應熄火滑行以節省燃油"], "ans": 2}, {"no": 25, "q": "下列哪些地方是高危險區，應避免停駐？", "opts": ["隧道內", "彎道處", "以上皆是"], "ans": 3}, {"no": 26, "q": "駕駛人駕車肇事致人受傷或死亡，違反任意移動肇事汽車及現場痕跡證據等規定，如何處分？", "opts": ["應處以罰鍰", "只口頭勸導", "不會處分"], "ans": 1}, {"no": 27, "q": "道路交通事故係指以下何者在道路上行駛，致有人受傷或死亡？", "opts": ["汽車", "機車", "以上皆是"], "ans": 3}, {"no": 28, "q": "下列何者非屬重大道路交通事故？", "opts": ["死亡1人以上", "受傷人數在15人以上", "受傷人數在14人以下"], "ans": 3}, {"no": 29, "q": "下列何者係屬重大交通事故？", "opts": ["死亡3人以上", "受傷人數15人以上", "以上皆是"], "ans": 3}, {"no": 30, "q": "駕車肇事無人受傷或死亡且機車尚能行駛，應優先如何處理？", "opts": ["留在原地等待其他車輛", "將車輛位置標繪後並迅速移置路邊", "立即離開現場"], "ans": 2}, {"no": 31, "q": "肇事後在地面標繪相關證物位置後，下列何種狀況應將車輛立即移至路邊？", "opts": ["輕微事故無人傷亡", "有人死亡", "有人重傷"], "ans": 1}, {"no": 32, "q": "機車肇事無人受傷或死亡，且機車尚能行駛而不儘速移置路邊，致妨礙交通者如何處罰？", "opts": ["罰鍰", "吊銷駕照", "刑事拘留"], "ans": 1}, {"no": 33, "q": "肇事時，若以路權責任歸屬，下列何者正確？", "opts": ["直行車應讓轉彎車", "轉彎車應讓直行車", "兩者都不用讓"], "ans": 2}, {"no": 34, "q": "暢通呼吸道，檢查呼吸不超過多久？", "opts": ["5秒鐘", "10秒鐘", "30秒鐘"], "ans": 2}, {"no": 35, "q": "成人CPR胸外按壓與人工呼吸之比率為？", "opts": ["15：2", "30：2", "5：1"], "ans": 2}, {"no": 36, "q": "心肺復甦術胸部按壓之頻率約為？", "opts": ["60次／分鐘", "80次／分鐘", "100次／分鐘"], "ans": 3}, {"no": 37, "q": "發現傷者哪個部位受傷時，應告知並維持他不受移動？", "opts": ["頭部", "頸部", "以上皆是"], "ans": 3}, {"no": 38, "q": "如果傷者頸椎受傷，適合哪個方法維持呼吸道暢通？", "opts": ["推下顎法", "壓額抬頦法", "直接抬頭"], "ans": 1}, {"no": 39, "q": "下列何者為正確的心外按摩位置？", "opts": ["胸骨下端", "兩乳頭連線中央胸骨上", "腹部正中央"], "ans": 2}, {"no": 40, "q": "下列哪個表徵顯示個案有呼吸道阻塞？", "opts": ["可以正常說話", "手抓住頸部無法說話", "大聲咳嗽且能完整說話"], "ans": 2}, {"no": 41, "q": "下列何者需執行哈姆立克氏施救法？", "opts": ["懷疑呼吸道阻塞時", "輕微擦傷時", "單純腳扭傷時"], "ans": 1}, {"no": 42, "q": "大量出血時，下列急救處理方式中何者錯誤？", "opts": ["直接加壓止血", "使用乾淨布料壓住傷口", "將出血患肢放置低於心臟的位置"], "ans": 3}, {"no": 43, "q": "CPR在心跳停止多久後必須馬上執行，以免造成腦部不可逆的傷害？", "opts": ["1～2分鐘內", "4～6分鐘內", "10～15分鐘後"], "ans": 2}, {"no": 44, "q": "施行哈姆立克急救法時，雙手應握拳施力於病人的何處？", "opts": ["胸骨上方", "肚臍與胸骨的中間位置", "膝蓋上方"], "ans": 2}, {"no": 45, "q": "急救的優先做法為何？", "opts": ["直接餵水", "輕拍病患，並評估意識", "立即要求傷者站起來"], "ans": 2}, {"no": 46, "q": "在化學傷害的緊急處理措施為何？", "opts": ["沖洗患部", "用酒精擦拭", "用布用力摩擦"], "ans": 1}, {"no": 47, "q": "因外傷導致腿部出血，下列措施何者適當？", "opts": ["宜在傷口上加壓止血", "等待自然止血", "讓傷肢持續活動"], "ans": 1}, {"no": 48, "q": "請依急救原則，決定急救順序：A止血、B維持呼吸道通暢、C固定骨折。", "opts": ["A→B→C", "B→A→C", "C→A→B"], "ans": 2}, {"no": 49, "q": "下列有關一氧化碳中毒的敘述，何者錯誤？", "opts": ["患者的皮膚呈粉紅色", "應立即移至通風處", "患者的皮膚呈黑色"], "ans": 3}, {"no": 50, "q": "CPR時觀察患者有無呼吸的方法，不包括下列何者？", "opts": ["看胸部起伏", "聽呼吸聲", "摸有無頸動脈跳動"], "ans": 3}, {"no": 51, "q": "如患者有骨折，下列何者為不適當的急救處置？", "opts": ["移動患者骨折處，擺出能使患者舒服的臥位", "固定患肢", "減少不必要移動"], "ans": 1}, {"no": 52, "q": "關於一般傷口的急救法，下列何者錯誤？", "opts": ["先不要做任何處置，應靜待急救人員", "先加壓止血", "避免污染傷口"], "ans": 1}, {"no": 53, "q": "當發現有人昏迷時，下列何者為首要措施？", "opts": ["確認患者的意識狀態與脈搏", "先餵水", "先讓患者站起來"], "ans": 1}, {"no": 54, "q": "對於意識不清的患者，最好的姿位為何？", "opts": ["站立姿勢", "復甦姿勢", "坐姿"], "ans": 2}, {"no": 55, "q": "執行CPR後，患者已逐漸恢復呼吸及心跳，最適合的姿勢為何？", "opts": ["復甦姿勢", "站立姿勢", "俯臥姿勢"], "ans": 1}, {"no": 56, "q": "大面積嚴重燒傷，下列處置何者錯誤？", "opts": ["保持呼吸通暢", "立即脫去所有沾黏衣物", "等待專業醫療救援"], "ans": 2}, {"no": 57, "q": "對於昏迷或意識不清的患者，要如何幫助其維持體溫？", "opts": ["給予覆蓋毛毯", "用冰水沖全身", "讓患者赤裸散熱"], "ans": 1}, {"no": 58, "q": "進行CPR每2分鐘評估效果，應先檢查哪一項？", "opts": ["意識", "脈搏", "視力"], "ans": 2}, {"no": 59, "q": "成人有效的人工呼吸法為何？", "opts": ["口對口", "口對鼻", "兩者皆非"], "ans": 1}, {"no": 60, "q": "開始施行心肺復甦術後，不可中斷超過幾秒鐘以上？", "opts": ["10秒", "30秒", "60秒"], "ans": 1}, {"no": 61, "q": "施行CPR時，若無法吹入氣體應如何處理？", "opts": ["重新打開呼吸道，再吹1口氣", "停止CPR", "立即餵水"], "ans": 1}, {"no": 62, "q": "CPR實施程序「叫→叫→C→A→B→D」中的「D」是指？", "opts": ["檢查血壓", "取得AED去顫", "確認骨折"], "ans": 2}, {"no": 63, "q": "停止施行CPR的理由為何？", "opts": ["患者已恢復正常呼吸心跳", "專業救護人員接手", "以上皆是"], "ans": 3}, {"no": 64, "q": "血色鮮紅血液連續作噴狀流出係何種出血？", "opts": ["靜脈出血", "微血管出血", "動脈出血"], "ans": 3}, {"no": 65, "q": "斷骨穿出皮外大量流血時，應先如何處理？", "opts": ["止血", "立即將骨頭推回", "讓傷者走動"], "ans": 1}, {"no": 66, "q": "騎車途中，目睹車禍發生應如何處理？", "opts": ["立即離開現場", "暫留現場協助救護，並向警方處理人員作證", "只拿手機拍照後離開"], "ans": 2}, {"no": 67, "q": "圖示標誌代表何者？", "opts": ["路滑", "狹橋", "慢行"], "ans": 1}, {"no": 68, "q": "圖示標誌代表何者？", "opts": ["注意右側落石", "注意左側落石", "危險"], "ans": 2}, {"no": 69, "q": "圖示標誌代表何者？", "opts": ["注意右側落石", "注意左側落石", "隧道"], "ans": 1}, {"no": 70, "q": "圖示標誌代表何者？", "opts": ["右側斷崖", "左側斷崖", "礫頭、堤岸"], "ans": 1}, {"no": 71, "q": "圖示標誌代表何者？", "opts": ["危險", "當心行人", "注意號誌"], "ans": 1}, {"no": 72, "q": "圖示標誌代表何者？", "opts": ["圓環", "救護站", "注意強風"], "ans": 2}, {"no": 73, "q": "機車發生交通事故後，關於事故現場清除作業，下列敘述何者正確？", "opts": ["應等待肇事處理機關指示後，方可進行現場清除作業", "事故後立即自行清理現場即可", "不需保留任何現場資訊"], "ans": 1}, {"no": 74, "q": "機車發生道路交通事故後，關於車輛移置及報警義務，下列敘述何者正確？", "opts": ["無人傷亡且車輛尚能行駛時，應先標繪車輛位置或以攝影記錄後，將車輛移置不妨礙交通處，並仍應通知警察機關", "車輛能行駛就可以直接離開且不用報警", "只需口頭告知對方即可"], "ans": 1}, {"no": 75, "q": "機車駕駛人肇事致他人受傷時，關於現場處置之優先順序，下列敘述何者正確？", "opts": ["先離開現場再報警", "應立即對傷者採取救護措施並通知消防機關，同時依規定進行現場標示及報警", "先拍照再決定是否救護"], "ans": 2}, {"no": 76, "q": "機車發生交通事故後，關於通報處理之方式，下列敘述何者正確？", "opts": ["應立即撥打110報案，簡要說明事故地點、傷亡情形，並依指示進行後續處置", "只需自行處理", "等隔天再報警"], "ans": 1}, {"no": 77, "q": "駕駛人因違反道路交通管理處罰條例規定，其駕駛執照被吊銷後，除特定重大違規情形外，多久時間內不得重新考領？", "opts": ["1年", "3個月", "10年"], "ans": 1}, {"no": 78, "q": "實行心肺復甦術（CPR）時，關於傷患的姿勢，下列何者正確？", "opts": ["確保傷患仰臥於堅硬的平面上", "讓傷患坐著", "讓傷患趴著"], "ans": 1}, {"no": 79, "q": "當病患疑似頸椎受傷時，急救時應如何處理呼吸道？", "opts": ["小心固定傷患頭頸部後，使用下顎推拉法暢通呼吸道", "用力後仰頭部", "讓患者自行處理"], "ans": 1}];let order=[],idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){order=shuffle(QUESTIONS);idx=0;score=0;$("quiz").style.display="block";$("result").style.display="none";render()}
function render(){locked=false;const item=order[idx];$("qno").textContent="第"+item.no+"題";$("question").textContent=item.q;$("score").textContent=score;$("fill").style.width=(idx/order.length*100)+"%";$("feedback").className="fb";$("feedback").textContent="";$("next").disabled=true;$("next").textContent=idx===order.length-1?"查看成績":"下一題";$("options").innerHTML="";item.shuffled=shuffle(item.opts.map((text,i)=>({text,i})));item.shuffled.forEach((o,pos)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=String.fromCharCode(65+pos)+"．"+o.text;b.onclick=()=>choose(o.i,b,item);$("options").appendChild(b)})}
function choose(i,b,item){if(locked)return;locked=true;const bs=[...document.querySelectorAll(".opt")];bs.forEach(x=>x.disabled=true);const cp=item.shuffled.findIndex(o=>o.i===item.ans);if(i===item.ans){score++;b.classList.add("correct");$("feedback").className="fb show ok";$("feedback").textContent="答對！"}else{b.classList.add("wrong");bs[cp].classList.add("correct");$("feedback").className="fb show bad";$("feedback").textContent="答錯。正確答案："+String.fromCharCode(65+cp)+"．"+item.opts[item.ans]}$("score").textContent=score;$("next").disabled=false}
$("next").onclick=()=>{if(!locked)return;if(idx===order.length-1){$("quiz").style.display="none";$("result").style.display="block";$("finalScore").textContent=score+" / "+order.length;$("finalRate").textContent="正確率 "+Math.round(score/order.length*100)+"％"}else{idx++;render();window.scrollTo({top:0,behavior:"smooth"})}}
$("restart").onclick=start;start();
</script></body></html>
