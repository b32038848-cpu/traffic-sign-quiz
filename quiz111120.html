<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#234d68;color:white;padding:20px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #d7e0e8;border-radius:14px;padding:18px;margin:12px 0}button{border:0;border-radius:9px;padding:11px 15px;margin:4px;background:#245b78;color:white;font-size:16px;cursor:pointer}button.secondary{background:#e8edf2;color:#20364f}button.opt{display:block;width:100%;text-align:left;background:white;color:#17202a;border:1px solid #cbd5df;margin:9px 0}button:disabled{cursor:default}.correct{background:#e2f4e8!important;color:#14532d!important}.wrong{background:#ffebeb!important;color:#7f1d1d!important}.hidden{display:none}.q{font-size:20px;font-weight:750;line-height:1.7}.muted{color:#5c6875}.row{display:flex;flex-wrap:wrap;gap:6px}.progress{height:8px;background:#e3e8ee;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#3b78d8}.feedback{padding:12px;border-radius:10px;background:#f0f3f7;margin-top:12px}.score{font-size:32px;font-weight:850}.item{border-bottom:1px solid #e3e8ee;padding:16px 0;line-height:1.7}</style><title>工作項目三｜111～120題重複測驗</title><header><h1>烘焙食品丙級｜工作項目三</h1><div>第 111～120 題｜朗讀＋可重複測驗</div></header><main><section id="start" class="card"><h2>開始練習</h2><p>共 10 題。每次開始會重新打亂題目與選項。答題後立即顯示正誤與正確答案，完成後可查看錯題並重新測驗。</p><button id="startBtn">開始測驗</button></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section></main><script>const BANK=[{"n":111,"q":"何種攪拌方法能節省人工和縮短攪拌時間？","opts":["糖油拌合法","麵粉油脂拌合法","糖水拌合法","直接法"],"a":"直接法"},{"n":112,"q":"麵糊類蛋糕的麵糊溫度應該是？在這個溫度的麵糊所烤出來的蛋糕，體積最大，內部組織細膩。","opts":["10℃","15℃","22℃","30℃"],"a":"22℃"},{"n":113,"q":"下列何種蛋糕在烘焙時不可擦防粘油脂？","opts":["海綿蛋糕","重奶油蛋糕","輕奶油蛋糕","天使蛋糕"],"a":"天使蛋糕"},{"n":114,"q":"理想的海綿蛋糕麵糊比重為多少左右？","opts":["0.46","0.56","0.66","0.76"],"a":"0.46"},{"n":115,"q":"利用糖油拌合法製作丹麥小西餅（Danish cookies），材料中的麵粉應在最後加入，輕輕拌勻，其主要的原因為？","opts":["容易吸收水分","好控制麵粉量","避免攪拌出筋","防止破壞打發的氣泡"],"a":"避免攪拌出筋"},{"n":116,"q":"菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱，其原因為？","opts":["不需最後發酵","需較高濕度發酵","需較高溫度發酵","避免高濕高溫的發酵使菠蘿皮融解而化開"],"a":"避免高濕高溫的發酵使菠蘿皮融解而化開"},{"n":117,"q":"50～100 公克左右的甜麵包，其烤焙應？","opts":["上火為主，下火為輔","只用上火","下火為主，上火為輔","只用下火"],"a":"上火為主，下火為輔"},{"n":118,"q":"以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？","opts":["硬","粗糙","細膩","沒影響"],"a":"粗糙"},{"n":119,"q":"戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？","opts":["組織較軟","拌入其他材料時易消泡","體積較大","不影響蛋糕品質"],"a":"拌入其他材料時易消泡"},{"n":120,"q":"可以減少海綿蛋糕出爐時收縮的程度為？","opts":["選用麵筋較強的麵粉","烤焙時間避免過久","烤盤擦油","減少配方中的用油量"],"a":"烤焙時間避免過久"}];const $=id=>document.getElementById(id);let run=[],idx=0,score=0,wrong=[];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function start(){stop();run=shuffle(BANK).map(x=>({...x,opts:shuffle(x.opts)}));idx=0;score=0;wrong=[];$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()}function show(){let x=run[idx];$('quiz').innerHTML=`<div class="muted">第 ${idx+1} / ${run.length} 題（題庫題號 ${x.n}）</div><div class="progress"><div class="fill" style="width:${idx/run.length*100}%"></div></div><div class="q">${x.q}</div><div id="opts"></div><div class="row"><button class="secondary" id="read">🔊 朗讀題目與選項</button><button class="secondary" id="stop">⏹ 停止朗讀</button></div><div id="feedback"></div>`;x.opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>choose(o);$('opts').appendChild(b)});$('read').onclick=()=>speak(`第${x.n}題。${x.q}。${x.opts.map((o,i)=>`選項${['A','B','C','D'][i]}：${o}。`).join('')}`);$('stop').onclick=stop}function choose(o){stop();let x=run[idx],ok=o===x.a;if(ok)score++;else wrong.push({...x,chosen:o});document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct');if(b.textContent===o&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=`<div class="feedback">${ok?'答對！':'答錯。'} 正確答案：${x.a}</div><button id="next">${idx===run.length-1?'查看成績':'下一題'}</button>`;$('next').onclick=()=>{idx++;if(idx<run.length)show();else finish()}}function finish(){stop();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let pct=Math.round(score/run.length*100);$('result').innerHTML=`<h2>測驗完成</h2><div class="score">${score} / ${run.length} 題（${pct} 分）</div><p>${wrong.length?`答錯 ${wrong.length} 題，請檢視下方錯題。`:'全部答對！'}</p><h3>錯題整理</h3>${wrong.length?wrong.map(x=>`<div class="item"><strong>第 ${x.n} 題：</strong>${x.q}<br>你的答案：${x.chosen}<br><strong>正確答案：${x.a}</strong><br><button class="secondary" data-read="${x.n}">🔊 朗讀錯題與答案</button></div>`).join(''):'<p>沒有錯題。</p>'}<div class="row"><button id="again">🔁 重新測驗</button><button class="secondary" id="stop">⏹ 停止朗讀</button></div>`;document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let x=wrong.find(x=>x.n==b.dataset.read);speak(`第${x.n}題。${x.q}。正確答案：${x.a}。`)});$('again').onclick=start;$('stop').onclick=stop}$('startBtn').onclick=start;</script></html>
