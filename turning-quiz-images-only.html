let currentRound=0,items=[],idx=0,answers=[],wrong=[];
function start(r){currentRound=r;items=Q.slice(r*20, r===0?20:34);idx=0;answers=[];wrong=[];document.getElementById('result').classList.add('hide');document.getElementById('quiz').classList.remove('hide');render()}
function render(){let q=items[idx];document.getElementById('meta').textContent=`第${currentRound+1}回｜第${idx+1}/${items.length}題｜題庫題號 ${q[0]}`;document.getElementById('bar').style.width=((idx)/items.length*100)+'%';document.getElementById('qtitle').textContent='題號 '+q[0]+'｜'+q[2];let qi=document.getElementById('qimage');qi.innerHTML=IMAGES[q[0]]?`<img class="question-image" alt="題號 ${q[0]} 原始題庫圖片" src="${IMAGES[q[0]]}">`:'';let o=document.getElementById('opts');o.innerHTML='';q[3].forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=`(${i+1}) ${v}`;b.onclick=()=>answer(i);o.appendChild(b)});let f=document.getElementById('feedback');f.className='feedback';f.textContent='';document.getElementById('next').classList.add('hide')}
function answer(n){let q=items[idx],ok=n===q[1]-1;answers.push(n);if(!ok)wrong.push({q,chosen:n});[...document.querySelectorAll('.opt')].forEach((b,i)=>{b.disabled=true;if(i===q[1]-1)b.classList.add('correct');if(i===n&&!ok)b.classList.add('wrong')});let f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'答對了！':'答錯了！正確答案：('+q[1]+') '+q[3][q[1]-1]}</strong><br>${q[4]}`;document.getElementById('next').textContent=idx===items.length-1?'查看成績':'下一題';document.getElementById('next').classList.remove('hide')}
function nextQ(){if(idx<items.length-1){idx++;render()}else showResult()}
function showResult(){document.getElementById('quiz').classList.add('hide');document.getElementById('result').classList.remove('hide');let score=answers.filter((a,i)=>a===items[i][1]-1).length;document.getElementById('score').textContent=`${score}／${items.length} 題（${Math.round(score/items.length*100)}分）`;document.getElementById('detail').textContent=`答對 ${score} 題，答錯 ${wrong.length} 題。`;let ol=document.getElementById('wronglist');ol.innerHTML='';wrong.forEach(({q,chosen})=>{let li=document.createElement('li');li.innerHTML=`<b>第${q[0]}題：</b>${q[2]}<br>你的答案：(${chosen+1}) ${q[3][chosen]}<br>正確答案：(${q[1]}) ${q[3][q[1]-1]}`;ol.appendChild(li)});if(!wrong.length)ol.innerHTML='<li>本回合全數答對。</li>'}
</script></body></html>
