const sections={sec1:[1,50],sec2:[51,100],sec3:[101,159]};
function speak(text){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀，請使用手機 Chrome 或 Safari。');return;}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=.88; u.pitch=1; speechSynthesis.speak(u);
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }
function showPage(id){ stopSpeak(); document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }
function render(id,start,end){
  const box=document.getElementById('list-'+id); if(box.dataset.ready) return; box.dataset.ready='1';
  const data=items.filter(x=>x.n>=start && x.n<=end);
  box.innerHTML=data.map(x=>`<article class="card"><div class="no">第 ${x.n} 題</div><div class="q">${x.q}</div><div class="a">答案：${x.a}</div><button class="btn speak" data-speak-one="${x.n}">🔊 朗讀本題</button></article>`).join('');
  box.querySelectorAll('[data-speak-one]').forEach(b=>b.addEventListener('click',()=>{ const n=Number(b.dataset.speakOne); const x=items.find(i=>i.n===n); speak(`第${x.n}題。${x.q}。答案：${x.a}。`); }));
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.go; const [s,e]=sections[id]; render(id,s,e); showPage(id);}));
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>showPage('home')));
document.querySelectorAll('[data-stop]').forEach(b=>b.addEventListener('click',stopSpeak));
document.querySelectorAll('[data-speak-section]').forEach(b=>b.addEventListener('click',()=>{const [s,e]=b.dataset.speakSection.split('-').map(Number); const text=items.filter(x=>x.n>=s&&x.n<=e).map(x=>`第${x.n}題。${x.q}。答案：${x.a}。`).join(''); speak(text);}));
</script>
</body></html>
