<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>烘焙食品丙級｜加強題→原料71-90即時回饋</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:auto}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}
h1{font-size:19px;margin:0 0 4px}.sub{font-size:13px;color:#666}
main{padding:14px 12px 80px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.stage{display:inline-block;padding:5px 10px;border-radius:999px;background:#eee;font-size:13px;font-weight:700;margin-bottom:12px}
.qhead{display:flex;justify-content:space-between;color:#666;font-size:14px;font-weight:700;margin-bottom:10px}
.question{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d7d7d7;border-radius:12px;padding:14px;margin:10px 0;font-size:17px;line-height:1.5;cursor:pointer}
.option:disabled{cursor:default}
.option.correct{border:2px solid #17834d;background:#edf8f1}
.option.wrong{border:2px solid #c73939;background:#fff0f0}
.feedback{display:none;border-radius:12px;padding:14px;margin-top:14px;line-height:1.6}
.feedback.correct{background:#edf8f1}
.feedback.wrong{background:#fff0f0}
.next{display:none;width:100%;border:0;border-radius:12px;background:#222;color:#fff;padding:14px;font-size:17px;margin-top:14px;cursor:pointer}
.progress{height:8px;background:#e8e8e8;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.fill{height:100%;background:#222}
.score{font-size:40px;font-weight:900;margin:8px 0}
.notice{background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7;margin-top:14px}
.wrong-item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;line-height:1.65}
.wrong-q{font-weight:800}
.action{width:100%;border:0;border-radius:12px;background:#555;color:#fff;padding:14px;font-size:17px;margin-top:16px;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
<h1>烘焙食品丙級｜加強題 → 原料 71～90</h1>
<div class="sub" id="status">第一階段：第 1／9 題</div>
</div></header>
<main class="wrap">
<section id="start" class="card">
<div class="stage">第一階段</div>
<h2>加強題 1～9</h2>
<div class="notice">共 9 題，<strong>每題作答後立即顯示正確性與正確答案</strong>。<br>
必須 <strong>9／9 全對</strong> 才能進入下一階段。</div>
<button class="action" id="startBtn">開始測驗</button>
</section>

<section id="quiz" class="card hidden"></section>
<section id="result" class="card hidden"></section>
</main>

<script>
const DATA={"stage1":[{"n":1,"q":"小麥胚芽中富含油脂，其主要之脂肪酸為？","opts":["亞麻仁油酸","棕櫚酸","硬脂酸","月桂酸"],"ans":0},{"n":2,"q":"小麥製粉時，與其出粉率成正比者為？","opts":["灰分含量","麩皮含量","水分含量","蛋白質含量"],"ans":0},{"n":3,"q":"麵粉中添加維生素 C 作為改良劑之主要效用為？","opts":["增加甜味","熟成作用","降低水分","增加油脂含量"],"ans":1},{"n":4,"q":"蛋糕用麵粉一般由何種麥所磨製？","opts":["軟質冬麥","硬質春麥","杜蘭小麥","裸麥"],"ans":0},{"n":5,"q":"食品用水溶於油（W／O）之乳化劑，其親水親油平衡值（HLB）之範圍介於？","opts":["3.5～6","7～9","10～14","15～18"],"ans":0},{"n":6,"q":"食品用油溶於水（O／W）之乳化劑，其親水親油平衡值（HLB）之範圍介於？","opts":["1～4","3.5～6","8～18","19～25"],"ans":2},{"n":7,"q":"製作轉化糖漿時，以下列何種酸水解得到之品質最佳？","opts":["鹽酸","醋酸","酒石酸","檸檬酸"],"ans":2},{"n":8,"q":"雞蛋蛋白的脂肪含量為？","opts":["0％","5％","10％","15％"],"ans":0},{"n":9,"q":"下列何者為小麥製粉主要的目的？","opts":["增加麵粉的甜味","使麩皮、胚芽與胚乳部分分離","提高麵粉中的油脂含量","使所有成分完全混合"],"ans":1}],"stage2":[{"n":71,"q":"依 CNS 所謂全麥麵包，其全麥麵粉的用量應為？","opts":["20％","30％","40％","50％以上"],"ans":0},{"n":72,"q":"使用蒸發奶水代替鮮奶時，應照鮮奶用量？","opts":["等量使用","1/3 蒸發奶水加 2/3 水","2/3 蒸發奶水加 1/3 水","1/2 蒸發奶水加 1/2 水"],"ans":3},{"n":73,"q":"欲生產良好的烘焙產品下列條件何者不是？","opts":["好的原料","純熟的技術","好的設備","好的裝潢"],"ans":3},{"n":74,"q":"夾心餅乾之夾心用油脂，通常需要數個月之保存、流通，因此宜使用？","opts":["花生油","沙拉油","葵花油","椰子油"],"ans":3},{"n":75,"q":"烘焙用油脂的融點愈高，其口溶性？","opts":["愈好","愈差","無關","差不多"],"ans":1},{"n":76,"q":"食品衛生管理法規定烘焙油脂中合成抗氧化劑的總量不得超過？","opts":["50 ppm","200 ppm","400 ppm","0.1％"],"ans":1},{"n":77,"q":"麵粉之蛋白質組成成分中缺乏？","opts":["丙苯胺酸","離胺酸","麩胺酸","半胱胺酸"],"ans":1},{"n":78,"q":"不是派餡用來做膠凍原料有？","opts":["玉米澱粉","動物膠","雞蛋","果膠"],"ans":3},{"n":79,"q":"製作蛋糕道納司所使用之膨脹劑是？","opts":["酵母","發粉（B.P）","油脂","小蘇打（B.S）"],"ans":1},{"n":80,"q":"製作蛋白霜飾所需要之主原料是？","opts":["蛋黃","全蛋","蛋白和糖","蛋黃和糖"],"ans":2},{"n":81,"q":"一個中型雞蛋去殼後約重？","opts":["40公克","50公克","60公克","70公克"],"ans":1},{"n":82,"q":"麵粉中的蛋白質每增加1％，則吸水量約增加？","opts":["1％","2％","3％","4％"],"ans":1},{"n":83,"q":"製作轉化糖漿使用何種糖原料？","opts":["砂糖","麥芽糖","葡萄糖","果糖"],"ans":0},{"n":84,"q":"烘焙用乾酪（Cheese）原料，其主要的組成成分為？","opts":["脂肪","蛋白質","醣類","水分"],"ans":1},{"n":85,"q":"烘焙產品使用何者糖，在其烤焙時較易產生梅納反應？","opts":["砂糖","麥芽糖","果糖","乳糖"],"ans":2},{"n":86,"q":"下列何種油脂含有反式脂肪酸？","opts":["豬油","牛油","橄欖油","花生油"],"ans":1},{"n":87,"q":"下列材料中何者不屬於膨脹劑？","opts":["小蘇打","發粉","酵母","可可粉"],"ans":3},{"n":88,"q":"下列何種小麥適合製作海綿蛋糕？","opts":["硬質小麥","軟質小麥","杜蘭小麥","高筋小麥"],"ans":1},{"n":89,"q":"下列何種性質不是為小麥分類的依據？","opts":["麥粒硬度","麥粒顏色","麥粒蛋白質含量","破損澱粉"],"ans":3},{"n":90,"q":"小麥胚乳的主要色素為？","opts":["葉綠素","花青素","葉黃素","胡蘿蔔素"],"ans":3}]};
const LABELS=["①","②","③","④"];
let phase=1,current=0,score=0,answered=false,wrong=[];
let stage1Score=0,stage1Wrong=[],stage2Score=0,stage2Wrong=[];

const $=id=>document.getElementById(id);
function esc(s){
  return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function qs(){return phase===1?DATA.stage1:DATA.stage2;}
function render(){
  const list=qs(),q=list[current];
  answered=false;
  $("status").textContent=(phase===1?"第一階段｜":"第二階段｜")+"第 "+(current+1)+"／"+list.length+" 題";
  $("start").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  $("quiz").innerHTML=`
    <div class="stage">${phase===1?"第一階段：加強題 1～9":"第二階段：原料 71～90"}</div>
    <div class="qhead"><span>${phase===1?"加強題 "+q.n:"原題第 "+q.n+" 題"}</span><span>${current+1} / ${list.length}</span></div>
    <div class="progress"><div class="fill" style="width:${(current+1)/list.length*100}%"></div></div>
    <div class="question">${esc(q.q)}</div>
    <div id="opts">${q.opts.map((o,i)=>`<button class="option" data-i="${i}">${LABELS[i]} ${esc(o)}</button>`).join("")}</div>
    <div id="feedback" class="feedback"></div>
    <button id="next" class="next">${current===list.length-1?"查看結果":"下一題 →"}</button>
  `;
  document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));
  $("next").onclick=next;
}
function answer(chosen){
  if(answered)return;
  answered=true;
  const q=qs()[current],bs=[...document.querySelectorAll(".option")],fb=$("feedback");
  bs.forEach(b=>b.disabled=true);
  if(chosen===q.ans){
    score++;
    bs[chosen].classList.add("correct");
    fb.className="feedback correct";
    fb.innerHTML="<strong>答對！</strong><br>正確答案："+LABELS[q.ans]+" "+esc(q.opts[q.ans]);
  }else{
    bs[chosen].classList.add("wrong");
    bs[q.ans].classList.add("correct");
    wrong.push({n:q.n,q:q.q,a:q.opts[q.ans]});
    fb.className="feedback wrong";
    fb.innerHTML="<strong>答錯！</strong><br>正確答案："+LABELS[q.ans]+" "+esc(q.opts[q.ans]);
  }
  fb.style.display="block";
  $("next").style.display="block";
}
function next(){
  if(!answered)return;
  const list=qs();
  if(current<list.length-1){current++;window.scrollTo(0,0);render();return;}
  finishPhase();
}
function finishPhase(){
  if(phase===1){
    stage1Score=score;stage1Wrong=wrong.slice();
    if(stage1Score===9){
      phase=2;current=0;score=0;wrong=[];
      $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
      $("status").textContent="第一階段通過";
      $("result").innerHTML=`
        <h2>第一階段通過！</h2><div class="score">9／9</div>
        <div class="notice"><strong>9 題全部答對。</strong><br>現在進入第二階段：原料 71～90。</div>
        <button class="action" id="go2">開始第二階段</button>`;
      $("go2").onclick=()=>render();
    }else{
      $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
      $("status").textContent="第一階段未通過";
      $("result").innerHTML=`
        <h2>第一階段未通過</h2><div class="score">${stage1Score}／9</div>
        <div class="notice">必須 <strong>9／9 全對</strong> 才能進入第二階段。下列為本次錯題：</div>
        ${stage1Wrong.map((x,i)=>`<div class="wrong-item"><div class="wrong-q">${i+1}．加強題 ${x.n}：${esc(x.q)}</div><div><strong>正確答案：</strong>${esc(x.a)}</div></div>`).join("")}
        <button class="action" id="retry1">重新挑戰 9 題</button>`;
      $("retry1").onclick=()=>{
        phase=1;current=0;score=0;wrong=[];stage1Score=0;stage1Wrong=[];
        render();window.scrollTo(0,0);
      };
    }
  }else{
    stage2Score=score;stage2Wrong=wrong.slice();showFinal();
  }
}
function showFinal(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("status").textContent="全部完成";
  const total=stage1Score+stage2Score;
  const allWrong=[...stage1Wrong.map(x=>({...x,group:"第一階段"})),...stage2Wrong.map(x=>({...x,group:"第二階段"}))];
  const list=allWrong.length?allWrong.map((x,i)=>`<div class="wrong-item"><div class="wrong-q">${i+1}．${x.group}｜第 ${x.n} 題：${esc(x.q)}</div><div><strong>正確答案：</strong>${esc(x.a)}</div></div>`).join(""):"<div class='notice'><strong>29 題全部答對！</strong></div>";
  $("result").innerHTML=`
    <h2>測驗完成</h2>
    <div class="score">${total}／29</div>
    <div>第一階段：${stage1Score}／9　｜　第二階段：${stage2Score}／20</div>
    <div style="margin-top:8px">總答對率：${Math.round(total/29*100)}%</div>
    <h3 style="margin-top:20px">錯誤題目整理（${allWrong.length} 題）</h3>
    ${list}
    <button class="action" id="restart">重新開始</button>`;
  $("restart").onclick=()=>{
    phase=1;current=0;score=0;wrong=[];stage1Score=0;stage1Wrong=[];stage2Score=0;stage2Wrong=[];
    render();window.scrollTo(0,0);
  };
}
$("startBtn").onclick=()=>{
  phase=1;current=0;score=0;wrong=[];stage1Score=0;stage1Wrong=[];stage2Score=0;stage2Wrong=[];
  render();
};
</script>
</body>
</html>
