<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#234d68;color:white;padding:20px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #d7e0e8;border-radius:14px;padding:18px;margin:12px 0}button{border:0;border-radius:9px;padding:11px 15px;margin:4px;background:#245b78;color:white;font-size:16px;cursor:pointer}button.secondary{background:#e8edf2;color:#20364f}button.opt{display:block;width:100%;text-align:left;background:white;color:#17202a;border:1px solid #cbd5df;margin:9px 0}button:disabled{cursor:default}.correct{background:#e2f4e8!important;color:#14532d!important}.wrong{background:#ffebeb!important;color:#7f1d1d!important}.hidden{display:none}.q{font-size:20px;font-weight:750;line-height:1.7}.muted{color:#5c6875}.row{display:flex;flex-wrap:wrap;gap:6px}.progress{height:8px;background:#e3e8ee;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#3b78d8}.feedback{padding:12px;border-radius:10px;background:#f0f3f7;margin-top:12px}.score{font-size:32px;font-weight:850}.item{border-bottom:1px solid #e3e8ee;padding:16px 0;line-height:1.7}</style><title>工作項目三｜111～120題題目與答案朗讀</title><header><h1>烘焙食品丙級｜工作項目三</h1><div>第 111～120 題｜題目與正確答案朗讀</div></header><main><section class="card"><p>每題只顯示題目與正確答案，不列選項。可逐題朗讀或連續播放。</p><div class="row"><button id="playAll">▶ 連續朗讀</button><button class="secondary" id="stop">⏹ 停止</button></div><div id="list"></div></section></main><script>const DATA=[{"n": 111, "q": "小麥之橫斷面呈粉質狀者為何？", "a": "低筋麵粉"}, {"n": 112, "q": "小麥之橫斷面呈玻璃質狀者為何？", "a": "高筋麵粉"}, {"n": 113, "q": "麵粉蛋白質是屬於部分不完全蛋白質，因為其胺基酸內缺少了一種必需胺基酸為？", "a": "離胺酸（lysine）"}, {"n": 114, "q": "下列何種胺基酸內含有硫氫根（-SH），並具有還原特性，以影響麵糰之性質？", "a": "半胱胺酸（cysteine）"}, {"n": 115, "q": "小麥胚芽中含有下列何種物質，其含有硫氫根（-SH），會減少麵筋彈性，使麵糰發粘？", "a": "麩胱甘肽"}, {"n": 116, "q": "可以得到麵粉之吸水量、攪拌時間及攪拌耐力之儀器設備為？", "a": "麵糰攪拌特性測定儀（Farinograph）"}, {"n": 117, "q": "測定低筋粉或軟麥麵粉中膠性粘度之儀器設備為？", "a": "連續溫度黏度測定儀（Viscosgraph）"}, {"n": 118, "q": "測定麵筋之伸張力及伸張阻力等品質之儀器設備為？", "a": "麵糰拉力特性測定儀（Extensograph）"}, {"n": 119, "q": "測定麵粉中之液化酵素的儀器設備為？", "a": "麵粉酵素活性測定儀（Amylograph）"}, {"n": 120, "q": "D.E.值（葡萄糖當量）30～50 之澱粉糖漿，其組成成分為？", "a": "糊精、麥芽糖及葡萄糖之混合物"}];const $=id=>document.getElementById(id);function speak(t){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}function stop(){speechSynthesis.cancel()}$('list').innerHTML=DATA.map(x=>`<div class="item"><strong>第 ${x.n} 題</strong><p>${x.q}</p><p><strong>正確答案：${x.a}</strong></p><button class="secondary" data-n="${x.n}">🔊 朗讀本題</button></div>`).join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{stop();let x=DATA.find(x=>x.n==b.dataset.n);speak(`第${x.n}題。${x.q}。正確答案：${x.a}。`)});$('playAll').onclick=()=>{stop();DATA.forEach(x=>speak(`第${x.n}題。${x.q}。正確答案：${x.a}。`))};$('stop').onclick=stop;</script></html>
