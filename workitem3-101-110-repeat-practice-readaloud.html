<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作項目三｜101～110題重複測驗</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:#f5f7fa;color:#17202a}header{background:#20364f;color:white;padding:20px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #dce2e9;border-radius:14px;padding:18px;margin:12px 0}button{border:0;border-radius:10px;padding:12px 15px;margin:4px;background:#244d7a;color:white;font-size:16px;cursor:pointer}button.secondary{background:#e8edf3;color:#20364f}button.opt{display:block;width:100%;text-align:left;background:white;color:#17202a;border:1px solid #cbd5df;margin:9px 0}button.opt:disabled{cursor:default}button.correct{background:#e3f5e9;border-color:#24834c;color:#14532d}button.wrong{background:#ffebeb;border-color:#c43d3d;color:#7f1d1d}.hidden{display:none}.q{font-size:20px;font-weight:750;line-height:1.65}.muted{color:#5c6875}.row{display:flex;flex-wrap:wrap;gap:6px}.score{font-size:34px;font-weight:850}.wrong-item{border-top:1px solid #dce2e9;padding:14px 0;line-height:1.65}.progress{height:8px;background:#e3e8ee;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#3b78d8;width:0}.feedback{padding:12px;border-radius:10px;background:#f0f3f7;margin-top:12px}</style><header><h1>烘焙食品丙級｜工作項目三</h1><div>第 101～110 題｜朗讀＋可重複測驗</div></header><main><section id="start" class="card"><h2>開始練習</h2><p>共 10 題，每次開始會重新打亂題目與選項。答題後立即顯示正誤與正確答案，完成後統整錯題。可隨時重新測驗。</p><button id="startBtn">開始測驗</button></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section></main><script>const BANK=[{"n": 101, "q": "製作轉化糖漿時，以下列何種酸水解得到之品質最佳？", "a": "酒石酸", "opts": ["酒石酸", "檸檬酸", "鹽酸", "醋酸"]}, {"n": 102, "q": "雞蛋蛋白的脂肪含量為？", "a": "0％", "opts": ["0％", "1％", "5％", "10％"]}, {"n": 103, "q": "使用脫脂奶粉代替奶水時，脫脂奶粉對水混合的比例應為？", "a": "10：90", "opts": ["10：90", "20：80", "25：75", "30：70"]}, {"n": 104, "q": "裝飾用鮮奶油加入牛奶攪拌時，牛奶溫度必須保持在多少以下，以避免油水分離？", "a": "10℃", "opts": ["10℃", "15℃", "20℃", "25℃"]}, {"n": 105, "q": "發粉的定義是由小蘇打及酸性鹽混合攪拌而成的一種膨大劑，所產生的二氧化碳量不能低於發粉重量的？", "a": "12％", "opts": ["12％", "8％", "10％", "15％"]}, {"n": 106, "q": "在常溫時不釋出氣體，須於烤焙時才釋出二氧化碳氣體，為？", "a": "慢性反應發粉", "opts": ["慢性反應發粉", "快速反應發粉", "酵母發粉", "碳酸氫鈉"]}, {"n": 107, "q": "製作蛋糕時，為有效地控制釋出均勻且有規則的氣體，常使用？", "a": "雙重反應發粉", "opts": ["雙重反應發粉", "快速反應發粉", "慢性反應發粉", "單一酸性鹽發粉"]}, {"n": 108, "q": "椰子粉的脂肪含量約為？", "a": "60％", "opts": ["60％", "20％", "40％", "80％"]}, {"n": 109, "q": "製作棉花糖時，加入下列何種具有打發起泡特性之膠凍原料？", "a": "動物膠", "opts": ["動物膠", "果膠", "洋菜", "海藻酸鈉"]}, {"n": 110, "q": "下列何種膠凍原料需添加適當比例的糖與酸，才能形成膠體？", "a": "果膠", "opts": ["果膠", "動物膠", "洋菜", "明膠"]}];const $=id=>document.getElementById(id);let run=[],idx=0,score=0,wrong=[];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function speak(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function start(){stop();run=shuffle(BANK).map(x=>({...x,opts:shuffle(x.opts)}));idx=0;score=0;wrong=[];$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()}function show(){let x=run[idx];$('quiz').innerHTML=`<div class="muted">第 ${idx+1} / ${run.length} 題</div><div class="progress"><div class="fill" style="width:${idx/run.length*100}%"></div></div><div class="q">${x.q}</div><div id="opts"></div><div class="row"><button class="secondary" id="read">🔊 朗讀題目與選項</button><button class="secondary" id="stop">⏹ 停止朗讀</button></div><div id="feedback"></div>`;x.opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>choose(o);$('opts').appendChild(b)});$('read').onclick=()=>speak(`第${x.n}題。${x.q}。${x.opts.map((o,i)=>`選項${['A','B','C','D'][i]}：${o}。`).join('')}`);$('stop').onclick=stop}function choose(o){let x=run[idx],ok=o===x.a;if(ok)score++;else wrong.push({...x,chosen:o});document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct');if(b.textContent===o&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=`<div class="feedback">${ok?'答對！':'答錯。'} 正確答案：${x.a}</div><button id="next">${idx===run.length-1?'查看成績':'下一題'}</button>`;$('next').onclick=()=>{idx++;if(idx<run.length)show();else finish()}}function finish(){stop();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let pct=Math.round(score/run.length*100);$('result').innerHTML=`<h2>測驗完成</h2><div class="score">${score} / ${run.length} 題（${pct} 分）</div><p>${wrong.length?`答錯 ${wrong.length} 題，請檢視下方錯題。`:'全部答對！'}</p><h3>錯題整理</h3>${wrong.length?wrong.map(x=>`<div class="wrong-item"><strong>第 ${x.n} 題：</strong>${x.q}<br>你的答案：${x.chosen}<br><strong>正確答案：${x.a}</strong><br><button class="secondary" data-read="${x.n}">🔊 朗讀錯題與答案</button></div>`).join(''):'<p>沒有錯題。</p>'}<div class="row"><button id="again">🔁 重新測驗</button><button class="secondary" id="stop">⏹ 停止朗讀</button></div>`;document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let x=wrong.find(x=>x.n==b.dataset.read);speak(`第${x.n}題。${x.q}。正確答案：${x.a}。`)});$('again').onclick=start;$('stop').onclick=stop}$('startBtn').onclick=start;</script></html>
