<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>烘焙食品丙級｜原料1～50｜題目＋答案報讀版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;user-select:text;-webkit-user-select:text}.wrap{max-width:760px;margin:auto;padding:14px}.header{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #ddd;padding:12px 0}.header h1{margin:0;font-size:20px}.sub{font-size:13px;color:#667085;margin-top:4px}.card{background:#fff;border-radius:16px;padding:17px;margin:13px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}.qno{font-weight:900;color:#667085;margin-bottom:7px}.question{font-size:20px;font-weight:800;line-height:1.6;margin-bottom:10px}.answer{font-size:18px;font-weight:800;line-height:1.6;border-top:1px solid #e5e7eb;padding-top:10px}.btn{width:100%;border:0;border-radius:12px;padding:13px 15px;font-size:17px;margin:6px 0;cursor:pointer}.speak{background:#eef1f4;color:#222}.stop{background:#333;color:#fff}.top{display:flex;gap:8px}.top .btn{flex:1}.small{font-size:13px;color:#697586;line-height:1.6;text-align:center;margin:10px 0}@media(max-width:480px){.question{font-size:19px}.answer{font-size:17px}}</style></head><body><div class="header"><div class="wrap"><h1>烘焙食品丙級｜原料1～50</h1><div class="sub">題目＋答案報讀版｜答案不顯示選項數字</div></div></div><main class="wrap"><div class="card"><div class="top"><button class="btn speak" id="all">🔊 全部朗讀</button><button class="btn stop" id="stop">⏹ 停止朗讀</button></div><div class="small">手機可直接選取文字，也可逐題朗讀。</div></div><div id="list"></div></main><script>const items=[{"n":1,"q":"下列材料中，甜度最低的是？","ans":"乳糖"},{"n":2,"q":"台灣目前使用的白油，每桶重量約為？","ans":"16公斤"},{"n":3,"q":"奶粉的重量 2.2 磅相當於公制單位的？","ans":"1公斤"},{"n":4,"q":"一般天使蛋糕的主要原料為？","ans":"蛋白"},{"n":5,"q":"派皮用的麵粉應以那種麵粉為宜？","ans":"中筋粉"},{"n":6,"q":"塔塔粉是屬？","ans":"酸性鹽"},{"n":7,"q":"不需要使用酵母的烘焙產品是？","ans":"重奶油蛋糕"},{"n":8,"q":"蛋黃中含量最多的成分？","ans":"水"},{"n":9,"q":"蛋白成分除了水以外含量最多的是？","ans":"蛋白質"},{"n":10,"q":"一般最適合於麵包製作的水是？","ans":"中硬度水"},{"n":11,"q":"麵包配方中糖含量（依烘焙百分比）佔20％以上的是？","ans":"甜麵包"},{"n":12,"q":"一般以中種法製作麵包，中種麵糰的原料不含？","ans":"鹽"},{"n":13,"q":"以下那一種原料不屬於化學膨大劑？","ans":"酵母"},{"n":14,"q":"無水奶油是來自於下列那種原料？","ans":"牛奶"},{"n":15,"q":"油脂麵粉與水先煮沸糊化之產品是？","ans":"奶油空心餅"},{"n":16,"q":"下列烘焙用原料較不常使用的是？","ans":"煉乳"},{"n":17,"q":"下列那種油脂約含有10％的氣體（氮氣）？","ans":"雪白乳化油"},{"n":18,"q":"沒有分析檢驗的情況下，下列何者不是由外觀判斷油炸油的劣化？","ans":"酸價為1.0"},{"n":19,"q":"麵包配方中何種材料添加愈多發酵愈快？","ans":"酵母"},{"n":20,"q":"國產麵粉每袋的重量以何種最多？","ans":"22公斤"},{"n":21,"q":"海綿蛋糕配方主要原料為？","ans":"麵粉、細砂糖、蛋"},{"n":22,"q":"下列何種材料可提高小西餅產品的脆性？","ans":"糖"},{"n":23,"q":"若用快速酵母粉取代新鮮酵母時，快速酵母粉的用量應為新鮮酵母的？","ans":"1/3"},{"n":24,"q":"製作某種麵包，使用新鮮酵母4％，今因某種原因需改用快速即發酵母粉，用量應為？","ans":"1.33％"},{"n":25,"q":"配方內使用60％鮮奶製作麵包，比用4％的脫脂奶粉作麵包，其實際奶粉固形量？","ans":"較多"},{"n":26,"q":"下列何種原料不是製作奶油布丁派餡之凝凍原料？","ans":"奶油水"},{"n":27,"q":"蛋白在烘焙原料中屬於那一種性質？","ans":"韌性原料"},{"n":28,"q":"蛋白的含水量為？","ans":"88％"},{"n":29,"q":"巧克力融化加熱方式，最好使用？","ans":"隔水加熱"},{"n":30,"q":"蛋黃成分中所含的油脂具有？","ans":"乳化作用"},{"n":31,"q":"製作蛋糕時，奶粉應屬於？","ans":"韌性材料"},{"n":32,"q":"奶水中含固形物（奶粉）量為？","ans":"12％"},{"n":33,"q":"做蘇打餅乾應注意油脂的？","ans":"安定性好、不易酸敗"},{"n":34,"q":"蒸發奶水含固形物為？","ans":"26％"},{"n":35,"q":"麵包配方使用2％的細砂糖如將糖量增加至4％，則發酵時間會？","ans":"不變"},{"n":36,"q":"麵包配方中正常用糖量如從5％增加為10％，則烤好後的麵包最明顯的不同是？","ans":"表皮顏色加深"},{"n":37,"q":"做麵包時配方中油脂量高，可使麵包表皮？","ans":"柔軟"},{"n":38,"q":"蛋黃之水分含量為？","ans":"50～55％"},{"n":39,"q":"一般奶油或瑪琪琳含水量約為？","ans":"14～22％"},{"n":40,"q":"乳化劑在蛋糕中的功能是？","ans":"融和配方內水和油使組織細膩"},{"n":41,"q":"麵粉中添加活性麵筋粉每增加1％時，則麵粉之吸水量約可提高？","ans":"1.5％"},{"n":42,"q":"新鮮酵母（compressed yeast）水分含量約為？","ans":"65～70％"},{"n":43,"q":"一般烘焙人員所稱的「重曹」（baking soda）是指？","ans":"蘇打粉"},{"n":44,"q":"沙拉油必須密封保存，是因為？","ans":"含不飽和脂肪酸易受氧化酸敗"},{"n":45,"q":"雞蛋中水分含量？","ans":"75％"},{"n":46,"q":"乳化劑在麵包中的功能？","ans":"使麵包柔軟不易老化"},{"n":47,"q":"全蛋的固形物為？","ans":"25％"},{"n":48,"q":"麵包的組織鬆軟好吃，主要是在製作的過程中加入了？","ans":"酵母"},{"n":49,"q":"要使麵包長時間保持柔軟，可在配方內添加？","ans":"乳化劑"},{"n":50,"q":"控制發酵最有效的原料是？","ans":"食鹽"}];function speakText(text){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀，請使用手機 Chrome 或 Safari。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.88;u.pitch=1;speechSynthesis.speak(u)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const list=document.getElementById('list');list.innerHTML=items.map(x=>'<section class="card"><div class="qno">第 '+x.n+' 題</div><div class="question">'+esc(x.q)+'</div><div class="answer">答案：'+esc(x.ans)+'</div><button class="btn speak" data-s="第'+x.n+'題。'+esc(x.q)+'。答案：'+esc(x.ans)+'。">🔊 朗讀本題</button></section>').join('');list.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speakText(b.dataset.s));document.getElementById('all').onclick=()=>speakText(items.map(x=>'第'+x.n+'題。'+x.q+'。答案：'+x.ans+'。').join('　'));document.getElementById('stop').onclick=()=>speechSynthesis.cancel();</script></body></html>
