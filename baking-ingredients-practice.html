<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#222}
.wrap{max-width:680px;margin:auto}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}
h1{font-size:19px;margin:0 0 4px}
#progress{font-size:14px;color:#666}
main{padding:14px 12px 100px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.qnum{font-weight:700;color:#666;margin-bottom:9px}
.question{font-size:20px;line-height:1.55;font-weight:700;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d8d8d8;border-radius:12px;padding:14px;margin:10px 0;font-size:17px;line-height:1.4;cursor:pointer}
.option:active{transform:scale(.99)}
.option.correct{border:2px solid #2e8b57;background:#eef9f1}
.option.wrong{border:2px solid #c94c4c;background:#fff1f1}
.option.disabled{cursor:default}
.feedback{display:none;border-radius:12px;padding:14px;margin-top:16px;font-size:17px;line-height:1.55}
.feedback.show{display:block}
.feedback.ok{background:#eef9f1}
.feedback.bad{background:#fff1f1}
.next{display:none;width:100%;margin-top:14px;background:#222;color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px}
.next.show{display:block}
#result{display:none;text-align:center}
.score{font-size:30px;font-weight:800;margin:8px 0 16px}
.restart{background:#222;color:#fff;border:0;border-radius:12px;padding:13px 20px;font-size:16px}
.tip{font-size:14px;color:#777;margin-top:8px}
</style>
</head>

甲酸丁酯', '④ 山梨酸'], 'ans': '② 丙酸鈉'}, {'n': 60, 'q': '新鮮酵母貯存的最佳溫度為？', 'opts': ['① -18～0℃', '② 2～10℃', '③ 15～20℃', '④ 25～30℃'], 'ans': '② 2～10℃'}, {'n': 61, 'q': '製作麩皮或裸麥麵包，其主要原料的麵粉為？', 'opts': ['① 低筋麵粉', '② 中筋麵粉', '③ 高筋麵粉', '④ 玉米澱粉'], 'ans': '① 高筋麵粉'}, {'n': 62, 'q': '下列那一種油脂其烤酥性最大？', 'opts': ['① 奶油', '② 白油', '③ 豬油', '④ 沙拉油'], 'ans': '③ 豬油'}, {'n': 63, 'q': '製作天使蛋糕時塔塔粉與鹽的用量總和為？', 'opts': ['① 0.5％', '② 1％', '③ 2％', '④ 3％'], 'ans': '② 1％'}, {'n': 64, 'q': '下列那一種糖的甜度最高？', 'opts': ['① 果糖', '② 砂糖', '③ 乳糖', '④ 麥芽糖'], 'ans': '① 果糖'}, {'n': 65, 'q': '製做丹麥麵包或鬆餅，其裹入用油脂應採用？', 'opts': ['① 白油', '② 沙拉油', '③ 奶油', '④ 瑪琪琳'], 'ans': '④ 瑪琪琳'}, {'n': 66, 'q': '麵粉如因貯存太久筋性受損，在做麵包時可酌量在配方內？', 'opts': ['① 增加酵母', '② 增加糖', '③ 使用脫脂奶粉', '④ 增加乳化劑'], 'ans': '③ 使用脫脂奶粉'}, {'n': 67, 'q': '製作高成分奶油海綿蛋糕為降低麵粉的筋性，配方內部分麵粉最好用？', 'opts': ['① 高筋麵粉', '② 中筋麵粉', '③ 小麥澱粉', '④ 裸麥粉'], 'ans': '③ 小麥澱粉'}, {'n': 68, 'q': '乳化油在下列那一項產品較不合適添加？', 'opts': ['① 戚風蛋糕', '② 麵包', '③ 海綿蛋糕', '④ 奶油霜飾'], 'ans': '① 戚風蛋糕'}, {'n': 69, 'q': '蛋糕所用的發粉應為？', 'opts': ['① 單重反應發粉', '② 小蘇打', '③ 雙重反應發粉', '④ 酵母'], 'ans': '③ 雙重反應發粉'}, {'n': 70, 'q': '欲增加小西餅鬆酥的性質可酌量增加？', 'opts': ['① 鹽', '② 糖', '③ 油', '④ 奶粉'], 'ans': '② 油'}];
let current = 0;
let correctCount = 0;
let answered = false;

const quiz = document.getElementById('quiz');
const progress = document.getElementById('progress');
const result = document.getElementById('result');

function renderQuestion() {
  answered = false;
  const x = questions[current];
  progress.textContent = `第 ${current + 1}／${questions.length} 題｜答對 ${correctCount} 題`;
  quiz.innerHTML = `
    <div class="qnum">第 ${x.n} 題</div>
    <div class="question">${escapeHtml(x.q)}</div>
    <div id="options">
      ${x.opts.map((o,i)=>`<button class="option" data-value="${o[0]}">${escapeHtml(o)}</button>`).join('')}
    </div>
    <div id="feedback" class="feedback"></div>
    <button id="next" class="next">${current === questions.length - 1 ? '查看測驗結果' : '下一題 →'}</button>
  `;
  document.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', choose));
  document.getElementById('next').addEventListener('click', nextQuestion);
}

function choose(e) {
  if (answered) return;
  answered = true;
  const chosen = e.currentTarget;
  const x = questions[current];
  const isCorrect = chosen.dataset.value === x.ans[0];

  document.querySelectorAll('.option').forEach(btn => {
    btn.classList.add('disabled');
    btn.disabled = true;
    if (btn.dataset.value === x.ans[0]) btn.classList.add('correct');
  });

  const feedback = document.getElementById('feedback');
  if (isCorrect) {
    correctCount++;
    chosen.classList.add('correct');
    feedback.className = 'feedback show ok';
    feedback.innerHTML = `✅ <strong>答對了！</strong><br>正確答案：${escapeHtml(x.ans)}`;
  } else {
    chosen.classList.add('wrong');
    feedback.className = 'feedback show bad';
    feedback.innerHTML = `❌ <strong>答錯了</strong><br>正確答案：${escapeHtml(x.ans)}`;
  }

  progress.textContent = `第 ${current + 1}／${questions.length} 題｜答對 ${correctCount} 題`;
  document.getElementById('next').classList.add('show');
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    window.scrollTo({top:0,behavior:'smooth'});
    renderQuestion();
  }
}

function showResult() {
  quiz.style.display = 'none';
  result.style.display = 'block';
  const percent = Math.round(correctCount / questions.length * 100);
  result.innerHTML = `
    <div>測驗完成</div>
    <div class="score">${correctCount}／${questions.length} 題</div>
    <div>答對率：${percent}%</div>
    <div class="tip">每題作答後已立即顯示正確答案。</div>
    <br>
    <button class="restart" onclick="restart()">重新開始</button>
  `;
  progress.textContent = `測驗完成｜答對 ${correctCount} 題`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart() {
  current = 0;
  correctCount = 0;
  result.style.display = 'none';
  quiz.style.display = 'block';
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

renderQuestion();
</script>
</body>
</html>
