<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>烘焙食品丙級｜原料1～70 即時練習｜重新核對版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#222}
.wrap{max-width:680px;margin:auto}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}
h1{font-size:19px;margin:0 0 4px}
#progress{font-size:14px;color:#666}
main{padding:14px 12px 100px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.qnum{font-weight:700;color:#666;margin-bottom:9px}
.question{font-size:20px;line-height:1.55;font-weight:700;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d8d8d8;border-radius:12px;padding:14px;margin:10px 0;font-size:17px;line-height:1.4;cursor:pointer}
.option:active{transform:scale(.99)}
.option.correct{border:2px solid #2e8b57;background:#eef9f1}
.option.wrong{border:2px solid #c94c4c;background:#fff1f1}
.option.disabled{cursor:default}
.feedback{display:none;border-radius:12px;padding:14px;margin-top:16px;font-size:17px;line-height:1.55}
.feedback.show{display:block}
.feedback.ok{background:#eef9f1}
.feedback.bad{background:#fff1f1}
.next{display:none;width:100%;margin-top:14px;background:#222;color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px}
.next.show{display:block}
#result{display:none;text-align:center}
.score{font-size:30px;font-weight:800;margin:8px 0 16px}
.restart{background:#222;color:#fff;border:0;border-radius:12px;padding:13px 20px;font-size:16px}
.tip{font-size:14px;color:#777;margin-top:8px}
</style>
</head>
<body>
<header><div class="wrap">
<h1>烘焙食品丙級｜原料 1～70 即時練習｜重新核對版</h1>
<div id="progress">第 1／70 題｜答對 0 題</div>
</div></header>

<main class="wrap">
<section id="quiz" class="card"></section>
<section id="result" class="card"></section>
</main>

<script>
const questions = [{"n": 1, "q": "下列材料中，甜度最低的是？", "opts": ["果糖", "砂糖", "麥芽糖", "乳糖"], "ans": 3}, {"n": 2, "q": "台灣目前使用的白油，每桶重量約為？", "opts": ["5公斤", "10公斤", "16公斤", "30公斤"], "ans": 2}, {"n": 3, "q": "奶粉的重量2.2磅相當於公制單位的？", "opts": ["半公斤", "1公斤", "1.5公斤", "4.4公斤"], "ans": 1}, {"n": 4, "q": "一般天使蛋糕的主要原料為？", "opts": ["太白粉", "蛋白", "乳酪", "鮮奶油"], "ans": 1}, {"n": 5, "q": "派皮用的麵粉應以那種麵粉為宜？", "opts": ["低筋粉", "中筋粉", "高筋粉", "太白粉"], "ans": 1}, {"n": 6, "q": "塔塔粉是屬？", "opts": ["中性鹽", "酸性鹽", "鹼性鹽", "低鹼性鹽"], "ans": 1}, {"n": 7, "q": "不需要使用酵母的烘焙產品是？", "opts": ["包子", "饅頭", "麵包", "重奶油蛋糕"], "ans": 3}, {"n": 8, "q": "蛋黃中含量最多的成分？", "opts": ["水", "油脂", "蛋白質", "灰分"], "ans": 0}, {"n": 9, "q": "蛋白成分除了水以外含量最多的是？", "opts": ["油脂", "葡萄糖", "灰分", "蛋白質"], "ans": 3}, {"n": 10, "q": "一般最適合於麵包製作的水是？", "opts": ["軟水", "蒸餾水", "鹼水", "中硬度水"], "ans": 3}, {"n": 11, "q": "麵包配方中糖含量（依烘焙百分比）佔20％以上的是？", "opts": ["土司麵包", "法國麵包", "甜麵包", "全麥麵包"], "ans": 2}, {"n": 12, "q": "一般以中種法製作麵包，中種麵糰的原料不含？", "opts": ["鹽", "酵母", "麵粉", "水"], "ans": 0}, {"n": 13, "q": "以下那一種原料不屬於化學膨大劑？", "opts": ["發粉", "小蘇打", "酵母", "阿摩尼亞（碳酸氫銨）"], "ans": 2}, {"n": 14, "q": "無水奶油是來自於下列那種原料？", "opts": ["牛肉", "豬肉", "牛奶", "植物油"], "ans": 2}, {"n": 15, "q": "油脂麵粉與水先煮沸糊化之產品是？", "opts": ["油條", "奶油空心餅", "甜麵包", "小西餅"], "ans": 1}, {"n": 16, "q": "下列烘焙用原料較不常使用的是？", "opts": ["新鮮奶油", "全脂奶粉", "脫脂奶粉", "煉乳"], "ans": 3}, {"n": 17, "q": "下列那種油脂約含有10％的氣體（氮氣）？", "opts": ["清香油", "瑪琪琳", "雪白乳化油", "奶油"], "ans": 2}, {"n": 18, "q": "沒有分析檢驗的情況下，下列何者不是由外觀判斷油炸油的劣化？", "opts": ["顏色加深", "黏度增加", "有蟹泡並提前冒煙", "酸價為1.0"], "ans": 3}, {"n": 19, "q": "麵包配方中何種材料添加愈多發酵愈快？", "opts": ["油脂", "蛋黃", "酵母", "細砂糖"], "ans": 2}, {"n": 20, "q": "國產麵粉每袋的重量以何種最多？", "opts": ["22磅", "30磅", "22公斤", "30公斤"], "ans": 2}, {"n": 21, "q": "海綿蛋糕配方主要原料為？", "opts": ["細砂糖、麵粉、鹽、牛奶", "麵粉、沙拉油、水", "麵粉、細砂糖、發粉", "麵粉、細砂糖、蛋"], "ans": 3}, {"n": 22, "q": "下列何種材料可提高小西餅產品的脆性？", "opts": ["鹽", "水", "糖", "蛋"], "ans": 2}, {"n": 23, "q": "若用快速酵母粉取代新鮮酵母時，快速酵母粉的用量應為新鮮酵母的？", "opts": ["等量", "1/3", "1/2", "2倍"], "ans": 1}, {"n": 24, "q": "製作某種麵包，使用新鮮酵母4％，今因某種原因需改用快速即發酵母粉，用量應為？", "opts": ["4％", "2％", "1.6％", "1.33％"], "ans": 3}, {"n": 25, "q": "配方內使用60％鮮奶製作麵包，比用4％的脫脂奶粉作麵包，其實際奶粉固形量？", "opts": ["較少", "相同", "較多", "大同小異"], "ans": 2}, {"n": 26, "q": "下列何種原料不是製作奶油布丁派餡之凝凍原料？", "opts": ["蛋", "動物膠", "玉米澱粉", "奶油水"], "ans": 3}, {"n": 27, "q": "蛋白在烘焙原料中屬於那一種性質？", "opts": ["柔性原料", "韌性原料", "酸性原料", "中性原料"], "ans": 1}, {"n": 28, "q": "蛋白的含水量為？", "opts": ["50％", "75％", "88％", "95％"], "ans": 2}, {"n": 29, "q": "巧克力融化加熱方式，最好使用？", "opts": ["直火加熱", "隔水加熱", "烤爐加熱", "自然融化"], "ans": 1}, {"n": 30, "q": "蛋黃成分中所含的油脂具有？", "opts": ["乳化作用", "起泡作用", "安定作用", "膨大作用"], "ans": 0}, {"n": 31, "q": "製作蛋糕時，奶粉應屬於？", "opts": ["柔性材料", "鹼性材料", "韌性材料", "芳香材料"], "ans": 2}, {"n": 32, "q": "奶水中含固形物（奶粉）量為？", "opts": ["4％", "8％", "12％", "16％"], "ans": 2}, {"n": 33, "q": "做蘇打餅乾應注意油脂的？", "opts": ["安定性好、不易酸敗", "打發性好", "乳化效果好", "可塑性好"], "ans": 0}, {"n": 34, "q": "蒸發奶水含固形物為？", "opts": ["40％", "35％", "30％", "26％"], "ans": 3}, {"n": 35, "q": "麵包配方使用2％的細砂糖如將糖量增加至4％，則發酵時間會？", "opts": ["縮短很多", "縮短很少", "延長", "不變"], "ans": 3}, {"n": 36, "q": "麵包配方中正常用糖量如從5％增加為10％，則烤好後的麵包最明顯的不同是？", "opts": ["表皮顏色變淺", "表皮變薄而軟", "表皮顏色加深", "表皮變粗糙"], "ans": 2}, {"n": 37, "q": "做麵包時配方中油脂量高，可使麵包表皮？", "opts": ["顏色深", "厚", "柔軟", "硬"], "ans": 2}, {"n": 38, "q": "蛋黃之水分含量為？", "opts": ["30～34％", "35～39％", "40～44％", "50～55％"], "ans": 3}, {"n": 39, "q": "一般奶油或瑪琪琳含水量約為？", "opts": ["6～10％", "11～13％", "14～22％", "24～30％"], "ans": 2}, {"n": 40, "q": "乳化劑在蛋糕中的功能是？", "opts": ["使蛋糕風味佳", "使蛋糕顏色加深", "融和配方內水和油使組織細膩", "縮短攪拌時間減少人工"], "ans": 2}, {"n": 41, "q": "麵粉中添加活性麵筋粉每增加1％時，則麵粉之吸水量約可提高？", "opts": ["1％", "1.5％", "2％", "2.5％"], "ans": 1}, {"n": 42, "q": "新鮮酵母(compressed yeast)水分含量約為？", "opts": ["45～50％", "55～60％", "65～70％", "80～85％"], "ans": 2}, {"n": 43, "q": "一般烘焙人員所稱的「重曹」(baking soda)是指？", "opts": ["發粉", "蘇打粉", "酵母", "酵素"], "ans": 1}, {"n": 44, "q": "沙拉油必須密封保存，是因為？", "opts": ["遇空氣易於變色", "含不飽和脂肪酸易受氧化酸敗", "易揮發", "易感染其他不良味道"], "ans": 1}, {"n": 45, "q": "雞蛋中水分含量？", "opts": ["70％", "75％", "80％", "85％"], "ans": 1}, {"n": 46, "q": "乳化劑在麵包中的功能？", "opts": ["增加麵包風味", "使麵包柔軟不易老化", "防止麵包發黴", "促進酵母活力"], "ans": 1}, {"n": 47, "q": "全蛋的固形物為？", "opts": ["10％", "15％", "25％", "35％"], "ans": 2}, {"n": 48, "q": "麵包的組織鬆軟好吃，主要是在製作的過程中加入了？", "opts": ["酵母", "發粉", "小蘇打", "阿摩尼亞（碳酸氫銨等）"], "ans": 0}, {"n": 49, "q": "要使麵包長時間保持柔軟，可在配方內添加？", "opts": ["膨大劑", "麥芽酵素", "乳化劑", "丙酸鈣"], "ans": 2}, {"n": 50, "q": "控制發酵最有效的原料是？", "opts": ["食鹽", "糖", "改良劑", "奶粉"], "ans": 0}, {"n": 51, "q": "稀釋奶油霜飾最適當的原料是？", "opts": ["沙拉油", "水", "蛋", "稀糖漿"], "ans": 3}, {"n": 52, "q": "一般油炸用油發煙點應在？", "opts": ["150～160℃", "160～170℃", "170～180℃", "200℃以上"], "ans": 3}, {"n": 53, "q": "為使小西餅達到鬆脆與擴展的目的，配方內可多使用？", "opts": ["細砂糖", "糖粉", "糖漿", "麥芽糖"], "ans": 0}, {"n": 54, "q": "製作水果蛋糕應選用？", "opts": ["新鮮水果", "罐頭水果", "蜜餞水果", "脫水水果"], "ans": 2}, {"n": 55, "q": "一般西點派皮或蛋糕用的奶酥底，配方內油脂應用？", "opts": ["無水奶油或精製豬油", "瑪琪琳", "含水奶油", "沙拉油"], "ans": 0}, {"n": 56, "q": "做蘋果派餡的膠凍原料，通常採用？", "opts": ["玉米澱粉", "動物膠", "洋菜粉", "甘藷粉"], "ans": 0}, {"n": 57, "q": "食品工廠用的油炸用油最好選用？", "opts": ["沙拉油", "氫化油", "黃豆油", "奶油"], "ans": 1}, {"n": 58, "q": "麵包可使用的防腐劑為？", "opts": ["丙酸鈣", "去水醋酸", "硼酸", "苯甲酸"], "ans": 0}, {"n": 59, "q": "蛋糕可使用的防腐劑為？", "opts": ["苯甲酸", "丙酸鈉", "對羥苯甲酸丁酯", "異抗壞血酸"], "ans": 1}, {"n": 60, "q": "新鮮酵母貯存的最佳溫度為？", "opts": ["-10～0℃", "2～10℃", "11～20℃", "21～27℃"], "ans": 1}, {"n": 61, "q": "製作麩皮或裸麥麵包，其主要原料的麵粉為？", "opts": ["高筋麵粉", "洗筋粉", "粉心粉", "低筋麵粉"], "ans": 0}, {"n": 62, "q": "下列那一種油脂其烤酥性最大？", "opts": ["純奶油", "人造奶油", "豬油", "雪白油"], "ans": 2}, {"n": 63, "q": "製作天使蛋糕時塔塔粉與鹽的用量總和為？", "opts": ["0.1％", "1％", "5％", "10％"], "ans": 1}, {"n": 64, "q": "下列那一種糖的甜度最高？", "opts": ["果糖", "轉化糖漿", "砂糖", "葡萄糖"], "ans": 0}, {"n": 65, "q": "製做丹麥麵包或鬆餅，其裹入用油脂應採用？", "opts": ["豬油", "雪白奶油", "白油（烤酥油）", "瑪琪琳"], "ans": 3}, {"n": 66, "q": "麵粉如因貯存太久筋性受損，在做麵包時可酌量在配方內？", "opts": ["增加鹽的用量", "減少糖的用量", "使用脫脂奶粉", "增加乳化劑"], "ans": 2}, {"n": 67, "q": "製作高成分奶油海綿蛋糕為降低麵粉的筋性，配方內部分麵粉最好用？", "opts": ["全脂奶粉", "太白粉", "小麥澱粉", "乳清粉"], "ans": 2}, {"n": 68, "q": "乳化油在下列那一項產品較不合適添加？", "opts": ["戚風蛋糕", "麵包", "海綿蛋糕", "奶油霜飾"], "ans": 0}, {"n": 69, "q": "蛋糕所用的發粉應為？", "opts": ["快性發粉", "次快性發粉", "雙重反應發粉", "慢性發粉"], "ans": 2}, {"n": 70, "q": "欲增加小西餅鬆酥的性質可酌量增加？", "opts": ["水", "油", "糖", "高筋麵粉"], "ans": 1}];
let current = 0;
let correctCount = 0;
let answered = false;
const quiz = document.getElementById('quiz');
const progress = document.getElementById('progress');
const result = document.getElementById('result');
const labels = ['①','②','③','④'];

function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function renderQuestion(){
  answered=false;
  const x=questions[current];
  progress.textContent=`第 ${current+1}／${questions.length} 題｜答對 ${correctCount} 題`;
  quiz.innerHTML=`
    <div class="qnum">第 ${x.n} 題</div>
    <div class="question">${escapeHtml(x.q)}</div>
    <div id="options">${x.opts.map((o,i)=>`<button class="option" data-index="${i}">${labels[i]} ${escapeHtml(o)}</button>`).join('')}</div>
    <div id="feedback" class="feedback"></div>
    <button id="next" class="next">${current===questions.length-1?'查看測驗結果':'下一題 →'}</button>
  `;
  document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',choose));
  document.getElementById('next').addEventListener('click',nextQuestion);
}
function choose(e){
  if(answered)return;
  answered=true;
  const chosen=e.currentTarget;
  const x=questions[current];
  const chosenIndex=Number(chosen.dataset.index);
  const isCorrect=chosenIndex===x.ans;
  document.querySelectorAll('.option').forEach((btn,i)=>{
    btn.classList.add('disabled');
    btn.disabled=true;
    if(i===x.ans)btn.classList.add('correct');
  });
  const feedback=document.getElementById('feedback');
  if(isCorrect){
    correctCount++;
    chosen.classList.add('correct');
    feedback.className='feedback show ok';
    feedback.innerHTML=`✅ <strong>答對了！</strong><br>正確答案：${labels[x.ans]} ${escapeHtml(x.opts[x.ans])}`;
  }else{
    chosen.classList.add('wrong');
    feedback.className='feedback show bad';
    feedback.innerHTML=`❌ <strong>答錯了</strong><br>正確答案：${labels[x.ans]} ${escapeHtml(x.opts[x.ans])}`;
  }
  progress.textContent=`第 ${current+1}／${questions.length} 題｜答對 ${correctCount} 題`;
  document.getElementById('next').classList.add('show');
}
function nextQuestion(){
  current++;
  if(current>=questions.length){showResult();return;}
  window.scrollTo({top:0,behavior:'smooth'});
  renderQuestion();
}
function showResult(){
  quiz.style.display='none';
  result.style.display='block';
  const percent=Math.round(correctCount/questions.length*100);
  result.innerHTML=`<div>測驗完成</div><div class="score">${correctCount}／${questions.length} 題</div><div>答對率：${percent}%</div><div class="tip">每題作答後已立即顯示正確答案。</div><button class="restart" onclick="restart()">重新開始</button>`;
}
function restart(){
  current=0;correctCount=0;result.style.display='none';quiz.style.display='block';renderQuestion();window.scrollTo({top:0,behavior:'smooth'});
}
renderQuestion();
</script>
</body>
</html>
