<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>烘焙食品丙級｜原料71-99混合正式測驗</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f3f4f6;color:#222}
body{user-select:none;-webkit-user-select:none}
.wrap{max-width:760px;margin:auto}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}
h1{font-size:19px;margin:0 0 4px}
.sub{font-size:13px;color:#666}
main{padding:14px 12px 90px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.start-title{font-size:24px;font-weight:900;margin-bottom:12px}
.notice{background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7;margin-bottom:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;color:#666;font-size:14px;font-weight:700;margin-bottom:10px}
.progress{height:8px;background:#e7e7e7;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.fill{height:100%;background:#222}
.question{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d6d6d6;border-radius:12px;padding:14px;margin:10px 0;font-size:17px;line-height:1.5;cursor:pointer}
.option.selected{border:2px solid #222;background:#f4f4f4}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-size:17px;cursor:pointer}
.prev{background:#eee;color:#222;flex:1}
.next{background:#222;color:#fff;flex:1}
.submit{background:#6b2e2e;color:#fff;width:100%;margin-top:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.score{font-size:40px;font-weight:900;margin:8px 0}
.wrong-list{margin-top:18px}
.wrong-item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;line-height:1.65}
.wrong-q{font-weight:800}
.locked{text-align:center;padding:24px 10px}
.small{font-size:13px;color:#777;line-height:1.6;margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
<h1>烘焙食品丙級｜原料 71～99 混合正式測驗</h1>
<div class="sub" id="status">尚未開始</div>
</div></header>
<main class="wrap">

<section id="start" class="card">
<div class="start-title">原料 71～99 混合測驗</div>
<div class="notice">
共 <strong>29 題</strong>，包含原料 71～90 與 9 題加強題（91～99）。<br>
每次開始會<strong>隨機打亂 29 題順序</strong>，但每題仍標示原題號。<br>
一次只呈現一題；作答過程<strong>不顯示答案</strong>。<br>
必須完成全部 29 題後才能交卷。交卷後才會顯示<strong>分數、答對率、所有錯誤題目與正確答案</strong>。
</div>
<button class="btn next" id="startBtn" style="width:100%">開始測驗</button>
<div class="small">完成交卷後，本測驗會鎖定，不提供學生重新測驗。</div>
</section>

<section id="quiz" class="card hidden"></section>
<section id="result" class="card hidden"></section>
<section id="locked" class="card hidden"></section>

</main>

<script>
const QUESTIONS=[{"n":71,"q":"依 CNS 所謂全麥麵包，其全麥麵粉的用量應為？","opts":["20％","30％","40％","50％以上"],"ans":0},{"n":72,"q":"使用蒸發奶水代替鮮奶時，應照鮮奶用量？","opts":["等量使用","1/3 蒸發奶水加 2/3 水","2/3 蒸發奶水加 1/3 水","1/2 蒸發奶水加 1/2 水"],"ans":3},{"n":73,"q":"欲生產良好的烘焙產品下列條件何者不是？","opts":["好的原料","純熟的技術","好的設備","好的裝潢"],"ans":3},{"n":74,"q":"夾心餅乾之夾心用油脂，通常需要數個月之保存、流通，因此宜使用？","opts":["花生油","沙拉油","葵花油","椰子油"],"ans":3},{"n":75,"q":"烘焙用油脂的融點愈高，其口溶性？","opts":["愈好","愈差","無關","差不多"],"ans":1},{"n":76,"q":"食品衛生管理法規定烘焙油脂中合成抗氧化劑的總量不得超過？","opts":["50 ppm","200 ppm","400 ppm","0.1％"],"ans":1},{"n":77,"q":"麵粉之蛋白質組成成分中缺乏？","opts":["丙苯胺酸","離胺酸","麩胺酸","半胱胺酸"],"ans":1},{"n":78,"q":"不是派餡用來做膠凍原料有？","opts":["玉米澱粉","動物膠","雞蛋","果膠"],"ans":3},{"n":79,"q":"製作蛋糕道納司所使用之膨脹劑是？","opts":["酵母","發粉（B.P）","油脂","小蘇打（B.S）"],"ans":1},{"n":80,"q":"製作蛋白霜飾所需要之主原料是？","opts":["蛋黃","全蛋","蛋白和糖","蛋黃和糖"],"ans":2},{"n":81,"q":"一個中型雞蛋去殼後約重？","opts":["40公克","50公克","60公克","70公克"],"ans":1},{"n":82,"q":"麵粉中的蛋白質每增加1％，則吸水量約增加？","opts":["1％","2％","3％","4％"],"ans":1},{"n":83,"q":"製作轉化糖漿使用何種糖原料？","opts":["砂糖","麥芽糖","葡萄糖","果糖"],"ans":0},{"n":84,"q":"烘焙用乾酪（Cheese）原料，其主要的組成成分為？","opts":["脂肪","蛋白質","醣類","水分"],"ans":1},{"n":85,"q":"烘焙產品使用何者糖，在其烤焙時較易產生梅納反應？","opts":["砂糖","麥芽糖","果糖","乳糖"],"ans":2},{"n":86,"q":"下列何種油脂含有反式脂肪酸？","opts":["豬油","牛油","橄欖油","花生油"],"ans":1},{"n":87,"q":"下列材料中何者不屬於膨脹劑？","opts":["小蘇打","發粉","酵母","可可粉"],"ans":3},{"n":88,"q":"下列何種小麥適合製作海綿蛋糕？","opts":["硬質小麥","軟質小麥","杜蘭小麥","高筋小麥"],"ans":1},{"n":89,"q":"下列何種性質不是為小麥分類的依據？","opts":["麥粒硬度","麥粒顏色","麥粒蛋白質含量","破損澱粉"],"ans":3},{"n":90,"q":"小麥胚乳的主要色素為？","opts":["葉綠素","花青素","葉黃素","胡蘿蔔素"],"ans":3},{"n":91,"q":"小麥胚芽中富含油脂，其主要之脂肪酸為？","opts":["亞麻仁油酸","棕櫚酸","硬脂酸","月桂酸"],"ans":0},{"n":92,"q":"小麥製粉時，與其出粉率成正比者為？","opts":["灰分含量","麩皮含量","水分含量","蛋白質含量"],"ans":0},{"n":93,"q":"麵粉中添加維生素 C 作為改良劑之主要效用為？","opts":["增加甜味","熟成作用","降低水分","增加油脂含量"],"ans":1},{"n":94,"q":"蛋糕用麵粉一般由何種麥所磨製？","opts":["軟質冬麥","硬質春麥","杜蘭小麥","裸麥"],"ans":0},{"n":95,"q":"食品用水溶於油（W／O）之乳化劑，其親水親油平衡值（HLB）之範圍介於？","opts":["3.5～6","7～9","10～14","15～18"],"ans":0},{"n":96,"q":"食品用油溶於水（O／W）之乳化劑，其親水親油平衡值（HLB）之範圍介於？","opts":["1～4","3.5～6","8～18","19～25"],"ans":2},{"n":97,"q":"製作轉化糖漿時，以下列何種酸水解得到之品質最佳？","opts":["鹽酸","醋酸","酒石酸","檸檬酸"],"ans":2},{"n":98,"q":"雞蛋蛋白的脂肪含量為？","opts":["0％","5％","10％","15％"],"ans":0},{"n":99,"q":"下列何者為小麥製粉主要的目的？","opts":["增加麵粉的甜味","使麩皮、胚芽與胚乳部分分離","提高麵粉中的油脂含量","使所有成分完全混合"],"ans":1}];
const LABELS=["①","②","③","④"];
const STORAGE_KEY="baking_mix_71_99_formal_v1";

let state={
  started:false,
  finished:false,
  order:[],
  current:0,
  answers:{},
  score:0,
  wrong:[]
};

const $=id=>document.getElementById(id);

function esc(s){
  return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}

function load(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}
  catch(e){return null;}
}

function startExam(){
  state={
    started:true,
    finished:false,
    order:shuffle(QUESTIONS.map((_,i)=>i)),
    current:0,
    answers:{},
    score:0,
    wrong:[]
  };
  save();
  renderQuestion();
}

function renderQuestion(){
  const qi=state.order[state.current];
  const q=QUESTIONS[qi];
  const selected=state.answers[state.current];

  $("start").classList.add("hidden");
  $("result").classList.add("hidden");
  $("locked").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  $("status").textContent=`第 ${state.current+1}／${QUESTIONS.length} 題｜已作答 ${Object.keys(state.answers).length}／29`;

  $("quiz").innerHTML=`
    <div class="qhead">
      <span>原題第 ${q.n} 題</span>
      <span>${state.current+1}／29</span>
    </div>
    <div class="progress"><div class="fill" style="width:${(state.current+1)/29*100}%"></div></div>
    <div class="question">${esc(q.q)}</div>
    <div id="opts">
      ${q.opts.map((o,i)=>`
        <button class="option ${selected===i?"selected":""}" data-i="${i}">
          ${LABELS[i]} ${esc(o)}
        </button>
      `).join("")}
    </div>
    <div class="nav">
      <button class="btn prev" id="prev" ${state.current===0?"disabled":""}>← 上一題</button>
      <button class="btn next" id="next">${state.current===28?"檢查作答":"下一題 →"}</button>
    </div>
    <button class="btn submit hidden" id="submit">交卷</button>
    <div class="small">可以回上一題修改答案；全部 29 題完成後才能交卷。</div>
  `;

  document.querySelectorAll(".option").forEach(btn=>{
    btn.onclick=()=>{
      state.answers[state.current]=Number(btn.dataset.i);
      save();
      renderQuestion();
    };
  });

  $("prev").onclick=()=>{
    if(state.current>0){
      state.current--;
      save();
      renderQuestion();
      window.scrollTo(0,0);
    }
  };

  $("next").onclick=()=>{
    if(state.answers[state.current]===undefined){
      alert("請先作答本題。");
      return;
    }
    if(state.current<28){
      state.current++;
      save();
      renderQuestion();
      window.scrollTo(0,0);
    }else{
      if(Object.keys(state.answers).length===29){
        $("submit").classList.remove("hidden");
        alert("29 題已全部作答，請按「交卷」。");
      }else{
        const missing=[];
        state.order.forEach((qi,displayIndex)=>{
          if(state.answers[displayIndex]===undefined)missing.push(QUESTIONS[qi].n);
        });
        alert("尚有未作答題目："+missing.join("、"));
      }
    }
  };

  $("submit").onclick=finishExam;
}

function finishExam(){
  if(Object.keys(state.answers).length!==29){
    alert("尚未完成全部 29 題，不能交卷。");
    return;
  }

  let score=0;
  const wrong=[];

  state.order.forEach((qi,displayIndex)=>{
    const q=QUESTIONS[qi];
    if(state.answers[displayIndex]===q.ans){
      score++;
    }else{
      wrong.push({
        n:q.n,
        q:q.q,
        answer:q.opts[q.ans]
      });
    }
  });

  state.score=score;
  state.wrong=wrong;
  state.finished=true;
  save();
  showResult();
}

function showResult(){
  $("start").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("locked").classList.add("hidden");
  $("result").classList.remove("hidden");

  $("status").textContent="測驗完成｜成績已保留";

  const wrongHtml=state.wrong.length===0
    ? "<div class='notice'><strong>29 題全部答對！</strong></div>"
    : `<div class="wrong-list">
        <h3>錯誤題目整理（共 ${state.wrong.length} 題）</h3>
        ${state.wrong.map((x,i)=>`
          <div class="wrong-item">
            <div class="wrong-q">${i+1}．原題第 ${x.n} 題：${esc(x.q)}</div>
            <div><strong>正確答案：</strong>${esc(x.answer)}</div>
          </div>
        `).join("")}
       </div>`;

  $("result").innerHTML=`
    <div class="start-title">測驗完成</div>
    <div class="score">${state.score}／29</div>
    <div>答對率：${Math.round(state.score/29*100)}%</div>
    ${wrongHtml}
    <div class="notice" style="margin-top:18px">
      本次測驗已完成並鎖定。<strong>學生不能自行重新測驗。</strong>
    </div>
  `;
}

function showLocked(){
  $("start").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("result").classList.add("hidden");
  $("locked").classList.remove("hidden");
  $("status").textContent="本次測驗已完成";

  $("locked").innerHTML=`
    <div class="locked">
      <h2>本次測驗已完成</h2>
      <p>此裝置已完成本次測驗，學生不能再次進入。</p>
    </div>`;
}

$("startBtn").onclick=startExam;

const saved=load();

if(saved && saved.finished){
  state=saved;
  showResult();
}else if(saved && saved.started){
  state=saved;
  renderQuestion();
}
</script>
</body>
</html>
