<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作項目三 101–150｜單次測驗教師解鎖</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#182b3d;font-family:system-ui,"Noto Sans TC",sans-serif;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:22px 16px 70px}.panel{background:white;border:1px solid #dce5ee;border-radius:14px;padding:20px;margin:16px 0}h1{font-size:26px}.muted{color:#586d7f}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button{font:inherit;padding:10px 15px;border:1px solid #b9c9d7;border-radius:9px;background:white;cursor:pointer}button.primary{background:#175a7d;color:white}.option{display:block;width:100%;text-align:left;margin:9px 0}.hide{display:none}.progress{height:8px;background:#e5ecf2;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#277da3}.tag{color:#175a7d;font-weight:700}.q{font-size:19px;font-weight:650;margin:14px 0}.stats{font-size:23px;font-weight:750}.review{border-top:1px solid #ddd;padding:12px 0}.correct{color:#17643a}.wrong{color:#a33}</style></head><body><main class="wrap"><h1>工作項目三：產品製作｜101–150 題單次測驗</h1><p class="muted">共 50 題｜作答期間不顯示答案｜提交後須由教師解鎖查看成績</p><section class="panel" id="intro"><p>請依序完成全部題目。每題作答後才能進入下一題；提交後不可重新測驗。作答期間請勿重新整理或關閉頁面。</p><button class="primary" id="start">開始測驗</button></section><section class="panel hide" id="exam"><div class="progress"><div id="bar" style="width:0%"></div></div><p id="progress" class="muted"></p><div id="question"></div><div class="actions"><button id="stop">停止朗讀</button></div></section><section class="panel hide" id="submitted"><h2>已完成測驗</h2><p>作答已提交並鎖定。請交由教師輸入密碼查看成績及錯題。</p><label>教師密碼 <input id="pw" type="password" autocomplete="off"></label> <button class="primary" id="unlock">教師解鎖</button><p id="msg" class="wrong"></p><div id="results"></div></section></main><script>const BANK=[{"n": 101, "q": "下列那一項非麵包滾圓的目的？", "options": ["鬆弛麵筋使麵糰易於整型", "使麵糰表面光滑不易粘手", "使麵糰易於保住二氧化碳", "使氣體均勻分佈"], "a": 0}, {"n": 102, "q": "調整配方時，下列何者材料不會使麵包麵糰較軟？", "options": ["水", "糖", "油", "麵粉"], "a": 3}, {"n": 103, "q": "調整甜麵包配方時，若增加蛋的使用量，得酌量減少原配方的？", "options": ["水", "糖", "油", "麵粉"], "a": 0}, {"n": 104, "q": "法國麵包（硬式麵包）常用之烤焙溫度為多少？", "options": ["230℃", "200℃", "170℃", "150℃"], "a": 0}, {"n": 105, "q": "800公克的帶蓋土司在正常的狀態下，給予200℃烤溫，烤焙所需時間為？", "options": ["15～20分", "35～40分", "55～60分", "1小時以上"], "a": 1}, {"n": 106, "q": "下列那一種麵包，烤焙時間最短？", "options": ["800公克的帶蓋土司", "450公克的圓頂葡萄乾土司", "350公克的法國麵包", "90公克包餡的甜麵包"], "a": 3}, {"n": 107, "q": "下列那一種麵包必需使用蒸氣烤爐？", "options": ["甜麵包", "丹麥麵包", "硬式麵包", "葡萄乾麵包"], "a": 2}, {"n": 108, "q": "圓烤盤，其直徑為22公分、高5公分其容積為？", "options": ["1899.7立方公分", "1997.7立方公分", "7598.8立方公分", "110立方公分"], "a": 0}, {"n": 109, "q": "長方型烤盤，其長為30公分、寬為22公分、高為5公分，其容積為？", "options": ["3300平方公分", "3300立方公分", "660平方公分", "660立方公分"], "a": 1}, {"n": 110, "q": "低成分重奶油蛋糕，採用何種攪拌方法為宜？", "options": ["麵粉油脂拌合法", "糖油拌合法", "兩步拌合法", "糖水拌合法"], "a": 1}, {"n": 111, "q": "何種攪拌方法能節省人工和縮短攪拌時間？", "options": ["糖油拌合法", "麵粉油脂拌合法", "糖水拌合法", "直接法"], "a": 3}, {"n": 112, "q": "麵糊類蛋糕的麵糊溫度應該是？", "options": ["10℃", "15℃", "22℃", "30℃"], "a": 2}, {"n": 113, "q": "下列何種蛋糕在烘焙時不可擦防粘油脂？", "options": ["海綿蛋糕", "重奶油蛋糕", "輕奶油蛋糕", "天使蛋糕"], "a": 3}, {"n": 114, "q": "理想的海綿蛋糕麵糊比重為", "options": ["0.46", "0.56", "0.66", "0.76"], "a": 0}, {"n": 115, "q": "利用糖油拌合法製作丹麥小西餅(Danishcookies)，材料中的麵粉應在最後加入，輕輕拌勻，其主要的原因為？", "options": ["容易吸收水分", "好控制麵粉量", "避免攪拌出筋", "防止破壞打發的氣泡"], "a": 2}, {"n": 116, "q": "菠蘿甜麵包整形後，通常置於室內（或烤箱邊），而不送入最後發酵箱其原因為？", "options": ["不需最後發酵", "需較高濕度發酵", "需較高溫度發酵", "避免高濕高溫的發酵使菠蘿皮融解而化開"], "a": 3}, {"n": 117, "q": "50～100公克左右的甜麵包，其烤焙應？", "options": ["上火為主，下火為輔", "只用上火", "下火為主，上火為輔", "只用下火"], "a": 0}, {"n": 118, "q": "以糖油拌合法攪拌丹麥小西餅，在糖油部分打發過度，其產品組織較？", "options": ["硬", "粗糙", "細膩", "沒影響"], "a": 1}, {"n": 119, "q": "戚風蛋糕在攪拌蛋白與糖時，如果攪拌不足易造成產品？", "options": ["組織較軟", "拌入其他材料時易消泡", "體積較大", "不影響蛋糕品質"], "a": 1}, {"n": 120, "q": "可以減少海綿蛋糕出爐時收縮的程度為？", "options": ["選用麵筋較強的麵粉", "烤焙時間避免過久", "烤盤擦油", "減少配方中的用油量"], "a": 1}, {"n": 121, "q": "添加下列那一項材料不會增加蛋糕的柔軟度？", "options": ["糖", "油", "蛋黃", "麵粉"], "a": 3}, {"n": 122, "q": "一般麵糊類蛋糕烤熟與否的判斷方法？", "options": ["以探針試探或以手輕拍", "以顏色判斷即可", "時間一到即可出爐", "敲烤盤邊聽聲音判斷"], "a": 0}, {"n": 123, "q": "切割蛋糕用的刀子，下列那一種方式既可防止細菌污染又可達到切面整齊的要求？", "options": ["洗淨使用", "以布擦拭後使用", "浸在沸水中燙一次，切一次", "在沸水中燙一次用布擦一下使用"], "a": 2}, {"n": 124, "q": "煮製檸檬布丁餡時檸檬汁在？", "options": ["與水一道加入", "與玉米澱粉拌勻加入", "糖水部分煮沸後加入", "待餡煮好後加入拌勻"], "a": 3}, {"n": 125, "q": "製作丹麥麵包整形宜在？", "options": ["近烤爐邊", "一般的工作間", "在溫度較低的場所", "與溫度無關，在那裡整形皆可"], "a": 2}, {"n": 126, "q": "麵粉的pH值變小時，小西餅的體積", "options": ["不變", "變大", "變小", "變厚"], "a": 2}, {"n": 127, "q": "餅乾用麵粉，若酸度偏高時，配方中應提高？", "options": ["小蘇打", "水", "氧化劑", "油脂的用量"], "a": 0}, {"n": 128, "q": "蘇打餅乾成品的pH值比一般奶油小西餅為？", "options": ["高", "相同", "低", "測不出來"], "a": 0}, {"n": 129, "q": "下列那種因素不會影響麵包攪拌時間？", "options": ["攪拌速度不同", "配方不同", "攪拌機型式不同", "攪拌人員不同"], "a": 3}, {"n": 130, "q": "正常情況下，甜麵包麵糰之攪拌時間，應比白土司麵包？", "options": ["長", "短", "一樣", "不受限制"], "a": 0}, {"n": 131, "q": "麵糰整型時，如經過二道滾輪之整型機，正常第一道滾輪與第二道滾輪之間隙比為？", "options": ["6:1", "4:1", "2:1", "1:1"], "a": 2}, {"n": 132, "q": "下列那一項因素不會影響麵包之基本發酵時間？", "options": ["酵母量", "鹽", "麵糰溫度", "容器"], "a": 3}, {"n": 133, "q": "下列何者不是影響烘焙食品烤焙條件設定之因素？", "options": ["產品種類", "產品大小", "烤爐種類", "烤焙人員"], "a": 3}, {"n": 134, "q": "製作組織鬆軟體積較大的奶油蛋糕通常採用？", "options": ["糖油拌合法", "麵粉油脂拌合法", "直接拌合法", "糖水拌合法"], "a": 0}, {"n": 135, "q": "以攪拌機攪拌麵糊類蛋糕，下列那一項操作較為正確？", "options": ["自始至終一貫快速拌成", "隨時提升攪拌缸以利拌勻", "忽快忽慢促進麵筋形成", "先用慢速拌合材料，再以快速攪拌，中途停機刮勻缸底麵糊後再繼續攪拌"], "a": 3}, {"n": 136, "q": "為促進蛋白的起泡性並改善蛋糕的風味可在配方中酌加？", "options": ["麩胺酸鈉", "檸檬汁", "酒精", "亞硝酸鉀"], "a": 1}, {"n": 137, "q": "油炸甜圈餅（道納司，doughnuts）油脂宜選用？", "options": ["沙拉油", "豬油", "油炸油", "奶油"], "a": 2}, {"n": 138, "q": "製作泡芙（奶油空心餅）時常添加之化學膨大劑為？", "options": ["碳酸氫銨（阿摩尼亞）", "小蘇打", "發粉", "酵母"], "a": 0}, {"n": 139, "q": "鬆餅（起酥，puffpastry）烤焙時烤爐宜選用？", "options": ["熱風爐", "普通爐", "蒸氣爐", "隧道爐"], "a": 2}, {"n": 140, "q": "派皮堅韌不酥的原因為？", "options": ["派餡裝盤時太熱", "麵糰拌合太久", "烘烤時間不夠", "油脂用量太多"], "a": 1}, {"n": 141, "q": "派餡中牛奶布丁過於堅韌其原因為？", "options": ["烘烤時間太久", "派皮太厚", "熬煮膠凝程度不夠", "派餡溫度太低"], "a": 0}, {"n": 142, "q": "以直接法製作鹹餅乾，麵糰發酵的溫度以下列何者為宜？", "options": ["32℃", "42℃", "52℃", "62℃"], "a": 0}, {"n": 143, "q": "麵包製作時翻麵的目的，以下何者為非？", "options": ["平均溫度", "促進發酵", "抑制發酵", "促進氣體保留"], "a": 2}, {"n": 144, "q": "麵包直接法配方中，已知水用量為360g，理想水溫為5℃，自來水溫為20℃，該日室溫為28℃，冰用量為？", "options": ["40g", "54g", "80g", "100g"], "a": 1}, {"n": 145, "q": "製作蛋糕使用未經鹼處理過的可可粉時，應以部分小蘇打代替發粉，其用量為可可粉用量之", "options": ["2％", "7％", "10％", "15％"], "a": 1}, {"n": 146, "q": "一般蒸烤牛奶布丁，所選用之凝凍材料為？", "options": ["雞蛋", "吉利丁", "玉米粉", "麵粉"], "a": 0}, {"n": 147, "q": "烤焙不帶蓋土司若烤焙時間相同，烤爐溫度太高會造成", "options": ["體積大", "表皮顏色深", "烘焙損耗小", "表皮顏色淺"], "a": 1}, {"n": 148, "q": "烤焙甜麵包時，若烤焙時間相同烤爐溫度太低會造成", "options": ["體積不變", "底部顏色深", "表皮顏色淺", "組織細緻"], "a": 2}, {"n": 149, "q": "攪拌中種麵糰時為控制理想溫度為25℃，下列何者為宜？", "options": ["攪拌時間延長", "水溫提高", "依室溫及攪拌設備，控制材料溫度及攪拌時間", "用高速攪拌"], "a": 2}, {"n": 150, "q": "製作天使蛋糕擬降低蛋白之韌性可增加", "options": ["蛋白量", "麵粉量", "糖量", "鹽量"], "a": 2}];
function say(t){if(!('speechSynthesis'in window)){alert('請使用 Chrome 或 Edge 朗讀');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],idx=0,answers={},submitted=false;const $=id=>document.getElementById(id);
$('start').onclick=()=>{order=shuffle([...BANK]);idx=0;answers={};$('intro').classList.add('hide');$('exam').classList.remove('hide');draw()};function draw(){let x=order[idx];$('bar').style.width=(idx/50*100)+'%';$('progress').textContent=`第 ${idx+1}／50 題（題庫題號 ${x.n}）`;$('question').innerHTML=`<div class="tag">題庫第 ${x.n} 題</div><div class="q">${esc(x.q)}</div><button id="read">🔊 朗讀題目與選項</button><div id="opts">${x.options.map((o,i)=>`<button class="option" data-i="${i}">${'①②③④'[i]} ${esc(o)}</button>`).join('')}</div><p id="chosen" class="muted">請選擇一個答案</p><button class="primary hide" id="next">${idx===49?'提交測驗':'下一題'}</button>`;$('read').onclick=()=>say(`第${x.n}題。${x.q}。${x.options.map((o,i)=>`選項${i+1}，${o}`).join('。')}`);$('opts').onclick=e=>{let b=e.target.closest('[data-i]');if(!b||answers[x.n]!==undefined)return;answers[x.n]=+b.dataset.i;[...$('opts').children].forEach(z=>z.disabled=true);b.classList.add('selected');$('chosen').textContent='已選擇答案';$('next').classList.remove('hide')};$('next').onclick=()=>{stop();if(idx===49){submitted=true;$('exam').classList.add('hide');$('submitted').classList.remove('hide')}else{idx++;draw()}}}
$('stop').onclick=stop;$('unlock').onclick=()=>{if($('pw').value!=='1212'){$('msg').textContent='密碼錯誤';return}$('msg').textContent='';let bad=order.filter(x=>answers[x.n]!==x.a),good=50-bad.length;let out=`<h2>測驗成績</h2><div class="stats">${good}／50 題，${good*2} 分</div><p>答對 ${good} 題；答錯 ${bad.length} 題；正確率 ${good*2}%</p><h3>錯誤題目與正確答案</h3>`;out+=bad.length?bad.map(x=>`<div class="review"><div class="tag">題庫第 ${x.n} 題</div><strong>${esc(x.q)}</strong><p class="wrong">學生答案：${'①②③④'[answers[x.n]]} ${esc(x.options[answers[x.n]])}</p><p class="correct">正確答案：${'①②③④'[x.a]} ${esc(x.options[x.a])}</p></div>`).join(''):'<p class="correct">全部答對，沒有錯題。</p>';$('results').innerHTML=out;$('unlock').disabled=true;$('pw').disabled=true};
// 防止誤觸離開；此為瀏覽器端警告，無法防止清除資料或使用其他裝置繞過。window.addEventListener('beforeunload',e=>{if(!submitted&&idx>0){e.preventDefault();e.returnValue='測驗尚未完成，離開可能造成作答中斷。'}});
</script></body></html>
