{"id":63,"question":"麵糰整型時，如經過二道滾輪之整型機，正常第一道滾輪與第二道滾輪之間隙比 為？","options":["6：1","4：1","2：1","1：1"],"answer":"C"},{"id":64,"question":"油炸甜圈餅（道納司，doughnuts）油脂宜選用？","options":["沙拉油","豬油","油炸油","奶油"],"answer":"B"},{"id":65,"question":"鬆餅（起酥，puff pastry）烤焙時烤爐宜選用？","options":["熱風爐","普通爐","蒸氣爐","隧道爐"],"answer":"A"},{"id":66,"question":"派餡中牛奶布丁過於堅韌其原因為？","options":["烘烤時間太久","派皮太厚","熬煮膠凝程度不夠","派餡溫度太低"],"answer":"A"},{"id":67,"question":"以直接法製作鹹餅乾，麵糰發酵的溫度以下列何者為宜？","options":["32℃","42℃","52℃","62℃"],"answer":"C"},{"id":68,"question":"麵包製作時翻麵的目的，以下何者為非？","options":["平均溫度","促進發酵","抑制發酵","促進氣體保留"],"answer":"A"},{"id":69,"question":"製作蛋糕使用未經鹼處理過的可可粉時，應以部分小蘇打代替發粉，其用量為可 可粉用量之","options":["2％","7％","10％","15％"],"answer":"C"},{"id":70,"question":"一般蒸烤牛奶布丁，所選用之凝凍材料為？","options":["雞蛋","吉利丁","玉米粉","麵粉"],"answer":"A"},{"id":71,"question":"烤焙不帶蓋土司若烤焙時間相同，烤爐溫度太高會造成","options":["體積大","表皮顏色深","烘焙損耗小","表皮顏色淺"],"answer":"B"},{"id":72,"question":"烤焙甜麵包時，若烤焙時間相同烤爐溫度太低會造成","options":["體積不變","底部顏色深","表皮顏色淺","組織細緻"],"answer":"A"},{"id":73,"question":"為改善麵粉中澱粉之膠體性質及改良麵包之內部組織，一般可加入？","options":["纖維分解酵素","脂肪分解酵素","蛋白質分解酵素","液化酵素"],"answer":"C"},{"id":74,"question":"一般攪拌好之麵糰pH 值約為6.0，發酵後之麵糰pH 值會？","options":["下降","上升","不改變","先上升再下降"],"answer":"B"},{"id":75,"question":"製造調味餅乾在表面加入調味粉最適當之時機為？","options":["餅片成型後、入烤爐前","出烤爐噴油後","在烤焙時","進包裝機前"],"answer":"D"},{"id":76,"question":"下列何種產品的生麵片經成型、烤焙後的收縮率最大？","options":["蘇打餅乾","瑪莉餅乾","冰箱小西餅","乳沫類小西餅"],"answer":"B"},{"id":77,"question":"下列何種產品在攪拌過程中，麵糰的溫度最高？","options":["蘇打餅乾","瑪莉餅乾","冰箱小西餅","乳沫類小西餅"],"answer":"C"},{"id":78,"question":"下列成品何者含水量最少?","options":["白土司","重奶油蛋糕","海綿小西餅","椰子餅乾"],"answer":"C"},{"id":79,"question":"製作圓形貓舌小西餅時，那一項不是以不良品計？","options":["成品不呈平整","成品不呈圓片狀","成品質地硬脆","成品週邊無擴展 成尖薄狀"],"answer":"C"},{"id":80,"question":"全素業者製作葡萄乾燕麥紅糖小西餅時，那一項不是選用的材料？","options":["燕麥片","豆漿粉","奶粉","鷹嘴豆汁液"],"answer":"D"}];
let quiz=[],answers={},pos=0,submitted=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function begin(){quiz=shuffle([...questions]).map(q=>({...q,shuffled:shuffle(["A","B","C","D"])}));answers={};pos=0;submitted=false;$("intro").classList.add("hidden");$("locked").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");render();}
function render(){let q=quiz[pos];$("counter").textContent=`第 ${pos+1} / 80 題`;$("qhead").textContent=`原題號：${q.id}`;$("stem").textContent=q.question;$("opts").innerHTML="";
q.shuffled.forEach(letter=>{let label=document.createElement("label");label.className="option";let radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.value=letter;radio.checked=answers[q.id]===letter;radio.onchange=()=>{answers[q.id]=letter;progress();};label.appendChild(radio);
let body=document.createElement("div");body.innerHTML=`<b>(${letter})</b> `;
if(q.imageOptions){let im=document.createElement("img");im.className="optimg";im.alt=`第2題選項${letter}`;im.src="data:image/png;base64,"+q.imageOptions[letter];body.appendChild(im);}else body.appendChild(document.createTextNode(q.options[letter.charCodeAt(0)-65]||""));
label.appendChild(body);$("opts").appendChild(label);});
$("prev").disabled=pos===0;$("next").disabled=pos===79;progress();}
function progress(){let n=Object.keys(answers).length;$("answered").textContent=`已作答 ${n} / 80`;$("bar").style.width=(n/80*100)+"%";}
function speech(text){if(!("speechSynthesis" in window)){alert("此瀏覽器不支援語音報讀，請改用 Safari 或 Chrome。");return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="zh-TW";u.rate=0.9;speechSynthesis.speak(u);}
function spoken(q,all){let s=`第${q.id}題。${q.question}。`;if(all){q.shuffled.forEach(k=>{s+=`選項${k}。${q.imageOptions?`圖示選項${k}`:q.options[k.charCodeAt(0)-65]}。`;});}return s;}
$("start").onclick=begin;$("prev").onclick=()=>{if(pos>0){speechSynthesis.cancel();pos--;render();}};$("next").onclick=()=>{if(pos<79){speechSynthesis.cancel();pos++;render();}};
$("readQ").onclick=()=>speech(spoken(quiz[pos],false));$("readAll").onclick=()=>speech(spoken(quiz[pos],true));$("stopRead").onclick=()=>speechSynthesis.cancel();
$("submit").onclick=()=>{let n=Object.keys(answers).length;if(n<80&&!confirm(`目前尚有 ${80-n} 題未作答，未作答視為答錯。確定交卷？`))return;if(!confirm("交卷後將鎖定答案，確定交卷？"))return;submitted=true;speechSynthesis.cancel();$("quiz").classList.add("hidden");$("locked").classList.remove("hidden");};
$("unlock").onclick=()=>{if(!submitted){$("pwmsg").textContent="尚未交卷。";return;}if($("pw").value!=="1234"){$("pwmsg").textContent="密碼錯誤，請重新輸入。";return;}showResults();};
function showResults(){let wrong=quiz.filter(q=>answers[q.id]!==q.answer);let correct=80-wrong.length;$("locked").classList.add("hidden");$("results").classList.remove("hidden");$("score").textContent=`${(correct*1.25).toFixed(2)} 分 / 100 分`;$("stats").textContent=`答對 ${correct} 題；答錯 ${wrong.length} 題；未作答 ${quiz.filter(q=>!answers[q.id]).length} 題。`;
$("wrongList").innerHTML="";if(!wrong.length){$("wrongList").textContent="全部答對，沒有錯題。";return;}
wrong.forEach(q=>{let div=document.createElement("div");div.className="result-item";let correctText=q.imageOptions?`正確答案：選項 ${q.answer}（圖片選項）`:`正確答案：${q.options[q.answer.charCodeAt(0)-65]}`;div.innerHTML=`<b>原題第 ${q.id} 題</b><div>${q.question}</div><div class="correct">${correctText}</div>`;$("wrongList").appendChild(div);});}
$("again").onclick=()=>{$("results").classList.add("hidden");$("intro").classList.remove("hidden");$("pw").value="";$("pwmsg").textContent="";};
</script></body></html>
