function render(){if(state.finishedStage){renderResult(state.stagePassed,state.failMessage||'');return}if(!state.started){renderHome();return}renderQuiz()}
function renderHome(){
$('content').innerHTML=`<section class="card"><div class="stage-title">1～120 烘焙冒險闖關</div><div class="stage-meta">每20題一關｜每答錯一題生命值 −5｜20題全部答對才會通關</div><div class="char">${hpEmoji(state.hp)}</div><div class="status">目前進度：第 ${state.stage+1} 關／6</div><div class="map">${STAGES.map((s,i)=>{const unlocked=i<=state.stage;const done=i<state.stage;return `<button class="stage-btn ${i===state.stage?'current ':''}${done?'done':''} ${!unlocked?'locked':''}" ${unlocked?'':'disabled'} onclick="startStage(${i})">${unlocked?'':'🔒 '}第 ${i+1} 關｜${s.name}<br><span style="font-weight:600;color:#667085">題目 ${s.start}～${s.end}</span></button>`}).join('')}</div><div class="tip">闖關原則：生命值從100開始。答對不受傷；答錯扣5點生命值。完成20題後，只有生命值仍為100（20題全對）才會解鎖下一關。失敗就重新挑戰本關。</div></section><section class="card teacher"><b>教師重置進度</b><div class="tip">只在需要讓學生重新從第1關開始時使用。教師密碼：0217</div><input id="pass" inputmode="numeric" maxlength="8" style="width:100%;padding:12px;border:1px solid #d5dbe3;border-radius:10px;margin-top:8px;font-size:16px" placeholder="輸入教師密碼"><button class="btn secondary full" style="margin-top:8px" onclick="resetGame()">重置全部闖關進度</button></section>`}
function renderQuiz(){
const st=STAGES[state.stage],q=currentQuestion();
if(!state.choices.length){state.choices=shuffle(q.opts.map((text,i)=>({text,orig:i})));save()}
const opts=state.choices;const pct=(state.q/20)*100;
$('content').innerHTML=`<section class="card"><div style="display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="stage-title">第 ${state.stage+1} 關｜${st.name}</div><button class="btn secondary" style="white-space:nowrap" onclick="backToMap()">🗺️ 回到闖關地圖</button></div><div class="stage-meta">題目 ${st.start}～${st.end}｜本關第 ${state.q+1}／20 題</div><div class="hp-box"><div class="hp-row"><span>生命值 HP</span><span>${state.hp}／100</span></div><div class="hpbar"><div class="hpfill ${hpClass(state.hp)}" style="width:${state.hp}%"></div></div></div><div class="char">${hpEmoji(state.hp)}</div><div class="status">${state.hp===100?'狀態良好，保持全對！':'角色受傷了！繼續努力！'}</div><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div><div class="qnum">原題第 ${q.n} 題</div><div class="question">${esc(q.q)}</div><button class="speak" onclick="speakCurrent()">🔊 朗讀本題</button><div id="opts">${opts.map((o,i)=>`<button class="option" ${state.answered?'disabled':''} onclick="answerQuestion(${i})">${esc(o.text)}</button>`).join('')}</div><div id="feedback"></div><div class="nav"><button class="next" id="nextBtn" disabled>下一題</button></div><button class="btn secondary full" style="margin-top:10px" onclick="goHome()">🗺️ 回到闖關地圖</button><div class="tip">本關必須20題全對才能進階。答案選項順序每次挑戰都會重新打亂，避免只背位置。回到地圖後，可自由重玩所有已解鎖關卡。</div></section>`;
if(state.answered)showFeedback();
}
function speakCurrent(){const q=currentQuestion();const o=state.choices;speak(`第${q.n}題。${q.q}。選項一：${o[0].text}。選項二：${o[1].text}。選項三：${o[2].text}。選項四：${o[3].text}。`)}
function answerQuestion(i){if(state.answered)return;const q=currentQuestion();const selected=state.choices[i];const correct=selected.orig===q.ans;state.selected=i;state.answered=true;if(!correct)state.hp=Math.max(0,state.hp-5);save();document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(state.choices[j].orig===q.ans)b.classList.add('correct');if(j===i&&!correct)b.classList.add('wrong')});showFeedback(correct);if(state.hp===0){setTimeout(()=>stageFail('生命值歸零，角色倒下了！'),650)}}
function showFeedback(correct){const q=currentQuestion(),fb=$('feedback');if(!fb)return;const ok=typeof correct==='boolean'?correct:(state.choices[state.selected]?.orig===q.ans);fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=ok?`✅ 答對！生命值保持 ${state.hp}。`:`❌ 答錯！生命值 −5。<br><span class="answer">正確答案：${esc(q.opts[q.ans])}</span>`;const nb=$('nextBtn');nb.disabled=false;nb.textContent=state.q===19?'結算本關':'下一題 →';nb.onclick=nextQuestion}
function nextQuestion(){if(!state.answered)return;if(state.q===19){if(state.hp===100)stagePass();else stageFail('本關沒有20題全對，角色倒下了。')}else{state.q++;state.answered=false;state.selected=null;state.choices=[];save();renderQuiz()}}
function stagePass(){stopSpeak();const last=state.stage===5;state.stagePassed=true;state.finishedStage=true;state.started=false;state.q=0;state.hp=100;state.failMessage='';if(!last)state.stage++;save();renderResult(true,'')}
function stageFail(msg){stopSpeak();state.stagePassed=false;state.finishedStage=true;state.started=false;state.failMessage=msg;save();renderResult(false,msg)}
function renderResult(passed,msg){const completed=passed&&state.stage===5; $('content').innerHTML=`<section class="card result"><div class="result-title">${completed?'🏆 全部通關！':'本關挑戰結果'}</div><div class="big">${passed?'🎉':'💀'}</div><div style="font-size:20px;font-weight:900">${passed?(completed?'你完成了1～120全部六關！':'本關20題全對，成功解鎖下一關！'):(msg||'本關未能全對。')}</div><div class="muted" style="margin-top:10px">${passed?'下一關已解鎖。你也可以回到地圖重玩前面的關卡。':'請重新挑戰本關，直到20題全部答對。'}</div>${passed&&!completed?`<button class="btn primary full" style="margin-top:16px" onclick="startStage(${state.stage})">▶️ 直接挑戰下一關</button>`:''}<button class="btn secondary full" style="margin-top:10px" onclick="goHome()">🗺️ 回到闖關地圖</button>${!passed?`<button class="btn primary full" style="margin-top:10px" onclick="retryCurrent()">🔁 重新挑戰本關</button>`:''}</section>`}
function retryCurrent(){state.finishedStage=false;state.started=true;if(state.stage>5)state.stage=5;state.q=0;state.hp=100;state.answered=false;state.selected=null;state.choices=[];state.order=shuffle([...Array(20).keys()]);state.stagePassed=false;state.failMessage='';save();renderQuiz()}
function goHome(){stopSpeak();state.started=false;state.finishedStage=false;save();renderHome()}
function resetGame(){const p=$('pass').value.trim();if(p!==PASSCODE){alert('教師密碼錯誤');return}localStorage.removeItem(KEY);state={stage:0,q:0,hp:100,started:false,finishedStage:false,answered:false,order:[],choices:[],selected:null,stagePassed:false,failMessage:''};renderHome()}
window.addEventListener('load',render);</script></body></html>
