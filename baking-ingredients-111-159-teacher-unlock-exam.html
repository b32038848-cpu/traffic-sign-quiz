function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))}catch(e){return null}}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}function speak(text,rate=.88){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀，請使用手機 Chrome 或 Safari。');return}stopSpeak();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=rate;u.pitch=1;speechSynthesis.speak(u)}

function renderQuiz(){const q=currentQuestion();const qIndex=state.order[state.current];if(!state.choices[state.current])state.choices[state.current]=shuffle(q.o.map((text,i)=>({text,orig:i})));const opts=state.choices[state.current];const selectedOrig=state.answers[qIndex];$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('status').textContent=`第 ${state.current+1}／${BANK.length} 題｜原題第 ${q.n} 題`;$('quiz').innerHTML=`<div class="qhead"><span>原題第 ${q.n} 題</span><span>${state.current+1}／${BANK.length}</span></div><div class="progress"><div class="fill" style="width:${(state.current/BANK.length)*100}%"></div></div><div class="question">${esc(q.q)}</div><button class="btn speak" onclick="speakCurrent()">🔊 朗讀本題（題目＋選項）</button><button class="btn stop" onclick="stopSpeak()">⏹ 停止朗讀</button><div>${opts.map((o,i)=>`<button class="option ${selectedOrig===o.orig?'selected':''}" data-i="${i}">${esc(o.text)}</button>`).join('')}</div><div class="nav"><button class="btn secondary" ${state.current===0?'disabled':''} onclick="prevQ()">← 上一題</button><button class="btn primary" onclick="nextQ()">${state.current===BANK.length-1?'檢查作答':'下一題 →'}</button></div><div class="small">答案可以修改；完成49題後才能交卷。</div>`;document.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>selectOption(Number(btn.dataset.i)))}

function renderReview(){const missing=[];for(let i=0;i<BANK.length;i++)if(state.answers[i]===undefined)missing.push(BANK[i].n);$('quiz').classList.remove('hidden');$('quiz').innerHTML=`<div class="start-title">確認交卷</div><div class="review">你已完成全部題目。<br>${missing.length?'<b>尚未作答：第 '+missing.join('、')+' 題</b>':'已全部作答，請確認後正式交卷。'}</div><button class="btn secondary full" onclick="renderQuiz()">回到最後一題</button>${missing.length?'':`<button class="btn danger full" style="margin-top:10px" onclick="submitExam()">正式交卷</button>`}`}
function submitExam(){if(Object.keys(state.answers).length!==BANK.length){alert('尚有題目未作答，不能交卷。');return}stopSpeak();let score=0,wrong=[];for(let pos=0;pos<BANK.length;pos++){const qIndex=state.order[pos];const q=BANK[qIndex];const pickedOrig=state.answers[qIndex];if(pickedOrig===q.a)score++;else wrong.push({q:q,chosen:q.o[pickedOrig],correct:q.o[q.a]})}state.score=score;state.wrong=wrong;state.finished=true;state.started=false;save();renderResult()}
function renderResult(){$('start').classList.add('hidden');$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const rate=Math.round((state.score/BANK.length)*100);$('status').textContent=`測驗完成｜${state.score}／${BANK.length}`;$('result').innerHTML=`<div class="start-title">測驗完成</div><div class="score">${state.score}／${BANK.length}</div><div>答對率：${rate}%</div><div class="notice" style="margin-top:14px">本次測驗已鎖定。學生不能自行重測。<br>需要重新測驗，請由老師輸入密碼 <b>0217</b> 解鎖。</div><div class="wrong-list">${state.wrong.length?'<h3>錯誤題目與正確答案</h3>'+state.wrong.map(w=>`<div class="wrong-item"><b>第${w.q.n}題</b><br>${esc(w.q.q)}<br>你的答案：${esc(w.chosen)}<br><b>正確答案：${esc(w.correct)}</b></div>`).join(''):'<h3>🎉 全部答對！</h3>'}</div><div class="lock"><b>教師解鎖重測</b><input id="unlock2" class="input" inputmode="numeric" maxlength="8" placeholder="請輸入教師密碼"><button class="btn primary full" style="margin-top:10px" onclick="unlockRetake()">教師解鎖並重新測驗</button></div>`}
function unlockRetake(){const p=(document.getElementById('unlock')||document.getElementById('unlock2')).value.trim();if(p!==PASSCODE){alert('教師密碼錯誤');return}stopSpeak();localStorage.removeItem(STORAGE_KEY);state={started:false,finished:false,order:[],choices:{},answers:{},current:0,score:0,wrong:[]};renderStart()}
function speakCurrent(){const q=currentQuestion(),opts=state.choices[state.current];speak(`第${q.n}題。${q.q}。`+opts.map((o,i)=>`第${i+1}個選項：${o.text}`).join('。'))}
window.addEventListener('load',()=>{const old=load();if(old){state=old;if(state.finished)renderResult();else if(state.started)renderQuiz();else renderStart()}else renderStart()})
</script></body></html>
