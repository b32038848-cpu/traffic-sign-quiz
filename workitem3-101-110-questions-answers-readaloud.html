<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作項目三｜101～110題題目與答案報讀</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:#f5f7fa;color:#17202a}header{background:#20364f;color:white;padding:20px}main{max-width:850px;margin:auto;padding:16px}.card,.item{background:white;border:1px solid #dce2e9;border-radius:14px;padding:16px;margin:12px 0}button{border:0;border-radius:10px;padding:12px 15px;margin:4px;background:#244d7a;color:white;font-size:16px;cursor:pointer}button.secondary{background:#e8edf3;color:#20364f}.q{font-weight:700;line-height:1.7}.a{margin-top:8px;color:#17633a;font-weight:700}.row{display:flex;flex-wrap:wrap;gap:6px}.muted{color:#5c6875}</style><header><h1>烘焙食品丙級｜工作項目三</h1><div>第 101～110 題｜題目＋正確答案｜語音報讀</div></header><main><section class="card"><p>本頁只顯示題目與正確答案，不顯示選項。</p><div class="row"><button id="all">🔊 全部朗讀</button><button class="secondary" id="stop">⏹ 停止</button><button class="secondary" id="test">測試朗讀</button></div><p id="status" class="muted" aria-live="polite"></p></section><div id="list"></div></main><script>const Q=[{"n": 101, "q": "製作轉化糖漿時，以下列何種酸水解得到之品質最佳？", "a": "酒石酸"}, {"n": 102, "q": "雞蛋蛋白的脂肪含量為？", "a": "0％"}, {"n": 103, "q": "使用脫脂奶粉代替奶水時，脫脂奶粉對水混合的比例應為？", "a": "10：90"}, {"n": 104, "q": "裝飾用鮮奶油加入牛奶攪拌時，牛奶溫度必須保持在多少以下，以避免油水分離？", "a": "10℃"}, {"n": 105, "q": "發粉的定義是由小蘇打及酸性鹽混合攪拌而成的一種膨大劑，所產生的二氧化碳量不能低於發粉重量的？", "a": "12％"}, {"n": 106, "q": "在常溫時不釋出氣體，須於烤焙時才釋出二氧化碳氣體，為？", "a": "慢性反應發粉"}, {"n": 107, "q": "製作蛋糕時，為有效地控制釋出均勻且有規則的氣體，常使用？", "a": "雙重反應發粉"}, {"n": 108, "q": "椰子粉的脂肪含量約為？", "a": "60％"}, {"n": 109, "q": "製作棉花糖時，加入下列何種具有打發起泡特性之膠凍原料？", "a": "動物膠"}, {"n": 110, "q": "下列何種膠凍原料需添加適當比例的糖與酸，才能形成膠體？", "a": "果膠"}];const $=id=>document.getElementById(id);function speak(t){if(!('speechSynthesis'in window)){$('status').textContent='此瀏覽器不支援語音朗讀';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;u.onstart=()=>$('status').textContent='正在朗讀…';u.onend=()=>$('status').textContent='朗讀完成';speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();$('status').textContent='已停止'}$('list').innerHTML=Q.map(x=>`<article class="item"><div class="q">第 ${x.n} 題：${x.q}</div><div class="a">正確答案：${x.a}</div><button class="secondary" data-n="${x.n}">🔊 朗讀本題</button></article>`).join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{let x=Q.find(x=>x.n==b.dataset.n);speak(`第${x.n}題。${x.q}。正確答案：${x.a}。`)});$('all').onclick=()=>speak(Q.map(x=>`第${x.n}題。${x.q}。正確答案：${x.a}。`).join(''));$('stop').onclick=stop;$('test').onclick=()=>speak('語音朗讀測試。工作項目三第101至110題。');</script></html>
