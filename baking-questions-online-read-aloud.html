<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263b50"><title>烘焙丙級題庫｜指定題目朗讀</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#1d2935;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.7}header{background:#263b50;color:white;padding:20px 16px}header h1{font-size:20px;margin:0}header p{font-size:13px;color:#dce5ed;margin:5px 0 0}main{max-width:780px;margin:auto;padding:14px}.card{background:white;border:1px solid #dbe3ea;border-radius:16px;padding:16px;margin-bottom:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:#edf3f7;color:#1d2935}button{font-weight:650;cursor:pointer}button.primary{background:#294e70;color:white}button:disabled{opacity:.4}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#657586;font-size:13px}.qno{font-size:13px;color:#657586;font-weight:700}.question{font-size:19px;font-weight:750;margin:8px 0 12px}.answer{background:#eef6ef;border:1px solid #d2e7d4;padding:12px;border-radius:10px;font-weight:700}.item{padding:14px 0;border-bottom:1px solid #dbe3ea}.item:last-child{border:0}.item .question{font-size:17px}.progress{height:7px;background:#e7edf2;border-radius:8px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#5c86a7;width:0}footer{text-align:center;color:#657586;font-size:12px;padding:8px}@media(max-width:480px){main{padding:10px}.card{padding:14px}.controls button{flex:1}}
</style></head><body><header><h1>烘焙食品丙級｜指定題目朗讀</h1><p>共 25 題｜題目＋正確答案｜逐題或連續朗讀</p></header><main>
<section class="card"><div class="row"><strong>朗讀控制</strong><span class="muted" id="voiceStatus">正在檢查語音功能…</span></div><div class="controls" style="margin-top:12px"><button class="primary" id="readAll">▶ 全部朗讀</button><button id="readCurrent">朗讀本題</button><button id="stop">■ 停止</button></div><div class="row" style="margin-top:14px"><label class="muted" for="speed">語速</label><select id="speed"><option value=".85">較慢</option><option value="1" selected>一般</option><option value="1.15">稍快</option></select><label class="muted" for="voice">語音</label><select id="voice"><option value="auto">自動選擇繁體中文</option></select></div><div class="progress"><span id="progress"></span></div><div class="muted" id="status">尚未開始朗讀</div></section>
<section class="card" id="currentCard"><div class="row"><span class="qno" id="currentNo"></span><span class="muted" id="counter"></span></div><div class="question" id="currentQuestion"></div><div class="answer" id="currentAnswer"></div><div class="controls" style="margin-top:12px"><button id="prev">上一題</button><button class="primary" id="play">朗讀題目＋答案</button><button id="next">下一題</button></div></section>
<section class="card"><div class="row"><strong>題目清單</strong><span class="muted">點選題號可切換</span></div><div id="list"></div></section><footer>使用瀏覽器內建語音朗讀。建議以 Android Chrome 開啟，並確認裝置已安裝繁體中文語音。</footer></main>
<script>
const BANK=[{"n": 13, "q": "麵粉中的蛋白質每增加1％，則吸水量約增加？", "a": "(A) 2％"}, {"n": 16, "q": "小麥製粉時，與其出粉率成正比者為？", "a": "(B) 灰分含量"}, {"n": 17, "q": "麵粉中添加維生素C 作為改良劑之主要效用為？", "a": "(A) 熟成作用"}, {"n": 18, "q": "食品用油溶於水（O/W）之乳化劑，其親水親油平衡值（HLB：Hydrophilic - Lipophilic Balance value）之範圍介於？", "a": "(B) 8～18"}, {"n": 19, "q": "製作海綿蛋糕添加乳化起泡劑目的為？", "a": "(B) 增加麵糊的安定性"}, {"n": 25, "q": "小麥胚芽中含有下列何種物質，其含有硫氫根（-SH），會減少麵筋彈性，使麵 糰發粘？", "a": "(D) 麩胱甘肽"}, {"n": 28, "q": "有關發粉，下列敘述何者錯誤？", "a": "(A) 以碳酸鈉為主原料"}, {"n": 29, "q": "小西餅在烘焙過程中，下列何者不是扮演膨脹的因素？", "a": "(C) 酵母"}, {"n": 35, "q": "製作全素義大利蛋白霜可用那一項原料取代蛋白打發？", "a": "(C) 鷹嘴豆汁"}, {"n": 41, "q": "經攪拌後之蛋白糖以手指勾起成山峰狀，倒置而不彎曲，此階段稱為？", "a": "(C) 乾性發泡"}, {"n": 45, "q": "使用分割滾圓機分割麵糰，假如機器分割麵糰每分鐘30 粒每個50g，現有60 公 斤麵糰多少時間可分割完？", "a": "(C) 40 分"}, {"n": 48, "q": "以中種法製作蘇打餅乾時，中種麵糰發酵時的相對濕度應維持在", "a": "(C) 78％±2％"}, {"n": 49, "q": "標準土司麵包配方內水的用量應為", "a": "(C) 60～64％"}, {"n": 50, "q": "奶油海綿蛋糕中奶油用量最多可用", "a": "(D) 40～50％"}, {"n": 52, "q": "小西餅的烤焙原則為何？", "a": "(A) 高溫短時間"}, {"n": 53, "q": "製作麵包時麵粉筋性較弱，應採用何種攪拌速度？", "a": "(B) 中速"}, {"n": 54, "q": "烤焙法國麵包烤爐內必須有蒸氣設備，蒸氣的壓力為？", "a": "(C) 壓力低，量大"}, {"n": 55, "q": "一般乳沫類蛋糕使用蛋白的溫度最好為", "a": "(A) 17～22℃"}, {"n": 58, "q": "奶油空心餅成品內部缺乏空囊是因為？", "a": "(A) 麵糊太乾"}, {"n": 61, "q": "鬆餅（起酥，puff pastry）的製作，以蘇格蘭簡易法一起攪拌的方式為", "a": "(B) 以切麵刀將油脂和麵粉拌合切成 乒乓球狀，再將冰水和其他原料一起加入"}, {"n": 62, "q": "酵母油炸甜圈餅（酵母道納司，yeast doughnuts）製作時，若要控制成金黃色澤產 品時，在製程上應注意？", "a": "(A) 適當的發酵"}, {"n": 63, "q": "烤焙麵糰極軟的小西餅時最好使用（ ）烤盤（鋼帶）？", "a": "(C) 平板狀"}, {"n": 64, "q": "酵母油炸甜圈餅（酵母道納司，yeast doughnuts）所使用的配方，大致上與甜麵包 類似，然在為求成品之品質與形狀之完整性，則酵母油炸甜圈餅（酵母道納司， yeast doughnuts）配方中的糖與油脂，較甜麵包配方？", "a": "(B) 少"}, {"n": 75, "q": "一般蒸烤牛奶布丁，所選用之凝凍材料為？", "a": "(A) 雞蛋"}, {"n": 78, "q": "造成小西餅裂痕特性的原料是？", "a": "(C) 砂糖"}];let idx=0,queue=[],running=false;const $=id=>document.getElementById(id);
function voices(){return speechSynthesis.getVoices()||[]}
function populate(){let sel=$("voice"),vs=voices();sel.innerHTML='<option value="auto">自動選擇繁體中文</option>';vs.filter(v=>/zh|cmn|中文/i.test(v.lang+" "+v.name)).forEach(v=>{let o=document.createElement("option");o.value=String(vs.indexOf(v));o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o)});$("voiceStatus").textContent=vs.length?"語音功能可用":"等待裝置提供語音"}
function show(){let x=BANK[idx];$("currentNo").textContent="第 "+x.n+" 題";$("counter").textContent=(idx+1)+"／"+BANK.length;$("currentQuestion").textContent=x.q;$("currentAnswer").textContent="正確答案："+x.a;$("prev").disabled=idx===0;$("next").disabled=idx===BANK.length-1;document.querySelectorAll(".item").forEach((e,i)=>e.style.background=i===idx?"#f4f8fb":"transparent")}
function speak(t,done){if(!("speechSynthesis"in window)){$("status").textContent="此瀏覽器不支援語音朗讀";return}let u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";u.rate=Number($("speed").value);let vs=voices(),v=$("voice").value;if(v!=="auto"&&vs[Number(v)])u.voice=vs[Number(v)];else{let z=vs.find(v=>/^zh-TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(z)u.voice=z}u.onend=()=>{if(done)done()};u.onerror=()=>{$("status").textContent="語音播放遇到問題，請確認裝置已安裝中文語音"};speechSynthesis.speak(u)}
function read(i,done){let x=BANK[i];$("status").textContent="正在朗讀第 "+x.n+" 題";speak("第 "+x.n+" 題。"+x.q+"。正確答案："+x.a+"。",done)}
function stop(){if("speechSynthesis"in window)speechSynthesis.cancel();running=false;queue=[];$("status").textContent="已停止朗讀"}
$("play").onclick=()=>{stop();read(idx)};$("readCurrent").onclick=()=>{stop();read(idx)};$("stop").onclick=stop;
$("readAll").onclick=()=>{stop();running=true;queue=BANK.map((_,i)=>i);let total=queue.length;function step(){if(!running||!queue.length){running=false;$("status").textContent="全部朗讀完成";$("progress").style.width="100%";return}let i=queue.shift();idx=i;show();$("progress").style.width=((total-queue.length)/total*100)+"%";read(i,step)}step()};
$("prev").onclick=()=>{if(idx>0){idx--;show()}};$("next").onclick=()=>{if(idx<BANK.length-1){idx++;show()}};
$("list").innerHTML=BANK.map((x,i)=>`<div class="item"><button data-i="${i}">第 ${x.n} 題</button><div class="question">${x.q}</div><div class="answer">正確答案：${x.a}</div></div>`).join("");
$("list").addEventListener("click",e=>{let b=e.target.closest("button[data-i]");if(b){stop();idx=Number(b.dataset.i);show();$("currentCard").scrollIntoView({behavior:"smooth",block:"start"})}});
$("speed").onchange=()=>{if(running)stop()};if("speechSynthesis"in window){populate();speechSynthesis.onvoiceschanged=populate}else $("voiceStatus").textContent="瀏覽器不支援語音";show();
</script></body></html>
